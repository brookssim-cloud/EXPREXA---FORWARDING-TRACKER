<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exprexa Forwarding</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --ink-2:#1B2747; --paper:#EEF1F6; --card:#FFFFFF;
    --amber:#F2A93B; --amber-dk:#C97F12; --green:#1F9D6B; --red:#D64545;
    --line:#DCE1EA; --text:#1B2333; --muted:#6B748C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);
    font-family:Inter,-apple-system,Segoe UI,sans-serif;font-size:15px;}
  .app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--paper);
    display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---- shell ---- */
  .topbar{background:var(--ink);color:#fff;padding:14px 16px 0;}
  .topbar-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.01em;}
  .brand .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--amber);
    letter-spacing:.08em;border:1px solid rgba(242,169,59,.5);padding:1px 6px;
    border-radius:4px;margin-left:7px;vertical-align:2px;}
  .who{font-size:11.5px;color:#9FAAC6;display:flex;align-items:center;gap:6px;cursor:pointer;}
  .lvl-badge{font-size:8.5px;font-weight:700;letter-spacing:.4px;padding:1px 6px;
    border-radius:4px;background:rgba(255,255,255,.14);color:#CDD6E8;}
  .tabs-wrap{position:relative;}
  .tabs-wrap::after{
    content:''; position:absolute; top:0; right:0; bottom:0; width:22px;
    background:linear-gradient(to right, rgba(27,39,71,0), var(--ink-2));
    pointer-events:none;
  }
  .tabs{display:flex;background:var(--ink-2);padding:0 4px;margin-top:12px;overflow-x:auto;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{padding:11px 13px;font-size:12.5px;font-weight:600;color:#9FAAC6;cursor:pointer;
    border-bottom:2.5px solid transparent;white-space:nowrap;position:relative;flex:0 0 auto;
    scroll-snap-align:start;}
  .tab.on{color:#fff;border-bottom-color:var(--amber);}
  .tab .bdg{position:absolute;top:5px;right:1px;background:var(--red);color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;min-width:15px;
    height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    padding:0 3px;}
  .content{flex:1;padding-bottom:40px;}

  /* ---- board ---- */
  .counts{display:flex;gap:18px;padding:14px 16px 15px;background:var(--ink);color:#fff;flex-wrap:wrap;}
  .count .n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:25px;line-height:1;}
  .count .n.warn{color:var(--amber);}
  .count .l{font-size:10px;color:#9FAAC6;margin-top:4px;}
  .filters{display:flex;background:var(--ink-2);padding:0 6px;overflow-x:auto;}
  .filters::-webkit-scrollbar{display:none;}
  .filters span{padding:10px 12px;font-size:12px;font-weight:600;color:#9FAAC6;
    white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;}
  .filters span.on{color:#fff;border-bottom-color:var(--amber);}

  .row{background:var(--card);padding:13px 16px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .row:active{background:#F7F9FC;}
  .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:9px;}
  .awb{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--ink);}
  .kind{font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:4px;
    vertical-align:2px;margin-left:6px;}
  .kind.exp{background:rgba(20,33,61,.09);color:var(--ink);}
  .kind.imp{background:rgba(242,169,59,.20);color:var(--amber-dk);}
  .lots-tag{font-size:9px;font-weight:700;color:var(--amber-dk);
    background:rgba(242,169,59,.18);padding:2px 6px;border-radius:4px;margin-left:6px;}
  .route{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;}
  .pips{display:flex;align-items:center;margin:10px 0 8px;}
  .pip{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .pip.done{background:var(--ink);} .pip.now{background:var(--amber);
    box-shadow:0 0 0 3.5px rgba(242,169,59,.22);} .pip.todo{background:#CDD5E2;}
  .link3{height:2px;flex:1;background:#CDD5E2;} .link3.done{background:var(--ink);}
  .row-bot{display:flex;justify-content:space-between;align-items:center;gap:9px;}
  .lead{font-size:13px;font-weight:600;color:var(--ink);}
  .party{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .age{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;
    padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .age.ok{background:rgba(31,157,107,.12);color:var(--green);}
  .age.warn{background:rgba(242,169,59,.20);color:var(--amber-dk);}
  .age.bad{background:rgba(214,69,69,.13);color:var(--red);}
  .age.mut{background:#EEF1F6;color:var(--muted);}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

  /* ---- detail ---- */
  .back{padding:13px 16px;background:var(--ink);color:#9FAAC6;font-size:13px;cursor:pointer;}
  .head{background:var(--ink);color:#fff;padding:0 16px 18px;}
  .head .awb-lg{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;padding-top:2px;}
  .head .meta{font-size:12px;color:#9FAAC6;margin-top:6px;line-height:1.6;}
  .head .tally{display:flex;gap:20px;margin-top:13px;flex-wrap:wrap;}
  .head .tally div{font-size:10.5px;color:#9FAAC6;}
  .head .tally b{display:block;font-family:'IBM Plex Mono',monospace;font-size:18px;
    color:#fff;font-weight:600;line-height:1.25;}
  .head .tally b.amb{color:var(--amber);}
  .linkrow{display:flex;gap:8px;margin-top:14px;}
  .linkbtn{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    color:#fff;border-radius:8px;padding:9px;font-size:11.5px;font-weight:600;text-align:center;}

  .sect{font-size:11px;font-weight:700;color:var(--muted);margin:18px 16px 8px;
    letter-spacing:.03em;display:flex;justify-content:space-between;}
  .card{background:var(--card);margin:0 12px 12px;border-radius:12px;padding:14px 15px;}

  .lot{background:var(--card);margin:0 12px 12px;border-radius:12px;overflow:hidden;
    border-top:3px solid var(--ink);}
  .lot.wait{border-top-color:#B9C2D6;}
  .lot-hd{padding:12px 14px 0;display:flex;justify-content:space-between;align-items:baseline;}
  .lot-qty{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;color:var(--ink);}
  .lot-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;}
  .lot-tag.here{background:rgba(20,33,61,.09);color:var(--ink);}
  .lot-tag.w{background:#E7EBF3;color:var(--muted);}
  .lot-tag.done{background:rgba(31,157,107,.12);color:var(--green);}
  .lot-when{padding:3px 14px 0;font-size:11px;color:var(--muted);}
  .steps{display:flex;align-items:center;padding:12px 13px 4px;overflow-x:auto;}
  .st{flex:0 0 auto;text-align:center;}
  .st .d{width:9px;height:9px;border-radius:50%;margin:0 auto;}
  .st .d.done{background:var(--ink);} .st .d.now{background:var(--amber);
    box-shadow:0 0 0 3.5px rgba(242,169,59,.22);} .st .d.todo{background:#CDD5E2;}
  .st .lbl{font-size:7.5px;color:var(--muted);margin-top:4px;white-space:nowrap;}
  .st .lbl.on{color:var(--ink);font-weight:700;}
  .jn{height:2px;width:14px;background:#CDD5E2;margin-bottom:13px;flex:0 0 auto;} .jn.done{background:var(--ink);}
  .lot-now{padding:8px 14px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .lot-now .s{font-size:13.5px;font-weight:600;color:var(--ink);}
  .lot-now .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:1px;}
  .lot-act{display:block;width:100%;padding:14px;border:none;background:var(--amber);
    color:var(--ink);font:700 14px 'Space Grotesk',sans-serif;cursor:pointer;
    border-top:1px solid rgba(20,33,61,.08);}
  .lot-act small{display:block;font:500 10.5px Inter,sans-serif;color:rgba(20,33,61,.62);margin-bottom:3px;}
  .lot-act.ghost{background:#F2F5F9;color:var(--ink);}
  .lot-act.mut{background:#F2F5F9;color:var(--muted);}

  .run{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
  .run:last-child{border-bottom:none;}
  .run .qty{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;
    color:var(--ink);width:52px;flex:0 0 auto;}
  .run .who{font-size:13px;font-weight:600;color:var(--ink);}
  .run .when{font-size:11px;color:var(--muted);margin-top:1px;}
  .run .lorry{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);
    background:var(--paper);padding:2px 7px;border-radius:4px;display:inline-block;margin-top:3px;}

  .addlot{display:block;width:calc(100% - 24px);margin:0 12px 14px;padding:12px;
    background:transparent;border:1.5px dashed #B9C2D6;border-radius:12px;
    color:var(--muted);font:600 12.5px Inter,sans-serif;cursor:pointer;text-align:center;}

  .advance{display:block;width:calc(100% - 24px);margin:0 12px 12px;padding:15px;
    background:var(--ink);color:#fff;border:none;border-radius:12px;
    font:700 15px 'Space Grotesk',sans-serif;cursor:pointer;text-align:center;}
  .advance small{display:block;font:500 10.5px Inter,sans-serif;color:#9FAAC6;margin-bottom:3px;}
  .advance.finish{background:var(--green);}
  /* Amber means this isn't a plain one-tap move — a form, a photo, or both
     stand between tapping this and actually advancing. Navy means it just
     moves straight on. */
  .advance.needs-input{background:var(--amber);color:var(--ink);}
  .advance.needs-input small{color:rgba(20,33,61,.62);}

  .viewer-strip{margin:0 12px 14px;padding:12px 14px;border-radius:10px;background:#E7EBF3;
    border:1px dashed #B9C2D6;font-size:12px;color:var(--muted);line-height:1.6;}
  .viewer-strip b{color:var(--ink);}

  .noteline{background:#FFF8EC;border-left:3px solid var(--amber);padding:10px 12px;
    border-radius:0 8px 8px 0;font-size:13px;margin-bottom:8px;}
  .noteline:last-child{margin-bottom:0;}
  .noteline .who{font-size:11px;color:var(--muted);margin-top:4px;}
  .addnote{display:flex;gap:8px;margin-top:10px;}
  .addnote input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;}
  .addnote button{background:var(--ink);color:#fff;border:none;border-radius:8px;
    padding:0 14px;font-weight:600;font-size:12.5px;}
  .actrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .actrow:last-child{border-bottom:none;}
  .actrow .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);margin-top:6px;flex:0 0 auto;}
  .actrow .txt{font-size:13px;color:var(--text);}
  .actrow .who{font-size:11px;color:var(--muted);margin-top:2px;}

  /* ---- forms / picker ---- */
  .field{margin:0 16px 14px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
  .field input,.field select{width:100%;background:#fff;border:1.5px solid var(--line);
    border-radius:9px;padding:11px 12px;font-size:14.5px;color:var(--text);}
  .field input.mono{font-family:'IBM Plex Mono',monospace;}
  .seg{display:flex;gap:6px;margin:0 16px 16px;}
  .seg div{flex:1;text-align:center;padding:11px 0;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .seg div.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .picker{background:var(--card);margin:12px;border-radius:12px;padding:16px;}
  .picker .plbl{font-size:11px;color:var(--muted);margin-bottom:8px;}
  .qctl{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 4px;}
  .qctl button{width:44px;height:44px;border-radius:11px;border:1.5px solid var(--line);
    background:#fff;font-size:20px;color:var(--ink);cursor:pointer;line-height:1;}
  .qctl .val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;
    color:var(--ink);min-width:64px;text-align:center;}
  .qof{text-align:center;font-size:12px;color:var(--muted);}
  .chips{display:flex;gap:7px;flex-wrap:wrap;}
  .chips span{padding:8px 13px;border-radius:9px;border:1.5px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;cursor:pointer;}
  .chips span.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chips span.mono{font-family:'IBM Plex Mono',monospace;}
  .msg{margin:8px 16px 0;font-size:12.5px;}

  /* ---- alerts ---- */
  .grp{font-size:10.5px;font-weight:700;color:var(--muted);margin:16px 16px 7px;
    display:flex;justify-content:space-between;align-items:baseline;}
  .grp .c{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);}
  .listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--card);padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
  .listrow:active{background:#F7F9FC;}
  .listrow .lc{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:52%;}
  .listrow .lsub{font-size:10.5px;color:var(--muted);margin-top:3px;}
  .al{background:var(--card);margin:0 12px 8px;border-radius:12px;overflow:hidden;
    border-left:4px solid var(--line);}
  .al.red{border-left-color:var(--red);} .al.amb{border-left-color:var(--amber);}
  .al.gry{border-left-color:#B9C2D6;}
  .al-body{padding:12px 14px;cursor:pointer;}
  .al-top{display:flex;justify-content:space-between;gap:9px;}
  .al-what{font-size:14px;font-weight:600;color:var(--ink);line-height:1.35;}
  .al-age{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .al-age.red{color:var(--red);} .al-age.amb{color:var(--amber-dk);}
  .al-who{font-size:12px;color:var(--muted);margin-top:4px;}
  .al-acts{display:flex;border-top:1px solid var(--line);}
  .al-acts button{flex:1;padding:10px;border:none;background:transparent;
    font:600 12.5px Inter,sans-serif;color:var(--ink);cursor:pointer;}
  .al-acts button+button{border-left:1px solid var(--line);color:var(--muted);}
  .quiet{margin:14px 12px;padding:28px 18px;background:var(--card);border-radius:12px;text-align:center;}
  .quiet .big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:var(--green);}
  .quiet .sm{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6;}

  /* ---- access ---- */
  .person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .person:last-child{border-bottom:none;}
  .person .nm{flex:1;}
  .person .n{font-size:14px;font-weight:600;color:var(--ink);}
  .person .r{font-size:11px;color:var(--muted);margin-top:1px;}
  .segp{display:flex;gap:4px;flex:0 0 auto;}
  .segp span{font-size:10.5px;font-weight:700;padding:6px 8px;border-radius:6px;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;}
  .segp span.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .segp span.on.amb{background:var(--amber);border-color:var(--amber);color:var(--ink);}
  .segp span.on.off{background:#E7EBF3;border-color:#C9D2E2;color:var(--muted);}

  .fab{position:fixed;bottom:22px;left:50%;transform:translateX(calc(-50% + 190px));
    width:52px;height:52px;border-radius:50%;background:var(--amber);color:var(--ink);
    border:none;font-size:26px;font-weight:700;box-shadow:0 8px 20px rgba(20,33,61,.25);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;}
  @media (max-width:460px){ .fab{ left:auto; right:18px; transform:none; } }

  h3{font-family:'Space Grotesk',sans-serif;font-size:17px;color:var(--ink);margin:0 0 14px;font-weight:700;}
  .authcard{background:var(--card);border-radius:14px;padding:24px 22px;border:1px solid var(--line);
    max-width:380px;margin:32px auto 0;box-shadow:0 4px 14px rgba(20,33,61,.06);}
  .authcard .field{margin:0 0 14px;text-align:left;}
  .authcard .field label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .authwrap{padding:0 16px;}
  .searchbox{margin:0 4px;}
  .searchbox input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;text-align:center;}
  .namehit{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;
    margin-top:8px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;}
  .namehit:hover{background:#F7F9FC;}
  /* ---- wall display board ---- */
  .disp{position:fixed;inset:0;background:#0B1020;color:#fff;z-index:900;
    display:flex;flex-direction:column;font-family:Inter,sans-serif;}
  .disp-head{display:flex;justify-content:space-between;align-items:center;
    padding:18px 30px;border-bottom:2px solid rgba(255,255,255,.08);flex:0 0 auto;}
  .disp-title{font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(20px,2.4vw,34px);letter-spacing:.02em;}
  .disp-title span{color:var(--amber);}
  .disp-clock{font-family:'IBM Plex Mono',monospace;font-weight:600;
    font-size:clamp(20px,2.6vw,38px);text-align:right;}
  .disp-clock small{display:block;font-family:Inter,sans-serif;font-weight:500;
    font-size:clamp(10px,1vw,14px);color:#8C99B8;margin-top:2px;}
  .disp-stats{display:flex;gap:clamp(18px,3vw,46px);padding:12px 30px;
    border-bottom:2px solid rgba(255,255,255,.08);flex:0 0 auto;}
  .disp-stats div b{font-family:'IBM Plex Mono',monospace;font-size:clamp(20px,2.4vw,34px);
    font-weight:600;display:block;line-height:1.1;}
  .disp-stats div span{font-size:clamp(9px,.85vw,13px);color:#8C99B8;letter-spacing:.06em;}
  .disp-stats .amb b{color:var(--amber);}
  .disp-grid{flex:1;overflow:hidden;}
  .disp-row{display:grid;grid-template-columns:.8fr 1.9fr .7fr 1.8fr 1fr .85fr 1.85fr .95fr;
    gap:12px;align-items:center;padding:clamp(8px,1.1vh,16px) 30px;
    border-bottom:1px solid rgba(255,255,255,.06);}
  .disp-row.hd{color:#8C99B8;font-size:clamp(9px,.85vw,13px);letter-spacing:.1em;
    border-bottom:2px solid rgba(255,255,255,.12);}
  .disp-awb{font-family:'IBM Plex Mono',monospace;font-weight:600;
    font-size:clamp(13px,1.45vw,24px);line-height:1.25;}
  .disp-awb .hsub{display:block;font-size:clamp(10px,.95vw,15px);color:#8C99B8;font-weight:500;}
  .disp-mono{font-family:'IBM Plex Mono',monospace;font-size:clamp(11px,1.05vw,17px);color:#B9C4DC;}
  .disp-tag{font-size:clamp(9px,.8vw,13px);font-weight:700;padding:2px 8px;border-radius:5px;}
  .disp-tag.exp{background:rgba(255,255,255,.14);color:#CDD6E8;}
  .disp-tag.imp{background:rgba(242,169,59,.22);color:var(--amber);}
  .disp-tag.k1{background:rgba(214,69,69,.22);color:#FF8B8B;margin-left:6px;}
  .disp-cust{font-size:clamp(11px,1.1vw,18px);color:#D7DEEE;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .disp-stage{font-size:clamp(12px,1.2vw,20px);font-weight:600;}
  .disp-age{font-family:'IBM Plex Mono',monospace;font-size:clamp(12px,1.2vw,20px);
    text-align:right;font-weight:600;}
  .ok2{color:#4ED8A0;} .warn2{color:var(--amber);} .bad2{color:#FF7A7A;}
  .disp-row.flash{animation:dispflash 3s ease-out;}
  @keyframes dispflash{0%{background:rgba(242,169,59,.42);}100%{background:transparent;}}
  .disp-foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:10px 30px;border-top:2px solid rgba(255,255,255,.08);
    font-size:clamp(10px,.95vw,14px);color:#8C99B8;}
  .disp-exit{background:rgba(255,255,255,.1);border:none;color:#CDD6E8;
    padding:7px 14px;border-radius:7px;font-size:12px;cursor:pointer;}
  .disp-dots{display:flex;gap:6px;align-items:center;}
  .disp-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);display:block;}
  .disp-dots i.on{background:var(--amber);}

  .banner{margin:16px;padding:14px;border-radius:10px;font-size:13px;line-height:1.6;}
  .banner-err{background:#FCE9E9;color:#8A2E2E;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  'use strict';

  // ============================================================
  // Firebase — same project as EXPREXA ATTENDANCE, so worker IDs
  // and passwords are shared rather than duplicated. This app only
  // reads epx_workers; it never writes to it. Its own data lives in
  // fwd_ prefixed collections so nothing here can collide with the
  // attendance app's records.
  // ============================================================
  // Paste your own project's config here (Firebase console → Project settings →
  // Your apps → SDK setup and configuration). This app keeps its own Firebase
  // project — separate from EXPREXA ATTENDANCE and EXPREXA PERFORMANCE — with
  // its own worker records, set up the first time someone opens it.
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyD81njdDRg1VMFtga2ouoOM0NqLPaI_4l8",
    authDomain: "forwarding-tracker.firebaseapp.com",
    projectId: "forwarding-tracker",
    storageBucket: "forwarding-tracker.firebasestorage.app",
    messagingSenderId: "733118809749",
    appId: "1:733118809749:web:0cf0f81f37874043f4fd9c"
  };
  const FIREBASE_READY = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PASTE_') !== 0);
  let db = null;
  if(FIREBASE_READY){
    firebase.initializeApp(FIREBASE_CONFIG, 'forwarding');
    db = firebase.app('forwarding').firestore();
  }

  const SHIP = 'fwd_shipments';
  const CONFIG = 'fwd_config';

  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function uid(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  // A request that fails outright is caught by the try/catch around every
  // load — but one that just stalls on a bad connection never rejects at
  // all, so nothing catches it and the screen waits forever with nothing to
  // show for it. This forces a decision after a reasonable wait.
  function withTimeout(promise, ms, label){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(
        () => reject(new Error(`${label} is taking too long — check your connection and try again.`)), ms))
    ]);
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function ageStr(fromIso){
    const ms = Date.now() - new Date(fromIso).getTime();
    if(ms < 0) return '0h';
    const h = Math.floor(ms/3600000);
    if(h < 24) return h+'h';
    const d = Math.floor(h/24), rh = h%24;
    return d+'d'+(rh?' '+rh+'h':'');
  }
  // Hours and minutes since a stage last moved — precise enough for a wall
  // board, where "3h" alone hides whether it's been 3 or nearly 4 hours.
  function waitStr(fromIso){
    if(!fromIso) return '—';
    let mins = Math.floor((Date.now() - new Date(fromIso).getTime()) / 60000);
    if(!isFinite(mins) || mins < 0) mins = 0;
    const d = Math.floor(mins / 1440);
    if(d >= 1) return d + 'd ' + Math.floor((mins % 1440) / 60) + 'h';
    return Math.floor(mins / 60) + 'h ' + String(mins % 60).padStart(2,'0') + 'm';
  }
  // When the thing that's currently waiting last moved: the longest-sitting
  // open track or lot, matching whatever the status column is showing.
  function lastStageIso(s){
    if(s.type === 'export'){
      const tracks = exportTracks(s).filter(t => !t.closed);
      if(!tracks.length) return s.stageAt || s.createdAt;
      return tracks.reduce((a,b) => new Date(b.stageAt) < new Date(a.stageAt) ? b : a).stageAt;
    }
    const lots = (s.lots||[]).filter(l => !l.closed && l.hasArrived);
    if(!lots.length) return s.createdAt;
    return lots.reduce((a,b) => new Date(b.stageAt) < new Date(a.stageAt) ? b : a).stageAt;
  }

  function ageHours(fromIso){ return (Date.now() - new Date(fromIso).getTime())/3600000; }

  // ---- worker records — this app's own, not shared with the other two ----
  const WORKERS = 'fwd_workers';
  let _workerCache = null;
  function invalidateWorkerCache(){ _workerCache = null; }
  async function getWorkers(){
    if(_workerCache) return _workerCache;
    const snap = await withTimeout(db.collection(WORKERS).get(), 15000, 'Loading workers');
    _workerCache = snap.docs.map(d => d.data());
    return _workerCache;
  }
  async function saveWorker(w){
    await db.collection(WORKERS).doc(w.id).set(w);
    invalidateWorkerCache();
  }
  async function deleteWorker(id){
    await db.collection(WORKERS).doc(id).delete();
    invalidateWorkerCache();
    const ref = db.collection(CONFIG).doc('access');
    await db.runTransaction(async tx=>{
      const doc = await tx.get(ref);
      const v = doc.exists ? (doc.data().value || {}) : {};
      delete v[id];
      tx.set(ref, { value: v });
    });
  }

  // ---- access map: who can view/edit in THIS app ----
  async function getAccessMap(){
    const doc = await withTimeout(db.collection(CONFIG).doc('access').get(), 15000, 'Loading access settings');
    return doc.exists ? (doc.data().value || {}) : {};
  }
  // Who may open the wall display. Off for everyone by default so it isn't
  // left running in a background tab by people who don't need it; admins
  // always have it.
  async function getDisplayMap(){
    const doc = await withTimeout(db.collection(CONFIG).doc('display').get(), 15000, 'Loading display access');
    return doc.exists ? (doc.data().value || {}) : {};
  }
  async function setDisplayFor(workerId, on){
    const ref = db.collection(CONFIG).doc('display');
    await db.runTransaction(async tx=>{
      const doc = await tx.get(ref);
      const v = doc.exists ? (doc.data().value || {}) : {};
      if(on) v[workerId] = true; else delete v[workerId];
      tx.set(ref, { value: v });
    });
  }
  async function setAccessFor(workerId, level){
    const ref = db.collection(CONFIG).doc('access');
    await db.runTransaction(async tx=>{
      const doc = await tx.get(ref);
      const v = doc.exists ? (doc.data().value || {}) : {};
      if(level === 'off') delete v[workerId]; else v[workerId] = level;
      tx.set(ref, { value: v });
    });
  }

  // ---- terminals: defined once by AWB prefix, not tagged per shipment ----
  // A terminal is {id, name, prefixes:[...]}. Which terminal a shipment
  // belongs to is worked out from its own AWB — nothing to tag by hand as
  // shipments come and go.
  async function getTerminalsConfig(){
    const doc = await withTimeout(db.collection(CONFIG).doc('terminals').get(), 15000, 'Loading terminals');
    return doc.exists ? (doc.data().value || { terminals: [] }) : { terminals: [] };
  }
  async function saveTerminalsConfig(cfg){
    await db.collection(CONFIG).doc('terminals').set({ value: cfg });
  }
  function awbPrefix(awb){
    const m = String(awb||'').match(/^(\d{3})/);
    return m ? m[1] : null;
  }
  function terminalForAwb(awb, terminals){
    const p = awbPrefix(awb);
    if(!p) return null;
    const t = (terminals||[]).find(t => (t.prefixes||[]).includes(p));
    return t ? t.name : null;
  }

  // ---- shipments ----
  async function getOpenShipments(){
    const snap = await withTimeout(db.collection(SHIP).where('closed','==', false).get(), 15000, 'Loading shipments');
    return snap.docs.map(d => d.data());
  }
  // Read only when the Completed tab is actually opened, not on every load —
  // this can grow all season, so there's no reason to pay for it up front.
  // One day at a time: every closure stamps closedDate as YYYY-MM-DD, so
  // this reads only that day's shipments rather than the whole season.
  async function getClosedShipmentsOn(dateStr){
    const snap = await withTimeout(
      db.collection(SHIP).where('closedDate','==', dateStr).get(), 15000, 'Loading completed shipments');
    return snap.docs.map(d => d.data()).filter(s => s.closed);
  }
  async function getClosedTodayCount(){
    try{
      const snap = await db.collection(SHIP).where('closedDate','==', todayStr()).get();
      return snap.size;
    }catch(e){ return 0; }
  }
  async function saveShipment(s){
    await db.collection(SHIP).doc(s.id).set(s);
  }

  // ============================================================
  // Stage definitions
  // ============================================================
  // Export never needs a K1 (that's an import declaration), so it has one
  // sequence. Import branches depending on whether the lot needs a formal
  // K1 declaration — a simpler release without one, or Examine + Pay duty
  // with one. Each lot decides this for itself, since it's its own
  // clearance event and different lots on the same AWB can go either way.
  const EXPORT_STEPS = ['Delivery','Docs in','Screening','Releasing','Closing'];
  const IMPORT_STEPS_NOK1 = ['Arrived','Docs in','Screening','Releasing','Delivery','Closing'];
  const IMPORT_STEPS_K1   = ['Arrived','Docs in','Examine','Pay duty','Releasing','Delivery','Closing'];
  function importSteps(lot){ return lot.hasK1 ? IMPORT_STEPS_K1 : IMPORT_STEPS_NOK1; }
  // Whichever sequence a lot follows, "Delivery" is always the second-to-last
  // step — that's where the delivery-recording screen takes over — and the
  // last step is always the terminal "Closing".
  function deliveryIdx(steps){ return steps.length - 2; }
  function terminalIdx(steps){ return steps.length - 1; }

  // Threshold in hours before a stage counts as "stuck". Admin-tunable later;
  // fixed here for v1.
  const THRESH = {
    exp:     [48, 12, 24, 6, 24],        // Delivery, Docs in, Screening, Releasing, Closing (unused, terminal)
    impNoK1: [48, 12, 24, 6, 12, 24],    // Arrived, Docs in, Screening, Releasing, Delivery, Closing
    impK1:   [48, 12, 24, 12, 6, 12, 24] // Arrived, Docs in, Examine, Pay duty, Releasing, Delivery, Closing
  };
  function importThresh(lot){ return lot.hasK1 ? THRESH.impK1 : THRESH.impNoK1; }
  const CHASE_QUIET_DAYS = 1; // an alert chased today stays quiet until this many days pass

  function ageLevel(hours, threshold){
    if(hours >= threshold) return 'bad';
    if(hours >= threshold * 0.6) return 'warn';
    return 'ok';
  }

  // ============================================================
  // External tracking links
  // ============================================================
  function cargoLink(awb){
    const m = String(awb||'').match(/^(\d{3})-?(\d+)$/);
    if(!m) return null;
    const prefix = m[1], num = m[2];
    if(prefix === '232'){
      return { label:'Track on MASkargo', direct:true,
        url:`https://www.maskargo.com/en/shipment-tracking.html?prefixNumber=232&awbNumber=${num}` };
    }
    if(prefix === '807'){
      return { label:'Copy AWB & open AirAsia', direct:false, copy:`${prefix}${num}`,
        url:'https://airasia.smartkargo.com/FrmAWBTracking.aspx' };
    }
    return null;
  }
  function flightLink(flightNo){
    if(!flightNo) return null;
    // Flightradar24 resolves a flight number directly in this path — lowercase,
    // no spaces. Confirmed against FR24's own linking convention; not
    // independently re-tested against every route, so worth a quick check
    // the first time a link is used.
    const clean = flightNo.trim().toLowerCase().replace(/\s+/g,'');
    return `https://www.flightradar24.com/data/flights/${encodeURIComponent(clean)}`;
  }

  // ============================================================
  // Session
  // ============================================================
  let ME = null;        // { id, name }
  let MY_LEVEL = 'off';
  let CAN_EDIT = false;
  let IS_ADMIN = false;
  let CAN_DISPLAY = false;

  function restoreSession(){
    try{
      const raw = sessionStorage.getItem('fwd_session');
      if(raw) ME = JSON.parse(raw);
    }catch(e){}
  }
  function saveSession(){
    sessionStorage.setItem('fwd_session', JSON.stringify(ME));
  }
  function logout(){
    sessionStorage.removeItem('fwd_session');
    ME = null; MY_LEVEL='off'; CAN_EDIT=false; IS_ADMIN=false;
    renderLogin();
  }

  // ============================================================
  // Root render
  // ============================================================
  const root = document.getElementById('app');
  let STATE = { tab:'board', filter:'all', terminalFilter:'all', search:'', searchCompleted:'', display:{}, shipments:[], access:{}, workers:[], terminals:[], detailId:null };

  async function boot(){
    if(!FIREBASE_READY){ renderSetupNeeded(); return; }
    restoreSession();
    if(!ME){
      root.innerHTML = authShell('Loading…', '');
      let workers;
      try{ workers = await getWorkers(); }
      catch(e){ renderLoadError(e, boot); return; }
      if(workers.length === 0){ renderBootstrapAdmin(); return; }
      renderLogin();
      return;
    }
    await loadAccessAndGo();
  }

  function renderSetupNeeded(){
    root.innerHTML = authShell('Not connected yet', `
        <p style="line-height:1.7;">This app needs its own Firebase project.
          Create one at <b>console.firebase.google.com</b>, add a Firestore database
          (production mode), then open <b>Project settings → Your apps → Web app</b> and
          copy the config into <code>FIREBASE_CONFIG</code> near the top of this file's
          script, replacing the <code>PASTE_</code> placeholders.</p>
        <p>Once that's done, reload this page — the first person to open it will be
          prompted to set themselves up as the admin.</p>`);
  }

  // Every pre-login screen shares this shell: the dark topbar with the app
  // name, then a single centered card below on the page background — same
  // structure as the attendance app's own admin login.
  function authShell(title, bodyHtml){
    return `
      <div class="topbar" style="padding-bottom:14px;">
        <div class="brand">EXPREXA FORWARDING<span class="tag">Admin</span></div>
      </div>
      <div class="authwrap">
        <div class="authcard">
          <h3>${title}</h3>
          ${bodyHtml}
        </div>
      </div>`;
  }

  // Shown whenever a Firestore read fails — slow or dropped connections are
  // exactly when this matters most. Previously a failed read here left the
  // screen stuck on "Loading…" forever with no way back short of guessing to
  // reload, which looked identical to the data having vanished even though
  // it was safe the whole time.
  function renderLoadError(err, retryFn){
    console.error('Load failed:', err);
    root.innerHTML = authShell('Couldn\'t load', `
        <p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;">
          ${err && err.message ? escapeHtml(err.message) : 'A connection problem stopped this from loading.'}
          Nothing has been lost — this is just the read failing, not the data.</p>
        <button class="advance" id="ld-retry" style="margin:0;">Try again</button>`);
    document.getElementById('ld-retry').onclick = retryFn;
  }

  function renderBootstrapAdmin(){
    root.innerHTML = authShell('Set up the first admin', `
        <p style="font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.6;">
          No worker IDs exist yet in this project. Create yours — you'll get admin
          access automatically, and can add everyone else from the Worker IDs tab.</p>
        <div class="field"><label>Your name</label>
          <input id="bs-name" placeholder="Full name"></div>
        <div class="field"><label>Choose a password</label>
          <input id="bs-pass" type="password" placeholder="At least 4 characters"></div>
        <button class="advance" id="bs-go" style="margin:0;">Create admin &amp; sign in</button>
        <div class="msg" id="bs-msg" style="margin-top:10px;"></div>`);
    document.getElementById('bs-go').onclick = async function(){
      const name = document.getElementById('bs-name').value.trim();
      const pass = document.getElementById('bs-pass').value;
      const msg = document.getElementById('bs-msg');
      if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter your name.'; return; }
      if(!pass || pass.length < 4){ msg.style.color='var(--red)'; msg.textContent='Password needs at least 4 characters.'; return; }
      this.disabled = true; this.textContent = 'Creating…';
      const id = uid();
      const passwordHash = await sha256Hex(pass);
      await saveWorker({ id, name, passwordHash, createdAt: new Date().toISOString() });
      await setAccessFor(id, 'admin');
      ME = { id, name };
      saveSession();
      await loadAccessAndGo();
    };
  }

  async function loadAccessAndGo(){
    root.innerHTML = authShell('Loading…', '');
    try{
      const [access, termCfg, dispMap] = await Promise.all([getAccessMap(), getTerminalsConfig(), getDisplayMap()]);
      MY_LEVEL = access[ME.id] || 'off';
      CAN_EDIT = MY_LEVEL === 'edit' || MY_LEVEL === 'admin';
      IS_ADMIN = MY_LEVEL === 'admin';
      CAN_DISPLAY = IS_ADMIN || !!dispMap[ME.id];
      STATE.access = access;
      STATE.display = dispMap;
      STATE.terminals = termCfg.terminals || [];
      if(MY_LEVEL === 'off'){ renderNoAccess(); return; }
      await renderShell();
    }catch(e){
      renderLoadError(e, loadAccessAndGo);
    }
  }

  // ============================================================
  // Login — same worker records, same password, as attendance
  // ============================================================
  function renderLogin(){
    root.innerHTML = authShell('Sign in', `
        <div class="field"><label>Your name</label>
          <input type="text" id="w-name" placeholder="Search your name…" autocomplete="off">
          <div id="w-name-results"></div>
        </div>
        <div class="field"><label>Password</label>
          <input type="password" id="w-login-pass" placeholder="Your password"></div>
        <button class="advance" id="login-btn" style="margin:0;">Log In</button>
        <div id="login-msg" style="margin-top:10px;font-size:13px;"></div>`);
    let selectedName = '';
    const nameInput = document.getElementById('w-name');
    const nameResults = document.getElementById('w-name-results');
    nameInput.oninput = async () => {
      selectedName = '';
      nameInput.style.borderColor = '';
      const q = nameInput.value.trim().toLowerCase();
      nameResults.innerHTML = '';
      if(!q) return;
      const workers = await getWorkers();
      const matches = workers.filter(w => w.name && w.name.toLowerCase().includes(q)).slice(0,6);
      nameResults.innerHTML = matches.map(w =>
        `<div class="namehit" data-name="${escapeHtml(w.name)}">${escapeHtml(w.name)}</div>`
      ).join('');
      nameResults.querySelectorAll('.namehit').forEach(opt=>{
        opt.onclick = () => {
          selectedName = opt.dataset.name;
          nameInput.value = selectedName;
          nameInput.style.borderColor = 'var(--green)';
          nameResults.innerHTML = '';
          document.getElementById('w-login-pass').focus();
        };
      });
    };
    const doLogin = async () => {
      const btn = document.getElementById('login-btn');
      const pass = document.getElementById('w-login-pass').value;
      const msg = document.getElementById('login-msg');
      if(!selectedName){ msg.style.color='var(--red)'; msg.textContent='Please select your name from the list.'; return; }
      if(!pass){ msg.style.color='var(--red)'; msg.textContent='Please enter your password.'; return; }
      btn.disabled = true; btn.textContent = 'Checking…';
      const workers = await getWorkers();
      const worker = workers.find(w => w.name === selectedName);
      const hash = await sha256Hex(pass);
      if(!worker || hash !== worker.passwordHash){
        btn.disabled = false; btn.textContent = 'Log In';
        msg.style.color = 'var(--red)'; msg.textContent = 'Incorrect name or password.';
        return;
      }
      ME = { id: worker.id, name: worker.name };
      saveSession();
      await loadAccessAndGo();
    };
    document.getElementById('login-btn').onclick = doLogin;
    document.getElementById('w-login-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
    nameInput.focus();
  }

  function renderNoAccess(){
    root.innerHTML = authShell('Not set up yet', `
        <p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;">
          Signed in as <b style="color:var(--ink);">${escapeHtml(ME.name)}</b>, but you don't
          have access to the forwarding board yet.</p>
        <div class="banner banner-err" style="margin:0 0 14px;">
          Ask an admin to give you View or Edit access from the <b>Access</b> tab.</div>
        <button class="advance" id="na-out" style="margin:0;background:transparent;
          color:var(--ink);border:1.5px solid var(--line);">Sign out</button>`);
    document.getElementById('na-out').onclick = logout;
  }

  // ============================================================
  // Shell + tabs
  // ============================================================
  async function renderShell(){
    try{
      STATE.shipments = await getOpenShipments();
      await refreshCompletedToday();
    }catch(e){
      renderLoadError(e, renderShell);
      return;
    }
    STATE.detailId = null;
    STATE.tab = 'board';
    paintShell();
  }

  // A shipment is "awaiting closing" when a Closing action is actually
  // available on it right now — not merely at the delivery stage.
  function awaitingClosing(s){
    if(s.closed) return false;
    if(s.type === 'export'){
      const tracks = exportTracks(s);
      if(tracks.length) return tracks.some(t => !t.closed && t.stage === EXPORT_STEPS.length-2);
      return s.stage === EXPORT_STEPS.length-2;
    }
    const lots = s.lots || [];
    // Everything arrived has been delivered and closed, but part of the MAWB
    // never turned up — the write-off close is the only move left.
    if(lots.length && lots.every(l=>l.closed) && arrivalBalance(s) > 0) return true;
    return lots.some(l => {
      if(l.closed || !l.hasArrived) return false;
      if(l.stage !== deliveryIdx(importSteps(l))) return false;
      const delivered = (l.deliveries||[]).reduce((a,d)=>a+(d.pcs||0),0);
      return (l.pcsArrived||0) - delivered <= 0;
    });
  }

  // How many shipments were completed today. Read once per load rather than
  // on every re-render, since the board redraws constantly.
  let _completedToday = { date:null, count:0 };
  async function refreshCompletedToday(){
    const day = todayStr();
    try{
      const snap = await withTimeout(db.collection(SHIP).where('closedDate','==', day).get(), 15000, 'Counting completed');
      _completedToday = { date: day, count: snap.docs.filter(d => d.data().closed).length };
    }catch(e){ console.error('Could not count today\'s completed shipments:', e); }
  }

  function alertList(){
    const groups = { stuck:[], balance:[], deliver:[], missing:[] };
    const today = todayStr();
    STATE.shipments.forEach(s=>{
      if(s.closed) return;
      if(s.type === 'export' && exportTracks(s).length){
        exportTracks(s).forEach((t, ti) => {
          if(t.closed || t.chasedDate === today) return;
          const h = ageHours(t.stageAt), thr = THRESH.exp[t.stage] || 24;
          if(h >= thr && t.stage < EXPORT_STEPS.length-1){
            groups.stuck.push({ s, lot:null, what:`HAWB ${t.no}: ${EXPORT_STEPS[t.stage]}, no movement`,
              age: ageStr(t.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
              chaseKey: s.id + '|x' + ti });
          }
        });
      } else if(s.type === 'export'){
        const chased = s.chasedDate === today;
        const h = ageHours(s.stageAt);
        const thr = THRESH.exp[s.stage] || 24;
        if(!chased && h >= thr && s.stage < EXPORT_STEPS.length-1){
          groups.stuck.push({ s, lot:null, what:`${EXPORT_STEPS[s.stage]}, no movement`,
            age: ageStr(s.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
            chaseKey: s.id });
        }
        if(!s.pcs && !s.kg && ageHours(s.createdAt) >= 48){
          groups.missing.push({ s, lot:null, what:'No piece count or weight',
            age: ageStr(s.createdAt), level:'gry', chaseKey: null });
        }
      } else {
        (s.lots||[]).forEach((lot,li)=>{
          if(lot.closed) return;
          const chased = lot.chasedDate === today;
          const h = ageHours(lot.stageAt);
          if(!lot.hasArrived){
            // not yet arrived — flag only once its expected date has passed
            if(lot.expectedDate && lot.expectedDate < today && !chased){
              groups.balance.push({ s, lot, li, what:`${lot.pcsExpected||'?'} pcs not yet arrived`,
                age:'overdue', level:'amb', chaseKey: s.id+'|'+li });
            }
            return;
          }
          const steps = importSteps(lot);
          const thr = importThresh(lot)[lot.stage] || 24;
          if(lot.stage === deliveryIdx(steps)){
            // released, nothing delivered yet, or partially delivered with a balance
            const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
            const remaining = (lot.pcsArrived||0) - delivered;
            if(remaining > 0 && !chased){
              groups.deliver.push({ s, lot, li,
                what: delivered>0 ? `${remaining} pcs balance, not yet sent`
                                   : `${remaining} pcs, nobody assigned`,
                age: ageStr(lot.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
                chaseKey: s.id+'|'+li });
            }
          } else if(lot.stage < terminalIdx(steps) && !chased && h >= thr){
            groups.stuck.push({ s, lot, li, what:`${steps[lot.stage]}, no movement`,
              age: ageStr(lot.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
              chaseKey: s.id+'|'+li });
          }
        });
        if(!s.pcs && !s.kg && (s.lots||[]).every(l=>!l.pcsArrived) && ageHours(s.createdAt) >= 48){
          groups.missing.push({ s, lot:null, what:'No piece count or weight',
            age: ageStr(s.createdAt), level:'gry', chaseKey:null });
        }
      }
    });
    return groups;
  }

  // Shipments where the first (or only) round of arrivals came up short of
  // what was booked — these are the ones waiting on "+ Add lot".
  function shipmentsWithBalance(){
    return STATE.shipments.filter(s=>{
      if(s.closed) return false;
      if(s.type !== 'import') return false;
      const lots = s.lots || [];
      if(!lots.some(l=>l.hasArrived)) return false;
      const totalHere = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
      return (s.pcs||0) - totalHere > 0;
    });
  }

  function paintShell(){
    const groups = alertList();
    const alertCount = groups.stuck.length + groups.balance.length + groups.deliver.length + groups.missing.length;
    const open = STATE.shipments.filter(s => !s.closed);
    const counts = {
      completed: _completedToday.date === todayStr() ? _completedToday.count : 0,
      exports: open.filter(s => s.type === 'export').length,
      imports: open.filter(s => s.type === 'import').length,
      closing: open.filter(awaitingClosing).length
    };
    const balanceShipments = shipmentsWithBalance();

    root.innerHTML = `
      <div class="topbar">
        <div class="topbar-top">
          <div class="brand">EXPREXA FORWARDING<span class="tag">${IS_ADMIN?'ADMIN':CAN_EDIT?'EDIT':'VIEW'}</span></div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span id="refresh-btn" style="color:#9FAAC6;font-size:15px;cursor:pointer;line-height:1;" title="Refresh">&#8635;</span>
            <div class="who" id="who-btn">${escapeHtml(ME.name)} <span class="lvl-badge">${MY_LEVEL.toUpperCase()}</span></div>
          </div>
        </div>
        <div class="tabs-wrap"><div class="tabs">
          <span class="tab ${STATE.tab==='board'?'on':''}" data-tab="board">Board</span>
          <span class="tab ${STATE.tab==='alerts'?'on':''}" data-tab="alerts">Alerts
            ${alertCount?`<span class="bdg">${alertCount}</span>`:''}</span>
          <span class="tab ${STATE.tab==='balances'?'on':''}" data-tab="balances">Balances
            ${balanceShipments.length?`<span class="bdg">${balanceShipments.length}</span>`:''}</span>
          <span class="tab ${STATE.tab==='completed'?'on':''}" data-tab="completed">Completed</span>
          ${CAN_DISPLAY?`<span class="tab" id="disp-tab">Display</span>`:''}
          ${IS_ADMIN?`<span class="tab ${STATE.tab==='terminals'?'on':''}" data-tab="terminals">Terminals</span>`:''}
          ${IS_ADMIN?`<span class="tab ${STATE.tab==='workers'?'on':''}" data-tab="workers">Worker IDs</span>`:''}
          ${IS_ADMIN?`<span class="tab ${STATE.tab==='access'?'on':''}" data-tab="access">Access</span>`:''}
        </div></div>
      </div>
      <div class="content" id="content"></div>
      ${CAN_EDIT ? `<button class="fab" id="fab-new">+</button>` : ''}
    `;
    document.getElementById('who-btn').onclick = () => {
      if(confirm('Sign out of the Forwarding board?')) logout();
    };
    const refreshBtn = document.getElementById('refresh-btn');
    if(refreshBtn) refreshBtn.onclick = async () => {
      refreshBtn.style.opacity = '0.4';
      try{
        const fresh = await getOpenShipments();
        const freshIds = new Set(fresh.map(x=>x.id));
        const preserved = STATE.shipments.filter(x => !freshIds.has(x.id) && x.closed);
        STATE.shipments = fresh.concat(preserved);
        await refreshCompletedToday();
      }catch(e){ console.error('Manual refresh failed:', e); }
      paintShell();
    };
    document.querySelectorAll('.tab').forEach(t=> t.onclick = async () => {
      STATE.tab = t.dataset.tab;
      // Board, Alerts and Balances all read the same in-memory list, which
      // otherwise only ever refreshed on login — someone else's change would
      // sit invisible until a full page reload. Refetching on every visit to
      // one of these keeps what's shown roughly current without needing a
      // live connection open the whole time.
      if(['board','alerts','balances'].includes(STATE.tab)){
        try{
          const fresh = await getOpenShipments();
          const freshIds = new Set(fresh.map(x=>x.id));
          // Anything closed and already merged in from the Completed tab
          // isn't part of this query — keep it rather than losing it.
          const preserved = STATE.shipments.filter(x => !freshIds.has(x.id) && x.closed);
          STATE.shipments = fresh.concat(preserved);
          await refreshCompletedToday();
        }catch(e){ console.error('Refresh on tab switch failed:', e); }
      }
      paintShell();
    });
    // A touch swipe scrolls this sideways naturally, but a normal desktop
    // mouse wheel only moves vertically — nothing seemed to happen when
    // hovering the bar, even though overflow-x was always there. This
    // redirects an ordinary scroll into horizontal movement, and adds
    // click-and-drag panning for mice with no horizontal scroll at all.
    const tabsEl = document.querySelector('.tabs');
    if(tabsEl){
      tabsEl.addEventListener('wheel', (e) => {
        if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
          tabsEl.scrollLeft += e.deltaY;
          e.preventDefault();
        }
      }, { passive: false });
      let dragging = false, dragStartX = 0, dragStartScroll = 0, moved = false;
      tabsEl.addEventListener('mousedown', (e) => {
        dragging = true; moved = false;
        dragStartX = e.pageX; dragStartScroll = tabsEl.scrollLeft;
        tabsEl.style.cursor = 'grabbing';
      });
      window.addEventListener('mousemove', (e) => {
        if(!dragging) return;
        const dx = e.pageX - dragStartX;
        if(Math.abs(dx) > 3) moved = true;
        tabsEl.scrollLeft = dragStartScroll - dx;
      });
      window.addEventListener('mouseup', () => { dragging = false; tabsEl.style.cursor = ''; });
      // A drag that actually moved shouldn't also fire the tab underneath it.
      tabsEl.addEventListener('click', (e) => { if(moved){ e.stopPropagation(); moved = false; } }, true);
    }
    const dispTab = document.getElementById('disp-tab');
    if(dispTab) dispTab.onclick = (e) => { e.stopPropagation(); renderDisplayBoard(); };
    if(CAN_EDIT) document.getElementById('fab-new').onclick = renderNewShipment;

    const c = document.getElementById('content');
    if(STATE.tab === 'board') paintBoard(c, counts);
    else if(STATE.tab === 'alerts') paintAlerts(c, groups);
    else if(STATE.tab === 'balances') paintBalances(c, balanceShipments);
    else if(STATE.tab === 'completed') paintCompleted(c);
    else if(STATE.tab === 'terminals') paintTerminals(c);
    else if(STATE.tab === 'workers') paintWorkers(c);
    else if(STATE.tab === 'access') paintAccess(c);
  }

  // ============================================================
  // Board
  // ============================================================
  // One representative status per shipment, for grouping on the "All" list.
  // For a split import, this follows the same lot the age badge already
  // follows — whichever has been sitting longest — so the two stay consistent.
  function shipmentStatus(s){
    if(s.type === 'export'){
      const tracks = exportTracks(s).filter(t => !t.closed);
      if(!tracks.length) return EXPORT_STEPS[s.stage];
      const worst = tracks.reduce((a,b) => ageHours(b.stageAt) > ageHours(a.stageAt) ? b : a);
      return EXPORT_STEPS[worst.stage];
    }
    const lots = s.lots || [];
    const openLots = lots.filter(l=>!l.closed);
    if(openLots.length === 0) return arrivalBalance(s) > 0 ? 'Awaiting balance' : 'Delivered';
    let worstH = -1, worstLabel = null;
    openLots.forEach(l=>{
      if(!l.hasArrived){ if(worstLabel===null) worstLabel = 'Not arrived'; return; }
      const h = ageHours(l.stageAt);
      if(h > worstH){ worstH = h; worstLabel = importSteps(l)[l.stage]; }
    });
    return worstLabel || 'Not arrived';
  }

  // A compact grouped listing — AWB, customer, clustered under the status
  // they share — as an overview alternative to the detailed roadmap cards.
  // A shipment counts as K1 if any of its lots needs a K1 declaration.
  // Export never does.
  function isK1Shipment(s){
    return s.type === 'import' && (s.lots||[]).some(l => l.hasK1);
  }
  function shortDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day:'numeric', month:'short' });
  }
  function boardListingHtml(list){
    const groups = {};
    const order = [];
    list.forEach(s=>{
      const st = shipmentStatus(s);
      if(!groups[st]){ groups[st] = []; order.push(st); }
      groups[st].push(s);
    });
    // Busiest status first, so the cluster that needs the most attention is
    // the one you see without scrolling.
    order.sort((a,b)=> groups[b].length - groups[a].length);
    return order.map(st => `
      <div class="grp"><span>${escapeHtml(st.toUpperCase())}</span><span class="c">${groups[st].length}</span></div>
      ${groups[st].map(s=>`
        <div class="listrow" data-open="${s.id}">
          <div style="min-width:0;">
            <span class="awb">${escapeHtml(s.awb)}<span class="kind ${s.type==='export'?'exp':'imp'}">${s.type==='export'?'EXP':'IMP'}</span>${isK1Shipment(s)?`<span class="kind" style="background:rgba(214,69,69,.12);color:var(--red);">K1</span>`:''}</span>
            <div class="lsub">Created ${escapeHtml(shortDate(s.createdAt))}</div>
          </div>
          <span class="lc">${escapeHtml(s.customer||'—')}</span>
        </div>`).join('')}
    `).join('');
  }

  function paintBoard(c, counts){
    // A shipment closes during a live session, not just between page loads —
    // the initial query filtered these out, but nothing since then had, so a
    // shipment closed just now kept sitting on the board until a full reload.
    let list = STATE.shipments.filter(s=>!s.closed);
    if(STATE.filter === 'export') list = list.filter(s=>s.type==='export');
    else if(STATE.filter === 'import') list = list.filter(s=>s.type==='import');
    // Same rule as the "closing" counter above the filters, so the chip and
    // the number can never disagree.
    else if(STATE.filter === 'closing') list = list.filter(awaitingClosing);
    else if(STATE.filter === 'split') list = list.filter(s=> (s.lots||[]).length > 1);

    // Terminal narrows further, only meaningful once we're looking at imports.
    // Which terminal a shipment belongs to is worked out from its AWB prefix —
    // nothing stored on the shipment itself.
    const showTerminalRow = STATE.filter === 'import' && STATE.terminals.length > 0;
    if(showTerminalRow && STATE.terminalFilter !== 'all'){
      if(STATE.terminalFilter === '__none') list = list.filter(s=>!terminalForAwb(s.awb, STATE.terminals));
      else list = list.filter(s=> terminalForAwb(s.awb, STATE.terminals) === STATE.terminalFilter);
    }

    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n">${counts.completed}</div><div class="l">completed today</div></div>
        <div class="count"><div class="n">${counts.exports}</div><div class="l">export</div></div>
        <div class="count"><div class="n">${counts.imports}</div><div class="l">import</div></div>
        <div class="count"><div class="n warn">${counts.closing}</div><div class="l">closing</div></div>
      </div>
      <div class="filters">
        <span class="${STATE.filter==='all'?'on':''}" data-f="all">All</span>
        <span class="${STATE.filter==='export'?'on':''}" data-f="export">Export</span>
        <span class="${STATE.filter==='import'?'on':''}" data-f="import">Import</span>
        <span class="${STATE.filter==='closing'?'on':''}" data-f="closing">Closing</span>
        <span class="${STATE.filter==='split'?'on':''}" data-f="split">Split lots</span>
      </div>
      ${showTerminalRow ? `
      <div class="filters" style="background:var(--paper);">
        <span style="color:${STATE.terminalFilter==='all'?'var(--ink)':'var(--muted)'};
          border-bottom-color:${STATE.terminalFilter==='all'?'var(--ink)':'transparent'};" data-tf="all">All terminals</span>
        ${STATE.terminals.map(t=>`
          <span style="color:${STATE.terminalFilter===t.name?'var(--ink)':'var(--muted)'};
            border-bottom-color:${STATE.terminalFilter===t.name?'var(--ink)':'transparent'};"
            data-tf="${escapeHtml(t.name)}">${escapeHtml(t.name)}</span>`).join('')}
        <span style="color:${STATE.terminalFilter==='__none'?'var(--ink)':'var(--muted)'};
          border-bottom-color:${STATE.terminalFilter==='__none'?'var(--ink)':'transparent'};" data-tf="__none">Not set</span>
      </div>` : ''}
      <div style="padding:10px 12px 4px;">
        <input id="bd-search" placeholder="Search AWB, HAWB or customer…" value="${escapeHtml(STATE.search)}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div id="rows"></div>`;
    c.querySelectorAll('.filters span[data-f]').forEach(el=> el.onclick = ()=>{
      STATE.filter = el.dataset.f; STATE.terminalFilter = 'all'; paintShell(); });
    c.querySelectorAll('.filters span[data-tf]').forEach(el=> el.onclick = ()=>{
      STATE.terminalFilter = el.dataset.tf; paintShell(); });

    // Only the rows redraw as you type, so the search box keeps focus and
    // the caret doesn't jump.
    function renderRows(){
      const q = STATE.search.trim().toLowerCase();
      const shown = !q ? list : list.filter(s =>
        String(s.awb||'').toLowerCase().includes(q) ||
        String(s.customer||'').toLowerCase().includes(q) ||
        hawbList(s).some(h => h.no.toLowerCase().includes(q)));
      const host = document.getElementById('rows');
      host.innerHTML = shown.length
        ? (STATE.filter === 'all' ? boardListingHtml(shown) : shown.map(boardRowHtml).join(''))
        : `<div class="empty">${q ? 'Nothing matches that search.' : `Nothing here.${CAN_EDIT?' Tap + to add a shipment.':''}`}</div>`;
      host.querySelectorAll('[data-open]').forEach(el=> el.onclick = ()=> renderDetail(el.dataset.open));
    }
    renderRows();
    const searchBox = document.getElementById('bd-search');
    searchBox.oninput = () => { STATE.search = searchBox.value; renderRows(); };
  }

  // Shared dot-and-line roadmap — export always used this; import now does
  // too, so a shipment reads the same way on the board regardless of type.
  function pipsHtml(steps, stage){
    let pips = '<div class="pips">';
    for(let i=0;i<steps.length;i++){
      pips += `<div class="pip ${i<stage?'done':i===stage?'now':'todo'}"></div>`;
      if(i<steps.length-1) pips += `<div class="link3 ${i<stage?'done':''}"></div>`;
    }
    return pips + '</div>';
  }

  function summarise(s){
    if(s.type === 'export' && exportTracks(s).length){
      const tracks = exportTracks(s);
      const body = tracks.map((t,i) => `
        <div style="font-size:9.5px;color:var(--muted);font-weight:700;margin:${i>0?'8':'0'}px 0 2px;">HAWB ${escapeHtml(t.no)}</div>
        ${pipsHtml(EXPORT_STEPS, t.stage)}`).join('');
      const open = tracks.filter(t => !t.closed);
      const lead = open.length === 0 ? 'All HAWBs closed'
        : open.map(t => `${t.no} at ${EXPORT_STEPS[t.stage]}`).join(', ');
      let worstH = -1, worstLvl = 'ok', worstAge = ageStr(s.createdAt);
      open.forEach(t => {
        const h = ageHours(t.stageAt), thr = THRESH.exp[t.stage] || 24;
        if(h > worstH){ worstH = h; worstAge = ageStr(t.stageAt); worstLvl = h>=thr?'bad':h>=thr*0.6?'warn':'ok'; }
      });
      return { body, lead, age: worstAge, ageClass: worstLvl };
    }
    if(s.type === 'export'){
      const total = EXPORT_STEPS.length - 1;
      const pips = pipsHtml(EXPORT_STEPS, s.stage);
      const h = ageHours(s.stageAt);
      const thr = THRESH.exp[s.stage] || 24;
      const lvl = s.stage >= total ? 'ok' : ageLevel(h, thr);
      return { body: pips, lead: EXPORT_STEPS[s.stage], age: ageStr(s.stageAt),
        ageClass: s.stage>=total?'ok':(lvl==='bad'?'bad':lvl==='warn'?'warn':'ok') };
    }
    const lots = s.lots || [];
    // One roadmap per lot — almost always just one, so this reads exactly
    // like export's single line. A split shipment stacks its lots' roadmaps,
    // each labelled, rather than trying to force them into one line.
    const openLotsForRoadmap = lots.filter(l=>!l.closed);
    let roadmap;
    if(openLotsForRoadmap.length === 0){
      roadmap = '';
    } else if(openLotsForRoadmap.length === 1 && lots.length === 1){
      const l = openLotsForRoadmap[0];
      roadmap = pipsHtml(importSteps(l), l.hasArrived ? l.stage : -1);
    } else {
      roadmap = lots.map((l,li)=>{
        if(l.closed) return '';
        const label = `<div style="font-size:9.5px;color:var(--muted);font-weight:700;margin:${li>0?'8':'0'}px 0 2px;">LOT ${li+1}</div>`;
        return label + pipsHtml(importSteps(l), l.hasArrived ? l.stage : -1);
      }).join('');
    }
    // headline
    const openLots = lots.filter(l=>!l.closed);
    let lead;
    if(openLots.length === 0) lead = arrivalBalance(s) > 0
      ? `${arrivalBalance(s)} pcs balance not arrived`
      : 'All lots delivered';
    else {
      const parts = openLots.map(l=>{
        if(!l.hasArrived) return `${l.pcsExpected||'?'} not arrived`;
        const steps = importSteps(l);
        if(l.stage===deliveryIdx(steps)){
          const del = (l.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
          const rem = (l.pcsArrived||0)-del;
          return del>0 ? `${del} delivered, ${rem} to go` : `${l.pcsArrived} released`;
        }
        return `${l.pcsArrived||l.pcsExpected||'?'} at ${steps[l.stage]}`;
      });
      lead = parts.join(', ');
    }
    // worst age
    let worstH = -1, worstLvl = 'ok', worstAge = '';
    openLots.forEach(l=>{
      if(!l.hasArrived) return;
      const h = ageHours(l.stageAt), thr = importThresh(l)[l.stage]||24;
      if(h > worstH){ worstH = h; worstAge = ageStr(l.stageAt);
        worstLvl = h>=thr?'bad':h>=thr*0.6?'warn':'ok'; }
    });
    if(worstH < 0){ worstAge = ageStr(s.createdAt); worstLvl='ok'; }
    return { body: roadmap, lead, age: worstAge, ageClass: worstLvl };
  }

  function boardRowHtml(s){
    const sum = summarise(s);
    const lotsTag = s.type==='import' && (s.lots||[]).length>1 ? `<span class="lots-tag">${s.lots.length} LOTS</span>` : '';
    const term = terminalForAwb(s.awb, STATE.terminals);
    return `
      <div class="row" data-open="${s.id}">
        <div class="row-top">
          <span class="awb">${escapeHtml(s.awb)}<span class="kind ${s.type==='export'?'exp':'imp'}">${s.type==='export'?'EXP':'IMP'}</span>${lotsTag}</span>
          <span class="route">${escapeHtml(s.from||'')}&rarr;${escapeHtml(s.to||'')}</span>
        </div>
        ${sum.body}
        <div class="row-bot">
          <div><div class="lead">${escapeHtml(sum.lead)}</div>
            <div class="party">${escapeHtml(s.customer||'')}${term?` &middot; ${escapeHtml(term)}`:''}${hawbSummary(s)}</div></div>
          <span class="age ${sum.ageClass}">${sum.age}</span>
        </div>
      </div>`;
  }

  // ============================================================
  // Detail — export
  // ============================================================
  async function renderDetail(id){
    let s = STATE.shipments.find(x=>x.id===id);
    if(!s) return;
    // The board list only refreshes on tab switches — but the moment someone
    // is about to act on a shipment is exactly when a stale copy matters
    // most, so this always pulls that one document fresh. A single doc read
    // is cheap regardless of how large the board has grown.
    const contentEl = document.getElementById('content');
    if(contentEl) contentEl.innerHTML = `<div class="empty">Loading…</div>`;
    try{
      const fresh = await withTimeout(db.collection(SHIP).doc(id).get(), 15000, 'Loading shipment');
      if(fresh.exists){
        s = fresh.data();
        const idx = STATE.shipments.findIndex(x=>x.id===id);
        if(idx>-1) STATE.shipments[idx] = s; else STATE.shipments.push(s);
      }
    }catch(e){ console.error('Could not refresh shipment before opening — showing the last known copy:', e); }
    STATE.detailId = id;
    if(s.type === 'export') renderExportDetail(s); else renderImportDetail(s);
  }

  // Every status change and remark is logged here, with who and when — one
  // combined feed per shipment rather than notes and history living apart.
  function logActivity(s, text, kind, photoId){
    s.activity = s.activity || [];
    s.activity.push({ text, by: ME.name, at: new Date().toISOString(), kind: kind||'status', photoId: photoId||null });
  }
  function activityHtml(s){
    // Older shipments only have the separate notes list from before this was
    // unified — folded in here so nothing already written is lost.
    const legacyNotes = (s.notes||[]).map(n=>({ text:n.text, by:n.by, at:n.at, kind:'note' }));
    const entries = (s.activity||[]).concat(legacyNotes);
    // Shipments created before creation was logged still know who made them
    // and when, so show that as the first entry rather than leaving a gap.
    if(!entries.some(a => a.kind === 'created') && s.createdAt){
      entries.push({ text:'Shipment created', by: s.createdBy || 'unknown', at: s.createdAt, kind:'created' });
    }
    const all = entries.sort((a,b)=> String(b.at).localeCompare(String(a.at)));
    if(all.length === 0) return `<div style="font-size:12.5px;color:var(--muted);">No activity yet.</div>`;
    return all.map(a => a.kind==='note' ? `
        <div class="noteline">${escapeHtml(a.text)}
          <div class="who">${escapeHtml(a.by)}, ${new Date(a.at).toLocaleString()}</div></div>` : `
        <div class="actrow"><div class="dot"></div><div>
          <div class="txt">${escapeHtml(a.text)}</div>
          <div class="who">${escapeHtml(a.by)}, ${new Date(a.at).toLocaleString()}
            ${a.photoId?` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(a.photoId)}">View photo</span>`:''}</div></div></div>`
    ).join('');
  }
  // Wire up any "View photo" links just rendered — fetched on demand rather
  // than embedded in the shipment, so opening a shipment stays cheap even
  // once it's carrying a season's worth of photos.
  function wireActivityPhotoLinks(container){
    container.querySelectorAll('[data-viewphoto]').forEach(el=>{
      el.onclick = async () => {
        const original = el.textContent;
        el.textContent = 'Loading…';
        try{
          const doc = await withTimeout(db.collection(PHOTOS).doc(el.dataset.viewphoto).get(), 15000, 'Loading photo');
          if(doc.exists) showPhotoLightbox(doc.data().photo);
          else el.textContent = 'Photo not found';
        }catch(e){ el.textContent = 'Could not load'; }
        setTimeout(()=>{ if(el.textContent!=='Photo not found') el.textContent = original; }, 2000);
      };
    });
  }
  function showPhotoLightbox(dataUrl){
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,14,26,.92);z-index:999;'+
      'display:flex;align-items:center;justify-content:center;padding:20px;';
    ov.innerHTML = `<img src="${dataUrl}" style="max-width:100%;max-height:100%;border-radius:10px;">`;
    ov.onclick = () => ov.remove();
    document.body.appendChild(ov);
  }

  // ---- photo capture, kept in its own small collection ----
  const PHOTOS = 'fwd_photos';
  function resizeImageFile(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read the photo.'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not read the photo.'));
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  async function savePhoto(dataUrl){
    const id = uid();
    await db.collection(PHOTOS).doc(id).set({ photo: dataUrl, by: ME.name, at: new Date().toISOString() });
    return id;
  }
  // A small screen requiring a photo before the caller's action proceeds.
  // Used at the points in the workflow that need proof: Docs in, moving into
  // Delivery, and Closing.
  function requirePhoto(title, subtitle, onConfirm, onCancel){
    const c = document.getElementById('content') || document.getElementById('app');
    let file = null;
    c.innerHTML = `
      <div class="back" id="ph-bk">&larr; Cancel</div>

        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">${escapeHtml(title)}</div>

      </div>
      <div class="card" style="text-align:center;padding:22px 16px;">

        </div>
        <input type="file" accept="image/*" capture="environment" id="ph-file" style="display:none;">
        <input type="file" accept="image/*" id="ph-upload" style="display:none;">
        <div style="display:flex;gap:8px;">
          <button type="button" class="lot-act ghost" id="ph-pick" style="border-radius:9px;flex:1;">Take photo</button>
          <button type="button" class="lot-act ghost" id="ph-browse" style="border-radius:9px;flex:1;">Upload photo</button>
        </div>
      </div>

      <button class="advance" id="ph-go">Confirm</button>`;
    document.getElementById('ph-bk').onclick = () => onCancel && onCancel();
    // Two ways in: straight to the camera, or pick an existing photo.
    const fileInput = document.getElementById('ph-file');

    document.getElementById('ph-pick').onclick = () => fileInput.click();
    document.getElementById('ph-browse').onclick = () => uploadInput.click();
    function onPhPicked(input){
      file = input.files[0] || null;
      const prev = document.getElementById('ph-preview');
      if(file){
        const url = URL.createObjectURL(file);
        prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:220px;border-radius:10px;">`;
      }
    }
    fileInput.onchange = () => onPhPicked(fileInput);
    uploadInput.onchange = () => onPhPicked(uploadInput);
    document.getElementById('ph-go').onclick = async function(){

      }catch(e){
