            ${balanceShipments.length?`<span class="bdg">${balanceShipments.length}</span>`:''}</span>
          <span class="tab ${STATE.tab==='completed'?'on':''}" data-tab="completed">Completed</span>
          ${IS_ADMIN?`<span class="tab ${STATE.tab==='terminals'?'on':''}" data-tab="terminals">Terminals</span>`:''}
          ${IS_ADMIN?`<span class="tab ${STATE.tab==='workers'?'on':''}" data-tab="workers">Worker IDs</span>`:''}
          ${IS_ADMIN?`<span class="tab ${STATE.tab==='access'?'on':''}" data-tab="access">Access</span>`:''}
        </div></div>
      </div>
      <div class="content" id="content"></div>
      ${CAN_EDIT ? `<button class="fab" id="fab-new">+</button>` : ''}
    `;
    document.getElementById('who-btn').onclick = () => {
      if(confirm('Sign out of the Forwarding board?')) logout();
    };
    const refreshBtn = document.getElementById('refresh-btn');
    if(refreshBtn) refreshBtn.onclick = async () => {
      refreshBtn.style.opacity = '0.4';
      try{
        const fresh = await getOpenShipments();
        const freshIds = new Set(fresh.map(x=>x.id));
        const preserved = STATE.shipments.filter(x => !freshIds.has(x.id) && x.closed);
        STATE.shipments = fresh.concat(preserved);
      }catch(e){ console.error('Manual refresh failed:', e); }
      paintShell();
    };
    document.querySelectorAll('.tab').forEach(t=> t.onclick = async () => {
      STATE.tab = t.dataset.tab;
      // Board, Alerts and Balances all read the same in-memory list, which
      // otherwise only ever refreshed on login — someone else's change would
      // sit invisible until a full page reload. Refetching on every visit to
      // one of these keeps what's shown roughly current without needing a
      // live connection open the whole time.
      if(['board','alerts','balances'].includes(STATE.tab)){
        try{
          const fresh = await getOpenShipments();
          const freshIds = new Set(fresh.map(x=>x.id));
          // Anything closed and already merged in from the Completed tab
          // isn't part of this query — keep it rather than losing it.
          const preserved = STATE.shipments.filter(x => !freshIds.has(x.id) && x.closed);
          STATE.shipments = fresh.concat(preserved);
        }catch(e){ console.error('Refresh on tab switch failed:', e); }
      }
      paintShell();
    });
    if(CAN_EDIT) document.getElementById('fab-new').onclick = renderNewShipment;

    const c = document.getElementById('content');
    if(STATE.tab === 'board') paintBoard(c, toDeliver, needChasing);
    else if(STATE.tab === 'alerts') paintAlerts(c, groups);
    else if(STATE.tab === 'balances') paintBalances(c, balanceShipments);
    else if(STATE.tab === 'completed') paintCompleted(c);
    else if(STATE.tab === 'terminals') paintTerminals(c);
    else if(STATE.tab === 'workers') paintWorkers(c);
    else if(STATE.tab === 'access') paintAccess(c);
  }

  // ============================================================
  // Board
  // ============================================================
  // One representative status per shipment, for grouping on the "All" list.
  // For a split import, this follows the same lot the age badge already
  // follows — whichever has been sitting longest — so the two stay consistent.
  function shipmentStatus(s){
    if(s.type === 'export') return EXPORT_STEPS[s.stage];
    const lots = s.lots || [];
    const openLots = lots.filter(l=>!l.closed);
    if(openLots.length === 0) return 'Delivered';
    let worstH = -1, worstLabel = null;
    openLots.forEach(l=>{
      if(!l.hasArrived){ if(worstLabel===null) worstLabel = 'Not arrived'; return; }
      const h = ageHours(l.stageAt);
      if(h > worstH){ worstH = h; worstLabel = importSteps(l)[l.stage]; }
    });
    return worstLabel || 'Not arrived';
  }

  // A compact grouped listing — AWB, customer, clustered under the status
  // they share — as an overview alternative to the detailed roadmap cards.
  function boardListingHtml(list){
    const groups = {};
    const order = [];
    list.forEach(s=>{
      const st = shipmentStatus(s);
      if(!groups[st]){ groups[st] = []; order.push(st); }
      groups[st].push(s);
    });
    // Busiest status first, so the cluster that needs the most attention is
    // the one you see without scrolling.
    order.sort((a,b)=> groups[b].length - groups[a].length);
    return order.map(st => `
      <div class="grp"><span>${escapeHtml(st.toUpperCase())}</span><span class="c">${groups[st].length}</span></div>
      ${groups[st].map(s=>`
        <div class="listrow" data-open="${s.id}">
          <span class="awb">${escapeHtml(s.awb)}<span class="kind ${s.type==='export'?'exp':'imp'}">${s.type==='export'?'EXP':'IMP'}</span></span>
          <span class="lc">${escapeHtml(s.customer||'—')}</span>
        </div>`).join('')}
    `).join('');
  }

  function paintBoard(c, toDeliver, needChasing){
    // A shipment closes during a live session, not just between page loads —
    // the initial query filtered these out, but nothing since then had, so a
    // shipment closed just now kept sitting on the board until a full reload.
    let list = STATE.shipments.filter(s=>!s.closed);
    if(STATE.filter === 'export') list = list.filter(s=>s.type==='export');
    else if(STATE.filter === 'import') list = list.filter(s=>s.type==='import');
    else if(STATE.filter === 'deliver') list = list.filter(s=>s.type==='import' &&
      (s.lots||[]).some(l=>!l.closed && l.stage===5));
    else if(STATE.filter === 'split') list = list.filter(s=> (s.lots||[]).length > 1);

    // Terminal narrows further, only meaningful once we're looking at imports.
    // Which terminal a shipment belongs to is worked out from its AWB prefix —
    // nothing stored on the shipment itself.
    const showTerminalRow = STATE.filter === 'import' && STATE.terminals.length > 0;
    if(showTerminalRow && STATE.terminalFilter !== 'all'){
      if(STATE.terminalFilter === '__none') list = list.filter(s=>!terminalForAwb(s.awb, STATE.terminals));
      else list = list.filter(s=> terminalForAwb(s.awb, STATE.terminals) === STATE.terminalFilter);
    }

    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n">${STATE.shipments.length}</div><div class="l">open</div></div>
        <div class="count"><div class="n warn">${needChasing}</div><div class="l">need chasing</div></div>
        <div class="count"><div class="n warn">${toDeliver}</div><div class="l">to deliver</div></div>
      </div>
      <div class="filters">
        <span class="${STATE.filter==='all'?'on':''}" data-f="all">All</span>
        <span class="${STATE.filter==='export'?'on':''}" data-f="export">Export</span>
        <span class="${STATE.filter==='import'?'on':''}" data-f="import">Import</span>
        <span class="${STATE.filter==='deliver'?'on':''}" data-f="deliver">To deliver</span>
        <span class="${STATE.filter==='split'?'on':''}" data-f="split">Split lots</span>
      </div>
      ${showTerminalRow ? `
      <div class="filters" style="background:var(--paper);">
        <span style="color:${STATE.terminalFilter==='all'?'var(--ink)':'var(--muted)'};
          border-bottom-color:${STATE.terminalFilter==='all'?'var(--ink)':'transparent'};" data-tf="all">All terminals</span>
        ${STATE.terminals.map(t=>`
          <span style="color:${STATE.terminalFilter===t.name?'var(--ink)':'var(--muted)'};
            border-bottom-color:${STATE.terminalFilter===t.name?'var(--ink)':'transparent'};"
            data-tf="${escapeHtml(t.name)}">${escapeHtml(t.name)}</span>`).join('')}
        <span style="color:${STATE.terminalFilter==='__none'?'var(--ink)':'var(--muted)'};
          border-bottom-color:${STATE.terminalFilter==='__none'?'var(--ink)':'transparent'};" data-tf="__none">Not set</span>
      </div>` : ''}
      <div id="rows">
        ${list.length
          ? (STATE.filter === 'all' ? boardListingHtml(list) : list.map(boardRowHtml).join(''))
          : `<div class="empty">Nothing here.${CAN_EDIT?' Tap + to add a shipment.':''}</div>`}
      </div>`;
    c.querySelectorAll('.filters span[data-f]').forEach(el=> el.onclick = ()=>{
      STATE.filter = el.dataset.f; STATE.terminalFilter = 'all'; paintShell(); });
    c.querySelectorAll('.filters span[data-tf]').forEach(el=> el.onclick = ()=>{
      STATE.terminalFilter = el.dataset.tf; paintShell(); });
    c.querySelectorAll('[data-open]').forEach(el=> el.onclick = ()=> renderDetail(el.dataset.open));
  }

  // Shared dot-and-line roadmap — export always used this; import now does
  // too, so a shipment reads the same way on the board regardless of type.
  function pipsHtml(steps, stage){
    let pips = '<div class="pips">';
    for(let i=0;i<steps.length;i++){
      pips += `<div class="pip ${i<stage?'done':i===stage?'now':'todo'}"></div>`;
      if(i<steps.length-1) pips += `<div class="link3 ${i<stage?'done':''}"></div>`;
    }
    return pips + '</div>';
  }

  function summarise(s){
    if(s.type === 'export'){
      const total = EXPORT_STEPS.length - 1;
      const pips = pipsHtml(EXPORT_STEPS, s.stage);
      const h = ageHours(s.stageAt);
      const thr = THRESH.exp[s.stage] || 24;
      const lvl = s.stage >= total ? 'ok' : ageLevel(h, thr);
      return { body: pips, lead: EXPORT_STEPS[s.stage], age: ageStr(s.stageAt),
        ageClass: s.stage>=total?'ok':(lvl==='bad'?'bad':lvl==='warn'?'warn':'ok') };
    }
    const lots = s.lots || [];
    // One roadmap per lot — almost always just one, so this reads exactly
    // like export's single line. A split shipment stacks its lots' roadmaps,
    // each labelled, rather than trying to force them into one line.
    const openLotsForRoadmap = lots.filter(l=>!l.closed);
    let roadmap;
    if(openLotsForRoadmap.length === 0){
      roadmap = '';
    } else if(openLotsForRoadmap.length === 1 && lots.length === 1){
      const l = openLotsForRoadmap[0];
      roadmap = pipsHtml(importSteps(l), l.hasArrived ? l.stage : -1);
    } else {
      roadmap = lots.map((l,li)=>{
        if(l.closed) return '';
        const label = `<div style="font-size:9.5px;color:var(--muted);font-weight:700;margin:${li>0?'8':'0'}px 0 2px;">LOT ${li+1}</div>`;
        return label + pipsHtml(importSteps(l), l.hasArrived ? l.stage : -1);
      }).join('');
    }
    // headline
    const openLots = lots.filter(l=>!l.closed);
    let lead;
    if(openLots.length === 0) lead = 'All lots delivered';
    else {
      const parts = openLots.map(l=>{
        if(!l.hasArrived) return `${l.pcsExpected||'?'} not arrived`;
        const steps = importSteps(l);
        if(l.stage===deliveryIdx(steps)){
          const del = (l.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
          const rem = (l.pcsArrived||0)-del;
          return del>0 ? `${del} delivered, ${rem} to go` : `${l.pcsArrived} released`;
        }
        return `${l.pcsArrived||l.pcsExpected||'?'} at ${steps[l.stage]}`;
      });
      lead = parts.join(', ');
    }
    // worst age
    let worstH = -1, worstLvl = 'ok', worstAge = '';
    openLots.forEach(l=>{
      if(!l.hasArrived) return;
      const h = ageHours(l.stageAt), thr = importThresh(l)[l.stage]||24;
      if(h > worstH){ worstH = h; worstAge = ageStr(l.stageAt);
        worstLvl = h>=thr?'bad':h>=thr*0.6?'warn':'ok'; }
    });
    if(worstH < 0){ worstAge = ageStr(s.createdAt); worstLvl='ok'; }
    return { body: roadmap, lead, age: worstAge, ageClass: worstLvl };
  }

  function boardRowHtml(s){
    const sum = summarise(s);
    const lotsTag = s.type==='import' && (s.lots||[]).length>1 ? `<span class="lots-tag">${s.lots.length} LOTS</span>` : '';
    const term = terminalForAwb(s.awb, STATE.terminals);
    return `
      <div class="row" data-open="${s.id}">
        <div class="row-top">
          <span class="awb">${escapeHtml(s.awb)}<span class="kind ${s.type==='export'?'exp':'imp'}">${s.type==='export'?'EXP':'IMP'}</span>${lotsTag}</span>
          <span class="route">${escapeHtml(s.from||'')}&rarr;${escapeHtml(s.to||'')}</span>
        </div>
        ${sum.body}
        <div class="row-bot">
          <div><div class="lead">${escapeHtml(sum.lead)}</div>
            <div class="party">${escapeHtml(s.customer||'')}${term?` &middot; ${escapeHtml(term)}`:''}</div></div>
          <span class="age ${sum.ageClass}">${sum.age}</span>
        </div>
      </div>`;
  }

  // ============================================================
  // Detail — export
  // ============================================================
  async function renderDetail(id){
    let s = STATE.shipments.find(x=>x.id===id);
    if(!s) return;
    // The board list only refreshes on tab switches — but the moment someone
    // is about to act on a shipment is exactly when a stale copy matters
    // most, so this always pulls that one document fresh. A single doc read
    // is cheap regardless of how large the board has grown.
    const contentEl = document.getElementById('content');
    if(contentEl) contentEl.innerHTML = `<div class="empty">Loading…</div>`;
    try{
      const fresh = await withTimeout(db.collection(SHIP).doc(id).get(), 15000, 'Loading shipment');
      if(fresh.exists){
        s = fresh.data();
        const idx = STATE.shipments.findIndex(x=>x.id===id);
        if(idx>-1) STATE.shipments[idx] = s; else STATE.shipments.push(s);
      }
    }catch(e){ console.error('Could not refresh shipment before opening — showing the last known copy:', e); }
    STATE.detailId = id;
    if(s.type === 'export') renderExportDetail(s); else renderImportDetail(s);
  }

  // Every status change and remark is logged here, with who and when — one
  // combined feed per shipment rather than notes and history living apart.
  function logActivity(s, text, kind, photoId){
    s.activity = s.activity || [];
    s.activity.push({ text, by: ME.name, at: new Date().toISOString(), kind: kind||'status', photoId: photoId||null });
  }
  function activityHtml(s){
    // Older shipments only have the separate notes list from before this was
    // unified — folded in here so nothing already written is lost.
    const legacyNotes = (s.notes||[]).map(n=>({ text:n.text, by:n.by, at:n.at, kind:'note' }));
    const all = (s.activity||[]).concat(legacyNotes)
      .sort((a,b)=> String(b.at).localeCompare(String(a.at)));
    if(all.length === 0) return `<div style="font-size:12.5px;color:var(--muted);">No activity yet.</div>`;
    return all.map(a => a.kind==='note' ? `
        <div class="noteline">${escapeHtml(a.text)}
          <div class="who">${escapeHtml(a.by)}, ${new Date(a.at).toLocaleString()}</div></div>` : `
        <div class="actrow"><div class="dot"></div><div>
          <div class="txt">${escapeHtml(a.text)}</div>
          <div class="who">${escapeHtml(a.by)}, ${new Date(a.at).toLocaleString()}
            ${a.photoId?` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(a.photoId)}">View photo</span>`:''}</div></div></div>`
    ).join('');
  }
  // Wire up any "View photo" links just rendered — fetched on demand rather
  // than embedded in the shipment, so opening a shipment stays cheap even
  // once it's carrying a season's worth of photos.
  function wireActivityPhotoLinks(container){
    container.querySelectorAll('[data-viewphoto]').forEach(el=>{
      el.onclick = async () => {
        const original = el.textContent;
        el.textContent = 'Loading…';
        try{
          const doc = await withTimeout(db.collection(PHOTOS).doc(el.dataset.viewphoto).get(), 15000, 'Loading photo');
          if(doc.exists) showPhotoLightbox(doc.data().photo);
          else el.textContent = 'Photo not found';
        }catch(e){ el.textContent = 'Could not load'; }
        setTimeout(()=>{ if(el.textContent!=='Photo not found') el.textContent = original; }, 2000);
      };
    });
  }
  function showPhotoLightbox(dataUrl){
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,14,26,.92);z-index:999;'+
      'display:flex;align-items:center;justify-content:center;padding:20px;';
    ov.innerHTML = `<img src="${dataUrl}" style="max-width:100%;max-height:100%;border-radius:10px;">`;
    ov.onclick = () => ov.remove();
    document.body.appendChild(ov);
  }

  // ---- photo capture, kept in its own small collection ----
  const PHOTOS = 'fwd_photos';
  function resizeImageFile(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read the photo.'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not read the photo.'));
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  async function savePhoto(dataUrl){
    const id = uid();
    await db.collection(PHOTOS).doc(id).set({ photo: dataUrl, by: ME.name, at: new Date().toISOString() });
    return id;
  }
  // A small screen requiring a photo before the caller's action proceeds.
  // Used at the points in the workflow that need proof: Docs in, moving into
  // Delivery, and Closing.
  function requirePhoto(title, subtitle, onConfirm, onCancel){
    const c = document.getElementById('content') || document.getElementById('app');
    let file = null;
    c.innerHTML = `
      <div class="back" id="ph-bk">&larr; Cancel</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">${escapeHtml(title)}</div>
        <div class="meta">${escapeHtml(subtitle)} &middot; a photo is required for this step</div>
      </div>
      <div class="card" style="text-align:center;padding:22px 16px;">
        <div id="ph-preview" style="margin-bottom:14px;">
          <div style="font-size:12.5px;color:var(--muted);">No photo taken yet</div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="ph-file" style="display:none;">
        <button class="lot-act ghost" id="ph-pick" style="border-radius:10px;">Take photo</button>
      </div>
      <div class="msg" id="ph-msg"></div>
      <button class="advance" id="ph-go">Confirm</button>`;
    document.getElementById('ph-bk').onclick = () => onCancel && onCancel();
    const fileInput = document.getElementById('ph-file');
    document.getElementById('ph-pick').onclick = () => fileInput.click();
    fileInput.onchange = () => {
      file = fileInput.files[0] || null;
      const prev = document.getElementById('ph-preview');
      if(file){
        const url = URL.createObjectURL(file);
        prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:220px;border-radius:10px;">`;
      }
    };
    document.getElementById('ph-go').onclick = async function(){
      const msg = document.getElementById('ph-msg');
      if(!file){ msg.style.color='var(--red)'; msg.textContent='Take a photo first.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      try{
        const dataUrl = await resizeImageFile(file, 1000, 0.72);
        const photoId = await savePhoto(dataUrl);
        onConfirm(photoId);
      }catch(e){
        this.disabled = false; this.textContent = 'Confirm';
        msg.style.color='var(--red)'; msg.textContent = e.message || 'Could not save the photo — try again.';
      }
    };
  }

  function trackLinksHtml(s){
    const cl = cargoLink(s.awb);
    const fl = s.flight ? flightLink(s.flight) : null;
    if(!cl && !fl) return '';
    let html = '<div class="linkrow">';
    if(cl) html += `<div class="linkbtn" id="lk-cargo">${escapeHtml(cl.label)}</div>`;
    if(fl) html += `<div class="linkbtn" id="lk-flight">Track flight ${escapeHtml(s.flight)}</div>`;
    html += '</div>';
    return html;
  }
  function wireTrackLinks(s){
    const cl = cargoLink(s.awb);
    const fl = s.flight ? flightLink(s.flight) : null;
    const lc = document.getElementById('lk-cargo');
    if(lc && cl){
      lc.onclick = () => {
        if(cl.direct){ window.open(cl.url, '_blank'); }
        else {
          navigator.clipboard?.writeText(cl.copy).catch(()=>{});
          window.open(cl.url, '_blank');
        }
      };
    }
    const lf = document.getElementById('lk-flight');
    if(lf && fl) lf.onclick = () => window.open(fl, '_blank');
  }

  function renderExportDetail(s){
    const c = document.getElementById('content');
    const stepsHtml = EXPORT_STEPS.map((label,i)=>{
      const cls = i<s.stage?'done':i===s.stage?'now':'todo';
      return `<div class="st"><div class="d ${cls}"></div><div class="lbl ${i===s.stage?'on':''}">${label}</div></div>` +
        (i<EXPORT_STEPS.length-1?`<div class="jn ${i<s.stage?'done':''}"></div>`:'');
    }).join('');
    const done = s.stage >= EXPORT_STEPS.length-1;
    const nextLabel = done ? null : EXPORT_STEPS[s.stage+1];

    c.innerHTML = `
      <div class="back" id="bk">&larr; Board</div>
      <div class="head">
        <div class="awb-lg">${escapeHtml(s.awb)}</div>
        <div class="meta">Export to ${escapeHtml(s.to||'—')}${s.flight?` on ${escapeHtml(s.flight)}`:''}${s.departDate?` &middot; departs ${escapeHtml(s.departDate)}${s.departTime?', '+escapeHtml(s.departTime):''}`:''}<br>
          ${escapeHtml(s.customer||'')}${s.pcs?` &middot; ${escapeHtml(s.pcs)} pcs`:''}${s.kg?`, ${escapeHtml(s.kg)} kg`:''}</div>
        ${trackLinksHtml(s)}
        ${IS_ADMIN ? `<div class="linkrow"><div class="linkbtn" id="edit-btn">Edit details</div></div>` : ''}
      </div>
      <div class="card" style="padding:2px 15px;">
        <div class="steps" style="padding-top:14px;">${stepsHtml}</div>
      </div>
      ${!CAN_EDIT ? `<div class="viewer-strip">You're signed in as <b>view only</b>.
          Ask an editor to move this along.</div>` :
        done ? `<div class="card" style="text-align:center;color:var(--green);font-weight:600;">
          ${EXPORT_STEPS[EXPORT_STEPS.length-1]} — this shipment is closed.</div>` :
        `<button class="advance" id="adv"><small>Next step</small>Mark ${escapeHtml(nextLabel)}</button>`}
      <div class="sect">ACTIVITY</div>
      <div class="card">
        ${activityHtml(s)}
        ${CAN_EDIT ? `<div class="addnote"><input id="note-in" placeholder="Add a remark…">
          <button id="note-go">Add</button></div>` : ''}
      </div>
      <div style="height:20px;"></div>`;

    document.getElementById('bk').onclick = () => { STATE.tab='board'; paintShell(); };
    wireTrackLinks(s);
    wireActivityPhotoLinks(c);
    const editBtn = document.getElementById('edit-btn');
    if(editBtn) editBtn.onclick = () => renderEditShipment(s);
    const adv = document.getElementById('adv');
    if(adv) adv.onclick = async () => {
      const fromLabel = EXPORT_STEPS[s.stage];
      const toStage = s.stage + 1;
      const toLabel = EXPORT_STEPS[toStage];
      const isClosing = toStage >= EXPORT_STEPS.length-1;
      const needsPhoto = toLabel === 'Docs in' || isClosing;
      async function doAdvance(photoId){
        adv.disabled = true; adv.textContent = 'Saving…';
        s.stage = toStage;
        s.stageAt = new Date().toISOString();
        s.chasedDate = null;
        logActivity(s, `Moved from ${fromLabel} to ${toLabel}`, 'status', photoId);
        if(isClosing){ s.closed = true; s.closedDate = todayStr(); }
        await saveShipment(s);
        renderExportDetail(s);
      }
      if(needsPhoto){
        requirePhoto(`Photo for ${toLabel}`, s.awb, doAdvance, () => renderExportDetail(s));
      } else {
        await doAdvance(null);
      }
    };
    const noteGo = document.getElementById('note-go');
    if(noteGo) noteGo.onclick = async () => {
      const inp = document.getElementById('note-in');
      const text = inp.value.trim();
      if(!text) return;
      logActivity(s, text, 'note');
      await saveShipment(s);
      renderExportDetail(s);
    };
  }

  // ============================================================
  // Detail — import (lots)
  // ============================================================
  function lotStepsHtml(lot){
    const steps = importSteps(lot);
    return steps.map((label,i)=>{
      const cls = i<lot.stage?'done':i===lot.stage?'now':'todo';
      return `<div class="st"><div class="d ${cls}"></div></div>` +
        (i<steps.length-1?`<div class="jn ${i<lot.stage?'done':''}"></div>`:'');
    }).join('');
  }

  function renderImportDetail(s){
    const c = document.getElementById('content');
    const lots = s.lots || [];
    // s.pcs is the total booked on the AWB at creation — the one figure to
    // measure everything else against, rather than re-deriving it from
    // whatever each lot happens to expect.
    const totalExp = s.pcs || 0;
    const totalHere = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
    const anyArrived = lots.some(l=>l.hasArrived);
    const balance = totalExp - totalHere;
    // Only offer another lot once the first has actually arrived and come up
    // short — recording the full amount on the first go removes the option
    // entirely, since there's nothing left to split.
    const showAddLot = CAN_EDIT && anyArrived && balance > 0;

    c.innerHTML = `
      <div class="back" id="bk">&larr; Board</div>
      <div class="head">
        <div class="awb-lg">${escapeHtml(s.awb)}</div>
        <div class="meta">Import from ${escapeHtml(s.from||'—')}<br>${escapeHtml(s.customer||'')}</div>
        <div class="tally">
          <div>ON THE AWB<b>${totalExp||'—'}</b></div>
          <div>HERE<b>${totalHere}</b></div>
          ${anyArrived && balance>0?`<div>BALANCE<b class="amb">${balance}</b></div>`:''}
        </div>
        ${trackLinksHtml(s)}
        ${IS_ADMIN ? `<div class="linkrow"><div class="linkbtn" id="edit-btn">Edit details</div></div>` : ''}
      </div>
      <div id="lots-host"></div>
      ${showAddLot ? `<button class="addlot" id="add-lot">+ Add lot for the remaining ${balance} pcs</button>` : ''}
      <div class="sect">ACTIVITY</div>
      <div class="card">
        ${activityHtml(s)}
        ${CAN_EDIT ? `<div class="addnote"><input id="note-in" placeholder="Add a remark…">
          <button id="note-go">Add</button></div>` : ''}
      </div>
      <div style="height:20px;"></div>`;

    document.getElementById('bk').onclick = () => { STATE.tab='board'; paintShell(); };
    wireTrackLinks(s);
    wireActivityPhotoLinks(c);
    const editBtn = document.getElementById('edit-btn');
    if(editBtn) editBtn.onclick = () => renderEditShipment(s);
    paintLots(s);

    const addLotBtn = document.getElementById('add-lot');
    if(addLotBtn) addLotBtn.onclick = () => renderRecordArrival(s, null, balance);

    const noteGo = document.getElementById('note-go');
    if(noteGo) noteGo.onclick = async () => {
      const inp = document.getElementById('note-in');
      const text = inp.value.trim();
      if(!text) return;
      logActivity(s, text, 'note');
      await saveShipment(s);
      renderImportDetail(s);
    };
  }

  function paintLots(s){
    const host = document.getElementById('lots-host');
    const lots = s.lots || [];
    host.innerHTML = lots.map((lot, li) => {
      const label = lots.length>1 ? `LOT ${li+1}` : 'PROGRESS';
      const steps = importSteps(lot);
      const k1Tag = lot.hasArrived && !lot.closed
        ? `<span class="lot-tag ${lot.hasK1?'w':'here'}" style="margin-left:6px;">${lot.hasK1?'K1':'NO K1'}</span>` : '';
      const tagHtml = lot.closed ? `<span class="lot-tag done">DELIVERED</span>`
        : !lot.hasArrived ? `<span class="lot-tag w">NOT ARRIVED</span>`
        : `<span class="lot-tag here">HERE</span>${k1Tag}`;
      const qty = !lot.hasArrived ? (lot.pcsExpected||'?')+' pcs' : (lot.pcsArrived||'?')+' pcs';
      const when = !lot.hasArrived
        ? (lot.expectedDate ? `Expected ${lot.expectedDate}${lot.expectedTime?', '+lot.expectedTime:''}` : 'Date not yet known') + (lot.flight?` &middot; ${escapeHtml(lot.flight)}`:'')
        : `${lot.flight?escapeHtml(lot.flight)+' &middot; ':''}landed ${lot.arrivedAt?new Date(lot.arrivedAt).toLocaleDateString():''}${lot.k1?` &middot; K1 ${escapeHtml(lot.k1)}`:''}`;

      let nowLine, actionHtml;
      if(lot.closed){
        nowLine = `<div class="lot-now"><div><div class="s">Delivered in full</div></div>
          <span class="age ok">done</span></div>`;
        actionHtml = '';
      } else if(!lot.hasArrived){
        nowLine = `<div class="lot-now"><div><div class="s">Waiting on the airline</div>
          <div class="k">Will need its own clearance once here</div></div>
          <span class="age warn">${lot.expectedDate||'no date yet'}</span></div>`;
        actionHtml = CAN_EDIT ? `<button class="lot-act" data-arrive="${li}">Record this lot arriving</button>` : '';
      } else if(lot.stage === deliveryIdx(steps)){
        const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
        const remaining = (lot.pcsArrived||0) - delivered;
        const h = ageHours(lot.stageAt), thr = importThresh(lot)[lot.stage];
        nowLine = `<div class="lot-now"><div><div class="s">Delivery</div>
          <div class="k">${delivered} delivered, ${remaining} balance</div></div>
          <span class="age ${remaining>0?(ageLevel(h,thr)==='bad'?'bad':'warn'):'ok'}">${ageStr(lot.stageAt)}</span></div>`;
        const runsHtml = (lot.deliveries||[]).map(d=>`
          <div class="run"><div class="qty">${d.pcs} pcs</div>
            <div><div class="who">${escapeHtml(d.driver)}</div>
              <div class="when">${new Date(d.at).toLocaleString()}</div>
              <span class="lorry">${escapeHtml(d.lorry)}</span></div></div>`).join('');
        actionHtml = (runsHtml ? `<div style="padding:0 14px;">${runsHtml}</div>` : '') +
          (CAN_EDIT && remaining>0 ? `<button class="lot-act" data-deliver="${li}"><small>When it goes out</small>Record a delivery</button>
            <button class="lot-act mut" data-closelot="${li}">Close &mdash; nothing more to deliver</button>` : '');
      } else {
        const h = ageHours(lot.stageAt), thr = importThresh(lot)[lot.stage]||24;
        const lvl = ageLevel(h,thr);
        nowLine = `<div class="lot-now"><div><div class="s">${steps[lot.stage]}</div></div>
          <span class="age ${lvl==='bad'?'bad':lvl==='warn'?'warn':'ok'}">${ageStr(lot.stageAt)}</span></div>`;
        // The step right before Delivery goes straight into the combined
        // recording form — quantity, lorry, driver and photo together —
        // rather than a bare "mark as moved" tap first.
        actionHtml = !CAN_EDIT ? '' : steps[lot.stage+1] === 'Delivery'
          ? `<button class="lot-act" data-deliver="${li}"><small>When it goes out</small>Record a delivery</button>`
          : `<button class="lot-act" data-advance="${li}"><small>Next step</small>Mark ${escapeHtml(steps[lot.stage+1])}</button>`;
      }

      return `
        <div class="sect" style="margin-bottom:0;">${label}</div>
        <div class="lot ${!lot.hasArrived?'wait':''}">
          <div class="lot-hd"><span class="lot-qty">${qty}</span>${tagHtml}</div>
          <div class="lot-when">${when}</div>
          ${lot.hasArrived ? `<div class="steps">${lotStepsHtml(lot)}</div>` : ''}
          ${nowLine}
          ${actionHtml}
        </div>`;
    }).join('');

    if(!CAN_EDIT){
      host.insertAdjacentHTML('beforeend', `<div class="viewer-strip">You're signed in as
        <b>view only</b>. Ask an editor to move this along.</div>`);
    }

    host.querySelectorAll('[data-advance]').forEach(btn=>{
      btn.onclick = async () => {
        const li = +btn.dataset.advance;
        const lot = s.lots[li];
        const steps = importSteps(lot);
        const fromLabel = steps[lot.stage];
        const toStage = lot.stage + 1;
        const toLabel = steps[toStage];
        const label = lots.length>1 ? `Lot ${li+1}: ` : '';
        const needsPhoto = toLabel === 'Docs in';
        async function doAdvance(photoId){
          btn.disabled = true;
          lot.stage = toStage;
          lot.stageAt = new Date().toISOString();
          lot.chasedDate = null;
          logActivity(s, `${label}Moved from ${fromLabel} to ${toLabel}`, 'status', photoId);
          await saveShipment(s);
          renderImportDetail(s);
        }
        if(needsPhoto){
          requirePhoto(`Photo for ${toLabel}`, `${label}${s.awb}`, doAdvance, () => renderImportDetail(s));
        } else {
          await doAdvance(null);
        }
      };
    });
    host.querySelectorAll('[data-arrive]').forEach(btn=>{
      btn.onclick = () => renderRecordArrival(s, +btn.dataset.arrive);
    });
    host.querySelectorAll('[data-deliver]').forEach(btn=>{
      btn.onclick = () => renderRecordDelivery(s, +btn.dataset.deliver);
    });
    host.querySelectorAll('[data-closelot]').forEach(btn=>{
      btn.onclick = () => {
        if(!confirm('Close this lot with a balance still outstanding?')) return;
        const li = +btn.dataset.closelot;
        const lot = s.lots[li];
        const label = lots.length>1 ? `Lot ${li+1}: ` : '';
        requirePhoto('Photo for Closing', `${label}${s.awb}`, async (photoId) => {
          lot.closed = true;
          lot.stage = terminalIdx(importSteps(lot));
          logActivity(s, `${label}Closed with a balance still outstanding`, 'status', photoId);
          checkFullyClosed(s);
          await saveShipment(s);
          renderImportDetail(s);
        }, () => renderImportDetail(s));
      };
    });
  }

  function checkFullyClosed(s){
    if(s.type==='import' && (s.lots||[]).length && s.lots.every(l=>l.closed)){
      s.closed = true; s.closedDate = todayStr();
    }
  }

  // ---- record a lot arriving ----
  function renderRecordArrival(s, li, defaultQtyForNewLot){
    const c = document.getElementById('content');
    const lot = li!=null ? s.lots[li] : null;
    const defaultQty = lot ? (lot.pcsExpected || '') : (defaultQtyForNewLot || '');
    // K1 is decided once, when the shipment is created — not re-asked here.
    // A new lot from a balance takes the same K1 status as the first, since
    // it's the same commodity on the same AWB.
    const hasK1 = lot ? !!lot.hasK1 : !!(s.lots && s.lots[0] && s.lots[0].hasK1);
    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">
          ${lot?'Lot has arrived':'New lot arrived'}</div>
        <div class="meta">${escapeHtml(s.customer||'')}</div>
      </div>
      <div class="field"><label>Flight it came on</label>
        <input class="mono" id="ar-flight" value="${escapeHtml(lot&&lot.flight||s.flight||'')}" placeholder="e.g. CX9711"></div>
      <div class="field"><label>Pieces that actually landed</label>
        <input type="number" min="0" id="ar-qty" value="${escapeHtml(defaultQty)}" placeholder="e.g. 18"></div>
      ${lot&&lot.pcsExpected?`<div style="margin:-8px 16px 14px;font-size:11.5px;color:var(--muted);">of ${lot.pcsExpected} expected</div>`:''}
      <div style="margin:0 16px 14px;font-size:12px;color:var(--muted);line-height:1.6;">
        This lot starts its own clearance from here.${lot?'':' It will follow the same K1 status as the shipment.'}
        It goes through ${hasK1?'Examine and Pay duty':'Screening'}${hasK1?' (K1)':' (no K1)'}.
      </div>
      <div class="msg" id="ar-msg"></div>
      <button class="advance" id="ar-go">Record arrival</button>`;
    document.getElementById('bk').onclick = () => renderImportDetail(s);
    document.getElementById('ar-go').onclick = async function(){
      const flight = document.getElementById('ar-flight').value.trim();
      const qtyVal = document.getElementById('ar-qty').value.trim();
      const qty = qtyVal ? parseInt(qtyVal,10) : 0;
      const msg = document.getElementById('ar-msg');
      if(!qtyVal || isNaN(qty) || qty <= 0){ msg.style.color='var(--red)'; msg.textContent='Enter how many pieces arrived.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      const now = new Date().toISOString();
      if(lot){
        lot.hasArrived = true; lot.stage = 0; lot.pcsArrived = qty;
        lot.flight = flight || lot.flight || null;
        lot.arrivedAt = now; lot.stageAt = now; lot.chasedDate = null;
        const idx = s.lots.indexOf(lot);
        const label = s.lots.length>1 ? `Lot ${idx+1}: ` : '';
        logActivity(s, `${label}Arrived — ${qty} pcs${lot.hasK1?' (K1)':''}`);
      } else {
        s.lots = s.lots || [];
        s.lots.push({ id: uid(), hasArrived:true, hasK1, stage: 0, pcsArrived: qty, flight: flight||null,
          arrivedAt: now, stageAt: now, deliveries: [], closed:false, chasedDate:null });
        logActivity(s, `Lot ${s.lots.length}: Arrived — ${qty} pcs${hasK1?' (K1)':''}`);
      }
      await saveShipment(s);
      renderImportDetail(s);
    };
  }

  // ---- record a delivery ----
  function renderRecordDelivery(s, li){
    const c = document.getElementById('content');
    const lot = s.lots[li];
    const steps = importSteps(lot);
    const enteringDelivery = lot.stage < deliveryIdx(steps);
    const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
    const remaining = (lot.pcsArrived||0) - delivered;
    let file = null;

    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">Record a delivery</div>
        <div class="meta">${escapeHtml(s.customer||'')} &middot; ${remaining} pcs remaining</div>
      </div>
      <div class="field"><label>How many pieces are going out</label>
        <input type="number" min="0" max="${remaining}" id="dv-qty" value="${remaining}"></div>
      <div style="margin:-8px 16px 14px;font-size:11.5px;color:var(--muted);">of ${remaining} remaining</div>
      <div class="field"><label>Lorry</label>
        <input class="mono" id="dv-lorry" placeholder="e.g. QKK 4471"></div>
      <div class="field"><label>Driver</label>
        <input id="dv-driver" placeholder="Driver's name"></div>
      <div class="field">
        <label>Photo</label>
        <div id="dv-preview" style="margin-bottom:8px;">
          <div style="font-size:12px;color:var(--muted);">No photo taken yet</div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="dv-file" style="display:none;">
        <button type="button" class="lot-act ghost" id="dv-pick" style="border-radius:9px;width:100%;">Take photo</button>
      </div>
      <div class="msg" id="dv-msg"></div>
      <button class="advance" id="dv-go">Record delivery</button>
      <div style="margin:10px 16px 0;font-size:11.5px;color:var(--muted);text-align:center;">
        Recording all ${remaining} closes this lot. Fewer leaves a balance on the board.
      </div>`;
    document.getElementById('bk').onclick = () => renderImportDetail(s);

    const dvFile = document.getElementById('dv-file');
    document.getElementById('dv-pick').onclick = () => dvFile.click();
    dvFile.onchange = () => {
      file = dvFile.files[0] || null;
      const prev = document.getElementById('dv-preview');
      if(file){
        const url = URL.createObjectURL(file);
        prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:200px;border-radius:10px;">`;
      }
    };

    document.getElementById('dv-go').onclick = async function(){
      const qtyVal = document.getElementById('dv-qty').value.trim();
      const qty = qtyVal ? parseInt(qtyVal,10) : 0;
      const lorry = document.getElementById('dv-lorry').value.trim();
      const driver = document.getElementById('dv-driver').value.trim();
      const msg = document.getElementById('dv-msg');
      if(!qtyVal || isNaN(qty) || qty<=0){ msg.style.color='var(--red)'; msg.textContent='Enter how many pieces.'; return; }
      if(qty > remaining){ msg.style.color='var(--red)'; msg.textContent=`Only ${remaining} pcs remain — can't send more than that.`; return; }
      if(!lorry){ msg.style.color='var(--red)'; msg.textContent='Enter the lorry.'; return; }
      if(!driver){ msg.style.color='var(--red)'; msg.textContent="Enter the driver's name."; return; }
      if(!file){ msg.style.color='var(--red)'; msg.textContent='Take a photo.'; return; }
      const label = (s.lots.length>1) ? `Lot ${li+1}: ` : '';
      const willClose = qty >= remaining;

      this.disabled = true; this.textContent = 'Saving…';
      try{
        const dataUrl = await resizeImageFile(file, 1000, 0.72);
        const photoId = await savePhoto(dataUrl);
        if(enteringDelivery){
          lot.stage = deliveryIdx(steps);
          lot.stageAt = new Date().toISOString();
          lot.chasedDate = null;
        }
        lot.deliveries = lot.deliveries || [];
        lot.deliveries.push({ pcs: qty, lorry, driver, by: ME.name, at: new Date().toISOString() });
        logActivity(s, `${label}Delivered ${qty} pcs — ${driver}, ${lorry}`, 'status', photoId);
        if(willClose){
          lot.closed = true; lot.stage = terminalIdx(steps);
          logActivity(s, `${label}Closed — fully delivered`);
          checkFullyClosed(s);
        }
        await saveShipment(s);
        renderImportDetail(s);
      }catch(e){
        this.disabled = false; this.textContent = 'Record delivery';
        msg.style.color='var(--red)'; msg.textContent = e.message || 'Could not save — try again.';
      }
    };
  }

  // ============================================================
  // New shipment
  // ============================================================
  // Edit shipment details (admin only) — the same fields captured at
  // creation, editable afterwards. For import, the pre-arrival lot's
  // plan (flight/date/pieces) is kept in step too — but only while it
  // hasn't actually arrived yet; once a lot has real arrival data,
  // editing the shipment record doesn't silently overwrite what
  // actually happened.
  // ============================================================
  function renderEditShipment(s){
    const c = document.getElementById('content');
    const isExport = s.type === 'export';
    const curFlight = isExport ? (s.flight||'') : (s.flight || (s.lots&&s.lots[0]&&s.lots[0].flight) || '');
    const curDate = isExport ? (s.departDate||'') : (s.lots&&s.lots[0]&&s.lots[0].expectedDate) || '';
    const curTime = isExport ? (s.departTime||'') : (s.lots&&s.lots[0]&&s.lots[0].expectedTime) || '';
    const curPcs = s.pcs!=null ? s.pcs : (s.lots&&s.lots[0]&&s.lots[0].pcsExpected!=null ? s.lots[0].pcsExpected : '');

    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:19px;">Edit shipment</div>
        <div class="meta">${s.type==='export'?'Export':'Import'} &middot; all fields are required.</div>
      </div>
      <div class="field"><label>Air waybill *</label><input class="mono" id="ed-awb" value="${escapeHtml(s.awb)}"></div>
      <div class="field"><label>Customer *</label><input id="ed-cust" value="${escapeHtml(s.customer||'')}"></div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1;"><label>From *</label><input id="ed-from" value="${escapeHtml(s.from||'')}"></div>
        <div style="flex:1;"><label>To *</label><input id="ed-to" value="${escapeHtml(s.to||'')}"></div>
      </div>
      <div class="field"><label>Flight number *</label>
        <input class="mono" id="ed-flight" value="${escapeHtml(curFlight)}"></div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1.3;"><label>${isExport?'Departs':'Expected arrival'} *</label>
          <input type="date" id="ed-date" value="${escapeHtml(curDate)}"></div>
        <div style="flex:1;"><label>Time *</label><input type="time" id="ed-time" value="${escapeHtml(curTime)}"></div>
      </div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1;"><label>Pieces *</label><input type="number" min="0" id="ed-pcs" value="${escapeHtml(curPcs)}"></div>
        <div style="flex:1;"><label>Weight (kg) *</label><input type="number" min="0" step="0.1" id="ed-kg" value="${escapeHtml(s.kg!=null?s.kg:'')}"></div>
      </div>
      ${!isExport && s.lots && s.lots[0] && s.lots[0].hasArrived ?
        `<div class="viewer-strip">Lot 1 has already arrived, so its own recorded
          flight, date and pieces stay as they are — this only updates the shipment's
          own record.</div>` : ''}
      <div class="msg" id="ed-msg"></div>
      <button class="advance" id="ed-go">Save changes</button>
      ${IS_ADMIN ? `
      <div class="card" style="margin-top:22px;border:1.5px solid #F3C9C9;">
        <div style="font-weight:700;color:var(--red);font-size:13.5px;margin-bottom:5px;">Delete this shipment</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6;">
          Permanent — every lot, delivery, photo reference and activity entry on this
          shipment goes with it. This can't be undone.
        </div>
        <div class="field" style="margin-bottom:8px;">
          <label>Type the AWB to confirm</label>
          <input class="mono" id="del-confirm" placeholder="${escapeHtml(s.awb)}">
        </div>
        <button class="advance" id="del-go" style="background:var(--red);margin:0;">Delete shipment</button>
        <div class="msg" id="del-msg"></div>
      </div>` : ''}`;

    document.getElementById('bk').onclick = () => renderDetail(s.id);
    document.getElementById('ed-go').onclick = async function(){
      const awb = document.getElementById('ed-awb').value.trim();
      const customer = document.getElementById('ed-cust').value.trim();
      const from = document.getElementById('ed-from').value.trim().toUpperCase();
      const to = document.getElementById('ed-to').value.trim().toUpperCase();
      const flight = document.getElementById('ed-flight').value.trim();
      const dateVal = document.getElementById('ed-date').value;
      const timeVal = document.getElementById('ed-time').value;
      const pcsVal = document.getElementById('ed-pcs').value.trim();
      const kgVal = document.getElementById('ed-kg').value.trim();
      const pcs = pcsVal ? parseInt(pcsVal,10) : null;
      const kg = kgVal ? parseFloat(kgVal) : null;
      const msg = document.getElementById('ed-msg');
      if(!awb){ msg.style.color='var(--red)'; msg.textContent='Enter the air waybill number.'; return; }
      if(!customer){ msg.style.color='var(--red)'; msg.textContent='Enter the customer.'; return; }
      if(!from){ msg.style.color='var(--red)'; msg.textContent="Enter the 'from' airport."; return; }
      if(!to){ msg.style.color='var(--red)'; msg.textContent="Enter the 'to' airport."; return; }
      if(!flight){ msg.style.color='var(--red)'; msg.textContent='Enter the flight number.'; return; }
      if(!dateVal){ msg.style.color='var(--red)'; msg.textContent=(isExport?'Enter the departure date.':'Enter the expected arrival date.'); return; }
      if(!timeVal){ msg.style.color='var(--red)'; msg.textContent='Enter the time.'; return; }
      if(!pcsVal){ msg.style.color='var(--red)'; msg.textContent='Enter the number of pieces.'; return; }
      if(isNaN(pcs) || pcs < 0){ msg.style.color='var(--red)'; msg.textContent='Pieces must be a positive number.'; return; }
      if(!kgVal){ msg.style.color='var(--red)'; msg.textContent='Enter the weight.'; return; }
      if(isNaN(kg) || kg < 0){ msg.style.color='var(--red)'; msg.textContent='Weight must be a positive number.'; return; }
      if(STATE.shipments.some(x=>x.awb===awb && x.id!==s.id)){
        msg.style.color='var(--red)'; msg.textContent='Another open shipment already uses this AWB.'; return;
      }
      this.disabled = true; this.textContent = 'Saving…';
      s.awb = awb; s.customer = customer; s.from = from; s.to = to; s.flight = flight;
      s.pcs = pcs; s.kg = kg;
      if(isExport){
        s.departDate = dateVal; s.departTime = timeVal;
      } else if(s.lots && s.lots[0] && !s.lots[0].hasArrived){
        // Still pre-arrival — safe to keep the plan in step with the edit.
        s.lots[0].flight = flight; s.lots[0].expectedDate = dateVal;
        s.lots[0].expectedTime = timeVal; s.lots[0].pcsExpected = pcs;
      }
      logActivity(s, 'Shipment details edited');
      await saveShipment(s);
      renderDetail(s.id);
    };

    const delGo = document.getElementById('del-go');
    if(delGo) delGo.onclick = async function(){
      const typed = document.getElementById('del-confirm').value.trim();
      const msg = document.getElementById('del-msg');
      if(typed !== s.awb){ msg.style.color='var(--red)'; msg.textContent="That doesn't match the AWB — type it exactly to confirm."; return; }
      if(!confirm(`Delete ${s.awb} permanently? This cannot be undone.`)) return;
      this.disabled = true; this.textContent = 'Deleting…';
      try{
        await withTimeout(db.collection(SHIP).doc(s.id).delete(), 15000, 'Deleting shipment');
        STATE.shipments = STATE.shipments.filter(x=>x.id!==s.id);
        STATE.tab = 'board';
        paintShell();
      }catch(e){
        this.disabled = false; this.textContent = 'Delete shipment';
        msg.style.color='var(--red)'; msg.textContent = 'Could not delete: ' + e.message;
      }
    };
  }

    const c = document.getElementById('app');
    let type = 'import';
    c.innerHTML = `
      <div class="back" id="bk">&larr; Board</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:19px;">New shipment</div>
        <div class="meta">All fields are required to create a shipment.</div>
      </div>
      <div class="seg" id="ns-type"><div class="on" data-t="import">Import</div><div data-t="export">Export</div></div>
      <div class="field"><label>Air waybill *</label><input class="mono" id="ns-awb" placeholder="232-45678901"></div>

      <div class="field" style="display:flex;gap:10px;">

      </div>
      <div class="field"><label>Flight number *</label>
        <input class="mono" id="ns-flight" placeholder="e.g. MH2653"></div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1.3;"><label id="ns-date-lbl">Expected arrival *</label><input type="date" id="ns-date"></div>
        <div style="flex:1;"><label>Time *</label><input type="time" id="ns-time"></div>
      </div>
      <div class="field" id="ns-k1-field">
        <label>K1 declaration <span style="font-weight:400;color:var(--muted);text-transform:none;">— optional, leave off if not needed</span></label>
        <div class="seg" style="margin:0;" id="ns-k1">
          <div class="on" data-k1="no">No K1</div>
          <div data-k1="yes">K1</div>
        </div>
      </div>
      <div class="msg" id="ns-msg"></div>
      <button class="advance" id="ns-go">Create</button>`;
    document.getElementById('bk').onclick = () => { paintShell(); };
    let k1Choice = 'no';
    const k1Field = document.getElementById('ns-k1-field');
    document.querySelectorAll('#ns-k1 div').forEach(d=>{
      d.onclick = () => { k1Choice = d.dataset.k1;
        document.querySelectorAll('#ns-k1 div').forEach(x=>x.classList.remove('on'));
        d.classList.add('on'); };
    });
    const dateLbl = document.getElementById('ns-date-lbl');
    const fromInput = document.getElementById('ns-from');
    const toInput = document.getElementById('ns-to');
    document.querySelectorAll('#ns-type div').forEach(d=>{
      d.onclick = () => { type = d.dataset.t;
        document.querySelectorAll('#ns-type div').forEach(x=>x.classList.remove('on'));
        d.classList.add('on');
        dateLbl.textContent = (type === 'export' ? 'Departs' : 'Expected arrival') + ' *';
        k1Field.style.display = type === 'import' ? '' : 'none';
        // Autofill the usual route for whichever type is picked — still
        // editable if a shipment actually runs somewhere else.
        fromInput.value = type === 'export' ? 'KCH' : 'KUL';
        toInput.value = type === 'export' ? 'KUL' : 'KCH';
      };
    });
    document.getElementById('ns-go').onclick = async function(){
      const awb = document.getElementById('ns-awb').value.trim();
      const customer = document.getElementById('ns-cust').value.trim();
      const from = document.getElementById('ns-from').value.trim().toUpperCase();
      const to = document.getElementById('ns-to').value.trim().toUpperCase();
      const flight = document.getElementById('ns-flight').value.trim();
      const dateVal = document.getElementById('ns-date').value;   // 'YYYY-MM-DD' or ''
      const timeVal = document.getElementById('ns-time').value;   // 'HH:MM' or ''
      const pcsVal = document.getElementById('ns-pcs').value.trim();
      const kgVal = document.getElementById('ns-kg').value.trim();
      const pcs = pcsVal ? parseInt(pcsVal,10) : null;
      const kg = kgVal ? parseFloat(kgVal) : null;
      const msg = document.getElementById('ns-msg');
      if(!awb){ msg.style.color='var(--red)'; msg.textContent='Enter the air waybill number.'; return; }
      if(!customer){ msg.style.color='var(--red)'; msg.textContent='Enter the customer.'; return; }
      if(!from){ msg.style.color='var(--red)'; msg.textContent="Enter the 'from' airport."; return; }
      if(!to){ msg.style.color='var(--red)'; msg.textContent="Enter the 'to' airport."; return; }
      if(!flight){ msg.style.color='var(--red)'; msg.textContent='Enter the flight number.'; return; }
      if(!dateVal){ msg.style.color='var(--red)'; msg.textContent=(type==='export'?'Enter the departure date.':'Enter the expected arrival date.'); return; }
      if(!timeVal){ msg.style.color='var(--red)'; msg.textContent='Enter the time.'; return; }
      if(!pcsVal){ msg.style.color='var(--red)'; msg.textContent='Enter the number of pieces.'; return; }
      if(isNaN(pcs) || pcs < 0){ msg.style.color='var(--red)'; msg.textContent='Pieces must be a positive number.'; return; }
      if(!kgVal){ msg.style.color='var(--red)'; msg.textContent='Enter the weight.'; return; }
      if(isNaN(kg) || kg < 0){ msg.style.color='var(--red)'; msg.textContent='Weight must be a positive number.'; return; }
      if(STATE.shipments.some(s=>s.awb===awb)){
        msg.style.color='var(--red)'; msg.textContent='A shipment with this AWB is already open.'; return;
      }
      this.disabled = true; this.textContent = 'Creating…';
      const now = new Date().toISOString();
      const s = {
        id: uid(), awb, type, customer, from, to, createdAt: now, createdBy: ME.name,
        notes: [], closed:false, closedDate:null, pcs, kg, flight: flight || null
      };
      if(type === 'export'){
        s.stage = 0; s.stageAt = now; s.chasedDate = null;
        s.departDate = dateVal || null; s.departTime = timeVal || null;
      } else {
        s.lots = [{ id: uid(), hasArrived:false, hasK1: k1Choice==='yes',
          stage: 0, pcsExpected: pcs,
          expectedDate: dateVal || null, expectedTime: timeVal || null, flight: flight || null,
          stageAt: now, deliveries:[], closed:false, chasedDate:null }];
      }
      await saveShipment(s);
      STATE.shipments.push(s);
      paintShell();
    };
  }

  // ============================================================
  // Alerts
  // ============================================================
  function paintAlerts(c, groups){
    const total = groups.stuck.length+groups.balance.length+groups.deliver.length+groups.missing.length;
    if(total === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">${STATE.shipments.length}</div>
          <div class="l">open, moving normally</div></div></div>
        <div class="quiet"><div class="big">All clear</div>
          <div class="sm">Nothing has been sitting longer than it should.</div></div>`;
      return;
    }
    function block(title, items){
      if(!items.length) return '';
      return `<div class="grp"><span>${title}</span><span class="c">${items.length}</span></div>` +
        items.map(a=>`
          <div class="al ${a.level==='red'?'red':a.level==='amb'?'amb':'gry'}">
            <div class="al-body" data-goto="${a.s.id}">
              <div class="al-top"><span class="al-what">${escapeHtml(a.what)}</span>
                <span class="al-age ${a.level==='red'?'red':'amb'}">${escapeHtml(a.age)}</span></div>
              <div class="al-who">${escapeHtml(a.s.customer||'')} &middot; ${escapeHtml(a.s.awb)}</div>
            </div>
            <div class="al-acts">
              <button data-goto2="${a.s.id}">Open</button>
              ${CAN_EDIT && a.chaseKey ? `<button data-chase="${escapeHtml(a.chaseKey)}">Chased today</button>` : ''}
            </div>
          </div>`).join('');
    }
    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n warn">${total}</div>
        <div class="l">need attention</div></div></div>
      ${block('STUCK TOO LONG', groups.stuck)}
      ${block('BALANCE NOT ARRIVED', groups.balance)}
      ${block('RELEASED, NOT DELIVERED', groups.deliver)}
      ${block('MISSING DETAILS', groups.missing)}
      <div style="height:20px;"></div>`;
    c.querySelectorAll('[data-goto],[data-goto2]').forEach(el=>{
      el.onclick = () => renderDetail(el.dataset.goto || el.dataset.goto2);
    });
    c.querySelectorAll('[data-chase]').forEach(el=>{
      el.onclick = async () => {
        const key = el.dataset.chase;
        const [sid, li] = key.split('|');
        const s = STATE.shipments.find(x=>x.id===sid);
        if(!s) return;
        if(li===undefined || li===''){ s.chasedDate = todayStr(); }
        else { s.lots[+li].chasedDate = todayStr(); }
        await saveShipment(s);
        paintShell();
      };
    });
  }

  // ============================================================
  // Balances — shipments whose first round of arrivals came up
  // short, sitting there until someone adds the balancing lot.
  // ============================================================
  function paintBalances(c, list){
    if(list.length === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">0</div>
          <div class="l">awaiting a balance lot</div></div></div>
        <div class="quiet"><div class="big">Nothing outstanding</div>
          <div class="sm">No import has arrived short of what was booked right now.</div></div>`;
      return;
    }
    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n warn">${list.length}</div>
        <div class="l">awaiting a balance lot</div></div></div>
      <div style="margin:0 16px 12px;font-size:12px;color:var(--muted);line-height:1.6;">
        These arrived short of what was booked on the AWB. Add the balancing lot once
        the rest lands, or open the shipment for the full picture.
      </div>
      ${list.map(s=>{
        const lots = s.lots||[];
        const totalHere = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
        const balance = (s.pcs||0) - totalHere;
        const lastArrived = lots.filter(l=>l.hasArrived).sort((a,b)=>String(b.stageAt).localeCompare(String(a.stageAt)))[0];
        const age = lastArrived ? ageStr(lastArrived.arrivedAt||lastArrived.stageAt) : '';
        return `
        <div class="row" style="cursor:default;">
          <div class="row-top" style="cursor:pointer;" data-goto="${s.id}">
            <span class="awb">${escapeHtml(s.awb)}<span class="kind imp">IMP</span>
              ${lots.length>1?`<span class="lots-tag">${lots.length} LOTS</span>`:''}</span>
            <span class="route">${escapeHtml(s.from||'')}&rarr;${escapeHtml(s.to||'')}</span>
          </div>
          <div class="row-bot" style="cursor:pointer;" data-goto="${s.id}">
            <div><div class="lead">${totalHere} of ${s.pcs} arrived &middot;
              <span style="color:var(--amber-dk);">${balance} balance</span></div>
              <div class="party">${escapeHtml(s.customer||'')}</div></div>
            <span class="age warn">${age}</span>
          </div>
          ${CAN_EDIT ? `<button class="lot-act ghost" style="margin-top:10px;border-radius:9px;"
            data-addbal="${s.id}">+ Add lot for the remaining ${balance} pcs</button>` : ''}
        </div>`;
      }).join('')}
      <div style="height:20px;"></div>`;
    c.querySelectorAll('[data-goto]').forEach(el=>{
      el.onclick = () => renderDetail(el.dataset.goto);
    });
    c.querySelectorAll('[data-addbal]').forEach(btn=>{
      btn.onclick = () => {
        const s = STATE.shipments.find(x=>x.id===btn.dataset.addbal);
        if(!s) return;
        const lots = s.lots||[];
        const totalHere = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
        const balance = (s.pcs||0) - totalHere;
        STATE.detailId = s.id;
        renderRecordArrival(s, null, balance);
      };
    });
  }

  // ============================================================
  // Completed — closed shipments are excluded everywhere else on
  // purpose (board, alerts, balances), so this is the one place they
  // can still be found: to check what happened, view its photos, or
  // confirm a closure after the fact. Read only when this tab is
  // opened, and only once per session.
  // ============================================================
  let _closedLoaded = false;
  async function paintCompleted(c){
    if(!_closedLoaded){
      c.innerHTML = `<div class="empty">Loading completed shipments…</div>`;
      let closed;
      try{ closed = await getClosedShipments(); }
      catch(e){ renderLoadError(e, () => { paintCompleted(c); }); return; }
      // Merge in rather than replace — anything already open-side stays put,
      // and the board/alerts/balances all already exclude anything closed.
      const known = new Set(STATE.shipments.map(s=>s.id));
      closed.forEach(s => { if(!known.has(s.id)) STATE.shipments.push(s); });
      _closedLoaded = true;
    }
    const list = STATE.shipments.filter(s=>s.closed)
      .sort((a,b)=> String(b.closedDate||'').localeCompare(String(a.closedDate||'')));

    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n">${list.length}</div>
        <div class="l">completed</div></div></div>
      ${IS_ADMIN ? `<div style="margin:0 16px 12px;text-align:right;">
        <button class="lot-act ghost" id="cp-refresh" style="width:auto;padding:7px 12px;font-size:11.5px;border-radius:8px;">Refresh</button>
      </div>` : ''}
      ${list.length ? list.map(s=>`
        <div class="row" data-goto="${s.id}">
          <div class="row-top">
            <span class="awb">${escapeHtml(s.awb)}<span class="kind ${s.type==='export'?'exp':'imp'}">${s.type==='export'?'EXP':'IMP'}</span></span>
            <span class="route">${escapeHtml(s.from||'')}&rarr;${escapeHtml(s.to||'')}</span>
          </div>
          <div class="row-bot" style="margin-top:8px;">
            <div><div class="lead">${escapeHtml(s.customer||'')}</div>
              <div class="party">${s.pcs?`${s.pcs} pcs`:''}${s.kg?`, ${s.kg} kg`:''}</div></div>
            <span class="age ok">${s.closedDate ? new Date(s.closedDate).toLocaleDateString() : 'closed'}</span>
          </div>
        </div>`).join('') : `<div class="empty">Nothing completed yet.</div>`}
      <div style="height:20px;"></div>`;
    c.querySelectorAll('[data-goto]').forEach(el=> el.onclick = () => renderDetail(el.dataset.goto));
    const refresh = document.getElementById('cp-refresh');
    if(refresh) refresh.onclick = () => { _closedLoaded = false; paintCompleted(c); };
  }

  // ============================================================
  // Terminals (admin only) — defined once by AWB prefix. Which
  // terminal a shipment belongs to is then worked out automatically
  // from its own AWB; nothing to tag per shipment.
  // ============================================================
  function paintTerminals(c){
    let newPrefix = {}; // { [terminalId]: current text in that terminal's "add prefix" box }

    function draw(){
      c.innerHTML = `
        <div style="margin:14px 16px 0;font-size:12px;color:var(--muted);line-height:1.6;">
          Create a terminal, then list the AWB prefixes it handles. Any shipment
          starting with one of those digits is sorted there automatically — on the
          board's Import filter and here.
        </div>

        ${STATE.terminals.map(t=>`
          <div class="card" style="margin:14px 12px 0;padding:14px 15px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--ink);">
                ${escapeHtml(t.name)}</div>
              <button class="lot-act ghost" style="width:auto;padding:6px 10px;font-size:11px;color:var(--red);"
                data-delterm="${t.id}">Remove</button>
            </div>
            <div class="chips" style="margin-top:10px;">
              ${(t.prefixes||[]).length ? t.prefixes.map(p=>`
                <span class="mono">${escapeHtml(p)}
                  <span data-delpfx="${t.id}|${escapeHtml(p)}" style="margin-left:5px;color:var(--red);font-weight:700;cursor:pointer;">&times;</span>
                </span>`).join('') : `<span style="color:var(--muted);font-size:12px;border:none;padding:0;">No prefixes yet</span>`}
            </div>
            <div style="display:flex;gap:8px;margin-top:10px;">
              <input class="mono" placeholder="e.g. 807" maxlength="3" style="flex:1;padding:8px 10px;
                border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;"
                data-pfxinput="${t.id}" value="${escapeHtml(newPrefix[t.id]||'')}">
              <button class="lot-act ghost" style="width:auto;padding:8px 12px;font-size:12px;"
                data-addpfx="${t.id}">Add prefix</button>
            </div>
          </div>`).join('') || `
          <div class="card" style="margin:14px 12px 0;">
            <div style="font-size:12.5px;color:var(--muted);">No terminals yet — add the first one below.</div>
          </div>`}

        <div class="sect">NEW TERMINAL</div>
        <div class="field"><label>Terminal name</label>
          <input id="tm-name" placeholder="e.g. POS Aviation"></div>
        <div class="field"><label>Prefixes <span style="font-weight:400;color:var(--muted);">— comma separated</span></label>
          <input class="mono" id="tm-prefixes" placeholder="e.g. 807, 975"></div>
        <div class="msg" id="tm-msg"></div>
        <button class="advance" id="tm-create">Create terminal</button>
        <div style="height:20px;"></div>`;

      async function persist(){
        await saveTerminalsConfig({ terminals: STATE.terminals });
      }

      c.querySelectorAll('[data-delterm]').forEach(btn=>{
        btn.onclick = async () => {
          if(!confirm('Remove this terminal? Its shipments will show as "Not set" until reassigned.')) return;
          STATE.terminals = STATE.terminals.filter(t=>t.id !== btn.dataset.delterm);
          await persist();
          draw();
        };
      });
      c.querySelectorAll('[data-delpfx]').forEach(el=>{
        el.onclick = async () => {
          const [tid, pfx] = el.dataset.delpfx.split('|');
          const t = STATE.terminals.find(x=>x.id===tid);
          if(!t) return;
          t.prefixes = (t.prefixes||[]).filter(p=>p!==pfx);
          await persist();
          draw();
        };
      });
      c.querySelectorAll('[data-pfxinput]').forEach(inp=>{
        inp.oninput = () => { newPrefix[inp.dataset.pfxinput] = inp.value; };
      });
      c.querySelectorAll('[data-addpfx]').forEach(btn=>{
        btn.onclick = async () => {
          const tid = btn.dataset.addpfx;
          const inp = c.querySelector(`[data-pfxinput="${tid}"]`);
          const val = inp.value.trim();
          if(!/^\d{3}$/.test(val)){ alert('Prefix must be exactly 3 digits, e.g. 807.'); return; }
          const t = STATE.terminals.find(x=>x.id===tid);
          if(!t) return;
          t.prefixes = t.prefixes || [];
          if(t.prefixes.includes(val)){ alert('That prefix is already listed here.'); return; }
          const clash = STATE.terminals.find(x=>x.id!==tid && (x.prefixes||[]).includes(val));
          if(clash){ alert(`Prefix ${val} is already assigned to ${clash.name}.`); return; }
          t.prefixes.push(val);
          delete newPrefix[tid];
          await persist();
          draw();
        };
      });

      document.getElementById('tm-create').onclick = async function(){
        const name = document.getElementById('tm-name').value.trim();
        const prefixesRaw = document.getElementById('tm-prefixes').value.trim();
        const msg = document.getElementById('tm-msg');
        if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter a terminal name.'; return; }
        if(STATE.terminals.some(t=>t.name.toLowerCase()===name.toLowerCase())){
          msg.style.color='var(--red)'; msg.textContent='A terminal with this name already exists.'; return;
        }
        const prefixes = prefixesRaw ? prefixesRaw.split(',').map(p=>p.trim()).filter(Boolean) : [];
        for(const p of prefixes){
          if(!/^\d{3}$/.test(p)){ msg.style.color='var(--red)'; msg.textContent=`"${p}" isn't a valid 3-digit prefix.`; return; }
        }
        for(const p of prefixes){
          const clash = STATE.terminals.find(t=>(t.prefixes||[]).includes(p));
          if(clash){ msg.style.color='var(--red)'; msg.textContent=`Prefix ${p} is already assigned to ${clash.name}.`; return; }
        }
        this.disabled = true; this.textContent = 'Creating…';
        STATE.terminals.push({ id: uid(), name, prefixes });
        await persist();
        draw();
      };
    }
    draw();
  }

  // ============================================================
  // Worker IDs (admin only) — add/remove people, reset passwords
  // ============================================================
  async function paintWorkers(c){
    c.innerHTML = `<div class="empty">Loading…</div>`;
    const workers = (await getWorkers()).slice().sort((a,b)=>a.name.localeCompare(b.name));
    c.innerHTML = `
      <div style="margin:14px 16px 0;font-size:12px;color:var(--muted);line-height:1.6;">
        These are this app's own IDs — separate from attendance and performance. A new
        person is <b>Off</b> in the Access tab until you set their level.
      </div>
      <div class="card" style="padding:2px 15px;">
        ${workers.map(w=>`
          <div class="person">
            <div class="nm"><div class="n">${escapeHtml(w.name)}</div>
              <div class="r">${STATE.access[w.id] ? STATE.access[w.id].toUpperCase() : 'OFF'}</div></div>
            <div style="display:flex;gap:6px;">
              <button class="lot-act ghost" style="width:auto;padding:7px 10px;font-size:11px;"
                data-reset="${w.id}">Reset password</button>
              <button class="lot-act ghost" style="width:auto;padding:7px 10px;font-size:11px;color:var(--red);"
                data-remove="${w.id}" data-name="${escapeHtml(w.name)}">Remove</button>
            </div>
          </div>`).join('') || '<div style="font-size:12.5px;color:var(--muted);padding:10px 0;">No workers yet.</div>'}
      </div>

      <div class="sect">ADD A WORKER</div>
      <div class="field"><label>Name</label><input id="wk-name" placeholder="Full name"></div>
      <div class="field"><label>Password</label><input id="wk-pass" type="password" placeholder="At least 4 characters"></div>
      <div class="msg" id="wk-msg"></div>
      <button class="advance" id="wk-add">Add worker</button>
      <div style="height:20px;"></div>`;

    c.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = async () => {
        if(!confirm(`Remove ${btn.dataset.name}? They'll no longer be able to sign in.`)) return;
        await deleteWorker(btn.dataset.remove);
        delete STATE.access[btn.dataset.remove];
        paintShell();
      };
    });
    c.querySelectorAll('[data-reset]').forEach(btn=>{
      btn.onclick = async () => {
        const pass = prompt('New password for this worker:');
        if(!pass) return;
        if(pass.length < 4){ alert('Password needs at least 4 characters.'); return; }
        const all = await getWorkers();
        const w = all.find(x=>x.id===btn.dataset.reset);
        if(!w) return;
        w.passwordHash = await sha256Hex(pass);
        await saveWorker(w);
        alert('Password updated.');
      };
    });
    document.getElementById('wk-add').onclick = async function(){
      const name = document.getElementById('wk-name').value.trim();
      const pass = document.getElementById('wk-pass').value;
      const msg = document.getElementById('wk-msg');
      if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter a name.'; return; }
      if(!pass || pass.length < 4){ msg.style.color='var(--red)'; msg.textContent='Password needs at least 4 characters.'; return; }
      const all = await getWorkers();
      if(all.some(w=>w.name.toLowerCase()===name.toLowerCase())){
        msg.style.color='var(--red)'; msg.textContent='Someone with this name already exists.'; return;
      }
      this.disabled = true; this.textContent = 'Adding…';
      const id = uid();
      const passwordHash = await sha256Hex(pass);
      await saveWorker({ id, name, passwordHash, createdAt: new Date().toISOString() });
      paintWorkers(c);
    };
  }

  // ============================================================
  // Access (admin only)
  // ============================================================
  async function paintAccess(c){
    c.innerHTML = `<div class="empty">Loading workers…</div>`;
    const workers = (await getWorkers()).slice().sort((a,b)=>a.name.localeCompare(b.name));
    const access = STATE.access;
    c.innerHTML = `
      <div style="margin:14px 16px 0;font-size:12px;color:var(--muted);line-height:1.6;">
        Same worker IDs as attendance. Off is the default — nobody sees this board until
        you put them here.
      </div>
      <div class="card" style="padding:2px 15px;">
        ${workers.map(w=>{
          const lvl = access[w.id] || 'off';
          return `
          <div class="person">
            <div class="nm"><div class="n">${escapeHtml(w.name)}</div>
              <div class="r">${escapeHtml(w.role||'')}</div></div>
            <div class="segp" data-w="${w.id}">
              <span class="${lvl==='off'?'on off':''}" data-lvl="off">Off</span>
              <span class="${lvl==='view'?'on amb':''}" data-lvl="view">View</span>
              <span class="${lvl==='edit'?'on':''}" data-lvl="edit">Edit</span>
              <span class="${lvl==='admin'?'on':''}" data-lvl="admin">Admin</span>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div style="height:20px;"></div>`;
    c.querySelectorAll('.segp').forEach(seg=>{
      seg.querySelectorAll('span').forEach(sp=>{
        sp.onclick = async () => {
          const wid = seg.dataset.w, lvl = sp.dataset.lvl;
          seg.querySelectorAll('span').forEach(x=>x.className='');
          sp.className = lvl==='off' ? 'on off' : lvl==='view' ? 'on amb' : 'on';
          await setAccessFor(wid, lvl);
          STATE.access[wid] = lvl;
          if(wid === ME.id){
            MY_LEVEL = lvl; CAN_EDIT = lvl==='edit'||lvl==='admin'; IS_ADMIN = lvl==='admin';
            if(!IS_ADMIN) STATE.tab = 'board';
            paintShell();
          }
        };
      });
    });
  }

  boot();
})();
</script>
</body>
</html>
