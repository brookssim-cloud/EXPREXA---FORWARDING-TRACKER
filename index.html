    const isLate = !!lot.closed;
    const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
    const remaining = (lot.pcsArrived||0) - delivered;
    // A consolidation is delivered one house bill at a time, each to its own
    // consignee — so the run is recorded against a specific HAWB, capped by
    // both what that HAWB still has outstanding and what this lot still holds.
    const hawbs = hawbProgress(s).filter(h => h.remaining === null || h.remaining > 0);
    const hasHawbs = hawbList(s).length > 0;
    let pickedHawb = hawbs.length ? hawbs[0].no : null;
    const capFor = no => {
      const h = hawbs.find(x => x.no === no);
      return (h && h.remaining !== null) ? Math.min(h.remaining, remaining) : remaining;
    };
    let file = null;

    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">${isLate ? 'Record a late delivery' : 'Record a delivery'}</div>
        <div class="meta">${escapeHtml(s.customer||'')} &middot; ${remaining} pcs ${isLate ? 'left over from a lot closed short' : 'remaining'}</div>
      </div>
      ${hasHawbs ? `
      <div class="field"><label>Which HAWB</label>
        <div class="chips" id="dv-hawb">
          ${hawbs.map((h,i)=>`<span class="mono ${i===0?'on':''}" data-h="${escapeHtml(h.no)}">${escapeHtml(h.no)}${h.remaining!==null?` &middot; ${h.remaining} left`:''}</span>`).join('')}
        </div>
      </div>` : ''}
      <div class="field"><label>How many pieces are going out</label>
        <input type="number" min="0" id="dv-qty" value="${pickedHawb ? capFor(pickedHawb) : remaining}"></div>
      <div id="dv-qof" style="margin:-8px 16px 14px;font-size:11.5px;color:var(--muted);">of ${pickedHawb ? capFor(pickedHawb) : remaining} remaining</div>
      <div class="field"><label>Lorry</label>
        <input class="mono" id="dv-lorry" placeholder="e.g. QKK 4471"></div>
      <div class="field"><label>Driver</label>
        <input id="dv-driver" placeholder="Driver's name"></div>
      <div class="field">
        <label>Photo</label>
        <div id="dv-preview" style="margin-bottom:8px;">
          <div style="font-size:12px;color:var(--muted);">No photo taken yet</div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="dv-file" style="display:none;">
        <input type="file" accept="image/*" id="dv-upload" style="display:none;">
        <div style="display:flex;gap:8px;">
          <button type="button" class="lot-act ghost" id="dv-pick" style="border-radius:9px;flex:1;">Take photo</button>
          <button type="button" class="lot-act ghost" id="dv-browse" style="border-radius:9px;flex:1;">Upload photo</button>
        </div>
      </div>
      <div class="msg" id="dv-msg"></div>
      <button class="advance" id="dv-go">Record delivery</button>
      <div style="margin:10px 16px 0;font-size:11.5px;color:var(--muted);text-align:center;">
        ${isLate
          ? 'This lot is already closed. Recording here only clears what was left outstanding — it stays closed either way.'
          : "Closing is a separate step once everything's been delivered."}
      </div>`;
    document.getElementById('bk').onclick = () => renderImportDetail(s);

    if(hasHawbs){
      document.querySelectorAll('#dv-hawb span').forEach(sp => {
        sp.onclick = () => {
          document.querySelectorAll('#dv-hawb span').forEach(x => x.classList.remove('on'));
          sp.classList.add('on');
          pickedHawb = sp.dataset.h;
          const cap = capFor(pickedHawb);
          document.getElementById('dv-qty').value = cap;
          document.getElementById('dv-qof').textContent = `of ${cap} remaining`;
        };
      });
    }

    const dvFile = document.getElementById('dv-file');
    const dvUpload = document.getElementById('dv-upload');
    document.getElementById('dv-pick').onclick = () => dvFile.click();
    document.getElementById('dv-browse').onclick = () => dvUpload.click();
    function dvPicked(input){
      file = input.files[0] || null;
      const prev = document.getElementById('dv-preview');
      if(file){
        const url = URL.createObjectURL(file);
        prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:200px;border-radius:10px;">`;
      }
    }
    dvFile.onchange = () => dvPicked(dvFile);
    dvUpload.onchange = () => dvPicked(dvUpload);

    document.getElementById('dv-go').onclick = async function(){
      const qtyVal = document.getElementById('dv-qty').value.trim();
      const qty = qtyVal ? parseInt(qtyVal,10) : 0;
      const lorry = document.getElementById('dv-lorry').value.trim();
      const driver = document.getElementById('dv-driver').value.trim();
      const msg = document.getElementById('dv-msg');
      const cap = pickedHawb ? capFor(pickedHawb) : remaining;
      if(hasHawbs && !pickedHawb){ msg.style.color='var(--red)'; msg.textContent='Every HAWB is already fully delivered.'; return; }
      if(!qtyVal || isNaN(qty) || qty<=0){ msg.style.color='var(--red)'; msg.textContent='Enter how many pieces.'; return; }
      if(qty > cap){ msg.style.color='var(--red)'; msg.textContent= pickedHawb
        ? `Only ${cap} pcs left on HAWB ${pickedHawb} — can't send more than that.`
        : `Only ${remaining} pcs remain — can't send more than that.`; return; }
      if(!lorry){ msg.style.color='var(--red)'; msg.textContent='Enter the lorry.'; return; }
      if(!driver){ msg.style.color='var(--red)'; msg.textContent="Enter the driver's name."; return; }
      if(!file){ msg.style.color='var(--red)'; msg.textContent='Take a photo.'; return; }
      const label = (s.lots.length>1) ? `Lot ${li+1}: ` : '';
      const hawbTag = pickedHawb ? `HAWB ${pickedHawb}: ` : '';

      this.disabled = true; this.textContent = 'Saving…';
      try{
        const dataUrl = await resizeImageFile(file, PHOTO_PROOF.max, PHOTO_PROOF.q);
        const photoId = await savePhoto(dataUrl);
        if(enteringDelivery){
          lot.stage = deliveryIdx(steps);
          lot.stageAt = new Date().toISOString();
          lot.chasedDate = null;
        }
        lot.deliveries = lot.deliveries || [];
        lot.deliveries.push({ pcs: qty, lorry, driver, hawb: pickedHawb || null, photoId,
          // Firestore rejects a field set to undefined outright, so the flag
          // is added only when it is actually a late run rather than written
          // as undefined on every ordinary one.
          ...(isLate ? { late: true } : {}),
          by: ME.name, at: new Date().toISOString() });
        // Only the delivery itself is recorded here. Closing is its own
        // separate step with its own photo. A late run says so in the log,
        // so the history shows the lot was closed before these pieces went.
        const stillShort = Math.max(0, remaining - qty);
        logActivity(s, isLate
          ? `${label}${hawbTag}Late delivery after closing — ${qty} pcs — ${driver}, ${lorry}` +
            (stillShort > 0 ? ` · ${stillShort} still outstanding` : ' · shortfall cleared')
          : `${label}${hawbTag}Delivered ${qty} pcs — ${driver}, ${lorry}`, 'status', photoId);
        await saveShipment(s);
        renderImportDetail(s);
      }catch(e){
        this.disabled = false; this.textContent = 'Record delivery';
        msg.style.color='var(--red)'; msg.textContent = e.message || 'Could not save — try again.';
      }
    };
  }

  // ============================================================

  // ============================================================
  // Edit shipment details (admin only) — the same fields captured at
  // creation, editable afterwards. For import, the pre-arrival lot's
  // plan (flight/date/pieces) is kept in step too — but only while it
  // hasn't actually arrived yet; once a lot has real arrival data,
  // editing the shipment record doesn't silently overwrite what
  // actually happened.
  // ============================================================
  function renderEditShipment(s){
    const c = document.getElementById('content');
    const isExport = s.type === 'export';
    const curFlight = isExport ? (s.flight||'') : (s.flight || (s.lots&&s.lots[0]&&s.lots[0].flight) || '');
    const curDate = isExport ? (s.departDate||'') : (s.lots&&s.lots[0]&&s.lots[0].expectedDate) || '';
    const curTime = isExport ? (s.departTime||'') : (s.lots&&s.lots[0]&&s.lots[0].expectedTime) || '';
    const curPcs = s.pcs!=null ? s.pcs : (s.lots&&s.lots[0]&&s.lots[0].pcsExpected!=null ? s.lots[0].pcsExpected : '');

    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:19px;">Edit shipment</div>
        <div class="meta">${s.type==='export'?'Export':'Import'} &middot; all fields are required.</div>
      </div>
      <div class="field"><label>MAWB *</label><input class="mono" id="ed-awb" value="${escapeHtml(s.awb)}"></div>
      ${hawbEditorHtml('ed', hawbList(s))}
      <div class="field"><label>Principal *</label>
        ${(STATE.principals.length || s.principal)
          ? `<select id="ed-principal">
              <option value="">Choose a principal…</option>
              ${Array.from(new Set(STATE.principals.concat(s.principal ? [s.principal] : [])))
                .map(p=>`<option value="${escapeHtml(p)}" ${p===s.principal?'selected':''}>${escapeHtml(p)}</option>`).join('')}
             </select>`
          : `<div style="font-size:12.5px;color:var(--red);">No principals set up yet — add one under Settings.</div>`}
      </div>
      <div class="field">
        <label>Endorsement <span style="font-weight:400;color:var(--muted);text-transform:none;">— optional, tap any that apply</span></label>
        <div class="chips" id="ed-endorse">
          ${ENDORSEMENTS.map(e=>`<span class="mono ${(s.endorsements||[]).includes(e)?'on':''}" data-endorse="${escapeHtml(e)}">${escapeHtml(e)}</span>`).join('')}
        </div>
      </div>
      <div class="field"><label>Customer *</label><input id="ed-cust" value="${escapeHtml(s.customer||'')}"></div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1;"><label>From *</label><input id="ed-from" value="${escapeHtml(s.from||'')}"></div>
        <div style="flex:1;"><label>To *</label><input id="ed-to" value="${escapeHtml(s.to||'')}"></div>
      </div>
      <div class="field"><label>Flight number *</label>
        <input class="mono" id="ed-flight" value="${escapeHtml(curFlight)}"></div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1.3;"><label>${isExport?'Departs':'Expected arrival'} *</label>
          <input type="date" id="ed-date" value="${escapeHtml(curDate)}"></div>
        <div style="flex:1;"><label>Time *</label><input type="time" id="ed-time" value="${escapeHtml(curTime)}"></div>
      </div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1;"><label>Pieces *</label><input type="number" min="0" id="ed-pcs" value="${escapeHtml(curPcs)}"></div>
        <div style="flex:1;"><label>Weight (kg) *</label><input type="number" min="0" step="0.1" id="ed-kg" value="${escapeHtml(s.kg!=null?s.kg:'')}"></div>
      </div>
      ${!isExport && s.lots && s.lots[0] && s.lots[0].hasArrived ?
        `<div class="viewer-strip">Lot 1 has already arrived, so its own recorded
          flight, date and pieces stay as they are — this only updates the shipment's
          own record.</div>` : ''}
      <div class="msg" id="ed-msg"></div>
      <button class="advance" id="ed-go">Save changes</button>
      ${IS_ADMIN ? `
      <div class="card" style="margin-top:22px;border:1.5px solid #F3C9C9;">
        <div style="font-weight:700;color:var(--red);font-size:13.5px;margin-bottom:5px;">Delete this shipment</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6;">
          Permanent — every lot, delivery, photo reference and activity entry on this
          shipment goes with it. This can't be undone.
        </div>
        <div class="field" style="margin-bottom:8px;">
          <label>Type the AWB to confirm</label>
          <input class="mono" id="del-confirm" placeholder="${escapeHtml(s.awb)}">
        </div>
        <button class="advance" id="del-go" style="background:var(--red);margin:0;">Delete shipment</button>
        <div class="msg" id="del-msg"></div>
      </div>` : ''}`;

    document.getElementById('bk').onclick = () => renderDetail(s.id);
    wireHawbEditor('ed');
    c.querySelectorAll('#ed-endorse [data-endorse]').forEach(el=>{
      el.onclick = () => el.classList.toggle('on');
    });
    document.getElementById('ed-go').onclick = async function(){
      const awb = document.getElementById('ed-awb').value.trim();
      const customer = document.getElementById('ed-cust').value.trim();
      const from = document.getElementById('ed-from').value.trim().toUpperCase();
      const to = document.getElementById('ed-to').value.trim().toUpperCase();
      const flight = document.getElementById('ed-flight').value.trim();
      const dateVal = document.getElementById('ed-date').value;
      const timeVal = document.getElementById('ed-time').value;
      const pcsVal = document.getElementById('ed-pcs').value.trim();
      const kgVal = document.getElementById('ed-kg').value.trim();
      const pcs = pcsVal ? parseInt(pcsVal,10) : null;
      const kg = kgVal ? parseFloat(kgVal) : null;
      const msg = document.getElementById('ed-msg');
      if(!awb){ msg.style.color='var(--red)'; msg.textContent='Enter the MAWB number.'; return; }
      if(!customer){ msg.style.color='var(--red)'; msg.textContent='Enter the customer.'; return; }
      if(!from){ msg.style.color='var(--red)'; msg.textContent="Enter the 'from' airport."; return; }
      if(!to){ msg.style.color='var(--red)'; msg.textContent="Enter the 'to' airport."; return; }
      if(!flight){ msg.style.color='var(--red)'; msg.textContent='Enter the flight number.'; return; }
      if(!dateVal){ msg.style.color='var(--red)'; msg.textContent=(isExport?'Enter the departure date.':'Enter the expected arrival date.'); return; }
      if(!timeVal){ msg.style.color='var(--red)'; msg.textContent='Enter the time.'; return; }
      if(!pcsVal){ msg.style.color='var(--red)'; msg.textContent='Enter the number of pieces.'; return; }
      if(isNaN(pcs) || pcs < 0){ msg.style.color='var(--red)'; msg.textContent='Pieces must be a positive number.'; return; }
      if(!kgVal){ msg.style.color='var(--red)'; msg.textContent='Enter the weight.'; return; }
      if(isNaN(kg) || kg < 0){ msg.style.color='var(--red)'; msg.textContent='Weight must be a positive number.'; return; }
      const hawbRead = readHawbs('ed', pcs);
      if(hawbRead.error){ msg.style.color='var(--red)'; msg.textContent=hawbRead.error; return; }
      // A HAWB that already has deliveries against it can't disappear or
      // shrink below what's already gone out — that would orphan real runs.
      for(const h of hawbProgress(s)){
        if(h.delivered <= 0) continue;
        const kept = hawbRead.hawbs.find(x => x.no === h.no);
        if(!kept){ msg.style.color='var(--red)'; msg.textContent=`HAWB ${h.no} already has ${h.delivered} pcs delivered, so it can't be removed.`; return; }
        if(kept.pcs < h.delivered){ msg.style.color='var(--red)'; msg.textContent=`HAWB ${h.no} already has ${h.delivered} pcs delivered — its pieces can't go below that.`; return; }
      }
      const edPrincipalEl = document.getElementById('ed-principal');
      const edPrincipal = edPrincipalEl ? edPrincipalEl.value : '';
      if(!edPrincipal){
        msg.style.color='var(--red)';
        msg.textContent = (STATE.principals.length || s.principal)
          ? 'Choose the principal.'
          : 'No principals set up yet — add one under Settings first.';
        return;
      }
      this.disabled = true; this.textContent = 'Checking AWB…';
      if(awbKey(awb) !== awbKey(s.awb)){
        const clash = await findExistingAwb(awb);
        if(clash && clash.id !== s.id){
          this.disabled = false; this.textContent = 'Save changes';
          msg.style.color='var(--red)';
          msg.textContent = `AWB ${clash.awb} already exists — ${clash.customer || 'no customer'}` +
            `${clash.closed ? ', since completed' : ''}.`;
          return;
        }
      }
      const hClash = await findExistingHawbs(hawbRead.hawbs, s.id);
      if(hClash){
        this.disabled = false; this.textContent = 'Save changes';
        msg.style.color='var(--red)';
        msg.textContent = `HAWB ${hClash.hawb} is already on ${hClash.ship.awb}` +
          `${hClash.ship.closed ? ', since completed' : ''}.`;
        return;
      }
      this.textContent = 'Saving…';
      s.awb = awb; s.awbKey = awbKey(awb); s.customer = customer; s.from = from; s.to = to; s.flight = flight;
      s.principal = edPrincipal;
      s.endorsements = ENDORSEMENTS.filter(e =>
        c.querySelector(`#ed-endorse [data-endorse="${e}"]`).classList.contains('on'));
      s.hawbs = hawbRead.hawbs;
      // Re-sync an export's per-HAWB tracks with the edited list — a new
      // house bill starts at Delivery, a removed one drops out, and if every
      // remaining track is already closed the shipment completes.
      if(s.type === 'export'){ exportTracks(s); closeExportIfDone(s); }
      s.pcs = pcs; s.kg = kg;
      if(isExport){
        s.departDate = dateVal; s.departTime = timeVal;
      } else if(s.lots && s.lots[0] && !s.lots[0].hasArrived){
        // Still pre-arrival — safe to keep the plan in step with the edit.
        s.lots[0].flight = flight; s.lots[0].expectedDate = dateVal;
        s.lots[0].expectedTime = timeVal; s.lots[0].pcsExpected = pcs;
      }
      logActivity(s, 'Shipment details edited');
      await saveShipment(s);
      renderDetail(s.id);
    };

    const delGo = document.getElementById('del-go');
    if(delGo) delGo.onclick = async function(){
      const typed = document.getElementById('del-confirm').value.trim();
      const msg = document.getElementById('del-msg');
      if(typed !== s.awb){ msg.style.color='var(--red)'; msg.textContent="That doesn't match the AWB — type it exactly to confirm."; return; }
      if(!confirm(`Delete ${s.awb} permanently? This cannot be undone.`)) return;
      this.disabled = true; this.textContent = 'Deleting…';
      try{
        await withTimeout(db.collection(SHIP).doc(s.id).delete(), 15000, 'Deleting shipment');
        STATE.shipments = STATE.shipments.filter(x=>x.id!==s.id);
        STATE.tab = 'board';
        paintShell();
      }catch(e){
        this.disabled = false; this.textContent = 'Delete shipment';
        msg.style.color='var(--red)'; msg.textContent = 'Could not delete: ' + e.message;
      }
    };
  }

        return;
      }
      const hClash = await findExistingHawbs(hawbs, null);
      if(hClash){
        this.disabled = false; this.textContent = 'Create';
        msg.style.color='var(--red)';
        msg.textContent = `HAWB ${hClash.hawb} is already on ${hClash.ship.awb}` +
          `${hClash.ship.customer ? ' — ' + hClash.ship.customer : ''}` +
          `${hClash.ship.closed ? ', since completed' : ''}.`;
        return;
      }
      this.textContent = 'Creating…';
      const now = new Date().toISOString();
      const s = {
        id: uid(), awb, awbKey: awbKey(awb), type, customer, principal,
        endorsements: ENDORSEMENTS.filter(e => endorsed.has(e)),
        from, to, createdAt: now, createdBy: ME.name,
        notes: [], closed:false, closedDate:null, pcs, kg, flight: flight || null, hawbs,
        stepsVersion: STEPS_VERSION
      };
      if(type === 'export'){
        s.stage = 0; s.stageAt = now; s.chasedDate = null;
        s.departDate = dateVal || null; s.departTime = timeVal || null;
      } else {
        s.lots = [{ id: uid(), hasArrived:false, hasK1: k1Choice==='yes',
          stage: 0, pcsExpected: pcs,
          expectedDate: dateVal || null, expectedTime: timeVal || null, flight: flight || null,
          stageAt: now, deliveries:[], closed:false, chasedDate:null }];
      }
      logActivity(s, `Shipment created — ${type === 'export' ? 'Export' : 'Import'}, ${pcs} pcs, ${kg} kg` +
        `${hawbs.length ? `, ${hawbs.length} HAWB` : ''} · ${principal}` +
        `${s.endorsements.length ? ` · endorsement: ${s.endorsements.join(', ')}` : ''}`, 'created');
      await saveShipment(s);
      STATE.shipments.push(s);
      paintShell();
    };
  }

  // ============================================================
  // Alerts
  // ============================================================
  function paintAlerts(c, groups){
    const total = groups.stuck.length+groups.balance.length+groups.deliver.length+groups.missing.length;
    if(total === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">${STATE.shipments.length}</div>
          <div class="l">open, moving normally</div></div></div>
        <div class="quiet"><div class="big">All clear</div>
          <div class="sm">Nothing has been sitting longer than it should.</div></div>`;
      return;
    }
    function block(title, items){
      if(!items.length) return '';
      return `<div class="grp"><span>${title}</span><span class="c">${items.length}</span></div>` +
        items.map(a=>`
          <div class="al ${a.level==='red'?'red':a.level==='amb'?'amb':'gry'}">
            <div class="al-body" data-goto="${a.s.id}">
              <div class="al-top"><span class="al-what">${escapeHtml(a.what)}</span>
                <span class="al-age ${a.level==='red'?'red':'amb'}">${escapeHtml(a.age)}</span></div>
              <div class="al-who">${escapeHtml(a.s.customer||'')} &middot; ${escapeHtml(a.s.awb)}</div>
            </div>
            <div class="al-acts">
              <button data-goto2="${a.s.id}">Open</button>
              ${CAN_EDIT && a.chaseKey ? `<button data-chase="${escapeHtml(a.chaseKey)}">Chased today</button>` : ''}
            </div>
          </div>`).join('');
    }
    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n warn">${total}</div>
        <div class="l">need attention</div></div></div>
      ${block('STUCK TOO LONG', groups.stuck)}
      ${block('BALANCE NOT ARRIVED', groups.balance)}
      ${block('RELEASED, NOT DELIVERED', groups.deliver)}
      ${block('MISSING DETAILS', groups.missing)}
      <div style="height:20px;"></div>`;
    c.querySelectorAll('[data-goto],[data-goto2]').forEach(el=>{
      el.onclick = () => renderDetail(el.dataset.goto || el.dataset.goto2);
    });
    c.querySelectorAll('[data-chase]').forEach(el=>{
      el.onclick = async () => {
        const key = el.dataset.chase;
        const [sid, li] = key.split('|');
        const s = STATE.shipments.find(x=>x.id===sid);
        if(!s) return;
        if(li===undefined || li===''){ s.chasedDate = todayStr(); }
        else if(li.startsWith('x')){ const t = exportTracks(s)[+li.slice(1)]; if(t) t.chasedDate = todayStr(); }
        else { s.lots[+li].chasedDate = todayStr(); }
        await saveShipment(s);
        paintShell();
      };
    });
  }

  // ============================================================
  // Balances — shipments whose first round of arrivals came up
  // short, sitting there until someone adds the balancing lot.
  // ============================================================
  // ============================================================
  // Outstanding — cargo that has arrived and cleared but hasn't all gone
  // out yet. Balances answers "what never came?"; this answers "what's
  // still sitting with us?".
  // ============================================================
  // Shipments closed before the shortfall marker existed carry no flag, so
  // the Outstanding query can't find them. Any time we have a shipment in
  // hand, correct its flag — opening one, or loading a day of completed
  // ones, quietly repairs it for good rather than only for this session.
  async function reconcileShortfallFlag(sh){
    if(!sh || sh.type !== 'import') return false;
    const should = outstandingTotal(sh) > 0;
    if(should === !!sh.hasShortfall) return false;
    sh.hasShortfall = should;
    try{
      await db.collection(SHIP).doc(sh.id).set(sh);
      _shortfallLoaded = false;   // let Outstanding re-query now it's findable
      return true;
    }catch(e){ console.error('Could not update shortfall flag:', e); return false; }
  }

  // Closed shipments aren't in the board's list, so fetch the flagged ones
  // once per session and merge them in.
  let _shortfallLoaded = false;
  async function ensureShortfallsLoaded(){
    if(_shortfallLoaded) return;
    try{
      const extra = await getShortfallShipments();
      const known = new Set(STATE.shipments.map(x=>x.id));
      extra.forEach(x => { if(!known.has(x.id)) STATE.shipments.push(x); });
      _shortfallLoaded = true;
    }catch(e){ console.error('Could not load closed shortfalls:', e); }
  }

  function paintOutstanding(c, list){
    const waitingAwbs = list.filter(s => deliveryOutstanding(s) > 0).length;
    const shortAwbs = list.filter(s => deliveryShortClosed(s) > 0).length;
    if(list.length === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">0</div>
          <div class="l">waiting to go out</div></div></div>
        <div class="quiet"><div class="big">Nothing outstanding</div>
          <div class="sm">Everything that has arrived has been delivered.</div></div>`;
      return;
    }
    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n warn">${waitingAwbs}</div><div class="l">still to go</div></div>
        <div class="count"><div class="n" style="color:var(--red);">${shortAwbs}</div><div class="l">closed short</div></div>
      </div>
      <div class="filters">
        <span class="${STATE.outFilter==='all'?'on':''}" data-of="all">All</span>
        <span class="${STATE.outFilter==='togo'?'on':''}" data-of="togo">Still to go</span>
        <span class="${STATE.outFilter==='short'?'on':''}" data-of="short">Closed short</span>
      </div>
      <div style="padding:10px 12px 4px;">
        <input id="out-search" placeholder="Search AWB, HAWB or customer…" value="${escapeHtml(STATE.searchOutstanding)}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div style="margin:4px 16px 10px;font-size:12px;color:var(--muted);line-height:1.6;">
        Pieces that arrived but never went out — either still waiting, or left
        behind on a lot that was closed short. A consolidation is broken down
        by house bill.
      </div>
      <div id="out-rows"></div>
      ${IS_ADMIN ? `<div style="margin:14px 12px 0;text-align:center;">
        <button class="lot-act ghost" id="out-scan" style="width:auto;padding:8px 14px;border-radius:9px;font-size:12px;">
          Scan older shipments for shortfalls</button>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;">
          Only needed once — finds shipments closed short before this check existed.</div>
      </div>` : ''}
      <div style="height:20px;"></div>`;

    // Only the rows redraw while typing, so the search box keeps focus.
    function renderOutRows(){
      const q = STATE.searchOutstanding.trim().toLowerCase();
      const shown = list.filter(s => {
        if(STATE.outFilter === 'togo' && deliveryOutstanding(s) <= 0) return false;
        if(STATE.outFilter === 'short' && deliveryShortClosed(s) <= 0) return false;
        if(!q) return true;
        return String(s.awb||'').toLowerCase().includes(q) ||
          String(s.customer||'').toLowerCase().includes(q) ||
          hawbList(s).some(h => h.no.toLowerCase().includes(q));
      });
      const host = document.getElementById('out-rows');
      if(shown.length === 0){
        host.innerHTML = `<div class="empty">Nothing matches.</div>`;
        return;
      }
      host.innerHTML = outstandingRowsHtml(shown);
      host.querySelectorAll('[data-goto]').forEach(el=> el.onclick = () => renderDetail(el.dataset.goto));
    }

    function outstandingRowsHtml(list){
      return `
      ${list.map(s=>{
        const lots = s.lots||[];
        const arrived = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
        const out = deliveryOutstanding(s);
        const short = deliveryShortClosed(s);
        const delivered = arrived - out - short;
        const prog = hawbProgress(s).filter(h => h.remaining === null || h.remaining > 0);
        const oldest = lots.filter(l=>l.hasArrived && lotShortfall(l) > 0)
          .sort((a,b)=>String(a.stageAt).localeCompare(String(b.stageAt)))[0];
        const age = oldest ? ageStr(oldest.stageAt) : '';
        return `
        <div class="row" style="cursor:default;">
          <div class="row-top" style="cursor:pointer;" data-goto="${s.id}">
            <span class="awb">${escapeHtml(s.awb)}<span class="kind imp">IMP</span>
              ${isK1Shipment(s)?`<span class="kind" style="background:rgba(214,69,69,.12);color:var(--red);">K1</span>`:''}${s.hasOpenSurvey?`<span class="kind" style="background:rgba(214,69,69,.12);color:var(--red);">SURVEY</span>`:s.hasSurvey?`<span class="kind" style="background:rgba(31,157,107,.12);color:var(--green);">SURVEY</span>`:''}
              ${lots.length>1?`<span class="lots-tag">${lots.length} LOTS</span>`:''}</span>
            <span class="route">${escapeHtml(s.from||'')}&rarr;${escapeHtml(s.to||'')}</span>
          </div>
          <div class="row-bot" style="cursor:pointer;" data-goto="${s.id}">
            <div><div class="lead">${delivered} of ${arrived} delivered${out?` &middot;
              <span style="color:var(--amber-dk);">${out} still to go</span>`:''}${short?` &middot;
              <span style="color:var(--red);">${short} closed short</span>`:''}</div>
              <div class="party">${escapeHtml(s.customer||'')}</div></div>
            <span class="age warn">${age}</span>
          </div>
          ${prog.length ? `<div style="margin-top:8px;">${prog.map(h=>`
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;">
              <span style="font-family:'IBM Plex Mono',monospace;color:var(--ink);">${escapeHtml(h.no)}</span>
              <span style="color:var(--muted);">${h.delivered}${h.pcs!=null?' of '+h.pcs:''} delivered</span>
            </div>`).join('')}</div>` : ''}
        </div>`;
      }).join('')}`;
    }

    renderOutRows();
    c.querySelectorAll('.filters span[data-of]').forEach(el=> el.onclick = () => {
      STATE.outFilter = el.dataset.of; paintShell();
    });
    const outSearch = document.getElementById('out-search');
    outSearch.oninput = () => { STATE.searchOutstanding = outSearch.value; renderOutRows(); };

    const scanBtn = document.getElementById('out-scan');
    if(scanBtn) scanBtn.onclick = async () => {
      if(!confirm('Check every closed shipment for undelivered pieces? This reads them all once and marks any it finds.')) return;
      scanBtn.disabled = true; scanBtn.textContent = 'Scanning…';
      try{
        const snap = await withTimeout(db.collection(SHIP).where('closed','==', true).get(), 30000, 'Scanning shipments');
        let found = 0;
        for(const d of snap.docs){
          const sh = d.data();
          const short = outstandingTotal(sh) > 0;
          if(short !== !!sh.hasShortfall){
            sh.hasShortfall = short;
            await db.collection(SHIP).doc(sh.id).set(sh);
          }
          if(short){
            found++;
            if(!STATE.shipments.some(x => x.id === sh.id)) STATE.shipments.push(sh);
          }
        }
        alert(found ? `Found ${found} closed shipment${found>1?'s':''} with pieces unaccounted for.` : 'No shortfalls found in closed shipments.');
        paintShell();
      }catch(e){
        scanBtn.disabled = false; scanBtn.textContent = 'Scan older shipments for shortfalls';
        alert('Scan failed: ' + (e.message || e));
      }
    };
  }

  function paintBalances(c, list){
    if(list.length === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">0</div>
          <div class="l">awaiting a balance lot</div></div></div>
        <div class="quiet"><div class="big">Nothing outstanding</div>
          <div class="sm">No import has arrived short of what was booked right now.</div></div>`;
      return;
    }
    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n warn">${list.length}</div>
        <div class="l">awaiting a balance lot</div></div></div>
      <div style="margin:0 16px 12px;font-size:12px;color:var(--muted);line-height:1.6;">
        These arrived short of what was booked on the AWB. Add the balancing lot once
        the rest lands, or open the shipment for the full picture.
      </div>
      ${list.map(s=>{
        const lots = s.lots||[];
        const totalHere = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
        const balance = (s.pcs||0) - totalHere;
        const lastArrived = lots.filter(l=>l.hasArrived).sort((a,b)=>String(b.stageAt).localeCompare(String(a.stageAt)))[0];
        const age = lastArrived ? ageStr(lastArrived.arrivedAt||lastArrived.stageAt) : '';
        return `
        <div class="row" style="cursor:default;">
          <div class="row-top" style="cursor:pointer;" data-goto="${s.id}">
            <span class="awb">${escapeHtml(s.awb)}<span class="kind imp">IMP</span>
              ${lots.length>1?`<span class="lots-tag">${lots.length} LOTS</span>`:''}</span>
            <span class="route">${escapeHtml(s.from||'')}&rarr;${escapeHtml(s.to||'')}</span>
          </div>
          <div class="row-bot" style="cursor:pointer;" data-goto="${s.id}">
            <div><div class="lead">${totalHere} of ${s.pcs} arrived &middot;
              <span style="color:var(--amber-dk);">${balance} balance</span></div>
              <div class="party">${escapeHtml(s.customer||'')}</div></div>
            <span class="age warn">${age}</span>
          </div>
          ${CAN_EDIT ? `<button class="lot-act ghost" style="margin-top:10px;border-radius:9px;"
            data-addbal="${s.id}">+ Add lot for the remaining ${balance} pcs</button>` : ''}
        </div>`;
      }).join('')}
      <div style="height:20px;"></div>`;
    c.querySelectorAll('[data-goto]').forEach(el=>{
      el.onclick = () => renderDetail(el.dataset.goto);
    });
    c.querySelectorAll('[data-addbal]').forEach(btn=>{
      btn.onclick = () => {
        const s = STATE.shipments.find(x=>x.id===btn.dataset.addbal);
        if(!s) return;
        const lots = s.lots||[];
        const totalHere = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
        const balance = (s.pcs||0) - totalHere;
        STATE.detailId = s.id;
        renderRecordArrival(s, null, balance);
      };
    });
  }

  // ============================================================
  // Completed — closed shipments are excluded everywhere else on
  // purpose (board, alerts, balances), so this is the one place they
  // can still be found: to check what happened, view its photos, or
  // confirm a closure after the fact. Read only when this tab is
  // opened, and only once per session.
  // ============================================================
  // Which day the Completed tab is showing, and which days have already been
  // fetched this session — revisiting a day costs nothing.
  let _completedDate = null;
  const _closedLoadedDates = new Set();
  async function paintCompleted(c){
    if(!_completedDate) _completedDate = todayStr();
    const day = _completedDate;
    if(!_closedLoadedDates.has(day)){
      c.innerHTML = `<div class="empty">Loading completed shipments…</div>`;
      let closed;
      try{ closed = await getClosedShipmentsOn(day); }
      catch(e){ renderLoadError(e, () => { paintShell(); }); return; }
      // Heal shipments wrongly completed by the old closing rule: an import
      // closed while part of its MAWB never arrived, with no deliberate
      // write-off, could only have got there through that bug. Reopen it so
      // it goes back on the board and the balance can still be received.
      const wronglyClosed = closed.filter(x => x.type === 'import' && !x.balanceWrittenOff && arrivalBalance(x) > 0);
      for(const x of wronglyClosed){
        x.closed = false; x.closedDate = null;
        logActivity(x, `Reopened — ${arrivalBalance(x)} pcs on the MAWB haven't arrived yet`);
        try{ await saveShipment(x); }catch(e){ console.error('Could not reopen', x.awb, e); }
      }
      // Merge in rather than replace — the board, alerts and balances all
      // already exclude anything closed, so these only surface here.
      const idx = {};
      STATE.shipments.forEach((s,i)=>{ idx[s.id] = i; });
      closed.forEach(s => {
        if(idx[s.id] !== undefined) STATE.shipments[idx[s.id]] = s;
        else STATE.shipments.push(s);
      });
      // Free repair pass: these closed shipments are already loaded, so fix
      // any missing shortfall flags while we have them.
      closed.forEach(x => { reconcileShortfallFlag(x); });
      _closedLoadedDates.add(day);
    }
    const list = STATE.shipments.filter(s => s.closed && s.closedDate === day)
      .sort((a,b)=> String(a.awb).localeCompare(String(b.awb)));
    const isToday = day === todayStr();
    const niceDay = new Date(day + 'T00:00:00').toLocaleDateString(undefined,
      { weekday:'short', day:'numeric', month:'short', year:'numeric' });

    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n">${list.length}</div>
        <div class="l">completed ${isToday ? 'today' : 'on ' + escapeHtml(niceDay)}</div></div></div>
      <div style="display:flex;gap:8px;align-items:center;margin:12px 12px 4px;">
        <button class="lot-act ghost" id="cp-prev" style="width:auto;padding:9px 12px;border-radius:9px;">&larr;</button>
        <input type="date" id="cp-date" value="${day}" max="${todayStr()}"
          style="flex:1;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;">
        <button class="lot-act ghost" id="cp-next" ${isToday ? 'disabled' : ''}
          style="width:auto;padding:9px 12px;border-radius:9px;${isToday ? 'opacity:.4;cursor:default;' : ''}">&rarr;</button>
      </div>
      ${!isToday ? `<div style="margin:0 12px 6px;text-align:right;">
        <span id="cp-today" style="font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;">Back to today</span></div>` : ''}
      <div style="padding:6px 12px 4px;">
        <input id="cp-search" placeholder="Search AWB, HAWB or customer…" value="${escapeHtml(STATE.searchCompleted)}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div id="cp-rows"></div>
      <div style="height:20px;"></div>`;

    // Same grouped listing the All tab uses — AWB, type, K1 tag, creation
    // date and customer, clustered by status — with its own search box.
    function renderCompletedRows(){
      const q = STATE.searchCompleted.trim().toLowerCase();
      const shown = !q ? list : list.filter(s =>
        String(s.awb||'').toLowerCase().includes(q) ||
        String(s.customer||'').toLowerCase().includes(q) ||
        hawbList(s).some(h => h.no.toLowerCase().includes(q)));
      const host = document.getElementById('cp-rows');
      host.innerHTML = shown.length
        ? boardListingHtml(shown)
        : `<div class="empty">${q ? 'Nothing matches that search.'
            : `Nothing was completed ${isToday ? 'today' : 'on this day'}.`}</div>`;
      host.querySelectorAll('[data-open]').forEach(el=> el.onclick = () => renderDetail(el.dataset.open));
    }
    renderCompletedRows();
    const cpSearch = document.getElementById('cp-search');
    cpSearch.oninput = () => { STATE.searchCompleted = cpSearch.value; renderCompletedRows(); };

    function shiftDay(delta){
      const d = new Date(day + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      const next = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(next > todayStr()) return;
      _completedDate = next;
      paintCompleted(c);
    }
    document.getElementById('cp-prev').onclick = () => shiftDay(-1);
    const nextBtn = document.getElementById('cp-next');
    if(!isToday) nextBtn.onclick = () => shiftDay(1);
    document.getElementById('cp-date').onchange = (e) => {
      const v = e.target.value;
      if(!v || v > todayStr()) return;
      _completedDate = v;
      paintCompleted(c);
    };
    const todayLink = document.getElementById('cp-today');
    if(todayLink) todayLink.onclick = () => { _completedDate = todayStr(); paintCompleted(c); };
  }

  // ============================================================
  // Remarks — every remark written on a chosen day, across all
  // shipments. Each remark is indexed as its own small record when it's
  // written, so a day costs one query rather than reading every
  // shipment to find the notes inside them.
  // ============================================================
  let _remarksDate = null;
  const _remarksCache = {};
  async function paintRemarks(c){
    if(!_remarksDate) _remarksDate = todayStr();
    const day = _remarksDate;

    if(!_remarksCache[day]){
      c.innerHTML = `<div class="empty">Loading remarks…</div>`;
      try{ _remarksCache[day] = await getRemarksOn(day); }
      catch(e){ renderLoadError(e, () => paintShell()); return; }
    }
    const all = _remarksCache[day];
    const isToday = day === todayStr();
    const niceDay = new Date(day + 'T00:00:00').toLocaleDateString(undefined,
      { weekday:'short', day:'numeric', month:'short', year:'numeric' });

    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n">${all.length}</div>
        <div class="l">remark${all.length===1?'':'s'} ${isToday ? 'today' : 'on ' + escapeHtml(niceDay)}</div></div></div>
      <div style="display:flex;gap:8px;align-items:center;margin:12px 12px 4px;">
        <button class="lot-act ghost" id="rm-prev" style="width:auto;padding:9px 12px;border-radius:9px;">&larr;</button>
        <input type="date" id="rm-date" value="${day}" max="${todayStr()}"
          style="flex:1;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;">
        <button class="lot-act ghost" id="rm-next" ${isToday ? 'disabled' : ''}
          style="width:auto;padding:9px 12px;border-radius:9px;${isToday ? 'opacity:.4;cursor:default;' : ''}">&rarr;</button>
      </div>
      ${!isToday ? `<div style="margin:0 12px 6px;text-align:right;">
        <span id="rm-today" style="font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;">Back to today</span></div>` : ''}
      <div style="padding:6px 12px 4px;">
        <input id="rm-search" placeholder="Search AWB, customer, author or text…" value="${escapeHtml(STATE.searchRemarks)}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div id="rm-rows"></div>
      <div style="height:20px;"></div>`;

    function renderRemarkRows(){

        String(r.customer||'').toLowerCase().includes(q) ||
        String(r.by||'').toLowerCase().includes(q) ||
        String(r.text||'').toLowerCase().includes(q));

  // ============================================================
  // Surveys — every damage report raised on a chosen day, in one
  // place. This is the view to open when a claim needs putting
  // together: the conditions, the pieces, the notes and the photos,
  // without hunting through shipments one at a time.
  // ============================================================
  async function paintSurveys(c){
    if(!_surveysDate) _surveysDate = todayStr();

    if(!_surveysCache[day]){
      c.innerHTML = `<div class="empty">Loading survey reports…</div>`;
      try{ _surveysCache[day] = await getSurveysOn(day); }
      catch(e){ renderLoadError(e, () => paintShell()); return; }

    const all = _surveysCache[day];
    const isToday = day === todayStr();
    const niceDay = new Date(day + 'T00:00:00').toLocaleDateString(undefined,
      { weekday:'short', day:'numeric', month:'short', year:'numeric' });
    const pcsTotal = all.reduce((n,r)=> n + (Number(r.pcs) || 0), 0);
    if(_openSurveys === null) await refreshOpenSurveys();
    const stillOpen = _openSurveys || [];
    // Oldest first out of the query, so the head of the list is the one
    // that has been waiting longest.
    const oldest = stillOpen[0];
    const daysOld = oldest
      ? Math.floor((Date.now() - Date.parse(oldest.at)) / 86400000) : 0;

    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n">${all.length}</div>

        <div class="count"><div class="n" style="${stillOpen.length?'color:var(--amber);':''}">${stillOpen.length || '—'}</div>

        <div class="count"><div class="n">${pcsTotal || '—'}</div><div class="l">pcs affected</div></div>
      </div>

        <div class="viewer-strip" id="sv-alert" style="background:rgba(214,69,69,.10);border-color:var(--red);
          color:var(--text);cursor:pointer;">
          <b>${stillOpen.length} survey report${stillOpen.length===1?'':'s'} still open</b> —
          raised but not closed${oldest ? `, the oldest ${daysOld === 0 ? 'today' : daysOld + ' day' + (daysOld===1?'':'s') + ' ago'}

      <div style="display:flex;gap:8px;align-items:center;margin:12px 12px 4px;">

        <button class="lot-act ghost" id="sv-next" ${isToday ? 'disabled' : ''}

      </div>
      ${!isToday ? `<div style="margin:0 12px 6px;text-align:right;">
        <span id="sv-today" style="font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;">Back to today</span></div>` : ''}
      <div style="padding:6px 12px 4px;">
        <input id="sv-search" placeholder="Search AWB, customer, author or notes…" value="${escapeHtml(STATE.searchSurveys||'')}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div id="sv-rows"></div>
      <div style="height:20px;"></div>`;

    function renderSurveyRows(){
      const q = (STATE.searchSurveys||'').trim().toLowerCase();
      // Either the chosen day, or every report still open regardless of when
      // it was raised — which is what the alert above switches to.
      const source = STATE.surveysOpenOnly ? stillOpen : all;
      const shown = !q ? source : source.filter(r =>
        String(r.awb||'').toLowerCase().includes(q) ||
        String(r.customer||'').toLowerCase().includes(q) ||
        String(r.by||'').toLowerCase().includes(q) ||
        String(r.notes||'').toLowerCase().includes(q) ||
        conditionLabels(r.conditions).join(' ').toLowerCase().includes(q));
      const host = document.getElementById('sv-rows');
      if(shown.length === 0){
        host.innerHTML = `<div class="empty">${q ? 'Nothing matches that search.'
          : STATE.surveysOpenOnly ? 'Every survey report has been closed.'
          : `No survey reports were raised ${isToday ? 'today' : 'on this day'}.`}</div>`;
        return;
      }
      host.innerHTML = shown.map(r => `
        <div class="row" data-open="${escapeHtml(r.shipId)}" style="cursor:pointer;">
          <div class="row-top">
            <span class="awb">${escapeHtml(r.awb)}<span class="kind ${r.type==='export'?'exp':'imp'}">${r.type==='export'?'EXP':'IMP'}</span></span>
            <span class="route">${escapeHtml(STATE.surveysOpenOnly
              ? String(r.date||'').slice(0,10)
              : new Date(r.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}))}</span>
          </div>
          <div style="margin-top:8px;">${surveyStatusChip(r)} ${surveyChipsHtml(r.conditions)}
            ${r.pcs ? `<span style="font-size:12px;color:var(--red);font-weight:700;margin-left:4px;">${escapeHtml(String(r.pcs))} pcs</span>` : ''}
            ${r.hawb ? `<span style="font-size:12px;color:var(--muted);margin-left:4px;">on ${escapeHtml(r.hawb)}</span>` : ''}
          </div>
          ${r.notes ? `<div class="noteline" style="margin-top:8px;border-left-color:${surveyOpen(r)?'var(--red)':'var(--green)'};">${escapeHtml(r.notes)}</div>` : ''}
          <div class="who" style="margin-top:6px;">Raised by ${escapeHtml(r.by||'')}${r.customer?` &middot; ${escapeHtml(r.customer)}`:''}
            ${(r.photoId ? [r.photoId] : (r.photoIds||[])).map((pid,i,arr)=>
              ` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(pid)}">Photo${arr.length>1?' '+(i+1):''}</span>`).join('')}
          </div>
          ${!surveyOpen(r) ? `<div class="who" style="color:var(--green);">Closed by ${escapeHtml(r.closedBy||'')}${r.closedAt?`, ${new Date(r.closedAt).toLocaleString()}`:''}
            ${r.closingPhotoId ? ` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(r.closingPhotoId)}">Closing photo</span>` : ''}
          </div>` : ''}

      // The whole card opens the shipment, except the photo links inside it,
      // which have their own job.
      host.querySelectorAll('[data-open]').forEach(el => el.onclick = (e) => {
        if(e.target.closest('[data-viewphoto]')) return;
        renderDetail(el.dataset.open);
      });
      wireActivityPhotoLinks(host);
    }
    renderSurveyRows();

    function shiftDay(delta){
      const d = new Date(day + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      const next = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(next > todayStr()) return;
      _surveysDate = next; STATE.surveysOpenOnly = false; paintShell();
    }
    document.getElementById('sv-prev').onclick = () => shiftDay(-1);
    if(!isToday) document.getElementById('sv-next').onclick = () => shiftDay(1);
    document.getElementById('sv-date').onchange = (e) => {
      const v = e.target.value;
      if(!v || v > todayStr()) return;
      _surveysDate = v; STATE.surveysOpenOnly = false; paintShell();

    const back = document.getElementById('sv-today');
    if(back) back.onclick = () => { _surveysDate = todayStr(); paintShell(); };
    const svSearch = document.getElementById('sv-search');
    svSearch.oninput = () => { STATE.searchSurveys = svSearch.value; renderSurveyRows(); };
    const svAlert = document.getElementById('sv-alert');
    if(svAlert) svAlert.onclick = () => { STATE.surveysOpenOnly = !STATE.surveysOpenOnly; paintShell(); };

  // ============================================================
  // Report — every shipment in a date range, filtered by principal,
  // with a CSV for whoever needs it outside the app.
  //
  // This reads the whole shipment collection rather than the board,
  // because a report that quietly left out everything already completed
  // would be worse than no report. It is held for the session so
  // changing a filter costs nothing; Refresh pulls it again.
  // ============================================================
  let _reportAll = null;
  // Which date a shipment is reported under: when it actually landed for an
  // import, when it leaves for an export, and the date it was booked if
  // neither has happened yet.
  function reportDateOf(s){
    if(s.type === 'export') return s.departDate || String(s.createdAt||'').slice(0,10);
    const lots = s.lots || [];
    const landed = lots.filter(l => l.hasArrived && l.arrivedAt)
      .map(l => String(l.arrivedAt).slice(0,10)).sort();
    if(landed.length) return landed[0];
    const expected = lots.map(l => l.expectedDate).filter(Boolean).sort();
    if(expected.length) return expected[0];
    return String(s.createdAt||'').slice(0,10);
  }
  // Every principal involved — the master's and any a house bill carries of
  // its own — so filtering by principal never hides a shipment that is
  // partly theirs.
  function principalsOf(s){
    const all = [s.principal].concat(hawbList(s).map(h => h.principal));
    return Array.from(new Set(all.filter(Boolean)));
  }
  function csvCell(v){
    const t = v == null ? '' : String(v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
  }
  function downloadCsv(filename, rows){
    // The BOM is what makes Excel read it as UTF-8 rather than mangling any
    // accented name in it.
    const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  }
  const REPORT_HEADERS = ['Shipment type','Principal','Arrival date','Origin','Destination','Customer','AWB',
    'Quantity','Weight'].concat(ENDORSEMENTS).concat(['Survey Report']);
  function reportRowFor(s){
    const end = s.endorsements || [];
    return [
      s.type === 'export' ? 'Export' : 'Import',
      s.principal || '', reportDateOf(s), s.from || '', s.to || '',
      s.customer || '', s.awb || '',
      s.pcs == null ? '' : s.pcs, s.kg == null ? '' : s.kg
    ].concat(ENDORSEMENTS.map(e => end.includes(e) ? 'YES' : ''))
     .concat([(s.surveys || []).length ? 'YES' : '']);
  }

  async function paintReport(c){
    // Nothing is chosen when the tab opens, and nothing is fetched either —
    // the shipments are only read once a filter says what is wanted, so
    // simply visiting the tab costs no reads at all.
    const anyFilter = () => !!(STATE.reportFrom || STATE.reportTo || STATE.reportPrincipal !== 'all');

    async function ensureLoaded(){
      if(_reportAll) return true;
      const host = document.getElementById('rp-state');
      if(host) host.textContent = 'Loading shipments…';
      try{
        const snap = await withTimeout(db.collection(SHIP).get(), 30000, 'Loading shipments');
        _reportAll = snap.docs.map(d => d.data());
        _reportAll.forEach(migrateShipmentSteps);
        // The dropdown was built before anything was loaded, so it only had
        // the configured principals. Add any that turn up on the shipments
        // themselves now that they are here.
        const sel = document.getElementById('rp-principal');
        if(sel){
          const want = Array.from(new Set(STATE.principals.concat(_reportAll.flatMap(principalsOf)))).sort();
          const have = [...sel.options].map(o => o.value);
          want.forEach(p=>{
            if(have.includes(p)) return;
            const o = document.createElement('option');
            o.value = p; o.textContent = p;
            sel.appendChild(o);
          });
          sel.value = STATE.reportPrincipal;
        }
        return true;
      }catch(e){
        if(host){ host.style.color = 'var(--red)'; host.textContent = 'Could not load: ' + e.message; }
        return false;
      }
    }

    const principalOptions = Array.from(new Set(
      STATE.principals.concat(_reportAll ? _reportAll.flatMap(principalsOf) : []))).sort();

    // An empty From or To simply means no bound on that side, so a principal
    // can be reported on its own without picking dates.
    function rowsNow(){
      if(!_reportAll) return [];
      const from = STATE.reportFrom, to = STATE.reportTo, who = STATE.reportPrincipal;
      return _reportAll.filter(s=>{
        const d = reportDateOf(s);
        if(from && (!d || d < from)) return false;
        if(to && (!d || d > to)) return false;
        if(who !== 'all' && !principalsOf(s).includes(who)) return false;
        return true;
      }).sort((a,b)=> String(reportDateOf(a)).localeCompare(String(reportDateOf(b)))
        || String(a.awb).localeCompare(String(b.awb)));
    }

    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n" id="rp-count">—</div><div class="l">shipments</div></div>
        <div class="count"><div class="n" id="rp-pcs">—</div><div class="l">pieces</div></div>
        <div class="count"><div class="n" id="rp-kg">—</div><div class="l">kg</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-end;margin:12px 12px 0;">
        <div style="flex:1;">
          <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;">FROM</label>
          <input type="date" id="rp-from" value="${STATE.reportFrom}"
            style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;">
        </div>
        <div style="flex:1;">
          <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;">TO</label>
          <input type="date" id="rp-to" value="${STATE.reportTo}"
            style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;">
        </div>
      </div>
      <div style="margin:10px 12px 0;">
        <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;">PRINCIPAL</label>
        <select id="rp-principal" style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;">
          <option value="all">All principals</option>
          ${principalOptions.map(p=>`<option value="${escapeHtml(p)}" ${p===STATE.reportPrincipal?'selected':''}>${escapeHtml(p)}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:8px;margin:12px 12px 0;">
        <button class="lot-act ghost" id="rp-refresh" style="flex:0 0 auto;width:auto;padding:11px 14px;">Refresh</button>
        <button class="advance" id="rp-export" style="margin:0;flex:1;">Export CSV</button>
      </div>
      <div id="rp-state" style="margin:12px 16px 0;font-size:12.5px;color:var(--muted);line-height:1.6;text-align:center;"></div>
      <div style="height:20px;"></div>`;

    // Only the totals are shown. The point of this tab is the CSV, and a
    // long list on screen is just something to scroll past on the way to it.
    function draw(){
      const state = document.getElementById('rp-state');
      const setCounts = (a,b,c2) => {
        document.getElementById('rp-count').textContent = a;
        document.getElementById('rp-pcs').textContent = b;
        document.getElementById('rp-kg').textContent = c2;
      };
      if(!anyFilter()){
        setCounts('—','—','—');
        state.style.color = 'var(--muted)';
        state.textContent = 'Pick a date range or a principal, then export.';
        return;
      }
      const rows = rowsNow();
      setCounts(rows.length,
        rows.reduce((n,s)=> n + (Number(s.pcs)||0), 0) || '—',
        Math.round(rows.reduce((n,s)=> n + (Number(s.kg)||0), 0)) || '—');
      state.style.color = 'var(--muted)';
      state.textContent = rows.length
        ? `${rows.length} shipment${rows.length===1?'':'s'} ready to export.`
        : 'Nothing matches that filter.';
    }
    draw();

    async function onFilterChange(){
      if(anyFilter() && !(await ensureLoaded())) return;
      draw();
    }
    document.getElementById('rp-from').onchange = (e)=>{ STATE.reportFrom = e.target.value; onFilterChange(); };
    document.getElementById('rp-to').onchange = (e)=>{ STATE.reportTo = e.target.value; onFilterChange(); };
    document.getElementById('rp-principal').onchange = (e)=>{ STATE.reportPrincipal = e.target.value; onFilterChange(); };
    document.getElementById('rp-refresh').onclick = () => { _reportAll = null; paintShell(); };
    document.getElementById('rp-export').onclick = async function(){
      const state = document.getElementById('rp-state');
      if(!anyFilter()){
        state.style.color = 'var(--red)';
        state.textContent = 'Pick a date range or a principal first.';
        return;
      }
      if(!(await ensureLoaded())) return;
      draw();
      const rows = rowsNow();
      if(rows.length === 0){
        state.style.color = 'var(--red)';
        state.textContent = 'Nothing matches that filter — nothing to export.';
        return;
      }
      const who = STATE.reportPrincipal === 'all' ? 'all-principals'
        : STATE.reportPrincipal.replace(/[^0-9A-Za-z]+/g,'-').toLowerCase();
      // Either date may be left open, so the name only mentions the ones set.
      const span = STATE.reportFrom && STATE.reportTo ? `${STATE.reportFrom}-to-${STATE.reportTo}`
        : STATE.reportFrom ? `from-${STATE.reportFrom}`
        : STATE.reportTo ? `up-to-${STATE.reportTo}`
        : 'all-dates';
      downloadCsv(`forwarding-${who}-${span}.csv`,
        [REPORT_HEADERS].concat(rows.map(reportRowFor)));
    };
  }

  // ============================================================
  // Terminals (admin only) — defined once by AWB prefix. Which
  // terminal a shipment belongs to is then worked out automatically
  // from its own AWB; nothing to tag per shipment.
  // ============================================================

        <div class="sect">PRINCIPALS</div>

        </div>
        <div class="card" style="margin:0 12px;padding:14px 15px;">
          <div class="chips">
            ${STATE.principals.length ? STATE.principals.map(p=>`
              <span class="mono">${escapeHtml(p)}
                <span data-delprin="${escapeHtml(p)}" style="margin-left:5px;color:var(--red);font-weight:700;cursor:pointer;">&times;</span>
              </span>`).join('') : `<span style="color:var(--muted);font-size:12px;border:none;padding:0;">
                No principals yet — nobody can create a shipment until one is added.</span>`}
          </div>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <input id="pr-name" placeholder="e.g. EXPREXA LOGISTICS SDN BHD" style="flex:1;padding:8px 10px;
              border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;">
            <button class="lot-act ghost" style="width:auto;padding:8px 12px;font-size:12px;" id="pr-add">Add</button>
          </div>
          <div class="msg" id="pr-msg" style="margin:8px 0 0;"></div>
        </div>

        <div class="sect">DUPLICATE CHECKING</div>
        <div style="margin:0 16px 10px;font-size:12px;color:var(--muted);line-height:1.6;">
          New shipments are checked against every AWB and HAWB on record, completed ones
          included. Shipments created before this check existed carry no house-bill index,
          so a HAWB clash with an old completed shipment could slip through. Run this once
          and they are all covered.
        </div>
        <div class="card" style="margin:0 12px;padding:14px 15px;">
          <button class="lot-act ghost" id="bf-run" style="width:100%;">Index older shipments</button>
          <div class="msg" id="bf-msg" style="margin:9px 0 0;"></div>
        </div>

        <div class="sect">PHOTO STORAGE</div>
        <div style="margin:0 16px 10px;font-size:12px;color:var(--muted);line-height:1.6;">
          Photos are the only thing here that grows without limit. This removes them from
          shipments completed longer ago than the age below — the shipment, its activity log
          and every record stay exactly as they are, only the images go. Check first; it
          tells you what would be removed before anything is.
        </div>
        <div class="card" style="margin:0 12px;padding:14px 15px;">
          <div style="display:flex;gap:8px;align-items:center;">
            <span style="font-size:13px;color:var(--muted);">Keep photos for</span>
            <input type="number" id="pg-months" value="12" min="1" max="120"
              style="width:70px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;">
            <span style="font-size:13px;color:var(--muted);">months</span>
          </div>
          <button class="lot-act ghost" id="pg-check" style="width:100%;margin-top:10px;">Check what would be removed</button>
          <div id="pg-result" style="margin-top:9px;"></div>
        </div>
        <div style="height:20px;"></div>`;

      // Two steps on purpose: deleting photos cannot be undone, so nothing
      // happens until the count has been seen and confirmed.
      let _purgeFound = null;
      document.getElementById('pg-check').onclick = async function(){
        const months = Math.max(1, parseInt(document.getElementById('pg-months').value, 10) || 12);
        const out = document.getElementById('pg-result');
        this.disabled = true; this.textContent = 'Checking…';
        out.innerHTML = `<div class="msg" style="margin:0;">Looking…</div>`;
        try{
          const cut = new Date();
          cut.setMonth(cut.getMonth() - months);
          const cutoff = cut.toISOString().slice(0,10);
          // Single-field range query, so only the shipments actually old
          // enough are read.
          const snap = await withTimeout(
            db.collection(SHIP).where('closedDate','<', cutoff).get(), 30000, 'Finding old shipments');
          const ships = snap.docs.map(d => d.data())
            .filter(x => x.closed && !x.photosPurged && photoIdsOf(x).length);
          const photos = ships.reduce((n,x) => n + photoIdsOf(x).length, 0);
          _purgeFound = { cutoff, months, ships, photos };
          if(photos === 0){
            out.innerHTML = `<div class="msg" style="margin:0;color:var(--green);">
              Nothing to remove — no completed shipment older than ${months} months still has photos.</div>`;
          }else{
            out.innerHTML = `
              <div class="msg" style="margin:0 0 9px;">
                <strong>${photos}</strong> photo${photos===1?'':'s'} across
                <strong>${ships.length}</strong> shipment${ships.length===1?'':'s'} completed before
                ${escapeHtml(cutoff)} — roughly ${Math.round(photos * 0.07)} MB.
                Records stay; only the images go.</div>
              <button class="lot-act" id="pg-go" style="width:100%;background:var(--red);color:#fff;border:none;">
                Remove ${photos} photo${photos===1?'':'s'}</button>
              <div class="msg" id="pg-done" style="margin:9px 0 0;"></div>`;
            document.getElementById('pg-go').onclick = runPurge;
          }
        }catch(e){
          out.innerHTML = `<div class="msg" style="margin:0;color:var(--red);">Could not check: ${escapeHtml(e.message)}</div>`;
        }
        this.disabled = false; this.textContent = 'Check what would be removed';
      };

      async function runPurge(){
        if(!_purgeFound) return;
        const { ships, photos, months } = _purgeFound;
        if(!confirm(`Permanently delete ${photos} photo(s) from ${ships.length} shipment(s) completed more than ${months} months ago? This cannot be undone.`)) return;
        this.disabled = true; this.textContent = 'Removing…';
        const done = document.getElementById('pg-done');
        let gone = 0;
        try{
          for(const sh of ships){
            const ids = photoIdsOf(sh);
            for(const id of ids){
              await db.collection(PHOTOS).doc(id).delete().catch(()=>{});
              gone++;
            }
            // Marked so the check skips it next time, and so a photo link on
            // an old shipment can say the photo was retired rather than lost.
            await db.collection(SHIP).doc(sh.id).update({ photosPurged: true, photosPurgedAt: new Date().toISOString() });
          }
          _purgeFound = null;
          done.style.color = 'var(--green)';
          done.textContent = `Removed ${gone} photo${gone===1?'':'s'}. Roughly ${Math.round(gone * 0.07)} MB freed.`;
        }catch(e){
          this.disabled = false; this.textContent = 'Retry';
          done.style.color = 'var(--red)';
          done.textContent = `Stopped after ${gone}: ${e.message}`;
        }
      }

      // One pass over every shipment, stamping the two lookup fields the
      // duplicate checks query. Only shipments actually missing them are
      // written, so running it twice costs reads and nothing else.
      document.getElementById('bf-run').onclick = async function(){
        const msg = document.getElementById('bf-msg');
        this.disabled = true; this.textContent = 'Indexing…';
        msg.style.color = 'var(--muted)'; msg.textContent = 'Reading every shipment…';
        try{
          const snap = await withTimeout(db.collection(SHIP).get(), 30000, 'Reading shipments');
          let fixed = 0;
          for(const d of snap.docs){
            const sh = d.data();
            const wantAwb = awbKey(sh.awb);
            const wantHawb = hawbList(sh).map(h => awbKey(h.no)).filter(Boolean);
            const current = Array.isArray(sh.hawbKeys) ? sh.hawbKeys : null;
            const sameHawb = current && current.length === wantHawb.length
              && wantHawb.every((k,i) => current[i] === k);
            if(sh.awbKey === wantAwb && sameHawb) continue;
            await db.collection(SHIP).doc(d.id).update({ awbKey: wantAwb, hawbKeys: wantHawb });
            fixed++;
          }
          msg.style.color = 'var(--green)';
          msg.textContent = fixed
            ? `Indexed ${fixed} of ${snap.size} shipments. Every AWB and HAWB on record is now checked against.`
            : `All ${snap.size} shipments were already indexed — nothing to do.`;
        }catch(e){
          msg.style.color = 'var(--red)';
          msg.textContent = 'Could not finish: ' + e.message;
        }
        this.disabled = false; this.textContent = 'Index older shipments';
      };

      async function persist(){
        await saveTerminalsConfig({ terminals: STATE.terminals, principals: STATE.principals });
      }

      // Principals. Removing one leaves the shipments already created under
      // it untouched — it only stops new ones being made under that name.
      c.querySelectorAll('[data-delprin]').forEach(el=>{
        el.onclick = async () => {
          const name = el.dataset.delprin;
          const used = STATE.shipments.filter(s => s.principal === name).length;
          if(!confirm(used
            ? `Remove "${name}"? ${used} open shipment${used===1?'':'s'} already created under it keep the name — it just stops being offered on new ones.`
            : `Remove "${name}" from the principal list?`)) return;
          STATE.principals = STATE.principals.filter(p => p !== name);
          await persist();
          draw();
        };
      });
      document.getElementById('pr-add').onclick = async function(){
        const inp = document.getElementById('pr-name');
        const msg = document.getElementById('pr-msg');
        const name = inp.value.trim();
        if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter the principal name.'; return; }
        if(STATE.principals.some(p => p.toLowerCase() === name.toLowerCase())){
          msg.style.color='var(--red)'; msg.textContent='That principal is already listed.'; return;
        }
        this.disabled = true;
        try{
          STATE.principals = STATE.principals.concat(name);
          await persist();
          draw();
        }catch(e){
          this.disabled = false;
          msg.style.color='var(--red)'; msg.textContent = 'Could not save: ' + e.message;
        }
      };

      c.querySelectorAll('[data-delterm]').forEach(btn=>{
        btn.onclick = async () => {
          if(!confirm('Remove this terminal? Its shipments will show as "Not set" until reassigned.')) return;
          STATE.terminals = STATE.terminals.filter(t=>t.id !== btn.dataset.delterm);
          await persist();
          draw();
        };
      });
      c.querySelectorAll('[data-delpfx]').forEach(el=>{
        el.onclick = async () => {
          const [tid, pfx] = el.dataset.delpfx.split('|');
          const t = STATE.terminals.find(x=>x.id===tid);
          if(!t) return;
          t.prefixes = (t.prefixes||[]).filter(p=>p!==pfx);
          await persist();
          draw();
        };
      });
      c.querySelectorAll('[data-pfxinput]').forEach(inp=>{
        inp.oninput = () => { newPrefix[inp.dataset.pfxinput] = inp.value; };
      });
      c.querySelectorAll('[data-addpfx]').forEach(btn=>{
        btn.onclick = async () => {
          const tid = btn.dataset.addpfx;
          const inp = c.querySelector(`[data-pfxinput="${tid}"]`);
          const val = inp.value.trim();
          if(!/^\d{3}$/.test(val)){ alert('Prefix must be exactly 3 digits, e.g. 807.'); return; }
          const t = STATE.terminals.find(x=>x.id===tid);
          if(!t) return;
          t.prefixes = t.prefixes || [];
          if(t.prefixes.includes(val)){ alert('That prefix is already listed here.'); return; }
          const clash = STATE.terminals.find(x=>x.id!==tid && (x.prefixes||[]).includes(val));
          if(clash){ alert(`Prefix ${val} is already assigned to ${clash.name}.`); return; }
          t.prefixes.push(val);
          delete newPrefix[tid];
          await persist();
          draw();
        };
      });

      document.getElementById('tm-create').onclick = async function(){
        const name = document.getElementById('tm-name').value.trim();
        const prefixesRaw = document.getElementById('tm-prefixes').value.trim();
        const msg = document.getElementById('tm-msg');
        if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter a terminal name.'; return; }
        if(STATE.terminals.some(t=>t.name.toLowerCase()===name.toLowerCase())){
          msg.style.color='var(--red)'; msg.textContent='A terminal with this name already exists.'; return;
        }
        const prefixes = prefixesRaw ? prefixesRaw.split(',').map(p=>p.trim()).filter(Boolean) : [];
        for(const p of prefixes){
          if(!/^\d{3}$/.test(p)){ msg.style.color='var(--red)'; msg.textContent=`"${p}" isn't a valid 3-digit prefix.`; return; }
        }
        for(const p of prefixes){
          const clash = STATE.terminals.find(t=>(t.prefixes||[]).includes(p));
          if(clash){ msg.style.color='var(--red)'; msg.textContent=`Prefix ${p} is already assigned to ${clash.name}.`; return; }
        }
        this.disabled = true; this.textContent = 'Creating…';
        STATE.terminals.push({ id: uid(), name, prefixes });
        await persist();
        draw();
      };
    }
    draw();
  }

  // ============================================================
  // Worker IDs (admin only) — add/remove people, reset passwords
  // ============================================================
  async function paintWorkers(c){
    c.innerHTML = `<div class="empty">Loading…</div>`;
    const workers = (await getWorkers()).slice().sort((a,b)=>a.name.localeCompare(b.name));
    c.innerHTML = `
      <div style="margin:14px 16px 0;font-size:12px;color:var(--muted);line-height:1.6;">
        These are this app's own IDs — separate from attendance and performance. A new
        person is <b>Off</b> in the Access tab until you set their level.
      </div>
      <div class="card" style="padding:2px 15px;">
        ${workers.map(w=>`
          <div class="person">
            <div class="nm"><div class="n">${escapeHtml(w.name)}</div>
              <div class="r">${STATE.access[w.id] ? STATE.access[w.id].toUpperCase() : 'OFF'}</div></div>
            <div style="display:flex;gap:6px;">
              <button class="lot-act ghost" style="width:auto;padding:7px 10px;font-size:11px;"
                data-reset="${w.id}">Reset password</button>
              <button class="lot-act ghost" style="width:auto;padding:7px 10px;font-size:11px;color:var(--red);"
                data-remove="${w.id}" data-name="${escapeHtml(w.name)}">Remove</button>
            </div>
          </div>`).join('') || '<div style="font-size:12.5px;color:var(--muted);padding:10px 0;">No workers yet.</div>'}
      </div>

      <div class="sect">ADD A WORKER</div>
      <div class="field"><label>Name</label><input id="wk-name" placeholder="Full name"></div>
      <div class="field"><label>Password</label><input id="wk-pass" type="password" placeholder="At least 4 characters"></div>
      <div class="msg" id="wk-msg"></div>
      <button class="advance" id="wk-add">Add worker</button>
      <div style="height:20px;"></div>`;

    c.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = async () => {
        if(!confirm(`Remove ${btn.dataset.name}? They'll no longer be able to sign in.`)) return;
        await deleteWorker(btn.dataset.remove);
        delete STATE.access[btn.dataset.remove];
        paintShell();
      };
    });
    c.querySelectorAll('[data-reset]').forEach(btn=>{
      btn.onclick = async () => {
        const pass = prompt('New password for this worker:');
        if(!pass) return;
        if(pass.length < 4){ alert('Password needs at least 4 characters.'); return; }
        const all = await getWorkers();
        const w = all.find(x=>x.id===btn.dataset.reset);
        if(!w) return;
        w.passwordHash = await sha256Hex(pass);
        await saveWorker(w);
        alert('Password updated.');
      };
    });
    document.getElementById('wk-add').onclick = async function(){
      const name = document.getElementById('wk-name').value.trim();
      const pass = document.getElementById('wk-pass').value;
      const msg = document.getElementById('wk-msg');
      if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter a name.'; return; }
      if(!pass || pass.length < 4){ msg.style.color='var(--red)'; msg.textContent='Password needs at least 4 characters.'; return; }
      const all = await getWorkers();
      if(all.some(w=>w.name.toLowerCase()===name.toLowerCase())){
        msg.style.color='var(--red)'; msg.textContent='Someone with this name already exists.'; return;
      }
      this.disabled = true; this.textContent = 'Adding…';
      const id = uid();
      const passwordHash = await sha256Hex(pass);
      await saveWorker({ id, name, passwordHash, createdAt: new Date().toISOString() });
      paintWorkers(c);
    };
  }

    c.innerHTML = `<div class="empty">Loading workers…</div>`;
    const workers = (await getWorkers()).slice().sort((a,b)=>a.name.localeCompare(b.name));

          <div class="person">

                <span class="${lvl==='edit'?'on':''}" data-lvl="edit">Edit</span>

              </div>

        }).join('')}
      </div>
      <div style="height:20px;"></div>`;
    c.querySelectorAll('[data-disp]').forEach(sp=>{
      sp.onclick = async () => {
        const wid = sp.dataset.disp;
        if((STATE.access[wid] || 'off') === 'admin') return; // admins always have it
        const now = !STATE.display[wid];
        sp.className = now ? 'on' : '';
