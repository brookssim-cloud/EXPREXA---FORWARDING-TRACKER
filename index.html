        if(now) STATE.display[wid] = true; else delete STATE.display[wid];
        if(wid === ME.id){ CAN_DISPLAY = IS_ADMIN || now; paintShell(); }
      };
    });
    c.querySelectorAll('.segp[data-w]').forEach(seg=>{
      seg.querySelectorAll('span').forEach(sp=>{
        sp.onclick = async () => {
          const wid = seg.dataset.w, lvl = sp.dataset.lvl;
          seg.querySelectorAll('span').forEach(x=>x.className='');
          sp.className = lvl==='off' ? 'on off' : lvl==='view' ? 'on amb' : 'on';
          await setAccessFor(wid, lvl);
          STATE.access[wid] = lvl;
          if(wid === ME.id){
            MY_LEVEL = lvl; CAN_EDIT = lvl==='edit'||lvl==='admin'; IS_ADMIN = lvl==='admin';
            CAN_DISPLAY = IS_ADMIN || !!STATE.display[wid];
            if(!IS_ADMIN) STATE.tab = 'board';
            paintShell();
          }
        };
      });
    });
  }

  // ============================================================
  // Wall display board — a read-only, full-screen view for an office
  // screen. Kept deliberately separate from the working app: big type,
  // no controls, and a live Firestore listener so it updates itself as
  // people move shipments along on their phones. Nobody has to touch it.
  // ============================================================
  function renderDisplayBoard(){
    let unsub = null, unsubDone = null, clockTimer = null, pageTimer = null, minuteTimer = null, wakeLock = null;
    let doneToday = 0;
    let rows = [], page = 0, perPage = 10;
    const lastSeen = new Map();     // shipment id -> stage text, to spot changes
    const flashing = new Set();

    const el = document.createElement('div');
    el.className = 'disp';
    el.innerHTML = `
      <div class="disp-head">
        <div class="disp-title">EXPREXA <span>FORWARDING</span></div>
        <div class="disp-clock" id="dp-clock"></div>
      </div>
      <div class="disp-stats" id="dp-stats"></div>
      <div class="disp-grid" id="dp-grid"></div>
      <div class="disp-foot">
        <span id="dp-status">Connecting…</span>
        <div class="disp-dots" id="dp-dots"></div>
        <button class="disp-exit" id="dp-exit">Exit display</button>
      </div>`;
    document.body.appendChild(el);

    // Keep the screen awake and go full screen — both are best-effort and
    // silently skipped where the browser doesn't allow it.
    (async () => {
      try{ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
      try{ if(el.requestFullscreen) await el.requestFullscreen(); }catch(e){}
    })();

    function tickClock(){
      const now = new Date();
      const clock = document.getElementById('dp-clock');
      if(clock) clock.innerHTML = `${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}` +
        `<small>${now.toLocaleDateString([], {weekday:'long', day:'numeric', month:'long'})}</small>`;
    }

    // Sort the way a flight board does: whatever needs attention first,
    // then longest-waiting.
    function rank(r){ return r.level === 'bad2' ? 0 : r.level === 'warn2' ? 1 : 2; }
    function dispDay(d){
      if(!d) return '—';
      const dt = new Date(d + 'T00:00:00');
      return isNaN(dt) ? String(d) : dt.toLocaleDateString(undefined,{day:'2-digit',month:'short'});
    }
    function dispDate(iso){
      if(!iso) return '—';
      const d = new Date(iso);
      return isNaN(d) ? '—' : d.toLocaleDateString(undefined,{day:'2-digit',month:'short'});
    }

    function lvlFrom(iso, thr){
      const l = ageLevel(ageHours(iso), thr || 24);
      return l === 'bad' ? 'bad2' : l === 'warn' ? 'warn2' : 'ok2';
    }
    // Expected arrival (import) or departure (export), as entered at creation.
    function etaOf(s){
      if(s.type === 'export') return { date: s.departDate, time: s.departTime };
      const lot = (s.lots||[])[0] || {};
      return { date: lot.expectedDate, time: lot.expectedTime };
    }
    // A consolidation shows one line per house bill, since each one is
    // cleared or delivered separately — a single row would hide which of
    // them is actually holding things up.
    function build(shipments){
      const out = [];
      shipments.filter(s => !s.closed).forEach(s => {
        const sum = summarise(s);
        const eta = etaOf(s);
        const base = {
          id: s.id, awb: s.awb, type: s.type, k1: isK1Shipment(s),
          customer: s.customer || '—',
          created: s.createdAt,
          eta: eta.date, etaTime: eta.time,
          flight: s.flight || '',
          terminal: terminalForAwb(s.awb, STATE.terminals) || '',
          shipId: s.id,
          hasBalance: hasArrivalShortfall(s),
          outstandingPcs: outstandingTotal(s),
          notArrived: s.type === 'import' && !(s.lots||[]).some(l => l.hasArrived),
          closing: awaitingClosing(s)
        };
        const hawbs = hawbList(s);
        if(hawbs.length === 0){
          out.push({ ...base, hawb: '', stage: shipmentStatus(s),
            waitFrom: lastStageIso(s),
            level: sum.ageClass === 'bad' ? 'bad2' : sum.ageClass === 'warn' ? 'warn2' : 'ok2' });
          return;
        }
        if(s.type === 'export'){
          // Each HAWB runs its own roadmap, so each has its own status.
          exportTracks(s).forEach(t => {
            if(t.closed) return;
            out.push({ ...base, hawb: t.no, stage: EXPORT_STEPS[t.stage],
              waitFrom: t.stageAt, level: lvlFrom(t.stageAt, THRESH.exp[t.stage]) });
          });
          return;
        }
        // Import: the consol clears together, then splits at delivery — so
        // show the shared stage until then, and each HAWB's own progress
        // once delivery starts.
        const prog = hawbProgress(s);
        const atDelivery = (s.lots||[]).some(l => !l.closed && l.hasArrived &&
          l.stage === deliveryIdx(importSteps(l)));
        const shared = shipmentStatus(s);
        const waitFrom = lastStageIso(s);
        const level = sum.ageClass === 'bad' ? 'bad2' : sum.ageClass === 'warn' ? 'warn2' : 'ok2';
        prog.forEach(h => {
          let stage = shared;
          if(atDelivery){
            stage = h.status === 'done' ? 'Delivered'
              : `Delivery ${h.delivered}${h.pcs != null ? '/' + h.pcs : ''}`;
          }
          out.push({ ...base, hawb: h.no, stage, waitFrom,
            level: atDelivery && h.status === 'done' ? 'ok2' : level });
        });
      });
      // Furthest along first. Export and import have different numbers of
      // steps, so each row is placed by how far through its own sequence it
      // is rather than by a raw step number — otherwise a 5-step export
      // would always outrank a 7-step K1 import at the same point.
      function progress(r){
        const label = String(r.stage || '');
        if(label === 'Not arrived') return -1;
        if(label === 'Delivered' || label === 'All lots delivered') return 0.99;
        if(label === 'Awaiting balance') return 0.9;
        if(label.startsWith('Delivery ')) return 0.85;
        const arr = r.type === 'export' ? EXPORT_STEPS : (r.k1 ? IMPORT_STEPS_K1 : IMPORT_STEPS_NOK1);
        const i = arr.indexOf(label);
        return i < 0 ? 0 : i / (arr.length - 1);
      }
      return out.sort((a,b) => progress(b) - progress(a) ||
        a.awb.localeCompare(b.awb) || String(a.hawb).localeCompare(String(b.hawb)));
    }

    function measurePerPage(){
      const grid = document.getElementById('dp-grid');
      if(!grid) return;
      const probe = document.createElement('div');
      probe.className = 'disp-row';
      probe.style.visibility = 'hidden';
      probe.innerHTML = '<span class="disp-mono">22 Sep</span><span class="disp-awb">000-00000000<span class="hsub">KCH-0000</span></span><span></span><span class="disp-cust">x</span><span class="disp-mono">x</span><span class="disp-mono">x</span><span class="disp-stage">x</span><span class="disp-age">0h 00m</span>';
      grid.appendChild(probe);
      const rowH = probe.offsetHeight || 46;
      probe.remove();
      perPage = Math.max(4, Math.floor((grid.clientHeight - rowH) / rowH));
    }

    function paintStats(){
      const stats = document.getElementById('dp-stats');
      if(!stats) return;
      const imp = rows.filter(r=>r.type==='import').length;
      const exp = rows.filter(r=>r.type==='export').length;
      const notArrived = rows.filter(r=>r.notArrived).length;
      const closing = rows.filter(r=>r.closing).length;
      // Counted as AWBs, not pieces — and a consolidation spans several
      // lines, so each shipment is only counted once.
      const seen = new Set();
      let balanceAwbs = 0, outstandingAwbs = 0;
      rows.forEach(r => {
        if(seen.has(r.shipId)) return;
        seen.add(r.shipId);
        if(r.hasBalance) balanceAwbs++;
        if((r.outstandingPcs || 0) > 0) outstandingAwbs++;
      });
      // One figure per terminal you've set up, named as you named them —
      // nothing hardcoded, so adding a terminal adds a figure here.
      const terminalStats = (STATE.terminals||[]).map(t =>
        `<div><b>${rows.filter(r=>r.terminal===t.name).length}</b><span>${escapeHtml(t.name.toUpperCase())}</span></div>`).join('');
      stats.innerHTML = `
        <div><b>${rows.length}</b><span>ACTIVE LINES</span></div>
        <div><b>${imp}</b><span>IMPORT</span></div>
        <div><b>${exp}</b><span>EXPORT</span></div>
        ${terminalStats}
        <div><b>${notArrived}</b><span>NOT ARRIVED</span></div>
        <div class="amb"><b>${balanceAwbs}</b><span>BALANCE</span></div>
        <div class="amb"><b>${outstandingAwbs}</b><span>OUTSTANDING</span></div>
        <div class="amb"><b>${closing}</b><span>CLOSING</span></div>
        <div style="margin-left:auto;text-align:right;"><b style="color:#4ED8A0;">${doneToday}</b><span>COMPLETED TODAY</span></div>`;
    }

    // Sectioned the same way the All tab groups its board: a heading with a
    // count, then its lines. K1 imports sit in their own section rather than
    // inside IMPORT, since they follow a different clearance path.
    function sectioned(){
      const groups = [
        { label:'IMPORT', rows: rows.filter(r => r.type === 'import' && !r.k1) },
        { label:'EXPORT', rows: rows.filter(r => r.type === 'export') },
        { label:'K1',     rows: rows.filter(r => r.type === 'import' && r.k1) }
      ].filter(g => g.rows.length);
      const items = [];
      groups.forEach(g => {
        items.push({ head:true, label:g.label, count:g.rows.length });
        g.rows.forEach(r => items.push({ head:false, r }));
      });
      return items;
    }

    function paint(){
      const grid = document.getElementById('dp-grid');
      if(!grid) return;
      let items = sectioned();
      // Don't let a section heading sit alone at the bottom of a page.
      const pages = Math.max(1, Math.ceil(items.length / perPage));
      if(page >= pages) page = 0;
      let start = page * perPage, end = start + perPage;
      if(items[end - 1] && items[end - 1].head) end -= 1;
      const slice = items.slice(start, end);

      grid.innerHTML = `
        <div class="disp-row hd">
          <span>CREATED</span><span>AWB</span><span>TYPE</span><span>CUSTOMER</span>
          <span>ETA</span><span>FLIGHT</span><span>STATUS</span><span style="text-align:right;">WAITING</span>
        </div>
        ${slice.map(it => it.head
          ? `<div class="disp-grp"><b>${escapeHtml(it.label)}</b><i>${it.count}</i></div>`
          : ((r => `
          <div class="disp-row ${flashing.has(r.id) ? 'flash' : ''}">
            <span class="disp-mono">${escapeHtml(dispDate(r.created))}</span>
            <span class="disp-awb">${escapeHtml(r.awb)}${r.hawb ? `<span class="hsub">${escapeHtml(r.hawb)}</span>` : ''}</span>
            <span><span class="disp-tag ${r.type==='export'?'exp':'imp'}">${r.type==='export'?'EXP':'IMP'}</span>${r.k1?'<span class="disp-tag k1">K1</span>':''}</span>
            <span class="disp-cust">${escapeHtml(r.customer)}</span>
            <span class="disp-mono">${escapeHtml(r.eta ? dispDay(r.eta) : '—')}${r.etaTime ? `<span style="color:#6E7B99;"> ${escapeHtml(r.etaTime)}</span>` : ''}</span>
            <span class="disp-mono">${escapeHtml(r.flight || '—')}</span>
            <span class="disp-stage ${r.closing ? 'warn2' : ''}">${escapeHtml(r.stage)}</span>
            <span class="disp-age ${r.level}">${escapeHtml(waitStr(r.waitFrom))}</span>
          </div>`)(it.r))).join('')}
        ${slice.length === 0 ? '<div class="disp-row"><span class="disp-cust">Nothing active right now.</span></div>' : ''}`;

      const dots = document.getElementById('dp-dots');
      dots.innerHTML = pages > 1
        ? Array.from({length: pages}, (_,i)=>`<i class="${i===page?'on':''}"></i>`).join('') +
          `<span style="margin-left:10px;">Page ${page+1} of ${pages}</span>`
        : '';
    }

    function exit(){
      detach();
      clearInterval(clockTimer); clearInterval(pageTimer); clearInterval(minuteTimer);
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      try{ if(wakeLock) wakeLock.release(); }catch(e){}
      try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
      el.remove();
      paintShell();
    }
    function onKey(e){ if(e.key === 'Escape') exit(); }
    function onResize(){ measurePerPage(); paint(); }
    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', onResize);
    document.getElementById('dp-exit').onclick = exit;

    tickClock();
    clockTimer = setInterval(tickClock, 1000);
    // Redraw once a minute so the waiting times keep counting up between
    // changes — no reads, just a re-render of what's already loaded.
    minuteTimer = setInterval(() => { if(!document.hidden) paint(); }, 60000);
    measurePerPage();
    function cyclePage(){
      // Count the section headings too — they take a slot on the page, so
      // paging on row count alone would skip the tail of the list.
      const pages = Math.max(1, Math.ceil(sectioned().length / perPage));
      if(pages > 1){ page = (page + 1) % pages; paint(); }
    }
    pageTimer = setInterval(cyclePage, 12000);

    // Live: the board redraws whenever anyone changes a shipment anywhere.
    function attach(){
      if(unsub) return;
      unsub = db.collection(SHIP).where('closed','==', false).onSnapshot(snap => {
      const shipments = snap.docs.map(d => d.data());
      rows = build(shipments);
      // Flag anything whose status changed since the last update so it
      // catches the eye for a few seconds.
      rows.forEach(r => {
        const prev = lastSeen.get(r.id);
        if(prev !== undefined && prev !== r.stage){
          flashing.add(r.id);
          setTimeout(() => { flashing.delete(r.id); }, 3000);
        }
        lastSeen.set(r.id, r.stage);
      });
      const st = document.getElementById('dp-status');
      if(st) st.textContent = `Live · ${rows.length} active · updated ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
      paintStats();
      measurePerPage();
      paint();
      }, err => {
        const st = document.getElementById('dp-status');
        if(st) st.textContent = 'Lost connection — retrying…';
        console.error('Display board listener error:', err);
      });
    }
    function attachDone(){
      if(unsubDone) return;
      // Small, separate listener: only today's closed shipments, so the
      // completed total updates the moment someone closes one.
      unsubDone = db.collection(SHIP).where('closedDate','==', todayStr()).onSnapshot(snap => {
        doneToday = snap.docs.filter(d => d.data().closed).length;
        paintStats();
      }, err => console.error('Completed-today listener error:', err));
    }
    function detach(){
      if(unsub){ unsub(); unsub = null; }
      if(unsubDone){ unsubDone(); unsubDone = null; }
    }
    // A board left open behind other windows shouldn't keep a live listener
    // running for nobody — drop it while hidden and pick it up on return.
    function onVisibility(){
      if(document.hidden){
        detach();
        clearInterval(pageTimer); pageTimer = null;
        const st = document.getElementById('dp-status');
        if(st) st.textContent = 'Paused while in the background';
      } else if(!unsub){
        attach(); attachDone();
        if(!pageTimer) pageTimer = setInterval(cyclePage, 12000);
      }
    }
    document.addEventListener('visibilitychange', onVisibility);
    attach(); attachDone();
  }

  boot();
})();
</script>
</body>
</html>
