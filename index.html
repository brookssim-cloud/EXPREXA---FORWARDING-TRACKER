        migrateShipmentSteps(s);
        const idx = STATE.shipments.findIndex(x=>x.id===id);
        if(idx>-1) STATE.shipments[idx] = s; else STATE.shipments.push(s);
      }
    }catch(e){ console.error('Could not refresh shipment before opening — showing the last known copy:', e); }
    reconcileShortfallFlag(s);
    STATE.detailId = id;
    if(s.type === 'export') renderExportDetail(s); else renderImportDetail(s);
  }

  // Every status change and remark is logged here, with who and when — one
  // combined feed per shipment rather than notes and history living apart.
  function logActivity(s, text, kind, photoId){
    s.activity = s.activity || [];
    s.activity.push({ text, by: ME.name, at: new Date().toISOString(), kind: kind||'status', photoId: photoId||null });
  }
  function activityHtml(s){
    // Older shipments only have the separate notes list from before this was
    // unified — folded in here so nothing already written is lost.
    const legacyNotes = (s.notes||[]).map(n=>({ text:n.text, by:n.by, at:n.at, kind:'note' }));
    const entries = (s.activity||[]).concat(legacyNotes);
    // Shipments created before creation was logged still know who made them
    // and when, so show that as the first entry rather than leaving a gap.
    if(!entries.some(a => a.kind === 'created') && s.createdAt){
      entries.push({ text:'Shipment created', by: s.createdBy || 'unknown', at: s.createdAt, kind:'created' });
    }
    const all = entries.sort((a,b)=> String(b.at).localeCompare(String(a.at)));
    if(all.length === 0) return `<div style="font-size:12.5px;color:var(--muted);">No activity yet.</div>`;
    return all.map(a => a.kind==='note' ? `
        <div class="noteline">${escapeHtml(a.text)}
          <div class="who">${escapeHtml(a.by)}, ${new Date(a.at).toLocaleString()}</div></div>` : `
        <div class="actrow"><div class="dot"></div><div>
          <div class="txt">${escapeHtml(a.text)}</div>
          <div class="who">${escapeHtml(a.by)}, ${new Date(a.at).toLocaleString()}
            ${a.photoId?` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(a.photoId)}">View photo</span>`:''}</div></div></div>`
    ).join('');
  }
  // Wire up any "View photo" links just rendered — fetched on demand rather
  // than embedded in the shipment, so opening a shipment stays cheap even
  // once it's carrying a season's worth of photos.
  function wireActivityPhotoLinks(container){
    container.querySelectorAll('[data-viewphoto]').forEach(el=>{
      el.onclick = async () => {
        const original = el.textContent;
        el.textContent = 'Loading…';
        try{
          const doc = await withTimeout(db.collection(PHOTOS).doc(el.dataset.viewphoto).get(), 15000, 'Loading photo');
          if(doc.exists) showPhotoLightbox(doc.data().photo);
          // Photos are removed from long-completed shipments on purpose, so
          // a missing one usually means retired rather than lost.
          else el.textContent = 'Photo no longer kept';
        }catch(e){ el.textContent = 'Could not load'; }
        setTimeout(()=>{ if(el.textContent!=='Photo not found') el.textContent = original; }, 2000);
      };
    });
  }
  function showPhotoLightbox(dataUrl){
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,14,26,.92);z-index:999;'+
      'display:flex;align-items:center;justify-content:center;padding:20px;';
    ov.innerHTML = `<img src="${dataUrl}" style="max-width:100%;max-height:100%;border-radius:10px;">`;
    ov.onclick = () => ov.remove();
    document.body.appendChild(ov);
  }

  // ---- photo capture, kept in its own small collection ----
  const PHOTOS = 'fwd_photos';
  const REMARKS = 'fwd_remarks';
  async function saveRemark(s, text){
    const now = new Date();
    const rec = { id: uid(), shipId: s.id, awb: s.awb, type: s.type,
      customer: s.customer || '', date: todayStr(), at: now.toISOString(),
      by: ME.name, text };
    try{
      await db.collection(REMARKS).doc(rec.id).set(rec);
      // Today's list is cached, so drop it or a remark just written
      // wouldn't appear until the next session.
      delete _remarksCache[rec.date];
    }catch(e){ console.error('Could not index remark:', e); }
  }
  async function getRemarksOn(dateStr){
    const snap = await withTimeout(
      db.collection(REMARKS).where('date','==', dateStr).get(), 15000, 'Loading remarks');
    return snap.docs.map(d => d.data()).sort((a,b)=> String(b.at).localeCompare(String(a.at)));
  }
  // Two sizes, by what the photo is for. A document has to stay readable —
  // an AWB, a K1, a delivery order, or damage being surveyed for a claim.
  // A proof-of-handover shot of a lorry and its cargo does not, and delivery
  // runs are by far the most frequent photo taken, so they are stored
  // smaller. That roughly halves the storage a busy year uses.
  const PHOTO_DOC = { max: 800, q: 0.85 };
  const PHOTO_PROOF = { max: 640, q: 0.70 };
  // Every photo id a shipment refers to, wherever it hangs — the activity
  // feed, delivery runs on lots or on an export, and both ends of a survey.
  function photoIdsOf(s){
    const ids = [];
    (s.activity||[]).forEach(a => { if(a.photoId) ids.push(a.photoId); });
    (s.lots||[]).forEach(l => (l.deliveries||[]).forEach(d => { if(d.photoId) ids.push(d.photoId); }));
    (s.deliveries||[]).forEach(d => { if(d.photoId) ids.push(d.photoId); });
    (s.surveys||[]).forEach(r => {
      if(r.photoId) ids.push(r.photoId);
      if(r.closingPhotoId) ids.push(r.closingPhotoId);
      (r.photoIds||[]).forEach(p => ids.push(p));
    });
    return Array.from(new Set(ids.filter(Boolean)));
  }
  function resizeImageFile(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read the photo.'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not read the photo.'));
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  // ---- survey reports ----
  // Raised against a shipment when cargo turns up wet, torn, damaged or short
  // landed. The report lives on the shipment itself (like the activity feed)
  // so opening a shipment costs no extra reads, and is mirrored into its own
  // collection so the Surveys tab can pull a whole day's reports for a claim
  // without loading every shipment. Photos go to fwd_photos like every other
  // photo in the app; only their ids are stored here.
  const SURVEYS = 'fwd_surveys';
  const SURVEY_CONDITIONS = [
    { key:'wet',     label:'Wet' },
    { key:'torn',    label:'Torn' },
    { key:'damaged', label:'Damaged' },
    { key:'short',   label:'Short landed' }
  ];
  let _surveysDate = null;
  const _surveysCache = {};
  function conditionLabels(keys){
    return (keys||[]).map(k => (SURVEY_CONDITIONS.find(c=>c.key===k)||{}).label || k);
  }
  function surveyStatusChip(r){
    return surveyOpen(r)
      ? `<span class="lot-tag" style="background:rgba(242,169,59,.18);color:var(--amber-dark,#C97F12);">CREATED</span>`
      : `<span class="lot-tag" style="background:rgba(31,157,107,.14);color:var(--green);">CLOSED</span>`;
  }
  function surveyChipsHtml(keys){
    return conditionLabels(keys).map(l =>
      `<span class="lot-tag" style="background:rgba(214,69,69,.14);color:var(--red);">${escapeHtml(l)}</span>`).join(' ');
  }
  // A survey runs in two steps, each with exactly one photo: raised when the
  // damage is found (Created), then closed once it has been dealt with
  // (Closing). Both photos matter for a claim — one showing the state it
  // arrived in, one showing how it was left.
  function surveyOpen(r){ return (r.status || 'created') !== 'closed'; }
  function refreshSurveyFlags(s){
    const list = s.surveys || [];
    s.hasSurvey = list.length > 0;
    s.hasOpenSurvey = list.some(surveyOpen);
  }
  async function mirrorSurvey(s, rec){
    // Mirror for the Surveys tab. A failure here costs the day view, not the
    // report itself, which is already saved on the shipment.
    try{
      await db.collection(SURVEYS).doc(rec.id).set({
        ...rec, shipId: s.id, awb: s.awb, type: s.type, customer: s.customer || ''
      });
      delete _surveysCache[rec.date];
      if(rec.closedDate) delete _surveysCache[rec.closedDate];
    }catch(e){ console.error('Could not index survey report:', e); }
  }
  async function saveSurvey(s, rec){
    s.surveys = s.surveys || [];
    s.surveys.push(rec);
    refreshSurveyFlags(s);
    logActivity(s,
      `Survey raised — ${conditionLabels(rec.conditions).join(', ')}` +
      (rec.pcs ? ` (${rec.pcs} pcs)` : '') + (rec.hawb ? ` on ${rec.hawb}` : ''),
      'survey', rec.photoId || null);
    await saveShipment(s);
    await mirrorSurvey(s, rec);
    // Kept in step locally so the tab badge is right straight away.
    if(_openSurveys) _openSurveys.push({ ...rec, shipId: s.id, awb: s.awb });
  }
  async function closeSurvey(s, surveyId, photoId){
    const rec = (s.surveys || []).find(r => r.id === surveyId);
    if(!rec) return;
    rec.status = 'closed';
    rec.closedAt = new Date().toISOString();
    rec.closedDate = todayStr();
    rec.closedBy = ME.name;
    rec.closingPhotoId = photoId || null;
    refreshSurveyFlags(s);
    logActivity(s, `Survey closed — ${conditionLabels(rec.conditions).join(', ')}` +
      (rec.hawb ? ` on ${rec.hawb}` : ''), 'survey', photoId || null);
    await saveShipment(s);
    await mirrorSurvey(s, rec);
    if(_openSurveys) _openSurveys = _openSurveys.filter(x => x.id !== surveyId);
  }
  // Every survey still open, whatever day it was raised. A survey left open
  // is unfinished business on a damaged shipment, so the count belongs on
  // the tab itself rather than only inside whichever day you happen to be
  // looking at. Few in number by nature — they get closed.
  let _openSurveys = null;
  async function refreshOpenSurveys(){
    try{
      const snap = await withTimeout(
        db.collection(SURVEYS).where('status','==','created').get(), 15000, 'Loading open surveys');
      _openSurveys = snap.docs.map(d => d.data())
        .sort((a,b)=> String(a.at).localeCompare(String(b.at)));
    }catch(e){ console.error('Could not load open survey reports:', e); }
  }
  function openSurveyCount(){ return _openSurveys ? _openSurveys.length : 0; }
  async function getSurveysOn(dateStr){
    const snap = await withTimeout(
      db.collection(SURVEYS).where('date','==', dateStr).get(), 15000, 'Loading survey reports');
    return snap.docs.map(d => d.data()).sort((a,b)=> String(b.at).localeCompare(String(a.at)));
  }
  async function savePhoto(dataUrl){
    const id = uid();
    await db.collection(PHOTOS).doc(id).set({ photo: dataUrl, by: ME.name, at: new Date().toISOString() });
    return id;
  }
  // The survey report section shown on every shipment, above the activity
  // feed. Reports already raised are listed in full; the button below them
  // is amber because it opens a form rather than acting in one tap.
  function surveySectionHtml(s){
    const list = s.surveys || [];
    const rows = list.slice().sort((a,b)=> String(b.at).localeCompare(String(a.at))).map(r => {
      const open = surveyOpen(r);
      // Older reports were saved before a survey had steps, and carried
      // several photos rather than one. Both shapes render here.
      const raisedPhotos = r.photoId ? [r.photoId] : (r.photoIds || []);
      return `
      <div class="noteline" style="border-left-color:${open ? 'var(--red)' : 'var(--green)'};">
        <div style="margin-bottom:5px;">${surveyStatusChip(r)} ${surveyChipsHtml(r.conditions)}
          ${r.pcs ? `<span style="font-size:12px;color:var(--red);font-weight:700;margin-left:4px;">${escapeHtml(String(r.pcs))} pcs affected</span>` : ''}
          ${r.hawb ? `<span style="font-size:12px;color:var(--muted);margin-left:4px;">on ${escapeHtml(r.hawb)}</span>` : ''}
        </div>
        ${r.notes ? `<div style="font-size:13px;">${escapeHtml(r.notes)}</div>` : ''}
        <div class="who">Raised by ${escapeHtml(r.by||'')}, ${new Date(r.at).toLocaleString()}
          ${raisedPhotos.map((pid,i)=>
            ` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(pid)}">Photo${raisedPhotos.length>1?' '+(i+1):''}</span>`).join('')}
        </div>
        ${!open ? `<div class="who" style="color:var(--green);">Closed by ${escapeHtml(r.closedBy||'')}, ${r.closedAt ? new Date(r.closedAt).toLocaleString() : ''}
          ${r.closingPhotoId ? ` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(r.closingPhotoId)}">Closing photo</span>` : ''}
        </div>` : ''}
        ${open && CAN_EDIT ? `<button class="lot-act needs-input" data-closesurvey="${escapeHtml(r.id)}" style="margin-top:9px;">
          <small>Photo required</small>Close this survey</button>` : ''}
      </div>`; }).join('');
    return `
      <div class="sect">SURVEY REPORT${list.length ? ` (${list.length})` : ''}</div>
      <div class="card">
        ${list.length ? rows : `<div style="font-size:12.5px;color:var(--muted);">
          No survey raised. Raise one if the cargo is wet, torn, damaged or short landed.</div>`}
        ${CAN_EDIT ? `<button class="lot-act needs-input" id="survey-add" style="margin-top:12px;">
          ${list.length ? 'Add another survey report' : 'Raise a survey report'}</button>` : ''}
      </div>`;
  }
  // Wires the button rendered above. backTo repaints whichever detail view
  // the shipment belongs to once the form is done with.
  function wireSurveySection(s){
    const btn = document.getElementById('survey-add');
    if(btn) btn.onclick = () => renderSurveyForm(s);
    document.querySelectorAll('[data-closesurvey]').forEach(el=>{
      el.onclick = () => {
        const id = el.dataset.closesurvey;
        const rec = (s.surveys || []).find(r => r.id === id);
        requirePhoto('Closing the survey',
          `${s.awb} — ${conditionLabels(rec ? rec.conditions : []).join(', ')}`,
          async (photoId) => {
            await closeSurvey(s, id, photoId);
            reopenDetail(s);
          },
          () => reopenDetail(s));
      };
    });
  }
  function reopenDetail(s){
    if(s.type === 'export') renderExportDetail(s); else renderImportDetail(s);
  }

  // Full-screen form: what is wrong, how many pieces, which HAWB, notes, and
  // as many photos as they want to attach.
  function renderSurveyForm(s){
    const c = document.getElementById('content') || document.getElementById('app');
    const picked = new Set();
    // Exactly one photo at this step. Taking another replaces it, so the
    // report that reaches the claim is one clear picture, not a pile.
    let photo = null;    // { id, dataUrl } — uploaded as soon as it is taken
    const hawbs = hawbList(s);
    c.innerHTML = `
      <div class="back" id="sv-bk">&larr; Cancel</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">Survey report</div>
        <div class="meta">${escapeHtml(s.awb)}${s.customer?` &middot; ${escapeHtml(s.customer)}`:''}</div>
      </div>
      <div class="card">
        <div class="sect" style="margin:0 0 8px;">WHAT IS WRONG</div>
        <div id="sv-conds" style="display:flex;flex-wrap:wrap;gap:8px;">
          ${SURVEY_CONDITIONS.map(cd=>`
            <span class="lot-tag sv-cond" data-cond="${cd.key}"
              style="cursor:pointer;padding:9px 14px;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--muted);">
              ${escapeHtml(cd.label)}</span>`).join('')}
        </div>
        <div style="display:flex;gap:10px;margin-top:14px;">
          <div style="flex:1;">
            <div class="sect" style="margin:0 0 6px;">PIECES AFFECTED</div>
            <input id="sv-pcs" type="number" min="1" placeholder="optional"
              style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;">
          </div>
          ${hawbs.length ? `<div style="flex:1;">
            <div class="sect" style="margin:0 0 6px;">WHICH HAWB</div>
            <select id="sv-hawb" style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;">
              <option value="">Whole shipment</option>
              ${hawbs.map(h=>`<option value="${escapeHtml(h.no)}">${escapeHtml(h.no)}</option>`).join('')}
            </select></div>` : ''}
        </div>
        <div class="sect" style="margin:14px 0 6px;">NOTES</div>
        <textarea id="sv-notes" rows="3" placeholder="What you saw — cartons soaked on one side, seal broken, 2 pcs missing…"
          style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit;"></textarea>
        <div class="sect" style="margin:14px 0 6px;">PHOTO</div>
        <div id="sv-thumbs" style="margin-bottom:10px;"></div>
        <input type="file" accept="image/*" capture="environment" id="sv-file" style="display:none;">
        <input type="file" accept="image/*" id="sv-upload" style="display:none;">
        <div style="display:flex;gap:8px;">
          <button class="lot-act ghost" id="sv-take" style="flex:1;">Take photo</button>
          <button class="lot-act ghost" id="sv-pick" style="flex:1;">Upload photo</button>
        </div>
        <button class="advance needs-input" id="sv-save" style="margin-top:14px;">
          <small>Raised as Created — close it later with a second photo</small>Raise survey report</button>
        <div id="sv-msg" style="margin-top:9px;font-size:12.5px;text-align:center;"></div>
      </div>
      <div style="height:20px;"></div>`;

    const msg = document.getElementById('sv-msg');
    function paintConds(){
      c.querySelectorAll('.sv-cond').forEach(el=>{
        const on = picked.has(el.dataset.cond);
        el.style.background = on ? 'rgba(214,69,69,.14)' : '#fff';
        el.style.color = on ? 'var(--red)' : 'var(--muted)';
        el.style.borderColor = on ? 'var(--red)' : 'var(--line)';
        el.style.fontWeight = on ? '700' : '600';
      });
    }
    c.querySelectorAll('.sv-cond').forEach(el=>{
      el.onclick = () => {
        if(picked.has(el.dataset.cond)) picked.delete(el.dataset.cond);
        else picked.add(el.dataset.cond);
        paintConds();
      };
    });
    paintConds();

    function paintThumbs(){
      const host = document.getElementById('sv-thumbs');
      host.innerHTML = photo
        ? `<div style="position:relative;display:inline-block;">
            <img src="${photo.dataUrl}" style="max-width:100%;max-height:200px;border-radius:9px;border:1.5px solid var(--line);display:block;">
            <span id="sv-drop" style="position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;
              width:22px;height:22px;border-radius:11px;font-size:14px;line-height:22px;text-align:center;cursor:pointer;">&times;</span>
          </div>`
        : `<div style="font-size:12.5px;color:var(--muted);">No photo taken yet — one photo goes with this report.</div>`;
      const drop = document.getElementById('sv-drop');
      if(drop) drop.onclick = () => { photo = null; paintThumbs(); };
    }
    paintThumbs();

    // The photo uploads as soon as it is taken, so saving the report at the
    // end is a small write even on a weak warehouse signal.
    async function takeFile(input){
      const f = input.files && input.files[0];
      if(!f) return;
      msg.style.color = 'var(--muted)';
      msg.textContent = photo ? 'Replacing photo…' : 'Adding photo…';
      try{
        const dataUrl = await resizeImageFile(f, PHOTO_DOC.max, PHOTO_DOC.q);
        const id = await savePhoto(dataUrl);
        photo = { id, dataUrl };
        paintThumbs();
        msg.textContent = '';
      }catch(e){
        msg.style.color = 'var(--red)';
        msg.textContent = 'Could not add that photo — try another.';
      }
      input.value = '';
    }
    document.getElementById('sv-take').onclick = () => document.getElementById('sv-file').click();
    document.getElementById('sv-pick').onclick = () => document.getElementById('sv-upload').click();
    document.getElementById('sv-file').onchange = function(){ takeFile(this); };
    document.getElementById('sv-upload').onchange = function(){ takeFile(this); };
    document.getElementById('sv-bk').onclick = () => reopenDetail(s);

    document.getElementById('sv-save').onclick = async function(){
      if(picked.size === 0){
        msg.style.color = 'var(--red)';
        msg.textContent = 'Tick at least one — wet, torn, damaged or short landed.';
        return;
      }
      const notes = document.getElementById('sv-notes').value.trim();
      const pcsRaw = document.getElementById('sv-pcs').value;
      const hawbEl = document.getElementById('sv-hawb');
      const pcs = pcsRaw === '' ? null : Math.max(1, parseInt(pcsRaw, 10) || 0) || null;
      if(!photo && !notes){
        msg.style.color = 'var(--red)';
        msg.textContent = 'Add the photo or a note so the report says what was seen.';
        return;
      }
      this.disabled = true; this.textContent = 'Saving…';
      try{
        await saveSurvey(s, {
          id: uid(), status: 'created',
          date: todayStr(), at: new Date().toISOString(), by: ME.name,
          conditions: SURVEY_CONDITIONS.map(c2=>c2.key).filter(k => picked.has(k)),
          pcs, hawb: hawbEl ? hawbEl.value : '', notes,
          photoId: photo ? photo.id : null
        });
        reopenDetail(s);
      }catch(e){
        this.disabled = false; this.textContent = 'Raise survey report';
        msg.style.color = 'var(--red)';
        msg.textContent = 'Could not save: ' + e.message;
      }
    };
  }

  // A small screen requiring a photo before the caller's action proceeds.
  // Used at the points in the workflow that need proof: Docs in, moving into
  // Delivery, and Closing.
  function requirePhoto(title, subtitle, onConfirm, onCancel){
    const c = document.getElementById('content') || document.getElementById('app');
    let file = null;
    c.innerHTML = `
      <div class="back" id="ph-bk">&larr; Cancel</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">${escapeHtml(title)}</div>
        <div class="meta">${escapeHtml(subtitle)} &middot; a photo is required for this step</div>
      </div>
      <div class="card" style="text-align:center;padding:22px 16px;">
        <div id="ph-preview" style="margin-bottom:14px;">
          <div style="font-size:12.5px;color:var(--muted);">No photo taken yet</div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="ph-file" style="display:none;">
        <input type="file" accept="image/*" id="ph-upload" style="display:none;">
        <div style="display:flex;gap:8px;">
          <button type="button" class="lot-act ghost" id="ph-pick" style="border-radius:9px;flex:1;">Take photo</button>
          <button type="button" class="lot-act ghost" id="ph-browse" style="border-radius:9px;flex:1;">Upload photo</button>
        </div>
      </div>
      <div class="msg" id="ph-msg"></div>
      <button class="advance" id="ph-go">Confirm</button>`;
    document.getElementById('ph-bk').onclick = () => onCancel && onCancel();
    // Two ways in: straight to the camera, or pick an existing photo.
    const fileInput = document.getElementById('ph-file');
    const uploadInput = document.getElementById('ph-upload');
    document.getElementById('ph-pick').onclick = () => fileInput.click();
    document.getElementById('ph-browse').onclick = () => uploadInput.click();
    function onPhPicked(input){
      file = input.files[0] || null;
      const prev = document.getElementById('ph-preview');
      if(file){
        const url = URL.createObjectURL(file);
        prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:220px;border-radius:10px;">`;
      }
    }
    fileInput.onchange = () => onPhPicked(fileInput);
    uploadInput.onchange = () => onPhPicked(uploadInput);
    document.getElementById('ph-go').onclick = async function(){
      const msg = document.getElementById('ph-msg');
      if(!file){ msg.style.color='var(--red)'; msg.textContent='Take a photo first.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      try{
        const dataUrl = await resizeImageFile(file, PHOTO_DOC.max, PHOTO_DOC.q);
        const photoId = await savePhoto(dataUrl);
        onConfirm(photoId);
      }catch(e){
        this.disabled = false; this.textContent = 'Confirm';
        msg.style.color='var(--red)'; msg.textContent = e.message || 'Could not save the photo — try again.';
      }
    };
  }

  // House AWBs consolidated under this master AWB. Optional — a direct
  // shipment has none, a consolidation can have several. The consol lands
  // and clears as one under the MAWB, then each HAWB is delivered to its own
  // consignee separately, so each carries its own piece count and its own
  // delivery status. Older records stored HAWBs as plain strings; those are
  // read as a HAWB with no known piece count.
  function hawbList(s){
    if(!Array.isArray(s.hawbs)) return [];
    return s.hawbs.filter(Boolean).map(h => typeof h === 'string'
        ? { no: h, pcs: null, principal: '' }
        : { no: h.no, pcs: h.pcs == null ? null : h.pcs, principal: h.principal || '' })
      .filter(h => h.no);
  }
  function allDeliveries(s){
    // Import runs sit on each lot; export runs (the shipper bringing cargo
    // in) sit on the shipment itself, since export never splits into lots.
    return (s.lots||[]).flatMap(l => (l.deliveries||[])).concat(s.deliveries||[]);
  }
  // Delivered pieces and status for each HAWB, worked out from the delivery
  // runs recorded against it across every lot.
  function hawbProgress(s){
    const runs = allDeliveries(s);
    return hawbList(s).map(h => {
      const mine = runs.filter(d => d.hawb === h.no);
      const delivered = mine.reduce((a,d)=>a+(d.pcs||0),0);
      let status;
      if(h.pcs != null) status = delivered >= h.pcs ? 'done' : delivered > 0 ? 'part' : 'none';
      else status = delivered > 0 ? 'part' : 'none';
      return { ...h, delivered, remaining: h.pcs != null ? Math.max(0, h.pcs - delivered) : null, status, runs: mine };
    });
  }
  function hawbSummary(s){
    const prog = hawbProgress(s);
    if(prog.length === 0) return '';
    const done = prog.filter(h => h.status === 'done').length;
    return done > 0
      ? ` &middot; ${done}/${prog.length} HAWB delivered`
      : ` &middot; ${prog.length} HAWB`;
  }
  // Principal and any endorsements, on the shipment header. Older shipments
  // carry neither, so each part only appears when it is actually set.
  function principalHeaderHtml(s){
    const bits = [];
    if(s.principal) bits.push(`Principal: <span style="color:#fff;">${escapeHtml(s.principal)}</span>`);
    if((s.endorsements||[]).length) bits.push(
      `Endorsement: <span style="color:var(--amber);">${s.endorsements.map(escapeHtml).join(', ')}</span>`);
    if(!bits.length) return '';
    return `<div class="meta" style="margin-top:6px;">${bits.join(' &middot; ')}</div>`;
  }
  function hawbHeaderHtml(s){
    const h = hawbList(s);
    if(h.length === 0) return '';
    return `<div class="meta" style="margin-top:6px;">HAWB: <span style="font-family:'IBM Plex Mono',monospace;color:#fff;">${h.map(x=>escapeHtml(x.no)).join(', ')}</span></div>`;
  }
  // Per-HAWB delivery status panel on an import — each house bill's own
  // progress and its own delivery runs, each with its photo.
  function hawbPanelHtml(s){
    const prog = hawbProgress(s);
    if(prog.length === 0) return '';
    const chip = st => st === 'done'
      ? '<span class="lot-tag done">DELIVERED</span>'
      : st === 'part' ? '<span class="lot-tag here" style="background:rgba(242,169,59,.2);color:var(--amber-dk);">PART DELIVERED</span>'
      : '<span class="lot-tag w">NOT DELIVERED</span>';
    return `
      <div class="sect">HAWB DELIVERY</div>
      <div class="card" style="padding:4px 15px;">
        ${prog.map(h => `
          <div style="padding:11px 0;border-bottom:1px solid var(--line);">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--ink);">${escapeHtml(h.no)}</span>
              ${chip(h.status)}
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:3px;">
              ${h.pcs != null ? `${h.delivered} of ${h.pcs} pcs delivered` : `${h.delivered} pcs delivered`}${(()=>{
                // Only worth showing when this house bill runs under someone
                // other than the master's principal.
                const own = (hawbList(s).find(x => x.no === h.no) || {}).principal;
                return own && own !== s.principal
                  ? ` &middot; <span style="color:var(--amber-dk);font-weight:600;">${escapeHtml(own)}</span>` : '';
              })()}</div>
            ${h.runs.map(d => `
              <div style="font-size:11.5px;color:var(--text);margin-top:5px;">
                ${d.pcs} pcs &middot; ${escapeHtml(d.driver||'')} &middot;
                <span style="font-family:'IBM Plex Mono',monospace;">${escapeHtml(d.lorry||'')}</span>
                <span style="color:var(--muted);"> &middot; ${new Date(d.at).toLocaleString()}</span>
                ${d.photoId ? ` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(d.photoId)}">View photo</span>` : ''}
              </div>`).join('')}
          </div>`).join('')}
      </div>`;
  }
  // Repeatable HAWB rows — number and pieces — with "+ Add another HAWB".
  function hawbEditorHtml(prefix, existing){
    const vals = (existing && existing.length) ? existing : [{ no:'', pcs:null }];
    return `
      <div class="field">
        <label>HAWB <span style="font-weight:400;color:var(--muted);text-transform:none;">— optional, one row per house bill with its pieces</span></label>
        <div id="${prefix}-hawb-list">
          ${vals.map(v => hawbRowHtml(v)).join('')}
        </div>
        <button type="button" class="lot-act ghost" id="${prefix}-hawb-add"
          style="border-radius:9px;width:100%;margin-top:6px;padding:10px;">+ Add another HAWB</button>
      </div>`;
  }
  function hawbRowHtml(v){
    v = v || {};
    // A house bill can sit under a different principal from its master, so
    // each row carries its own. Left on "Same as shipment" it simply follows
    // the MAWB, which is what most consolidations do.
    return `<div class="hawb-row" style="margin-bottom:8px;">
      <div style="display:flex;gap:8px;">
        <input class="mono hawb-input" value="${escapeHtml(v.no||'')}" placeholder="HAWB no." style="flex:1.6;min-width:0;">
        <input type="number" min="0" class="hawb-pcs" value="${v.pcs==null?'':escapeHtml(v.pcs)}" placeholder="pcs" style="flex:0.8;min-width:0;">
        <button type="button" class="hawb-del" style="width:42px;flex:0 0 auto;border:1.5px solid var(--line);background:#fff;
          border-radius:9px;color:var(--red);font-size:18px;line-height:1;">&times;</button>
      </div>
      <select class="hawb-principal" style="width:100%;margin-top:5px;font-size:12.5px;padding:8px 10px;">
        <option value="">Same principal as the shipment</option>
        ${Array.from(new Set(STATE.principals.concat(v.principal ? [v.principal] : [])))
          .map(p=>`<option value="${escapeHtml(p)}" ${p===v.principal?'selected':''}>${escapeHtml(p)}</option>`).join('')}
      </select>
    </div>`;
  }
  function wireHawbEditor(prefix){
    const list = document.getElementById(prefix + '-hawb-list');
    function wireRows(){
      list.querySelectorAll('.hawb-del').forEach(btn => {
        btn.onclick = () => {
          const rows = list.querySelectorAll('.hawb-row');
          const row = btn.closest('.hawb-row');
          if(rows.length > 1) row.remove();
          else row.querySelectorAll('input').forEach(i => i.value = '');
        };
      });
    }
    document.getElementById(prefix + '-hawb-add').onclick = () => {
      list.insertAdjacentHTML('beforeend', hawbRowHtml(null));
      wireRows();
      const inputs = list.querySelectorAll('.hawb-input');
      inputs[inputs.length-1].focus();
    };
    wireRows();
  }
  // Reads and validates the HAWB rows against the MAWB's total pieces.
  // Returns { hawbs } or { error }.
  function readHawbs(prefix, mawbPcs){
    const rows = [...document.querySelectorAll('#' + prefix + '-hawb-list .hawb-row')];
    const out = [], seen = new Set();
    for(const r of rows){
      const no = r.querySelector('.hawb-input').value.trim().toUpperCase();
      const pcsRaw = r.querySelector('.hawb-pcs').value.trim();
      const prinEl = r.querySelector('.hawb-principal');
      const principal = prinEl ? prinEl.value : '';
      if(!no && !pcsRaw) continue;
      if(!no) return { error: 'A HAWB row has pieces but no HAWB number.' };
      // Two rows for the same house bill would be caught here whether they
      // differ in pieces or principal — it is still the same bill.
      if(seen.has(awbKey(no))) return { error: `HAWB ${no} is listed twice.` };
      const pcs = parseInt(pcsRaw, 10);
      if(!pcsRaw || isNaN(pcs) || pcs <= 0) return { error: `Enter the pieces for HAWB ${no}.` };
      seen.add(awbKey(no));
      out.push(principal ? { no, pcs, principal } : { no, pcs });
    }
    if(out.length > 0 && mawbPcs != null){
      const sum = out.reduce((a,h)=>a+h.pcs,0);
      if(sum !== mawbPcs) return { error: `HAWB pieces add up to ${sum}, but the MAWB has ${mawbPcs} pcs — they need to match.` };
    }
    return { hawbs: out };
  }

  function trackLinksHtml(s){
    const cl = cargoLink(s.awb);
    const fl = s.flight ? flightLink(s.flight) : null;
    if(!cl && !fl) return '';
    let html = '<div class="linkrow">';
    if(cl) html += `<div class="linkbtn" id="lk-cargo">${escapeHtml(cl.label)}</div>`;
    if(fl) html += `<div class="linkbtn" id="lk-flight">Track flight ${escapeHtml(s.flight)}</div>`;
    html += '</div>';
    return html;
  }
  function wireTrackLinks(s){
    const cl = cargoLink(s.awb);
    const fl = s.flight ? flightLink(s.flight) : null;
    const lc = document.getElementById('lk-cargo');
    if(lc && cl){
      lc.onclick = () => {
        if(cl.direct){ window.open(cl.url, '_blank'); }
        else {
          navigator.clipboard?.writeText(cl.copy).catch(()=>{});
          window.open(cl.url, '_blank');
        }
      };
    }
    const lf = document.getElementById('lk-flight');
    if(lf && fl) lf.onclick = () => window.open(fl, '_blank');
  }

  // Export's own version of the combined delivery form — who brought the
  // cargo in, what lorry, and a photo, all together. No quantity/balance
  // concept here, since export never splits the way import lots can; this
  // is a single one-off event, not something recorded across several runs.
  // The shipper bringing export cargo in. For a consolidation, each HAWB's
  // shipper delivers separately — so each run is recorded against its house
  // bill, and the shipment only moves on to Docs in once every HAWB is fully
  // in. A direct shipment with no HAWBs is still a single one-off delivery.
  function renderExportDeliveryRecord(s, onlyHawb){
    const c = document.getElementById('content');
    const hasHawbs = hawbList(s).length > 0;
    // Opened from a HAWB's own card → locked to that house bill.
    const hawbs = hawbProgress(s).filter(h => (h.remaining === null || h.remaining > 0) && (!onlyHawb || h.no === onlyHawb));
    let pickedHawb = hawbs.length ? hawbs[0].no : null;
    const capFor = no => { const h = hawbs.find(x => x.no === no); return h && h.remaining !== null ? h.remaining : null; };
    let file = null;
    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">Record cargo in</div>
        <div class="meta">${escapeHtml(s.customer||'')} &middot; cargo delivered in by the shipper</div>
      </div>
      ${hasHawbs ? `
      <div class="field"><label>Which HAWB</label>
        <div class="chips" id="xd-hawb">
          ${hawbs.map((h,i)=>`<span class="mono ${i===0?'on':''}" data-h="${escapeHtml(h.no)}">${escapeHtml(h.no)}${h.remaining!==null?` &middot; ${h.remaining} left`:''}</span>`).join('')}
        </div>
      </div>
      <div class="field"><label>How many pieces came in</label>
        <input type="number" min="0" id="xd-qty" value="${pickedHawb && capFor(pickedHawb)!==null ? capFor(pickedHawb) : ''}"></div>
      <div id="xd-qof" style="margin:-8px 16px 14px;font-size:11.5px;color:var(--muted);">${pickedHawb && capFor(pickedHawb)!==null ? `of ${capFor(pickedHawb)} remaining` : ''}</div>` : ''}
      <div class="field"><label>Lorry</label>
        <input class="mono" id="xd-lorry" placeholder="e.g. QKK 4471"></div>
      <div class="field"><label>Driver</label>
        <input id="xd-driver" placeholder="Driver's name"></div>
      <div class="field">
        <label>Photo</label>
        <div id="xd-preview" style="margin-bottom:8px;">
          <div style="font-size:12px;color:var(--muted);">No photo taken yet</div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="xd-file" style="display:none;">
        <input type="file" accept="image/*" id="xd-upload" style="display:none;">
        <div style="display:flex;gap:8px;">
          <button type="button" class="lot-act ghost" id="xd-pick" style="border-radius:9px;flex:1;">Take photo</button>
          <button type="button" class="lot-act ghost" id="xd-browse" style="border-radius:9px;flex:1;">Upload photo</button>
        </div>
      </div>
      <div class="msg" id="xd-msg"></div>
      <button class="advance" id="xd-go">Record cargo in</button>
      ${hasHawbs ? `<div style="margin:10px 16px 0;font-size:11.5px;color:var(--muted);text-align:center;">
        Moves on to Docs in once every HAWB is fully delivered in.</div>` : ''}`;
    document.getElementById('bk').onclick = () => renderExportDetail(s);

    if(hasHawbs){
      document.querySelectorAll('#xd-hawb span').forEach(sp => {
        sp.onclick = () => {
          document.querySelectorAll('#xd-hawb span').forEach(x => x.classList.remove('on'));
          sp.classList.add('on');
          pickedHawb = sp.dataset.h;
          const cap = capFor(pickedHawb);
          document.getElementById('xd-qty').value = cap !== null ? cap : '';
          document.getElementById('xd-qof').textContent = cap !== null ? `of ${cap} remaining` : '';
        };
      });
    }

    const xdFile = document.getElementById('xd-file');
    const xdUpload = document.getElementById('xd-upload');
    document.getElementById('xd-pick').onclick = () => xdFile.click();
    document.getElementById('xd-browse').onclick = () => xdUpload.click();
    function xdPicked(input){
      file = input.files[0] || null;
      const prev = document.getElementById('xd-preview');
      if(file){
        const url = URL.createObjectURL(file);
        prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:200px;border-radius:10px;">`;
      }
    }
    xdFile.onchange = () => xdPicked(xdFile);
    xdUpload.onchange = () => xdPicked(xdUpload);

    document.getElementById('xd-go').onclick = async function(){
      const lorry = document.getElementById('xd-lorry').value.trim();
      const driver = document.getElementById('xd-driver').value.trim();
      const msg = document.getElementById('xd-msg');
      let qty = s.pcs || null;
      if(hasHawbs){
        if(!pickedHawb){ msg.style.color='var(--red)'; msg.textContent='Every HAWB is already fully delivered in.'; return; }
        const qtyVal = document.getElementById('xd-qty').value.trim();
        qty = qtyVal ? parseInt(qtyVal,10) : 0;
        const cap = capFor(pickedHawb);
        if(!qtyVal || isNaN(qty) || qty<=0){ msg.style.color='var(--red)'; msg.textContent='Enter how many pieces came in.'; return; }
        if(cap !== null && qty > cap){ msg.style.color='var(--red)'; msg.textContent=`Only ${cap} pcs left on HAWB ${pickedHawb} — can't record more than that.`; return; }
      }
      if(!lorry){ msg.style.color='var(--red)'; msg.textContent='Enter the lorry.'; return; }
      if(!driver){ msg.style.color='var(--red)'; msg.textContent="Enter the driver's name."; return; }
      if(!file){ msg.style.color='var(--red)'; msg.textContent='Take a photo.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      try{
        const dataUrl = await resizeImageFile(file, PHOTO_PROOF.max, PHOTO_PROOF.q);
        const photoId = await savePhoto(dataUrl);
        s.deliveries = s.deliveries || [];
        s.deliveries.push({ pcs: qty, lorry, driver, hawb: pickedHawb || null, photoId,
          by: ME.name, at: new Date().toISOString() });
        logActivity(s, `${pickedHawb ? `HAWB ${pickedHawb}: ` : ''}Cargo in${qty ? ` — ${qty} pcs` : ''} by ${driver}, ${lorry}`, 'status', photoId);
        if(hasHawbs){
          // Each HAWB moves on independently — only this house bill goes to
          // Docs in, and only once all of its own pieces are in.
          const tracks = exportTracks(s);
          const t = tracks.find(x => x.no === pickedHawb);
          const p = hawbProgress(s).find(x => x.no === pickedHawb);
          if(t && p && p.status === 'done' && t.stage === 0){
            t.stage = 1;
            t.stageAt = new Date().toISOString();
            t.chasedDate = null;
            logActivity(s, `HAWB ${pickedHawb}: all cargo in — moved to Docs in`);
          }
          closeExportIfDone(s);
        } else {
          s.stage = 1;
          s.stageAt = new Date().toISOString();
          s.chasedDate = null;
        }
        await saveShipment(s);
        renderExportDetail(s);
      }catch(e){
        this.disabled = false; this.textContent = 'Record cargo in';
        msg.style.color='var(--red)'; msg.textContent = e.message || 'Could not save — try again.';
      }
    };
  }

  // One HAWB's own card on a consolidated export — its roadmap, its delivery
  // progress and runs, and its own next-step button below it.
  function exportTrackCardHtml(s, t, i){
    const prog = hawbProgress(s).find(p => p.no === t.no) || { pcs:null, delivered:0, runs:[] };
    const dots = EXPORT_STEPS.map((label,k)=>{
      const cls = k<t.stage?'done':k===t.stage?'now':'todo';
      return `<div class="st"><div class="d ${cls}"></div><div class="lbl ${k===t.stage?'on':''}">${label}</div></div>` +
        (k<EXPORT_STEPS.length-1?`<div class="jn ${k<t.stage?'done':''}"></div>`:'');
    }).join('');
    const last = EXPORT_STEPS.length-1;
    const tag = t.closed ? '<span class="lot-tag done">CLOSED</span>'
      : t.stage === 0 ? '<span class="lot-tag w">AWAITING CARGO</span>'
      : '<span class="lot-tag here">IN PROGRESS</span>';
    let nowLine, btn = '';
    if(t.closed){
      nowLine = `<div class="lot-now"><div><div class="s">Closed</div></div><span class="age ok">done</span></div>`;
    } else {
      const h = ageHours(t.stageAt), thr = THRESH.exp[t.stage] || 24;
      const lvl = ageLevel(h, thr);
      nowLine = `<div class="lot-now"><div><div class="s">${EXPORT_STEPS[t.stage]}</div>
          ${t.stage===0 ? `<div class="k">${prog.delivered}${prog.pcs!=null?` of ${prog.pcs}`:''} pcs delivered in</div>` : ''}</div>
        <span class="age ${lvl==='bad'?'bad':lvl==='warn'?'warn':'ok'}">${ageStr(t.stageAt)}</span></div>`;
      if(CAN_EDIT){
        if(t.stage === 0){
          btn = `<button class="advance needs-input" data-xdeliver="${i}"><small>${prog.delivered>0?`${prog.delivered} of ${prog.pcs} in`:'When it arrives'}</small>Record cargo in</button>`;
        } else if(t.stage+1 >= last || EXPORT_STEPS[t.stage] === 'Docs in'){
          btn = `<button class="advance needs-input" data-xadv="${i}"><small>Photo required</small>Mark ${EXPORT_STEPS[t.stage+1]}</button>`;
        } else {
          btn = `<button class="advance" data-xadv="${i}"><small>Next step</small>Mark ${EXPORT_STEPS[t.stage+1]}</button>`;
        }
      }
    }
    const runs = (prog.runs||[]).map(d=>`
      <div class="run"><div class="qty">${d.pcs} pcs</div>
        <div><div class="who">${escapeHtml(d.driver||'')}</div>
          <div class="when">${new Date(d.at).toLocaleString()}</div>
          <span class="lorry">${escapeHtml(d.lorry||'')}</span>
          ${d.photoId?` <span style="font-size:11px;color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(d.photoId)}">View photo</span>`:''}</div></div>`).join('');
    return `
      <div class="sect" style="margin-bottom:0;">HAWB ${escapeHtml(t.no)}</div>
      <div class="lot ${t.stage===0 && !t.closed ? 'wait' : ''}">
        <div class="lot-hd"><span class="lot-qty">${prog.pcs!=null?prog.pcs+' pcs':'—'}</span>${tag}</div>
        <div class="steps">${dots}</div>
        ${nowLine}
        ${runs ? `<div style="padding:0 14px 6px;">${runs}</div>` : ''}
      </div>
      ${btn}`;
  }

  function renderExportDetail(s){
    const c = document.getElementById('content');
    const tracks = exportTracks(s);
    const stepsHtml = EXPORT_STEPS.map((label,i)=>{
      const cls = i<s.stage?'done':i===s.stage?'now':'todo';
      return `<div class="st"><div class="d ${cls}"></div><div class="lbl ${i===s.stage?'on':''}">${label}</div></div>` +
        (i<EXPORT_STEPS.length-1?`<div class="jn ${i<s.stage?'done':''}"></div>`:'');
    }).join('');
    const done = s.stage >= EXPORT_STEPS.length-1;
    const nextLabel = done ? null : EXPORT_STEPS[s.stage+1];

    c.innerHTML = `
      <div class="back" id="bk">&larr; Board</div>
      <div class="head">
        <div class="awb-lg">${escapeHtml(s.awb)}</div>
        <div class="meta">Export to ${escapeHtml(s.to||'—')}${s.flight?` on ${escapeHtml(s.flight)}`:''}${s.departDate?` &middot; departs ${escapeHtml(s.departDate)}${s.departTime?', '+escapeHtml(s.departTime):''}`:''}<br>
          ${escapeHtml(s.customer||'')}${s.pcs?` &middot; ${escapeHtml(s.pcs)} pcs`:''}${s.kg?`, ${escapeHtml(s.kg)} kg`:''}</div>
        ${principalHeaderHtml(s)}
        ${hawbHeaderHtml(s)}
        ${trackLinksHtml(s)}
        ${IS_ADMIN ? `<div class="linkrow"><div class="linkbtn" id="edit-btn">Edit details</div></div>` : ''}
      </div>
      ${tracks.length ? `
      ${tracks.map((t,i)=>exportTrackCardHtml(s,t,i)).join('')}
      ${s.closed ? `<div class="card" style="text-align:center;color:var(--green);font-weight:600;">
          Every HAWB is closed — this shipment is complete.</div>` : ''}
      ${!CAN_EDIT ? `<div class="viewer-strip">You're signed in as <b>view only</b>.
          You can add remarks, but ask an editor to move this along.</div>` : ''}
      ` : `
      <div class="card" style="padding:2px 15px;">
        <div class="steps" style="padding-top:14px;">${stepsHtml}</div>
      </div>
      ${!CAN_EDIT ? `<div class="viewer-strip">You're signed in as <b>view only</b>.
          You can add remarks, but ask an editor to move this along.</div>` :
        done ? `<div class="card" style="text-align:center;color:var(--green);font-weight:600;">
          ${EXPORT_STEPS[EXPORT_STEPS.length-1]} — this shipment is closed.</div>` :
        s.stage === 0
          ? `<button class="advance needs-input" id="adv"><small>${(() => {
              const p = hawbProgress(s);
              if(!p.length) return 'When it arrives';
              const done = p.filter(h => h.status === 'done').length;
              return done > 0 ? `${done} of ${p.length} HAWB in` : 'When it arrives';
            })()}</small>Record cargo in</button>`
          : (s.stage+1 >= EXPORT_STEPS.length-1 || EXPORT_STEPS[s.stage] === 'Docs in'
            ? `<button class="advance needs-input" id="adv"><small>Photo required</small>Mark ${escapeHtml(nextLabel)}</button>`
            : `<button class="advance" id="adv"><small>Next step</small>Mark ${escapeHtml(nextLabel)}</button>`)}
      `}
      ${surveySectionHtml(s)}
      <div class="sect">ACTIVITY</div>
      <div class="card">
        ${activityHtml(s)}
        <div class="addnote"><input id="note-in" placeholder="Add a remark…">
          <button id="note-go">Add</button></div>
      </div>
      <div style="height:20px;"></div>`;

    document.getElementById('bk').onclick = () => { STATE.tab='board'; paintShell(); };
    wireTrackLinks(s);
    wireActivityPhotoLinks(c);
    wireSurveySection(s);
    const editBtn = document.getElementById('edit-btn');
    if(editBtn) editBtn.onclick = () => renderEditShipment(s);
    c.querySelectorAll('[data-xdeliver]').forEach(btn => {
      btn.onclick = () => renderExportDeliveryRecord(s, tracks[+btn.dataset.xdeliver].no);
    });
    c.querySelectorAll('[data-xadv]').forEach(btn => {
      btn.onclick = () => {
        const t = tracks[+btn.dataset.xadv];
        const fromLabel = EXPORT_STEPS[t.stage];
        const toStage = t.stage + 1;
        const toLabel = EXPORT_STEPS[toStage];
        const isClosing = toStage >= EXPORT_STEPS.length-1;
        async function doAdvance(photoId){
          btn.disabled = true;
          t.stage = toStage;
          t.stageAt = new Date().toISOString();
          t.chasedDate = null;
          if(isClosing) t.closed = true;
          logActivity(s, `HAWB ${t.no}: Moved from ${fromLabel} to ${toLabel}`, 'status', photoId);
          closeExportIfDone(s);
          await saveShipment(s);
          renderExportDetail(s);
        }
        if(isClosing){
          requirePhoto(`Photo for ${toLabel} — closing the airline delivery order`, `HAWB ${t.no} · ${s.awb}`, doAdvance, () => renderExportDetail(s));
        } else if(fromLabel === 'Docs in'){
          requirePhoto('Photo of the documents', `HAWB ${t.no} · ${s.awb}`, doAdvance, () => renderExportDetail(s));
        } else {
          doAdvance(null);
        }
      };
    });
    const adv = document.getElementById('adv');
    if(adv) adv.onclick = async () => {
      const fromLabel = EXPORT_STEPS[s.stage];
      const toStage = s.stage + 1;
      const toLabel = EXPORT_STEPS[toStage];
      const isClosing = toStage >= EXPORT_STEPS.length-1;
      // Leaving "Delivery" is the moment cargo actually arrived from the
      // shipper — same kind of moment as an import's delivery, so it's
      // captured the same way: who brought it, what lorry, and a photo,
      // together, rather than a bare tap.
      if(s.stage === 0){
        renderExportDeliveryRecord(s);
        return;
      }
      // Photograph the documents when moving on from Docs in, and again at
      // Closing for the airline delivery order.
      const needsPhoto = isClosing || fromLabel === 'Docs in';
      async function doAdvance(photoId){
        adv.disabled = true; adv.textContent = 'Saving…';
        s.stage = toStage;
        s.stageAt = new Date().toISOString();
        s.chasedDate = null;
        logActivity(s, `Moved from ${fromLabel} to ${toLabel}`, 'status', photoId);
        if(isClosing){ s.closed = true; s.closedDate = todayStr(); }
        await saveShipment(s);
        renderExportDetail(s);
      }
      if(needsPhoto){
        requirePhoto(isClosing ? `Photo for ${toLabel} — closing the airline delivery order` : 'Photo of the documents',
          s.awb, doAdvance, () => renderExportDetail(s));
      } else {
        await doAdvance(null);
      }
    };
    const noteGo = document.getElementById('note-go');
    if(noteGo) noteGo.onclick = async () => {
      const inp = document.getElementById('note-in');
      const text = inp.value.trim();
      if(!text) return;
      logActivity(s, text, 'note');
      await saveShipment(s);
      await saveRemark(s, text);
      renderExportDetail(s);
    };
  }

  // ============================================================
  // Detail — import (lots)
  // ============================================================
  function lotStepsHtml(lot){
    const steps = importSteps(lot);
    return steps.map((label,i)=>{
      const cls = i<lot.stage?'done':i===lot.stage?'now':'todo';
      return `<div class="st"><div class="d ${cls}"></div><div class="lbl ${i===lot.stage?'on':''}">${label}</div></div>` +
        (i<steps.length-1?`<div class="jn ${i<lot.stage?'done':''}"></div>`:'');
    }).join('');
  }

  function renderImportDetail(s){
    const c = document.getElementById('content');
    const lots = s.lots || [];
    // s.pcs is the total booked on the AWB at creation — the one figure to
    // measure everything else against, rather than re-deriving it from
    // whatever each lot happens to expect.
    const totalExp = s.pcs || 0;
    const totalHere = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
    const anyArrived = lots.some(l=>l.hasArrived);
    const balance = totalExp - totalHere;
    // Only offer another lot once the first has actually arrived and come up
    // short — recording the full amount on the first go removes the option
    // entirely, since there's nothing left to split.
    const showAddLot = CAN_EDIT && !s.closed && anyArrived && balance > 0;
    // Every arrived lot is finished but the rest of the MAWB never turned up —
    // offer a deliberate write-off so the shipment isn't stranded open forever.
    const allLotsClosed = lots.length > 0 && lots.every(l=>l.closed);
    const showWriteOff = CAN_EDIT && !s.closed && allLotsClosed && balance > 0;

    c.innerHTML = `
      <div class="back" id="bk">&larr; Board</div>
      <div class="head">
        <div class="awb-lg">${escapeHtml(s.awb)}</div>
        <div class="meta">Import from ${escapeHtml(s.from||'—')}<br>${escapeHtml(s.customer||'')}</div>
        ${principalHeaderHtml(s)}
        ${hawbHeaderHtml(s)}
        <div class="tally">
          <div>ON THE AWB<b>${totalExp||'—'}</b></div>
          <div>HERE<b>${totalHere}</b></div>
          ${anyArrived && balance>0?`<div>BALANCE<b class="amb">${balance}</b></div>`:''}
        </div>
        ${trackLinksHtml(s)}
        ${IS_ADMIN ? `<div class="linkrow"><div class="linkbtn" id="edit-btn">Edit details</div></div>` : ''}
      </div>
      <div id="lots-host"></div>
      ${showAddLot ? `<button class="addlot" id="add-lot">+ Add lot for the remaining ${balance} pcs</button>` : ''}
      ${showWriteOff ? `
        <div style="margin:0 16px 8px;font-size:12px;color:var(--muted);line-height:1.6;">
          Everything that arrived is delivered and closed, but ${balance} pcs on this MAWB
          haven't arrived. The shipment stays open until they do — or close it here if
          they're not coming.</div>
        <button class="advance" id="writeoff-btn" style="background:#F2F5F9;color:var(--ink);">
          <small>Photo required</small>Close shipment — balance won't arrive</button>` : ''}
      ${hawbPanelHtml(s)}
      ${surveySectionHtml(s)}
      <div class="sect">ACTIVITY</div>
      <div class="card">
        ${activityHtml(s)}
        <div class="addnote"><input id="note-in" placeholder="Add a remark…">
          <button id="note-go">Add</button></div>
      </div>
      <div style="height:20px;"></div>`;

    document.getElementById('bk').onclick = () => { STATE.tab='board'; paintShell(); };
    wireTrackLinks(s);
    wireActivityPhotoLinks(c);
    wireSurveySection(s);
    const editBtn = document.getElementById('edit-btn');
    if(editBtn) editBtn.onclick = () => renderEditShipment(s);
    paintLots(s);

    const addLotBtn = document.getElementById('add-lot');
    if(addLotBtn) addLotBtn.onclick = () => renderRecordArrival(s, null, balance);
    const writeOffBtn = document.getElementById('writeoff-btn');
    if(writeOffBtn) writeOffBtn.onclick = () => {
      if(!confirm(`Close ${s.awb} with ${balance} pcs never arrived? This completes the whole shipment.`)) return;
      requirePhoto('Photo for Closing — closing the airline delivery order', s.awb, async (photoId) => {
        s.balanceWrittenOff = true;
        logActivity(s, `Shipment closed — ${balance} pcs balance never arrived`, 'status', photoId);
        checkFullyClosed(s);
        await saveShipment(s);
        renderImportDetail(s);
      }, () => renderImportDetail(s));
    };

    const noteGo = document.getElementById('note-go');
    if(noteGo) noteGo.onclick = async () => {
      const inp = document.getElementById('note-in');
      const text = inp.value.trim();
      if(!text) return;
      logActivity(s, text, 'note');
      await saveShipment(s);
      await saveRemark(s, text);
      renderImportDetail(s);
    };
  }

  function paintLots(s){
    const host = document.getElementById('lots-host');
    const lots = s.lots || [];
    host.innerHTML = lots.map((lot, li) => {
      const label = lots.length>1 ? `LOT ${li+1}` : 'PROGRESS';
      const steps = importSteps(lot);
      const k1Tag = lot.hasArrived && !lot.closed
        ? `<span class="lot-tag ${lot.hasK1?'w':'here'}" style="margin-left:6px;">${lot.hasK1?'K1':'NO K1'}</span>` : '';
      const tagHtml = lot.closed ? (lotShortfall(lot) > 0
          ? `<span class="lot-tag" style="background:rgba(214,69,69,.14);color:var(--red);">CLOSED SHORT</span>`
          : `<span class="lot-tag done">DELIVERED</span>`)
        : !lot.hasArrived ? `<span class="lot-tag w">NOT ARRIVED</span>`
        : `<span class="lot-tag here">HERE</span>${k1Tag}`;
      const qty = !lot.hasArrived ? (lot.pcsExpected||'?')+' pcs' : (lot.pcsArrived||'?')+' pcs';
      const when = !lot.hasArrived
        ? (lot.expectedDate ? `Expected ${lot.expectedDate}${lot.expectedTime?', '+lot.expectedTime:''}` : 'Date not yet known') + (lot.flight?` &middot; ${escapeHtml(lot.flight)}`:'')
        : `${lot.flight?escapeHtml(lot.flight)+' &middot; ':''}landed ${lot.arrivedAt?new Date(lot.arrivedAt).toLocaleDateString():''}${lot.k1?` &middot; K1 ${escapeHtml(lot.k1)}`:''}`;

      // Delivery runs stay visible at every stage, not only while delivering,
      // so a mistyped one can still be found and corrected afterwards.
      const runsBlock = (lot.deliveries||[]).length ? `<div style="padding:0 14px;">
        ${(lot.deliveries||[]).map((d,di)=>`
          <div class="run"><div class="qty">${d.pcs} pcs</div>
            <div style="flex:1;"><div class="who">${escapeHtml(d.driver)}</div>
              <div class="when">${new Date(d.at).toLocaleString()}</div>
              <span class="lorry">${escapeHtml(d.lorry)}</span>${d.hawb ? ` <span class="lorry" style="background:rgba(242,169,59,.18);color:var(--amber-dk);">HAWB ${escapeHtml(d.hawb)}</span>` : ''}
              ${IS_ADMIN ? `<div style="margin-top:4px;">
                <span style="font-size:11px;font-weight:700;color:var(--ink);cursor:pointer;" data-fixrun="${li}|${di}">Correct</span>
                <span style="font-size:11px;font-weight:700;color:var(--red);cursor:pointer;margin-left:10px;" data-delrun="${li}|${di}">Remove</span>
              </div>` : ''}
            </div></div>`).join('')}
      </div>` : '';
      // Admins can also fix a mistyped arrival count.
      const fixArrived = (IS_ADMIN && lot.hasArrived) ? `<div style="padding:0 14px 10px;">
        <span style="font-size:11px;font-weight:700;color:var(--ink);cursor:pointer;" data-fixarr="${li}">Correct arrived pieces</span>
      </div>` : '';

      let nowLine, insideAction = '', outsideAction = '';
      if(lot.closed){
        const short = lotShortfall(lot);
        nowLine = short > 0
          ? `<div class="lot-now"><div><div class="s">Closed short</div>
              <div class="k">${lotDelivered(lot)} of ${lot.pcsArrived} delivered &middot; ${short} still to go out</div></div>
             <span class="age bad">${short} short</span></div>`
          : `<div class="lot-now"><div><div class="s">Delivered in full</div>
              ${(lot.deliveries||[]).some(d=>d.late) ? `<div class="k">Cleared after closing</div>` : ''}</div>
             <span class="age ok">done</span></div>`;
        // A lot closed short isn't finished — those pieces still have to go
        // out eventually. Keep recording deliveries against it until the
        // shortfall reaches zero; the lot stays closed throughout, and it
        // drops off Outstanding by itself once nothing is left.
        if(short > 0 && CAN_EDIT){
          outsideAction = `<button class="advance needs-input" data-deliver="${li}">
            <small>${short} pcs still outstanding</small>Record a late delivery</button>`;
        }
      } else if(!lot.hasArrived && preArrival(lot)){
        // A K1 lot is declared and paid for before the cargo lands, so it
        // has real steps to work through while still in the air.
        const h = ageHours(lot.stageAt), thr = importThresh(lot)[lot.stage]||24;
        const lvl = ageLevel(h,thr);
        nowLine = `<div class="lot-now"><div><div class="s">${steps[lot.stage]}</div>
          <div class="k">Cleared before it lands${lot.expectedDate?` &middot; due ${escapeHtml(lot.expectedDate)}`:''}</div></div>
          <span class="age ${lvl==='bad'?'bad':lvl==='warn'?'warn':'ok'}">${ageStr(lot.stageAt)}</span></div>`;
        if(CAN_EDIT){
          const next = steps[lot.stage+1];
          outsideAction = next === 'Arrived'
            ? `<button class="advance needs-input" data-arrive="${li}"><small>Once it lands</small>Record this lot arriving</button>`
            : (steps[lot.stage] === 'K1 in'
              ? `<button class="advance needs-input" data-advance="${li}"><small>Photo required</small>Mark ${escapeHtml(next)}</button>`
              : `<button class="advance" data-advance="${li}"><small>Next step</small>Mark ${escapeHtml(next)}</button>`);
        }
      } else if(!lot.hasArrived){
        nowLine = `<div class="lot-now"><div><div class="s">Waiting on the airline</div>
          <div class="k">Will need its own clearance once here</div></div>
          <span class="age warn">${lot.expectedDate||'no date yet'}</span></div>`;
        outsideAction = CAN_EDIT ? `<button class="advance needs-input" data-arrive="${li}"><small>Once it lands</small>Record this lot arriving</button>` : '';
      } else if(lot.stage === deliveryIdx(steps)){
        const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
        const remaining = (lot.pcsArrived||0) - delivered;
        const h = ageHours(lot.stageAt), thr = importThresh(lot)[lot.stage];
        nowLine = `<div class="lot-now"><div><div class="s">Delivery</div>
          <div class="k">${delivered} delivered, ${remaining} balance</div></div>
          <span class="age ${remaining>0?(ageLevel(h,thr)==='bad'?'bad':'warn'):'ok'}">${ageStr(lot.stageAt)}</span></div>`;
        insideAction = runsBlock + fixArrived;
        if(!CAN_EDIT){
          outsideAction = '';
        } else if(remaining > 0){
          outsideAction = `<button class="advance needs-input" data-deliver="${li}"><small>When it goes out</small>Record a delivery</button>
             <button class="advance" style="background:#F2F5F9;color:var(--ink);" data-closelot="${li}">Close &mdash; nothing more to deliver</button>`;
        } else {
          // Everything's out. What comes next depends on the path: the K1
          // sequence closes from here, the other one still has Releasing to
          // go. Either way it's a deliberate tap, never automatic.
          const next = steps[lot.stage+1];
          outsideAction = next === 'Closing'
            ? `<button class="advance needs-input" data-closelot="${li}"><small>Photo required</small>Mark Closing</button>`
            : `<button class="advance" data-advance="${li}"><small>Next step</small>Mark ${escapeHtml(next)}</button>`;
        }
      } else {
        const h = ageHours(lot.stageAt), thr = importThresh(lot)[lot.stage]||24;
        const lvl = ageLevel(h,thr);
        nowLine = `<div class="lot-now"><div><div class="s">${steps[lot.stage]}</div></div>
          <span class="age ${lvl==='bad'?'bad':lvl==='warn'?'warn':'ok'}">${ageStr(lot.stageAt)}</span></div>`;
        // Every next step is a separate, standalone button below the card —
        // the same shape export uses throughout — coloured by whether it's
        // a plain tap or something that needs a form or a photo first.
        if(!CAN_EDIT){ /* nothing to show */ }
        else if(steps[lot.stage+1] === 'Delivery'){
          outsideAction = `<button class="advance needs-input" data-deliver="${li}"><small>When it goes out</small>Record a delivery</button>`;
        } else if(steps[lot.stage+1] === 'Closing'){
          outsideAction = `<button class="advance needs-input" data-closelot="${li}"><small>Photo required</small>Mark Closing</button>`;
        } else {
          const needsPhotoNext = steps[lot.stage+1] === 'Docs in';
          outsideAction = needsPhotoNext
            ? `<button class="advance needs-input" data-advance="${li}"><small>Photo required</small>Mark ${escapeHtml(steps[lot.stage+1])}</button>`
            : `<button class="advance" data-advance="${li}"><small>Next step</small>Mark ${escapeHtml(steps[lot.stage+1])}</button>`;
        }
      }

      return `
        <div class="sect" style="margin-bottom:0;">${label}</div>
        <div class="lot ${!lot.hasArrived?'wait':''}">
          <div class="lot-hd"><span class="lot-qty">${qty}</span>${tagHtml}</div>
          <div class="lot-when">${when}</div>
          ${(lot.hasArrived || lot.hasK1) ? `<div class="steps">${lotStepsHtml(lot)}</div>` : ''}
          ${nowLine}
          ${insideAction || (runsBlock + fixArrived)}
        </div>
        ${outsideAction}`;
    }).join('');

    if(!CAN_EDIT){
      host.insertAdjacentHTML('beforeend', `<div class="viewer-strip">You're signed in as
        <b>view only</b>. You can add remarks, but ask an editor to move this along.</div>`);
    }

    host.querySelectorAll('[data-advance]').forEach(btn=>{
      btn.onclick = async () => {
        const li = +btn.dataset.advance;
        const lot = s.lots[li];
        const steps = importSteps(lot);
        const fromLabel = steps[lot.stage];
        const toStage = lot.stage + 1;
        const toLabel = steps[toStage];
        const label = lots.length>1 ? `Lot ${li+1}: ` : '';
        // Docs get photographed on the way in; the K1 declaration gets
        // photographed on the way out of the K1 in step.
        const needsPhoto = toLabel === 'Docs in' || fromLabel === 'K1 in';
        async function doAdvance(photoId){
          btn.disabled = true;
          lot.stage = toStage;
          lot.stageAt = new Date().toISOString();
          lot.chasedDate = null;
          logActivity(s, `${label}Moved from ${fromLabel} to ${toLabel}`, 'status', photoId);
          await saveShipment(s);
          renderImportDetail(s);
        }
        if(needsPhoto){
          requirePhoto(`Photo for ${toLabel}`, `${label}${s.awb}`, doAdvance, () => renderImportDetail(s));
        } else {
          await doAdvance(null);
        }
      };
    });
    host.querySelectorAll('[data-arrive]').forEach(btn=>{
      btn.onclick = () => renderRecordArrival(s, +btn.dataset.arrive);
    });
    host.querySelectorAll('[data-deliver]').forEach(btn=>{
      btn.onclick = () => renderRecordDelivery(s, +btn.dataset.deliver);
    });
    // ---- admin corrections ----
    // Every correction is logged with what changed, the reason, and who did
    // it, so a fixed figure never looks like it was always that way.
    host.querySelectorAll('[data-fixarr]').forEach(el=>{
      el.onclick = async () => {
        const lot = s.lots[+el.dataset.fixarr];
        const label = lots.length>1 ? `Lot ${s.lots.indexOf(lot)+1}: ` : '';
        const cur = lot.pcsArrived || 0;
        const raw = prompt(`Arrived pieces for this lot (currently ${cur}):`, String(cur));
        if(raw === null) return;
        const val = parseInt(String(raw).trim(), 10);
        if(isNaN(val) || val <= 0){ alert('Enter a positive number.'); return; }
        if(val === cur) return;
        const out = lotDelivered(lot);
        if(val < out){ alert(`${out} pcs have already been delivered on this lot, so it can't be fewer than that.`); return; }
        const why = prompt('Why is this being corrected?');
        if(!why || !why.trim()) return;
        lot.pcsArrived = val;
        logActivity(s, `${label}Arrived pieces corrected ${cur} → ${val} (${why.trim()})`);
        await saveShipment(s);
        renderImportDetail(s);
      };
    });
    host.querySelectorAll('[data-fixrun]').forEach(el=>{
      el.onclick = async () => {
        const [li2, di] = el.dataset.fixrun.split('|').map(Number);
        const lot = s.lots[li2];
        const run = (lot.deliveries||[])[di];
        if(!run) return;
        const label = lots.length>1 ? `Lot ${li2+1}: ` : '';
        const raw = prompt(`Pieces on this delivery run (currently ${run.pcs}):`, String(run.pcs));
        if(raw === null) return;
        const val = parseInt(String(raw).trim(), 10);
        if(isNaN(val) || val <= 0){ alert('Enter a positive number.'); return; }
        if(val === run.pcs) return;
        const othersOnLot = lotDelivered(lot) - run.pcs;
        if(othersOnLot + val > (lot.pcsArrived||0)){
          alert(`That would make ${othersOnLot + val} pcs delivered on a lot that only received ${lot.pcsArrived}.`); return;
        }
        if(run.hawb){
          const h = hawbList(s).find(x => x.no === run.hawb);
          if(h && h.pcs != null){
            const othersOnHawb = allDeliveries(s)
              .filter(d => d.hawb === run.hawb && d !== run)
              .reduce((a,d)=>a+(d.pcs||0),0);
            if(othersOnHawb + val > h.pcs){
              alert(`That would deliver ${othersOnHawb + val} pcs against HAWB ${run.hawb}, which only has ${h.pcs}.`); return;
            }
          }
        }
        const why = prompt('Why is this being corrected?');
        if(!why || !why.trim()) return;
        const was = run.pcs;
        run.pcs = val;
        run.correctedBy = ME.name; run.correctedAt = new Date().toISOString();
        logActivity(s, `${label}Delivery corrected ${was} → ${val} pcs${run.hawb?` (HAWB ${run.hawb})`:''} — ${why.trim()}`);
        await saveShipment(s);
        renderImportDetail(s);
      };
    });
    host.querySelectorAll('[data-delrun]').forEach(el=>{
      el.onclick = async () => {
        const [li2, di] = el.dataset.delrun.split('|').map(Number);
        const lot = s.lots[li2];
        const run = (lot.deliveries||[])[di];
        if(!run) return;
        if(!confirm(`Remove this delivery of ${run.pcs} pcs by ${run.driver}? The pieces go back to outstanding.`)) return;
        const why = prompt('Why is it being removed?');
        if(!why || !why.trim()) return;
        const label = lots.length>1 ? `Lot ${li2+1}: ` : '';
        lot.deliveries.splice(di, 1);
        logActivity(s, `${label}Delivery removed — ${run.pcs} pcs, ${run.driver}${run.hawb?` (HAWB ${run.hawb})`:''} — ${why.trim()}`);
        await saveShipment(s);
        renderImportDetail(s);
      };
    });

    host.querySelectorAll('[data-closelot]').forEach(btn=>{
      btn.onclick = () => {
        const li = +btn.dataset.closelot;
        const lot = s.lots[li];
        const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
        const remaining = (lot.pcsArrived||0) - delivered;
        const label = lots.length>1 ? `Lot ${li+1}: ` : '';
        if(remaining > 0 && !confirm('Close this lot with a balance still outstanding?')) return;
        requirePhoto('Photo for Closing — closing the airline delivery order', `${label}${s.awb}`, async (photoId) => {
          lot.closed = true;
          lot.stage = terminalIdx(importSteps(lot));
          logActivity(s, remaining > 0
            ? `${label}Closed with a balance still outstanding`
            : `${label}Closed — fully delivered`, 'status', photoId);
          checkFullyClosed(s);
          await saveShipment(s);
          renderImportDetail(s);
        }, () => renderImportDetail(s));
      };
    });
  }

  // ---- export HAWB tracks ----
  // A consolidated export splits by house bill: each HAWB runs its own
  // Delivery → Docs in → Screening → Releasing → Closing, independently of
  // the others. A direct export with no HAWBs keeps the single shipment-level
  // stage it always had. Tracks are built lazily, so an older export that
  // already had HAWBs picks them up the first time it's opened.
  function exportTracks(s){
    if(s.type !== 'export') return [];
    const hawbs = hawbList(s);
    if(hawbs.length === 0) return [];
    if(!Array.isArray(s.xtracks)) s.xtracks = [];
    const prog = hawbProgress(s);
    // Keep tracks in step with the HAWB list: add any new house bill, drop
    // any removed one (the edit screen already blocks removing a HAWB that
    // has deliveries, so nothing real is lost here).
    const byNo = {};
    s.xtracks.forEach(t => { byNo[t.no] = t; });
    s.xtracks = hawbs.map(h => {
      if(byNo[h.no]) return byNo[h.no];
      const p = prog.find(x => x.no === h.no);
      // Migrating an older export: if this HAWB was already fully in, carry
      // on from wherever the shipment itself had got to.
      const startStage = (p && p.status === 'done') ? Math.max(1, s.stage||0) : 0;
      return { no: h.no, stage: Math.min(startStage, EXPORT_STEPS.length-1),
        stageAt: s.stageAt || new Date().toISOString(), chasedDate: null,
        closed: !!s.closed };
    });
    return s.xtracks;
  }
  function closeExportIfDone(s){
    const tracks = exportTracks(s);
    if(tracks.length && tracks.every(t => t.closed)){
      s.closed = true; s.closedDate = todayStr();
      s.stage = EXPORT_STEPS.length-1;
    } else if(tracks.length){
      // Keep the shipment-level stage as the least-advanced open track, so
      // anything still reading s.stage sees a sensible value.
      const open = tracks.filter(t => !t.closed);
      s.stage = Math.min(...open.map(t => t.stage));
    }
  }

  // Pieces booked on the MAWB that haven't arrived in any lot yet.
  function arrivalBalance(s){
    if(s.type !== 'import' || !s.pcs) return 0;
    const here = (s.lots||[]).filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
    return Math.max(0, s.pcs - here);
  }
  // Closing a lot closes that consignment's airline delivery order — it does
  // NOT mean the whole MAWB is done. The shipment only completes once every
  // lot is closed AND nothing booked on the MAWB is still waiting to arrive
  // (or someone has deliberately written that balance off). Previously only
  // the first half was checked, so closing the first short-shipped lot
  // completed the whole MAWB while the rest was still in the air.
  function checkFullyClosed(s){
    if(s.type !== 'import') return;
    const lots = s.lots || [];
    if(!lots.length || !lots.every(l=>l.closed)) return;
    if(arrivalBalance(s) > 0 && !s.balanceWrittenOff) return;
    s.closed = true; s.closedDate = todayStr();
  }

  // ---- record a lot arriving ----
  function renderRecordArrival(s, li, defaultQtyForNewLot){
    const c = document.getElementById('content');
    const lot = li!=null ? s.lots[li] : null;
    const defaultQty = lot ? (lot.pcsExpected || '') : (defaultQtyForNewLot || '');
    // K1 is decided once, when the shipment is created — not re-asked here.
    // A new lot from a balance takes the same K1 status as the first, since
    // it's the same commodity on the same AWB.
    const hasK1 = lot ? !!lot.hasK1 : !!(s.lots && s.lots[0] && s.lots[0].hasK1);
    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">
          ${lot?'Lot has arrived':'New lot arrived'}</div>
        <div class="meta">${escapeHtml(s.customer||'')}</div>
      </div>
      <div class="field"><label>Flight it came on</label>
        <input class="mono" id="ar-flight" value="${escapeHtml(lot&&lot.flight||s.flight||'')}" placeholder="e.g. CX9711"></div>
      <div class="field"><label>Pieces that actually landed</label>
        <input type="number" min="0" id="ar-qty" value="${escapeHtml(defaultQty)}" placeholder="e.g. 18"></div>
      ${lot&&lot.pcsExpected?`<div style="margin:-8px 16px 14px;font-size:11.5px;color:var(--muted);">of ${lot.pcsExpected} expected</div>`:''}
      <div style="margin:0 16px 14px;font-size:12px;color:var(--muted);line-height:1.6;">
        This lot starts its own clearance from here.${lot?'':' It will follow the same K1 status as the shipment.'}
        It goes through ${hasK1?'Examine and Pay duty':'Screening'}${hasK1?' (K1)':' (no K1)'}.
      </div>
      <div class="msg" id="ar-msg"></div>
      <button class="advance" id="ar-go">Record arrival</button>`;
    document.getElementById('bk').onclick = () => renderImportDetail(s);
    document.getElementById('ar-go').onclick = async function(){
      const flight = document.getElementById('ar-flight').value.trim();
      const qtyVal = document.getElementById('ar-qty').value.trim();
      const qty = qtyVal ? parseInt(qtyVal,10) : 0;
      const msg = document.getElementById('ar-msg');
      if(!qtyVal || isNaN(qty) || qty <= 0){ msg.style.color='var(--red)'; msg.textContent='Enter how many pieces arrived.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      const now = new Date().toISOString();
      if(lot){
        // On the K1 path "Arrived" is the fourth step, not the first.
        lot.hasArrived = true; lot.stage = arrivedIdx(importSteps(lot)); lot.pcsArrived = qty;
        lot.flight = flight || lot.flight || null;
        lot.arrivedAt = now; lot.stageAt = now; lot.chasedDate = null;
        const idx = s.lots.indexOf(lot);
        const label = s.lots.length>1 ? `Lot ${idx+1}: ` : '';
        logActivity(s, `${label}Arrived — ${qty} pcs${lot.hasK1?' (K1)':''}`);
      } else {
        s.lots = s.lots || [];
        s.lots.push({ id: uid(), hasArrived:true, hasK1,
          stage: arrivedIdx(hasK1 ? IMPORT_STEPS_K1 : IMPORT_STEPS_NOK1), pcsArrived: qty, flight: flight||null,
          arrivedAt: now, stageAt: now, deliveries: [], closed:false, chasedDate:null });
        logActivity(s, `Lot ${s.lots.length}: Arrived — ${qty} pcs${hasK1?' (K1)':''}`);
      }
      await saveShipment(s);
      renderImportDetail(s);
    };
  }

  // ---- record a delivery ----
  function renderRecordDelivery(s, li){
    const c = document.getElementById('content');
    const lot = s.lots[li];
    const steps = importSteps(lot);
    const enteringDelivery = lot.stage < deliveryIdx(steps);
    // A lot closed short can still take deliveries — this is the run that
    // clears what was left behind. The lot stays closed; only the shortfall
    // moves.
