<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exprexa Forwarding</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --ink-2:#1B2747; --paper:#EEF1F6; --card:#FFFFFF;
    --amber:#F2A93B; --amber-dk:#C97F12; --green:#1F9D6B; --red:#D64545;
    --line:#DCE1EA; --text:#1B2333; --muted:#6B748C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);
    font-family:Inter,-apple-system,Segoe UI,sans-serif;font-size:15px;}
  .app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--paper);
    display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---- shell ---- */
  .topbar{background:var(--ink);color:#fff;padding:14px 16px 0;}
  .topbar-top{display:flex;justify-content:space-between;align-items:center;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;}
  .brand .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--amber);
    letter-spacing:.08em;border:1px solid rgba(242,169,59,.5);padding:1px 6px;
    border-radius:4px;margin-left:7px;vertical-align:2px;}
  .who{font-size:11.5px;color:#9FAAC6;display:flex;align-items:center;gap:6px;cursor:pointer;}
  .lvl-badge{font-size:8.5px;font-weight:700;letter-spacing:.4px;padding:1px 6px;
    border-radius:4px;background:rgba(255,255,255,.14);color:#CDD6E8;}
  .tabs{display:flex;background:var(--ink-2);padding:0 4px;margin-top:12px;overflow-x:auto;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{padding:11px 13px;font-size:12.5px;font-weight:600;color:#9FAAC6;cursor:pointer;
    border-bottom:2.5px solid transparent;white-space:nowrap;position:relative;flex:0 0 auto;}
  .tab.on{color:#fff;border-bottom-color:var(--amber);}
  .tab .bdg{position:absolute;top:5px;right:1px;background:var(--red);color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;min-width:15px;
    height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    padding:0 3px;}
  .content{flex:1;padding-bottom:40px;}

  /* ---- board ---- */
  .counts{display:flex;gap:20px;padding:14px 16px 15px;background:var(--ink);color:#fff;}
  .count .n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:25px;line-height:1;}
  .count .n.warn{color:var(--amber);}
  .count .l{font-size:10px;color:#9FAAC6;margin-top:4px;}
  .filters{display:flex;background:var(--ink-2);padding:0 6px;overflow-x:auto;}
  .filters::-webkit-scrollbar{display:none;}
  .filters span{padding:10px 12px;font-size:12px;font-weight:600;color:#9FAAC6;
    white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;}
  .filters span.on{color:#fff;border-bottom-color:var(--amber);}

  .row{background:var(--card);padding:13px 16px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .row:active{background:#F7F9FC;}
  .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:9px;}
  .awb{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--ink);}
  .kind{font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:4px;
    vertical-align:2px;margin-left:6px;}
  .kind.exp{background:rgba(20,33,61,.09);color:var(--ink);}
  .kind.imp{background:rgba(242,169,59,.20);color:var(--amber-dk);}
  .lots-tag{font-size:9px;font-weight:700;color:var(--amber-dk);
    background:rgba(242,169,59,.18);padding:2px 6px;border-radius:4px;margin-left:6px;}
  .route{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;}
  .pips{display:flex;align-items:center;margin:10px 0 8px;}
  .pip{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .pip.done{background:var(--ink);} .pip.now{background:var(--amber);
    box-shadow:0 0 0 3.5px rgba(242,169,59,.22);} .pip.todo{background:#CDD5E2;}
  .link3{height:2px;flex:1;background:#CDD5E2;} .link3.done{background:var(--ink);}
  .qbar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:10px 0 8px;background:#CDD5E2;}
  .qseg{height:100%;} .qseg.done{background:var(--ink);} .qseg.mid{background:var(--amber);}
  .qseg.stuck{background:var(--red);} .qseg.wait{background:#B9C2D6;}
  .row-bot{display:flex;justify-content:space-between;align-items:center;gap:9px;}
  .lead{font-size:13px;font-weight:600;color:var(--ink);}
  .party{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .age{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;
    padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .age.ok{background:rgba(31,157,107,.12);color:var(--green);}
  .age.warn{background:rgba(242,169,59,.20);color:var(--amber-dk);}
  .age.bad{background:rgba(214,69,69,.13);color:var(--red);}
  .age.mut{background:#EEF1F6;color:var(--muted);}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

  /* ---- detail ---- */
  .back{padding:13px 16px;background:var(--ink);color:#9FAAC6;font-size:13px;cursor:pointer;}
  .head{background:var(--ink);color:#fff;padding:0 16px 18px;}
  .head .awb-lg{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;padding-top:2px;}
  .head .meta{font-size:12px;color:#9FAAC6;margin-top:6px;line-height:1.6;}
  .head .tally{display:flex;gap:20px;margin-top:13px;flex-wrap:wrap;}
  .head .tally div{font-size:10.5px;color:#9FAAC6;}
  .head .tally b{display:block;font-family:'IBM Plex Mono',monospace;font-size:18px;
    color:#fff;font-weight:600;line-height:1.25;}
  .head .tally b.amb{color:var(--amber);}
  .linkrow{display:flex;gap:8px;margin-top:14px;}
  .linkbtn{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    color:#fff;border-radius:8px;padding:9px;font-size:11.5px;font-weight:600;text-align:center;}

  .sect{font-size:11px;font-weight:700;color:var(--muted);margin:18px 16px 8px;
    letter-spacing:.03em;display:flex;justify-content:space-between;}
  .card{background:var(--card);margin:0 12px 12px;border-radius:12px;padding:14px 15px;}

  .lot{background:var(--card);margin:0 12px 12px;border-radius:12px;overflow:hidden;
    border-top:3px solid var(--ink);}
  .lot.wait{border-top-color:#B9C2D6;}
  .lot-hd{padding:12px 14px 0;display:flex;justify-content:space-between;align-items:baseline;}
  .lot-qty{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;color:var(--ink);}
  .lot-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;}
  .lot-tag.here{background:rgba(20,33,61,.09);color:var(--ink);}
  .lot-tag.w{background:#E7EBF3;color:var(--muted);}
  .lot-tag.done{background:rgba(31,157,107,.12);color:var(--green);}
  .lot-when{padding:3px 14px 0;font-size:11px;color:var(--muted);}
  .steps{display:flex;align-items:center;padding:12px 13px 4px;overflow-x:auto;}
  .st{flex:0 0 auto;text-align:center;}
  .st .d{width:9px;height:9px;border-radius:50%;margin:0 auto;}
  .st .d.done{background:var(--ink);} .st .d.now{background:var(--amber);
    box-shadow:0 0 0 3.5px rgba(242,169,59,.22);} .st .d.todo{background:#CDD5E2;}
  .st .lbl{font-size:7.5px;color:var(--muted);margin-top:4px;white-space:nowrap;}
  .st .lbl.on{color:var(--ink);font-weight:700;}
  .jn{height:2px;width:14px;background:#CDD5E2;margin-bottom:13px;flex:0 0 auto;} .jn.done{background:var(--ink);}
  .lot-now{padding:8px 14px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .lot-now .s{font-size:13.5px;font-weight:600;color:var(--ink);}
  .lot-now .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:1px;}
  .lot-act{display:block;width:100%;padding:14px;border:none;background:var(--amber);
    color:var(--ink);font:700 14px 'Space Grotesk',sans-serif;cursor:pointer;
    border-top:1px solid rgba(20,33,61,.08);}
  .lot-act.ghost{background:#F2F5F9;color:var(--ink);}
  .lot-act.mut{background:#F2F5F9;color:var(--muted);}

  .run{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
  .run:last-child{border-bottom:none;}
  .run .qty{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;
    color:var(--ink);width:52px;flex:0 0 auto;}
  .run .who{font-size:13px;font-weight:600;color:var(--ink);}
  .run .when{font-size:11px;color:var(--muted);margin-top:1px;}
  .run .lorry{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);
    background:var(--paper);padding:2px 7px;border-radius:4px;display:inline-block;margin-top:3px;}

  .addlot{display:block;width:calc(100% - 24px);margin:0 12px 14px;padding:12px;
    background:transparent;border:1.5px dashed #B9C2D6;border-radius:12px;
    color:var(--muted);font:600 12.5px Inter,sans-serif;cursor:pointer;text-align:center;}

  .advance{display:block;width:calc(100% - 24px);margin:0 12px 12px;padding:15px;
    background:var(--ink);color:#fff;border:none;border-radius:12px;
    font:700 15px 'Space Grotesk',sans-serif;cursor:pointer;text-align:center;}
  .advance small{display:block;font:500 10.5px Inter,sans-serif;color:#9FAAC6;margin-bottom:3px;}
  .advance.finish{background:var(--green);}

  .viewer-strip{margin:0 12px 14px;padding:12px 14px;border-radius:10px;background:#E7EBF3;
    border:1px dashed #B9C2D6;font-size:12px;color:var(--muted);line-height:1.6;}
  .viewer-strip b{color:var(--ink);}

  .noteline{background:#FFF8EC;border-left:3px solid var(--amber);padding:10px 12px;
    border-radius:0 8px 8px 0;font-size:13px;margin-bottom:8px;}
  .noteline:last-child{margin-bottom:0;}
  .noteline .who{font-size:11px;color:var(--muted);margin-top:4px;}
  .addnote{display:flex;gap:8px;margin-top:10px;}
  .addnote input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;}
  .addnote button{background:var(--ink);color:#fff;border:none;border-radius:8px;
    padding:0 14px;font-weight:600;font-size:12.5px;}

  /* ---- forms / picker ---- */
  .field{margin:0 16px 14px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
  .field input,.field select{width:100%;background:#fff;border:1.5px solid var(--line);
    border-radius:9px;padding:11px 12px;font-size:14.5px;color:var(--text);}
  .field input.mono{font-family:'IBM Plex Mono',monospace;}
  .seg{display:flex;gap:6px;margin:0 16px 16px;}
  .seg div{flex:1;text-align:center;padding:11px 0;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .seg div.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .picker{background:var(--card);margin:12px;border-radius:12px;padding:16px;}
  .picker .plbl{font-size:11px;color:var(--muted);margin-bottom:8px;}
  .qctl{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 4px;}
  .qctl button{width:44px;height:44px;border-radius:11px;border:1.5px solid var(--line);
    background:#fff;font-size:20px;color:var(--ink);cursor:pointer;line-height:1;}
  .qctl .val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;
    color:var(--ink);min-width:64px;text-align:center;}
  .qof{text-align:center;font-size:12px;color:var(--muted);}
  .chips{display:flex;gap:7px;flex-wrap:wrap;}
  .chips span{padding:8px 13px;border-radius:9px;border:1.5px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;cursor:pointer;}
  .chips span.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chips span.mono{font-family:'IBM Plex Mono',monospace;}
  .msg{margin:8px 16px 0;font-size:12.5px;}

  /* ---- alerts ---- */
  .grp{font-size:10.5px;font-weight:700;color:var(--muted);margin:16px 16px 7px;
    display:flex;justify-content:space-between;align-items:baseline;}
  .grp .c{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);}
  .al{background:var(--card);margin:0 12px 8px;border-radius:12px;overflow:hidden;
    border-left:4px solid var(--line);}
  .al.red{border-left-color:var(--red);} .al.amb{border-left-color:var(--amber);}
  .al.gry{border-left-color:#B9C2D6;}
  .al-body{padding:12px 14px;cursor:pointer;}
  .al-top{display:flex;justify-content:space-between;gap:9px;}
  .al-what{font-size:14px;font-weight:600;color:var(--ink);line-height:1.35;}
  .al-age{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .al-age.red{color:var(--red);} .al-age.amb{color:var(--amber-dk);}
  .al-who{font-size:12px;color:var(--muted);margin-top:4px;}
  .al-acts{display:flex;border-top:1px solid var(--line);}
  .al-acts button{flex:1;padding:10px;border:none;background:transparent;
    font:600 12.5px Inter,sans-serif;color:var(--ink);cursor:pointer;}
  .al-acts button+button{border-left:1px solid var(--line);color:var(--muted);}
  .quiet{margin:14px 12px;padding:28px 18px;background:var(--card);border-radius:12px;text-align:center;}
  .quiet .big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:var(--green);}
  .quiet .sm{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6;}

  /* ---- access ---- */
  .person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .person:last-child{border-bottom:none;}
  .person .nm{flex:1;}
  .person .n{font-size:14px;font-weight:600;color:var(--ink);}
  .person .r{font-size:11px;color:var(--muted);margin-top:1px;}
  .segp{display:flex;gap:4px;flex:0 0 auto;}
  .segp span{font-size:10.5px;font-weight:700;padding:6px 8px;border-radius:6px;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;}
  .segp span.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .segp span.on.amb{background:var(--amber);border-color:var(--amber);color:var(--ink);}
  .segp span.on.off{background:#E7EBF3;border-color:#C9D2E2;color:var(--muted);}

  .fab{position:fixed;bottom:22px;left:50%;transform:translateX(calc(-50% + 190px));
    width:52px;height:52px;border-radius:50%;background:var(--amber);color:var(--ink);
    border:none;font-size:26px;font-weight:700;box-shadow:0 8px 20px rgba(20,33,61,.25);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;}
  @media (max-width:460px){ .fab{ left:auto; right:18px; transform:none; } }

  .loginwrap{padding:60px 24px 0;text-align:center;}
  .loginwrap h1{font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--ink);margin:14px 0 4px;}
  .loginwrap p{color:var(--muted);font-size:13px;margin:0 0 26px;}
  .searchbox{margin:0 4px;}
  .searchbox input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;text-align:center;}
  .namehit{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;
    margin-top:8px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;}
  .namehit:hover{background:#F7F9FC;}
  .banner{margin:16px;padding:14px;border-radius:10px;font-size:13px;line-height:1.6;}
  .banner-err{background:#FCE9E9;color:#8A2E2E;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  'use strict';

  // ============================================================
  // Firebase — same project as EXPREXA ATTENDANCE, so worker IDs
  // and passwords are shared rather than duplicated. This app only
  // reads epx_workers; it never writes to it. Its own data lives in
  // fwd_ prefixed collections so nothing here can collide with the
  // attendance app's records.
  // ============================================================
  // Paste your own project's config here (Firebase console → Project settings →
  // Your apps → SDK setup and configuration). This app keeps its own Firebase
  // project — separate from EXPREXA ATTENDANCE and EXPREXA PERFORMANCE — with
  // its own worker records, set up the first time someone opens it.
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyD81njdDRg1VMFtga2ouoOM0NqLPaI_4l8",
    authDomain: "forwarding-tracker.firebaseapp.com",
    projectId: "forwarding-tracker",
    storageBucket: "forwarding-tracker.firebasestorage.app",
    messagingSenderId: "733118809749",
    appId: "1:733118809749:web:0cf0f81f37874043f4fd9c"
  };
  const FIREBASE_READY = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PASTE_') !== 0);
  let db = null;
  if(FIREBASE_READY){
    firebase.initializeApp(FIREBASE_CONFIG, 'forwarding');
    db = firebase.app('forwarding').firestore();
  }

  const SHIP = 'fwd_shipments';
  const CONFIG = 'fwd_config';

  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function uid(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function ageStr(fromIso){
    const ms = Date.now() - new Date(fromIso).getTime();
    if(ms < 0) return '0h';
    const h = Math.floor(ms/3600000);
    if(h < 24) return h+'h';
    const d = Math.floor(h/24), rh = h%24;
    return d+'d'+(rh?' '+rh+'h':'');
  }
  function ageHours(fromIso){ return (Date.now() - new Date(fromIso).getTime())/3600000; }

  // ---- worker records — this app's own, not shared with the other two ----
  const WORKERS = 'fwd_workers';
  let _workerCache = null;
  function invalidateWorkerCache(){ _workerCache = null; }
  async function getWorkers(){
    if(_workerCache) return _workerCache;
    const snap = await db.collection(WORKERS).get();
    _workerCache = snap.docs.map(d => d.data());
    return _workerCache;
  }
  async function saveWorker(w){
    await db.collection(WORKERS).doc(w.id).set(w);
    invalidateWorkerCache();
  }
  async function deleteWorker(id){
    await db.collection(WORKERS).doc(id).delete();
    invalidateWorkerCache();
    const ref = db.collection(CONFIG).doc('access');
    await db.runTransaction(async tx=>{
      const doc = await tx.get(ref);
      const v = doc.exists ? (doc.data().value || {}) : {};
      delete v[id];
      tx.set(ref, { value: v });
    });
  }

  // ---- access map: who can view/edit in THIS app ----
  async function getAccessMap(){
    const doc = await db.collection(CONFIG).doc('access').get();
    return doc.exists ? (doc.data().value || {}) : {};
  }
  async function setAccessFor(workerId, level){
    const ref = db.collection(CONFIG).doc('access');
    await db.runTransaction(async tx=>{
      const doc = await tx.get(ref);
      const v = doc.exists ? (doc.data().value || {}) : {};
      if(level === 'off') delete v[workerId]; else v[workerId] = level;
      tx.set(ref, { value: v });
    });
  }

  // ---- shipments ----
  async function getOpenShipments(){
    const snap = await db.collection(SHIP).where('closed','==', false).get();
    return snap.docs.map(d => d.data());
  }
  async function getClosedTodayCount(){
    try{
      const snap = await db.collection(SHIP).where('closedDate','==', todayStr()).get();
      return snap.size;
    }catch(e){ return 0; }
  }
  async function saveShipment(s){
    await db.collection(SHIP).doc(s.id).set(s);
  }

  // ============================================================
  // Stage definitions
  // ============================================================
  const EXPORT_STEPS = ['Booked','Docs in','K2 cleared','Docs released'];
  const IMPORT_STEPS = ['Pre-alert','Arrived','Docs in','K1 cleared','Duty paid','Released','Delivered'];

  // Threshold in hours before a stage counts as "stuck". Admin-tunable later;
  // fixed here for v1. Keyed by type + step index.
  const THRESH = {
    exp: [48, 12, 24, 6],           // Booked, Docs in, K2 cleared, Docs released
    imp: [48, 12, 24, 6, 12, 8, 24] // Pre-alert(overdue), Arrived, Docs in, K1, Duty, Released, Delivered(unused)
  };
  const CHASE_QUIET_DAYS = 1; // an alert chased today stays quiet until this many days pass

  function ageLevel(hours, threshold){
    if(hours >= threshold) return 'bad';
    if(hours >= threshold * 0.6) return 'warn';
    return 'ok';
  }

  // ============================================================
  // External tracking links
  // ============================================================
  function cargoLink(awb){
    const m = String(awb||'').match(/^(\d{3})-?(\d+)$/);
    if(!m) return null;
    const prefix = m[1], num = m[2];
    if(prefix === '232'){
      return { label:'Track on MASkargo', direct:true,
        url:`https://www.maskargo.com/en/shipment-tracking.html?prefixNumber=232&awbNumber=${num}` };
    }
    if(prefix === '807'){
      return { label:'Copy AWB & open AirAsia', direct:false, copy:`${prefix}${num}`,
        url:'https://airasia.smartkargo.com/FrmAWBTracking.aspx' };
    }
    return null;
  }
  function flightLink(flightNo){
    if(!flightNo) return null;
    return `https://www.flightaware.com/live/flight/${encodeURIComponent(flightNo.trim())}`;
  }

  // ============================================================
  // Session
  // ============================================================
  let ME = null;        // { id, name }
  let MY_LEVEL = 'off';
  let CAN_EDIT = false;
  let IS_ADMIN = false;

  function restoreSession(){
    try{
      const raw = sessionStorage.getItem('fwd_session');
      if(raw) ME = JSON.parse(raw);
    }catch(e){}
  }
  function saveSession(){
    sessionStorage.setItem('fwd_session', JSON.stringify(ME));
  }
  function logout(){
    sessionStorage.removeItem('fwd_session');
    ME = null; MY_LEVEL='off'; CAN_EDIT=false; IS_ADMIN=false;
    renderLogin();
  }

  // ============================================================
  // Root render
  // ============================================================
  const root = document.getElementById('app');
  let STATE = { tab:'board', filter:'all', shipments:[], access:{}, workers:[], detailId:null };

  async function boot(){
    if(!FIREBASE_READY){ renderSetupNeeded(); return; }
    restoreSession();
    if(!ME){
      const workers = await getWorkers();
      if(workers.length === 0){ renderBootstrapAdmin(); return; }
      renderLogin();
      return;
    }
    await loadAccessAndGo();
  }

  function renderSetupNeeded(){
    root.innerHTML = `
      <div class="loginwrap">
        <h1>Not connected yet</h1>
        <p style="text-align:left;line-height:1.7;">This app needs its own Firebase project.
          Create one at <b>console.firebase.google.com</b>, add a Firestore database
          (production mode), then open <b>Project settings → Your apps → Web app</b> and
          copy the config into <code>FIREBASE_CONFIG</code> near the top of this file's
          script, replacing the <code>PASTE_</code> placeholders.</p>
        <p style="text-align:left;">Once that's done, reload this page — the first person
          to open it will be prompted to set themselves up as the admin.</p>
      </div>`;
  }

  function renderBootstrapAdmin(){
    root.innerHTML = `
      <div class="loginwrap">
        <h1>Set up the first admin</h1>
        <p>No worker IDs exist yet in this project. Create yours — you'll get admin
          access automatically, and can add everyone else from the Worker IDs tab.</p>
        <div class="field" style="text-align:left;"><label>Your name</label>
          <input id="bs-name" placeholder="Full name"></div>
        <div class="field" style="text-align:left;"><label>Choose a password</label>
          <input id="bs-pass" type="password" placeholder="At least 4 characters"></div>
        <div class="msg" id="bs-msg" style="text-align:center;"></div>
        <button class="advance" id="bs-go" style="max-width:300px;margin:6px auto 0;">Create admin &amp; sign in</button>
      </div>`;
    document.getElementById('bs-go').onclick = async function(){
      const name = document.getElementById('bs-name').value.trim();
      const pass = document.getElementById('bs-pass').value;
      const msg = document.getElementById('bs-msg');
      if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter your name.'; return; }
      if(!pass || pass.length < 4){ msg.style.color='var(--red)'; msg.textContent='Password needs at least 4 characters.'; return; }
      this.disabled = true; this.textContent = 'Creating…';
      const id = uid();
      const passwordHash = await sha256Hex(pass);
      await saveWorker({ id, name, passwordHash, createdAt: new Date().toISOString() });
      await setAccessFor(id, 'admin');
      ME = { id, name };
      saveSession();
      await loadAccessAndGo();
    };
  }

  async function loadAccessAndGo(){
    root.innerHTML = `<div class="loginwrap"><p>Loading…</p></div>`;
    const access = await getAccessMap();
    MY_LEVEL = access[ME.id] || 'off';
    CAN_EDIT = MY_LEVEL === 'edit' || MY_LEVEL === 'admin';
    IS_ADMIN = MY_LEVEL === 'admin';
    STATE.access = access;
    if(MY_LEVEL === 'off'){ renderNoAccess(); return; }
    await renderShell();
  }

  // ============================================================
  // Login — same worker records, same password, as attendance
  // ============================================================
  function renderLogin(){
    root.innerHTML = `
      <div class="loginwrap">
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
          color:var(--ink);letter-spacing:.08em;">EXPREXA</div>
        <h1>Forwarding</h1>
        <p>Sign in with your worker name and password</p>
        <div class="searchbox">
          <input type="text" id="lg-name" placeholder="Start typing your name" autocomplete="off">
          <div id="lg-hits"></div>
        </div>
      </div>`;
    const input = document.getElementById('lg-name');
    const hits = document.getElementById('lg-hits');
    input.oninput = async () => {
      const q = input.value.trim().toLowerCase();
      hits.innerHTML = '';
      if(q.length < 2) return;
      const workers = await getWorkers();
      workers.filter(w => w.name && w.name.toLowerCase().includes(q)).slice(0,6).forEach(w=>{
        const el = document.createElement('div');
        el.className = 'namehit';
        el.textContent = w.name;
        el.onclick = () => renderPassword(w);
        hits.appendChild(el);
      });
    };
    input.focus();
  }

  function renderPassword(w){
    root.innerHTML = `
      <div class="loginwrap">
        <h1>${escapeHtml(w.name)}</h1>
        <p>Enter your password</p>
        <div class="searchbox">
          <input type="password" id="lg-pass" placeholder="Password" autocomplete="off">
        </div>
        <div class="msg" id="lg-msg" style="text-align:center;"></div>
        <button class="advance" id="lg-go" style="max-width:300px;margin:16px auto 0;">Sign in</button>
        <div style="margin-top:14px;"><span style="color:var(--muted);font-size:12.5px;
          cursor:pointer;" id="lg-back">&larr; Not you?</span></div>
      </div>`;
    document.getElementById('lg-back').onclick = renderLogin;
    const pass = document.getElementById('lg-pass');
    const msg = document.getElementById('lg-msg');
    const go = document.getElementById('lg-go');
    async function doLogin(){
      const p = pass.value;
      if(!p){ msg.style.color='var(--red)'; msg.textContent='Enter your password.'; return; }
      go.disabled = true; go.textContent = 'Checking…';
      const hash = await sha256Hex(p);
      if(hash === w.passwordHash){
        ME = { id: w.id, name: w.name };
        saveSession();
        await loadAccessAndGo();
      } else {
        go.disabled = false; go.textContent = 'Sign in';
        msg.style.color = 'var(--red)'; msg.textContent = 'Incorrect password.';
      }
    }
    go.onclick = doLogin;
    pass.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
    pass.focus();
  }

  function renderNoAccess(){
    root.innerHTML = `
      <div class="loginwrap">
        <h1>Not set up yet</h1>
        <p>Signed in as <b style="color:var(--ink);">${escapeHtml(ME.name)}</b>, but you don't
          have access to the forwarding board yet.</p>
        <div class="banner banner-err" style="text-align:left;">
          Ask an admin to give you View or Edit access from the <b>Access</b> tab.
        </div>
        <div style="margin-top:14px;"><span style="color:var(--muted);font-size:12.5px;
          cursor:pointer;" id="na-out">Sign out</span></div>
      </div>`;
    document.getElementById('na-out').onclick = logout;
  }

  // ============================================================
  // Shell + tabs
  // ============================================================
  async function renderShell(){
    STATE.shipments = await getOpenShipments();
    STATE.detailId = null;
    STATE.tab = 'board';
    paintShell();
  }

  function alertList(){
    const groups = { stuck:[], balance:[], deliver:[], missing:[] };
    const today = todayStr();
    STATE.shipments.forEach(s=>{
      if(s.type === 'export'){
        const chased = s.chasedDate === today;
        const h = ageHours(s.stageAt);
        const thr = THRESH.exp[s.stage] || 24;
        if(!chased && h >= thr && s.stage < EXPORT_STEPS.length-1){
          groups.stuck.push({ s, lot:null, what:`${EXPORT_STEPS[s.stage]}, no movement`,
            age: ageStr(s.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
            chaseKey: s.id });
        }
        if(!s.pcs && !s.kg && ageHours(s.createdAt) >= 48){
          groups.missing.push({ s, lot:null, what:'No piece count or weight',
            age: ageStr(s.createdAt), level:'gry', chaseKey: null });
        }
      } else {
        (s.lots||[]).forEach((lot,li)=>{
          if(lot.closed) return;
          const chased = lot.chasedDate === today;
          const h = ageHours(lot.stageAt);
          const thr = THRESH.imp[lot.stage] || 24;
          if(lot.stage === 0){
            // not yet arrived — flag only once its expected date has passed
            if(lot.expectedDate && lot.expectedDate < today && !chased){
              groups.balance.push({ s, lot, li, what:`${lot.pcsExpected||'?'} pcs not yet arrived`,
                age:'overdue', level:'amb', chaseKey: s.id+'|'+li });
            }
          } else if(lot.stage === 5){
            // released, nothing delivered yet, or partially delivered with a balance
            const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
            const remaining = (lot.pcsArrived||0) - delivered;
            if(remaining > 0 && !chased){
              groups.deliver.push({ s, lot, li,
                what: delivered>0 ? `${remaining} pcs balance, not yet sent`
                                   : `${remaining} pcs, nobody assigned`,
                age: ageStr(lot.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
                chaseKey: s.id+'|'+li });
            }
          } else if(lot.stage < 6 && !chased && h >= thr){
            groups.stuck.push({ s, lot, li, what:`${IMPORT_STEPS[lot.stage]}, no movement`,
              age: ageStr(lot.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
              chaseKey: s.id+'|'+li });
          }
        });
        if(!s.pcs && !s.kg && (s.lots||[]).every(l=>!l.pcsArrived) && ageHours(s.createdAt) >= 48){
          groups.missing.push({ s, lot:null, what:'No piece count or weight',
            age: ageStr(s.createdAt), level:'gry', chaseKey:null });
        }
      }
    });
    return groups;
  }

  function paintShell(){
    const groups = alertList();
    const alertCount = groups.stuck.length + groups.balance.length + groups.deliver.length + groups.missing.length;
    const toDeliver = STATE.shipments.filter(s => s.type==='import' &&
      (s.lots||[]).some(l=>!l.closed && l.stage===5)).length;
    const needChasing = groups.stuck.length + groups.balance.length + groups.deliver.length;

    root.innerHTML = `
      <div class="topbar">
        <div class="topbar-top">
          <div class="brand">Forwarding<span class="tag">${IS_ADMIN?'ADMIN':CAN_EDIT?'EDIT':'VIEW'}</span></div>
          <div class="who" id="who-btn">${escapeHtml(ME.name)} <span class="lvl-badge">${MY_LEVEL.toUpperCase()}</span></div>
        </div>
        <div class="tabs">
          <span class="tab ${STATE.tab==='board'?'on':''}" data-tab="board">Board</span>
          <span class="tab ${STATE.tab==='alerts'?'on':''}" data-tab="alerts">Alerts
            ${alertCount?`<span class="bdg">${alertCount}</span>`:''}</span>
          ${IS_ADMIN?`<span class="tab ${STATE.tab==='workers'?'on':''}" data-tab="workers">Worker IDs</span>`:''}
          ${IS_ADMIN?`<span class="tab ${STATE.tab==='access'?'on':''}" data-tab="access">Access</span>`:''}
        </div>
      </div>
      <div class="content" id="content"></div>
      ${CAN_EDIT ? `<button class="fab" id="fab-new">+</button>` : ''}
    `;
    document.getElementById('who-btn').onclick = () => {
      if(confirm('Sign out of the Forwarding board?')) logout();
    };
    document.querySelectorAll('.tab').forEach(t=> t.onclick = () => { STATE.tab = t.dataset.tab; paintShell(); });
    if(CAN_EDIT) document.getElementById('fab-new').onclick = renderNewShipment;

    const c = document.getElementById('content');
    if(STATE.tab === 'board') paintBoard(c, toDeliver, needChasing);
    else if(STATE.tab === 'alerts') paintAlerts(c, groups);
    else if(STATE.tab === 'workers') paintWorkers(c);
    else if(STATE.tab === 'access') paintAccess(c);
  }

  // ============================================================
  // Board
  // ============================================================
  function paintBoard(c, toDeliver, needChasing){
    let list = STATE.shipments.slice();
    if(STATE.filter === 'export') list = list.filter(s=>s.type==='export');
    else if(STATE.filter === 'import') list = list.filter(s=>s.type==='import');
    else if(STATE.filter === 'deliver') list = list.filter(s=>s.type==='import' &&
      (s.lots||[]).some(l=>!l.closed && l.stage===5));
    else if(STATE.filter === 'split') list = list.filter(s=> (s.lots||[]).length > 1);

    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n">${STATE.shipments.length}</div><div class="l">open</div></div>
        <div class="count"><div class="n warn">${needChasing}</div><div class="l">need chasing</div></div>
        <div class="count"><div class="n warn">${toDeliver}</div><div class="l">to deliver</div></div>
      </div>
      <div class="filters">
        <span class="${STATE.filter==='all'?'on':''}" data-f="all">All</span>
        <span class="${STATE.filter==='export'?'on':''}" data-f="export">Export</span>
        <span class="${STATE.filter==='import'?'on':''}" data-f="import">Import</span>
        <span class="${STATE.filter==='deliver'?'on':''}" data-f="deliver">To deliver</span>
        <span class="${STATE.filter==='split'?'on':''}" data-f="split">Split lots</span>
      </div>
      <div id="rows">
        ${list.length ? list.map(boardRowHtml).join('') :
          `<div class="empty">Nothing here.${CAN_EDIT?' Tap + to add a shipment.':''}</div>`}
      </div>`;
    c.querySelectorAll('.filters span').forEach(el=> el.onclick = ()=>{ STATE.filter = el.dataset.f; paintShell(); });
    c.querySelectorAll('[data-open]').forEach(el=> el.onclick = ()=> renderDetail(el.dataset.open));
  }

  function summarise(s){
    if(s.type === 'export'){
      const total = EXPORT_STEPS.length - 1;
      let pips = '<div class="pips">';
      for(let i=0;i<EXPORT_STEPS.length;i++){
        pips += `<div class="pip ${i<s.stage?'done':i===s.stage?'now':'todo'}"></div>`;
        if(i<EXPORT_STEPS.length-1) pips += `<div class="link3 ${i<s.stage?'done':''}"></div>`;
      }
      pips += '</div>';
      const h = ageHours(s.stageAt);
      const thr = THRESH.exp[s.stage] || 24;
      const lvl = s.stage >= total ? 'ok' : ageLevel(h, thr);
      return { body: pips, lead: EXPORT_STEPS[s.stage], age: ageStr(s.stageAt),
        ageClass: s.stage>=total?'ok':(lvl==='bad'?'bad':lvl==='warn'?'warn':'ok') };
    }
    const lots = s.lots || [];
    const segs = lots.map(l=>{
      if(l.closed) return {w:1,c:'done'};
      if(l.stage===0) return {w:1,c:'wait'};
      const h = ageHours(l.stageAt), thr = THRESH.imp[l.stage]||24;
      return {w:1, c: h>=thr ? 'stuck':'mid'};
    });
    const totalW = segs.length || 1;
    const bar = '<div class="qbar">'+segs.map(x=>`<div class="qseg ${x.c}" style="width:${100/totalW}%"></div>`).join('')+'</div>';
    // headline
    const openLots = lots.filter(l=>!l.closed);
    let lead;
    if(openLots.length === 0) lead = 'All lots delivered';
    else {
      const parts = openLots.map(l=>{
        if(l.stage===0) return `${l.pcsExpected||'?'} not arrived`;
        if(l.stage===5){
          const del = (l.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
          const rem = (l.pcsArrived||0)-del;
          return del>0 ? `${del} delivered, ${rem} to go` : `${l.pcsArrived} released`;
        }
        return `${l.pcsArrived||l.pcsExpected||'?'} at ${IMPORT_STEPS[l.stage]}`;
      });
      lead = parts.join(', ');
    }
    // worst age
    let worstH = -1, worstLvl = 'ok', worstAge = '';
    openLots.forEach(l=>{
      if(l.stage===0) return;
      const h = ageHours(l.stageAt), thr = THRESH.imp[l.stage]||24;
      if(h > worstH){ worstH = h; worstAge = ageStr(l.stageAt);
        worstLvl = h>=thr?'bad':h>=thr*0.6?'warn':'ok'; }
    });
    if(worstH < 0){ worstAge = ageStr(s.createdAt); worstLvl='ok'; }
    return { body: bar, lead, age: worstAge, ageClass: worstLvl };
  }

  function boardRowHtml(s){
    const sum = summarise(s);
    const lotsTag = s.type==='import' && (s.lots||[]).length>1 ? `<span class="lots-tag">${s.lots.length} LOTS</span>` : '';
    return `
      <div class="row" data-open="${s.id}">
        <div class="row-top">
          <span class="awb">${escapeHtml(s.awb)}<span class="kind ${s.type==='export'?'exp':'imp'}">${s.type==='export'?'EXP':'IMP'}</span>${lotsTag}</span>
          <span class="route">${escapeHtml(s.from||'')}&rarr;${escapeHtml(s.to||'')}</span>
        </div>
        ${sum.body}
        <div class="row-bot">
          <div><div class="lead">${escapeHtml(sum.lead)}</div><div class="party">${escapeHtml(s.customer||'')}</div></div>
          <span class="age ${sum.ageClass}">${sum.age}</span>
        </div>
      </div>`;
  }

  // ============================================================
  // Detail — export
  // ============================================================
  function renderDetail(id){
    const s = STATE.shipments.find(x=>x.id===id);
    if(!s) return;
    STATE.detailId = id;
    if(s.type === 'export') renderExportDetail(s); else renderImportDetail(s);
  }

  function trackLinksHtml(s){
    const cl = cargoLink(s.awb);
    const fl = s.flight ? flightLink(s.flight) : null;
    if(!cl && !fl) return '';
    let html = '<div class="linkrow">';
    if(cl) html += `<div class="linkbtn" id="lk-cargo">${escapeHtml(cl.label)}</div>`;
    if(fl) html += `<div class="linkbtn" id="lk-flight">Track flight ${escapeHtml(s.flight)}</div>`;
    html += '</div>';
    return html;
  }
  function wireTrackLinks(s){
    const cl = cargoLink(s.awb);
    const fl = s.flight ? flightLink(s.flight) : null;
    const lc = document.getElementById('lk-cargo');
    if(lc && cl){
      lc.onclick = () => {
        if(cl.direct){ window.open(cl.url, '_blank'); }
        else {
          navigator.clipboard?.writeText(cl.copy).catch(()=>{});
          window.open(cl.url, '_blank');
        }
      };
    }
    const lf = document.getElementById('lk-flight');
    if(lf && fl) lf.onclick = () => window.open(fl, '_blank');
  }

  function renderExportDetail(s){
    const c = document.getElementById('content');
    const stepsHtml = EXPORT_STEPS.map((label,i)=>{
      const cls = i<s.stage?'done':i===s.stage?'now':'todo';
      return `<div class="st"><div class="d ${cls}"></div><div class="lbl ${i===s.stage?'on':''}">${label}</div></div>` +
        (i<EXPORT_STEPS.length-1?`<div class="jn ${i<s.stage?'done':''}"></div>`:'');
    }).join('');
    const done = s.stage >= EXPORT_STEPS.length-1;
    const nextLabel = done ? null : EXPORT_STEPS[s.stage+1];

    c.innerHTML = `
      <div class="back" id="bk">&larr; Board</div>
      <div class="head">
        <div class="awb-lg">${escapeHtml(s.awb)}</div>
        <div class="meta">Export to ${escapeHtml(s.to||'—')}${s.flight?` on ${escapeHtml(s.flight)}`:''}<br>
          ${escapeHtml(s.customer||'')}${s.pcs?` &middot; ${escapeHtml(s.pcs)} pcs`:''}${s.kg?`, ${escapeHtml(s.kg)} kg`:''}</div>
        ${trackLinksHtml(s)}
      </div>
      <div class="card" style="padding:2px 15px;">
        <div class="steps" style="padding-top:14px;">${stepsHtml}</div>
      </div>
      ${!CAN_EDIT ? `<div class="viewer-strip">You're signed in as <b>view only</b>.
          Ask an editor to move this along.</div>` :
        done ? `<div class="card" style="text-align:center;color:var(--green);font-weight:600;">
          Docs released — this shipment is closed.</div>` :
        `<button class="advance" id="adv"><small>Next step</small>Mark ${escapeHtml(nextLabel)}</button>`}
      <div class="sect">NOTES</div>
      <div class="card">
        ${(s.notes||[]).slice().reverse().map(n=>`
          <div class="noteline">${escapeHtml(n.text)}
            <div class="who">${escapeHtml(n.by)}, ${new Date(n.at).toLocaleString()}</div></div>`).join('')
          || '<div style="font-size:12.5px;color:var(--muted);">No notes yet.</div>'}
        ${CAN_EDIT ? `<div class="addnote"><input id="note-in" placeholder="Add a note…">
          <button id="note-go">Add</button></div>` : ''}
      </div>
      <div style="height:20px;"></div>`;

    document.getElementById('bk').onclick = () => { STATE.tab='board'; paintShell(); };
    wireTrackLinks(s);
    const adv = document.getElementById('adv');
    if(adv) adv.onclick = async () => {
      adv.disabled = true; adv.textContent = 'Saving…';
      s.stage += 1;
      s.stageAt = new Date().toISOString();
      s.chasedDate = null;
      if(s.stage >= EXPORT_STEPS.length-1){ s.closed = true; s.closedDate = todayStr(); }
      await saveShipment(s);
      renderExportDetail(s);
    };
    const noteGo = document.getElementById('note-go');
    if(noteGo) noteGo.onclick = async () => {
      const inp = document.getElementById('note-in');
      const text = inp.value.trim();
      if(!text) return;
      s.notes = s.notes || [];
      s.notes.push({ text, by: ME.name, at: new Date().toISOString() });
      await saveShipment(s);
      renderExportDetail(s);
    };
  }

  // ============================================================
  // Detail — import (lots)
  // ============================================================
  function lotStepsHtml(lot){
    return IMPORT_STEPS.map((label,i)=>{
      const cls = i<lot.stage?'done':i===lot.stage?'now':'todo';
      return `<div class="st"><div class="d ${cls}"></div></div>` +
        (i<IMPORT_STEPS.length-1?`<div class="jn ${i<lot.stage?'done':''}"></div>`:'');
    }).join('');
  }

  function renderImportDetail(s){
    const c = document.getElementById('content');
    const lots = s.lots || [];
    const totalExp = lots.reduce((a,l)=>a+(l.pcsExpected||l.pcsArrived||0),0);
    const totalHere = lots.filter(l=>l.stage>0).reduce((a,l)=>a+(l.pcsArrived||0),0);
    const totalToCome = lots.filter(l=>l.stage===0).reduce((a,l)=>a+(l.pcsExpected||0),0);

    c.innerHTML = `
      <div class="back" id="bk">&larr; Board</div>
      <div class="head">
        <div class="awb-lg">${escapeHtml(s.awb)}</div>
        <div class="meta">Import from ${escapeHtml(s.from||'—')}<br>${escapeHtml(s.customer||'')}</div>
        <div class="tally">
          <div>ON THE AWB<b>${totalExp||'—'}</b></div>
          <div>HERE<b>${totalHere}</b></div>
          ${totalToCome?`<div>TO COME<b class="amb">${totalToCome}</b></div>`:''}
        </div>
        ${trackLinksHtml(s)}
      </div>
      <div id="lots-host"></div>
      ${CAN_EDIT ? `<button class="addlot" id="add-lot">+ Another lot arrived separately</button>` : ''}
      <div class="sect">NOTES</div>
      <div class="card">
        ${(s.notes||[]).slice().reverse().map(n=>`
          <div class="noteline">${escapeHtml(n.text)}
            <div class="who">${escapeHtml(n.by)}, ${new Date(n.at).toLocaleString()}</div></div>`).join('')
          || '<div style="font-size:12.5px;color:var(--muted);">No notes yet.</div>'}
        ${CAN_EDIT ? `<div class="addnote"><input id="note-in" placeholder="Add a note…">
          <button id="note-go">Add</button></div>` : ''}
      </div>
      <div style="height:20px;"></div>`;

    document.getElementById('bk').onclick = () => { STATE.tab='board'; paintShell(); };
    wireTrackLinks(s);
    paintLots(s);

    const addLotBtn = document.getElementById('add-lot');
    if(addLotBtn) addLotBtn.onclick = () => renderRecordArrival(s, null);

    const noteGo = document.getElementById('note-go');
    if(noteGo) noteGo.onclick = async () => {
      const inp = document.getElementById('note-in');
      const text = inp.value.trim();
      if(!text) return;
      s.notes = s.notes || [];
      s.notes.push({ text, by: ME.name, at: new Date().toISOString() });
      await saveShipment(s);
      renderImportDetail(s);
    };
  }

  function paintLots(s){
    const host = document.getElementById('lots-host');
    const lots = s.lots || [];
    host.innerHTML = lots.map((lot, li) => {
      const label = lots.length>1 ? `LOT ${li+1}` : 'PROGRESS';
      const tagHtml = lot.closed ? `<span class="lot-tag done">DELIVERED</span>`
        : lot.stage===0 ? `<span class="lot-tag w">NOT ARRIVED</span>`
        : `<span class="lot-tag here">HERE</span>`;
      const qty = lot.stage===0 ? (lot.pcsExpected||'?')+' pcs' : (lot.pcsArrived||'?')+' pcs';
      const when = lot.stage===0
        ? (lot.expectedDate ? `Expected ${lot.expectedDate}` : 'Date not yet known') + (lot.flight?` &middot; ${escapeHtml(lot.flight)}`:'')
        : `${lot.flight?escapeHtml(lot.flight)+' &middot; ':''}landed ${lot.arrivedAt?new Date(lot.arrivedAt).toLocaleDateString():''}${lot.k1?` &middot; K1 ${escapeHtml(lot.k1)}`:''}`;

      let nowLine, actionHtml;
      if(lot.closed){
        nowLine = `<div class="lot-now"><div><div class="s">Delivered in full</div></div>
          <span class="age ok">done</span></div>`;
        actionHtml = '';
      } else if(lot.stage===0){
        const h = lot.expectedDate ? null : ageHours(s.createdAt);
        nowLine = `<div class="lot-now"><div><div class="s">Waiting on the airline</div>
          <div class="k">Will need its own clearance once here</div></div>
          <span class="age warn">${lot.expectedDate||'no date yet'}</span></div>`;
        actionHtml = CAN_EDIT ? `<button class="lot-act ghost" data-arrive="${li}">Record this lot arriving</button>` : '';
      } else if(lot.stage===5){
        const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
        const remaining = (lot.pcsArrived||0) - delivered;
        const h = ageHours(lot.stageAt), thr = THRESH.imp[5];
        nowLine = `<div class="lot-now"><div><div class="s">Released</div>
          <div class="k">${delivered} delivered, ${remaining} balance</div></div>
          <span class="age ${remaining>0?(ageLevel(h,thr)==='bad'?'bad':'warn'):'ok'}">${ageStr(lot.stageAt)}</span></div>`;
        const runsHtml = (lot.deliveries||[]).map(d=>`
          <div class="run"><div class="qty">${d.pcs} pcs</div>
            <div><div class="who">${escapeHtml(d.driver)}</div>
              <div class="when">${new Date(d.at).toLocaleString()}</div>
              <span class="lorry">${escapeHtml(d.lorry)}</span></div></div>`).join('');
        actionHtml = (runsHtml ? `<div style="padding:0 14px;">${runsHtml}</div>` : '') +
          (CAN_EDIT && remaining>0 ? `<button class="lot-act" data-deliver="${li}"><small>When it goes out</small>Record a delivery</button>
            <button class="lot-act mut" data-closelot="${li}">Close &mdash; nothing more to deliver</button>` : '');
      } else {
        const h = ageHours(lot.stageAt), thr = THRESH.imp[lot.stage]||24;
        const lvl = ageLevel(h,thr);
        nowLine = `<div class="lot-now"><div><div class="s">${IMPORT_STEPS[lot.stage]}</div></div>
          <span class="age ${lvl==='bad'?'bad':lvl==='warn'?'warn':'ok'}">${ageStr(lot.stageAt)}</span></div>`;
        actionHtml = CAN_EDIT ? `<button class="lot-act" data-advance="${li}"><small>Next step</small>Mark ${escapeHtml(IMPORT_STEPS[lot.stage+1])}</button>` : '';
      }

      return `
        <div class="sect" style="margin-bottom:0;">${label}</div>
        <div class="lot ${lot.stage===0?'wait':''}">
          <div class="lot-hd"><span class="lot-qty">${qty}</span>${tagHtml}</div>
          <div class="lot-when">${when}</div>
          ${lot.stage>0 ? `<div class="steps">${lotStepsHtml(lot)}</div>` : ''}
          ${nowLine}
          ${actionHtml}
        </div>`;
    }).join('');

    if(!CAN_EDIT){
      host.insertAdjacentHTML('beforeend', `<div class="viewer-strip">You're signed in as
        <b>view only</b>. Ask an editor to move this along.</div>`);
    }

    host.querySelectorAll('[data-advance]').forEach(btn=>{
      btn.onclick = async () => {
        const li = +btn.dataset.advance;
        btn.disabled = true;
        const lot = s.lots[li];
        lot.stage += 1;
        lot.stageAt = new Date().toISOString();
        lot.chasedDate = null;
        await saveShipment(s);
        renderImportDetail(s);
      };
    });
    host.querySelectorAll('[data-arrive]').forEach(btn=>{
      btn.onclick = () => renderRecordArrival(s, +btn.dataset.arrive);
    });
    host.querySelectorAll('[data-deliver]').forEach(btn=>{
      btn.onclick = () => renderRecordDelivery(s, +btn.dataset.deliver);
    });
    host.querySelectorAll('[data-closelot]').forEach(btn=>{
      btn.onclick = async () => {
        if(!confirm('Close this lot with a balance still outstanding?')) return;
        const li = +btn.dataset.closelot;
        s.lots[li].closed = true;
        s.lots[li].stage = IMPORT_STEPS.length-1;
        checkFullyClosed(s);
        await saveShipment(s);
        renderImportDetail(s);
      };
    });
  }

  function checkFullyClosed(s){
    if(s.type==='import' && (s.lots||[]).length && s.lots.every(l=>l.closed)){
      s.closed = true; s.closedDate = todayStr();
    }
  }

  // ---- record a lot arriving ----
  function renderRecordArrival(s, li){
    const c = document.getElementById('content');
    const lot = li!=null ? s.lots[li] : null;
    let qty = lot ? (lot.pcsExpected || 1) : 1;
    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">
          ${lot?'Lot has arrived':'New lot arrived'}</div>
        <div class="meta">${escapeHtml(s.customer||'')}</div>
      </div>
      <div class="field"><label>Flight it came on</label>
        <input class="mono" id="ar-flight" value="${escapeHtml(lot&&lot.flight||s.flight||'')}" placeholder="e.g. CX9711"></div>
      <div class="picker">
        <div class="plbl">Pieces that actually landed</div>
        <div class="qctl"><button id="ar-minus">&minus;</button>
          <span class="val" id="ar-val">${qty}</span><button id="ar-plus">+</button></div>
        ${lot&&lot.pcsExpected?`<div class="qof">of ${lot.pcsExpected} expected</div>`:''}
      </div>
      <div style="margin:0 16px 14px;font-size:12px;color:var(--muted);line-height:1.6;">
        This lot starts its own clearance from here.${lot?' The other lot on this AWB carries on separately.':''}
      </div>
      <div class="msg" id="ar-msg"></div>
      <button class="advance" id="ar-go">Record arrival</button>`;
    document.getElementById('bk').onclick = () => renderImportDetail(s);
    const val = document.getElementById('ar-val');
    document.getElementById('ar-minus').onclick = () => { qty = Math.max(0,qty-1); val.textContent = qty; };
    document.getElementById('ar-plus').onclick = () => { qty += 1; val.textContent = qty; };
    document.getElementById('ar-go').onclick = async function(){
      const flight = document.getElementById('ar-flight').value.trim();
      const msg = document.getElementById('ar-msg');
      if(qty <= 0){ msg.style.color='var(--red)'; msg.textContent='Enter how many pieces arrived.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      const now = new Date().toISOString();
      if(lot){
        lot.stage = 1; lot.pcsArrived = qty; lot.flight = flight || lot.flight || null;
        lot.arrivedAt = now; lot.stageAt = now; lot.chasedDate = null;
      } else {
        s.lots = s.lots || [];
        s.lots.push({ id: uid(), stage: 1, pcsArrived: qty, flight: flight||null,
          arrivedAt: now, stageAt: now, deliveries: [], closed:false, chasedDate:null });
      }
      await saveShipment(s);
      renderImportDetail(s);
    };
  }

  // ---- record a delivery ----
  const LORRIES = ['QKK 4471','QKM 882','QKV 1203','Outside hire'];
  function renderRecordDelivery(s, li){
    const c = document.getElementById('content');
    const lot = s.lots[li];
    const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
    const remaining = (lot.pcsArrived||0) - delivered;
    let qty = remaining;
    let lorry = LORRIES[0], driver = null;

    getWorkers().then(all=>{
      const drivers = all.filter(w=>w.onRoster !== false).map(w=>w.name).sort();
      driver = drivers[0] || null;
      const dchips = document.getElementById('dv-drivers');
      if(dchips) dchips.innerHTML = drivers.slice(0,8).map((n,i)=>
        `<span class="${i===0?'on':''}" data-d="${escapeHtml(n)}">${escapeHtml(n)}</span>`).join('') +
        `<span data-d="__other">Someone else</span>`;
      wireChips('dv-drivers', v=>driver=v);
    });

    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">Record a delivery</div>
        <div class="meta">${escapeHtml(s.customer||'')} &middot; ${remaining} pcs remaining</div>
      </div>
      <div class="picker">
        <div class="plbl">How many pieces are going out</div>
        <div class="qctl"><button id="dv-minus">&minus;</button>
          <span class="val" id="dv-val">${qty}</span><button id="dv-plus">+</button></div>
        <div class="qof">of ${remaining} remaining</div>
      </div>
      <div class="picker">
        <div class="plbl">Lorry</div>
        <div class="chips" id="dv-lorries">${LORRIES.map((l,i)=>
          `<span class="mono ${i===0?'on':''}" data-l="${escapeHtml(l)}">${escapeHtml(l)}</span>`).join('')}</div>
      </div>
      <div class="picker">
        <div class="plbl">Driver</div>
        <div class="chips" id="dv-drivers"><span class="on">Loading…</span></div>
      </div>
      <div class="msg" id="dv-msg"></div>
      <button class="advance" id="dv-go">Record delivery</button>
      <div style="margin:10px 16px 0;font-size:11.5px;color:var(--muted);text-align:center;">
        Recording all ${remaining} closes this lot. Fewer leaves a balance on the board.
      </div>`;
    document.getElementById('bk').onclick = () => renderImportDetail(s);
    const val = document.getElementById('dv-val');
    document.getElementById('dv-minus').onclick = () => { qty = Math.max(0,qty-1); val.textContent = qty; };
    document.getElementById('dv-plus').onclick = () => { qty = Math.min(remaining,qty+1); val.textContent = qty; };
    wireChips('dv-lorries', v=>lorry=v);

    function wireChips(id, setter){
      const box = document.getElementById(id);
      box.querySelectorAll('span').forEach(sp=>{
        sp.onclick = () => {
          box.querySelectorAll('span').forEach(x=>x.classList.remove('on'));
          sp.classList.add('on');
          setter(sp.dataset.l || sp.dataset.d);
        };
      });
    }

    document.getElementById('dv-go').onclick = async function(){
      const msg = document.getElementById('dv-msg');
      if(qty<=0){ msg.style.color='var(--red)'; msg.textContent='Enter how many pieces.'; return; }
      let finalDriver = driver;
      if(finalDriver === '__other'){
        finalDriver = prompt('Driver name:');
        if(!finalDriver){ return; }
      }
      this.disabled = true; this.textContent = 'Saving…';
      lot.deliveries = lot.deliveries || [];
      lot.deliveries.push({ pcs: qty, lorry, driver: finalDriver, by: ME.name, at: new Date().toISOString() });
      const nowDelivered = lot.deliveries.reduce((a,d)=>a+d.pcs,0);
      if(nowDelivered >= (lot.pcsArrived||0)){
        lot.closed = true; lot.stage = IMPORT_STEPS.length-1;
        checkFullyClosed(s);
      }
      await saveShipment(s);
      renderImportDetail(s);
    };
  }

  // ============================================================
  // New shipment
  // ============================================================
  function renderNewShipment(){
    const c = document.getElementById('app');
    let type = 'export';
    c.innerHTML = `
      <div class="back" id="bk">&larr; Board</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:19px;">New shipment</div>
        <div class="meta">Four fields now — the rest can wait.</div>
      </div>
      <div class="seg" id="ns-type"><div class="on" data-t="export">Export</div><div data-t="import">Import</div></div>
      <div class="field"><label>Air waybill</label><input class="mono" id="ns-awb" placeholder="232-45678901"></div>
      <div class="field"><label>Customer</label><input id="ns-cust" placeholder="Who's it for"></div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1;"><label>From</label><input id="ns-from" placeholder="KCH"></div>
        <div style="flex:1;"><label>To</label><input id="ns-to" placeholder="SIN"></div>
      </div>
      <div class="msg" id="ns-msg"></div>
      <button class="advance" id="ns-go">Create</button>`;
    document.getElementById('bk').onclick = () => { paintShell(); };
    document.querySelectorAll('#ns-type div').forEach(d=>{
      d.onclick = () => { type = d.dataset.t;
        document.querySelectorAll('#ns-type div').forEach(x=>x.classList.remove('on'));
        d.classList.add('on'); };
    });
    document.getElementById('ns-go').onclick = async function(){
      const awb = document.getElementById('ns-awb').value.trim();
      const customer = document.getElementById('ns-cust').value.trim();
      const from = document.getElementById('ns-from').value.trim().toUpperCase();
      const to = document.getElementById('ns-to').value.trim().toUpperCase();
      const msg = document.getElementById('ns-msg');
      if(!awb){ msg.style.color='var(--red)'; msg.textContent='Enter the air waybill number.'; return; }
      if(STATE.shipments.some(s=>s.awb===awb)){
        msg.style.color='var(--red)'; msg.textContent='A shipment with this AWB is already open.'; return;
      }
      this.disabled = true; this.textContent = 'Creating…';
      const now = new Date().toISOString();
      const s = {
        id: uid(), awb, type, customer, from, to, createdAt: now, createdBy: ME.name,
        notes: [], closed:false, closedDate:null, pcs:null, kg:null, flight:null
      };
      if(type === 'export'){
        s.stage = 0; s.stageAt = now; s.chasedDate = null;
      } else {
        s.lots = [{ id: uid(), stage: 0, pcsExpected:null, expectedDate:null, flight:null,
          stageAt: now, deliveries:[], closed:false, chasedDate:null }];
      }
      await saveShipment(s);
      STATE.shipments.push(s);
      paintShell();
    };
  }

  // ============================================================
  // Alerts
  // ============================================================
  function paintAlerts(c, groups){
    const total = groups.stuck.length+groups.balance.length+groups.deliver.length+groups.missing.length;
    if(total === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">${STATE.shipments.length}</div>
          <div class="l">open, moving normally</div></div></div>
        <div class="quiet"><div class="big">All clear</div>
          <div class="sm">Nothing has been sitting longer than it should.</div></div>`;
      return;
    }
    function block(title, items){
      if(!items.length) return '';
      return `<div class="grp"><span>${title}</span><span class="c">${items.length}</span></div>` +
        items.map(a=>`
          <div class="al ${a.level==='red'?'red':a.level==='amb'?'amb':'gry'}">
            <div class="al-body" data-goto="${a.s.id}">
              <div class="al-top"><span class="al-what">${escapeHtml(a.what)}</span>
                <span class="al-age ${a.level==='red'?'red':'amb'}">${escapeHtml(a.age)}</span></div>
              <div class="al-who">${escapeHtml(a.s.customer||'')} &middot; ${escapeHtml(a.s.awb)}</div>
            </div>
            <div class="al-acts">
              <button data-goto2="${a.s.id}">Open</button>
              ${CAN_EDIT && a.chaseKey ? `<button data-chase="${escapeHtml(a.chaseKey)}">Chased today</button>` : ''}
            </div>
          </div>`).join('');
    }
    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n warn">${total}</div>
        <div class="l">need attention</div></div></div>
      ${block('STUCK TOO LONG', groups.stuck)}
      ${block('BALANCE NOT ARRIVED', groups.balance)}
      ${block('RELEASED, NOT DELIVERED', groups.deliver)}
      ${block('MISSING DETAILS', groups.missing)}
      <div style="height:20px;"></div>`;
    c.querySelectorAll('[data-goto],[data-goto2]').forEach(el=>{
      el.onclick = () => renderDetail(el.dataset.goto || el.dataset.goto2);
    });
    c.querySelectorAll('[data-chase]').forEach(el=>{
      el.onclick = async () => {
        const key = el.dataset.chase;
        const [sid, li] = key.split('|');
        const s = STATE.shipments.find(x=>x.id===sid);
        if(!s) return;
        if(li===undefined || li===''){ s.chasedDate = todayStr(); }
        else { s.lots[+li].chasedDate = todayStr(); }
        await saveShipment(s);
        paintShell();
      };
    });
  }

  // ============================================================
  // Worker IDs (admin only) — add/remove people, reset passwords
  // ============================================================
  async function paintWorkers(c){
    c.innerHTML = `<div class="empty">Loading…</div>`;
    const workers = (await getWorkers()).slice().sort((a,b)=>a.name.localeCompare(b.name));
    c.innerHTML = `
      <div style="margin:14px 16px 0;font-size:12px;color:var(--muted);line-height:1.6;">
        These are this app's own IDs — separate from attendance and performance. A new
        person is <b>Off</b> in the Access tab until you set their level.
      </div>
      <div class="card" style="padding:2px 15px;">
        ${workers.map(w=>`
          <div class="person">
            <div class="nm"><div class="n">${escapeHtml(w.name)}</div>
              <div class="r">${STATE.access[w.id] ? STATE.access[w.id].toUpperCase() : 'OFF'}</div></div>
            <div style="display:flex;gap:6px;">
              <button class="lot-act ghost" style="width:auto;padding:7px 10px;font-size:11px;"
                data-reset="${w.id}">Reset password</button>
              <button class="lot-act ghost" style="width:auto;padding:7px 10px;font-size:11px;color:var(--red);"
                data-remove="${w.id}" data-name="${escapeHtml(w.name)}">Remove</button>
            </div>
          </div>`).join('') || '<div style="font-size:12.5px;color:var(--muted);padding:10px 0;">No workers yet.</div>'}
      </div>

      <div class="sect">ADD A WORKER</div>
      <div class="field"><label>Name</label><input id="wk-name" placeholder="Full name"></div>
      <div class="field"><label>Password</label><input id="wk-pass" type="password" placeholder="At least 4 characters"></div>
      <div class="msg" id="wk-msg"></div>
      <button class="advance" id="wk-add">Add worker</button>
      <div style="height:20px;"></div>`;

    c.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = async () => {
        if(!confirm(`Remove ${btn.dataset.name}? They'll no longer be able to sign in.`)) return;
        await deleteWorker(btn.dataset.remove);
        delete STATE.access[btn.dataset.remove];
        paintShell();
      };
    });
    c.querySelectorAll('[data-reset]').forEach(btn=>{
      btn.onclick = async () => {
        const pass = prompt('New password for this worker:');
        if(!pass) return;
        if(pass.length < 4){ alert('Password needs at least 4 characters.'); return; }
        const all = await getWorkers();
        const w = all.find(x=>x.id===btn.dataset.reset);
        if(!w) return;
        w.passwordHash = await sha256Hex(pass);
        await saveWorker(w);
        alert('Password updated.');
      };
    });
    document.getElementById('wk-add').onclick = async function(){
      const name = document.getElementById('wk-name').value.trim();
      const pass = document.getElementById('wk-pass').value;
      const msg = document.getElementById('wk-msg');
      if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter a name.'; return; }
      if(!pass || pass.length < 4){ msg.style.color='var(--red)'; msg.textContent='Password needs at least 4 characters.'; return; }
      const all = await getWorkers();
      if(all.some(w=>w.name.toLowerCase()===name.toLowerCase())){
        msg.style.color='var(--red)'; msg.textContent='Someone with this name already exists.'; return;
      }
      this.disabled = true; this.textContent = 'Adding…';
      const id = uid();
      const passwordHash = await sha256Hex(pass);
      await saveWorker({ id, name, passwordHash, createdAt: new Date().toISOString() });
      paintWorkers(c);
    };
  }

  // ============================================================
  // Access (admin only)
  // ============================================================
  async function paintAccess(c){
    c.innerHTML = `<div class="empty">Loading workers…</div>`;
    const workers = (await getWorkers()).slice().sort((a,b)=>a.name.localeCompare(b.name));
    const access = STATE.access;
    c.innerHTML = `
      <div style="margin:14px 16px 0;font-size:12px;color:var(--muted);line-height:1.6;">
        Same worker IDs as attendance. Off is the default — nobody sees this board until
        you put them here.
      </div>
      <div class="card" style="padding:2px 15px;">
        ${workers.map(w=>{
          const lvl = access[w.id] || 'off';
          return `
          <div class="person">
            <div class="nm"><div class="n">${escapeHtml(w.name)}</div>
              <div class="r">${escapeHtml(w.role||'')}</div></div>
            <div class="segp" data-w="${w.id}">
              <span class="${lvl==='off'?'on off':''}" data-lvl="off">Off</span>
              <span class="${lvl==='view'?'on amb':''}" data-lvl="view">View</span>
              <span class="${lvl==='edit'?'on':''}" data-lvl="edit">Edit</span>
              <span class="${lvl==='admin'?'on':''}" data-lvl="admin">Admin</span>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div style="height:20px;"></div>`;
    c.querySelectorAll('.segp').forEach(seg=>{
      seg.querySelectorAll('span').forEach(sp=>{
        sp.onclick = async () => {
          const wid = seg.dataset.w, lvl = sp.dataset.lvl;
          seg.querySelectorAll('span').forEach(x=>x.className='');
          sp.className = lvl==='off' ? 'on off' : lvl==='view' ? 'on amb' : 'on';
          await setAccessFor(wid, lvl);
          STATE.access[wid] = lvl;
          if(wid === ME.id){
            MY_LEVEL = lvl; CAN_EDIT = lvl==='edit'||lvl==='admin'; IS_ADMIN = lvl==='admin';
            if(!IS_ADMIN) STATE.tab = 'board';
            paintShell();
          }
        };
      });
    });
  }

  boot();
})();
</script>
</body>
</html>
