  // House AWBs consolidated under this master AWB. Optional — a direct
  // shipment has none, a consolidation can have several. The consol lands
  // and clears as one under the MAWB, then each HAWB is delivered to its own
  // consignee separately, so each carries its own piece count and its own
  // delivery status. Older records stored HAWBs as plain strings; those are
  // read as a HAWB with no known piece count.
  function hawbList(s){
    if(!Array.isArray(s.hawbs)) return [];
    return s.hawbs.filter(Boolean).map(h => typeof h === 'string' ? { no: h, pcs: null } : { no: h.no, pcs: h.pcs == null ? null : h.pcs })
      .filter(h => h.no);
  }
  function allDeliveries(s){
    // Import runs sit on each lot; export runs (the shipper bringing cargo
    // in) sit on the shipment itself, since export never splits into lots.
    return (s.lots||[]).flatMap(l => (l.deliveries||[])).concat(s.deliveries||[]);
  }
  // Delivered pieces and status for each HAWB, worked out from the delivery
  // runs recorded against it across every lot.
  function hawbProgress(s){
    const runs = allDeliveries(s);
    return hawbList(s).map(h => {
      const mine = runs.filter(d => d.hawb === h.no);
      const delivered = mine.reduce((a,d)=>a+(d.pcs||0),0);
      let status;
      if(h.pcs != null) status = delivered >= h.pcs ? 'done' : delivered > 0 ? 'part' : 'none';
      else status = delivered > 0 ? 'part' : 'none';
      return { ...h, delivered, remaining: h.pcs != null ? Math.max(0, h.pcs - delivered) : null, status, runs: mine };
    });
  }
  function hawbSummary(s){
    const prog = hawbProgress(s);
    if(prog.length === 0) return '';
    const done = prog.filter(h => h.status === 'done').length;
    return done > 0
      ? ` &middot; ${done}/${prog.length} HAWB delivered`
      : ` &middot; ${prog.length} HAWB`;
  }
  function hawbHeaderHtml(s){
    const h = hawbList(s);
    if(h.length === 0) return '';
    return `<div class="meta" style="margin-top:6px;">HAWB: <span style="font-family:'IBM Plex Mono',monospace;color:#fff;">${h.map(x=>escapeHtml(x.no)).join(', ')}</span></div>`;
  }
  // Per-HAWB delivery status panel on an import — each house bill's own
  // progress and its own delivery runs, each with its photo.
  function hawbPanelHtml(s){
    const prog = hawbProgress(s);
    if(prog.length === 0) return '';
    const chip = st => st === 'done'
      ? '<span class="lot-tag done">DELIVERED</span>'
      : st === 'part' ? '<span class="lot-tag here" style="background:rgba(242,169,59,.2);color:var(--amber-dk);">PART DELIVERED</span>'
      : '<span class="lot-tag w">NOT DELIVERED</span>';
    return `
      <div class="sect">HAWB DELIVERY</div>
      <div class="card" style="padding:4px 15px;">
        ${prog.map(h => `
          <div style="padding:11px 0;border-bottom:1px solid var(--line);">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--ink);">${escapeHtml(h.no)}</span>
              ${chip(h.status)}
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:3px;">
              ${h.pcs != null ? `${h.delivered} of ${h.pcs} pcs delivered` : `${h.delivered} pcs delivered`}</div>
            ${h.runs.map(d => `
              <div style="font-size:11.5px;color:var(--text);margin-top:5px;">
                ${d.pcs} pcs &middot; ${escapeHtml(d.driver||'')} &middot;
                <span style="font-family:'IBM Plex Mono',monospace;">${escapeHtml(d.lorry||'')}</span>
                <span style="color:var(--muted);"> &middot; ${new Date(d.at).toLocaleString()}</span>
                ${d.photoId ? ` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(d.photoId)}">View photo</span>` : ''}
              </div>`).join('')}
          </div>`).join('')}
      </div>`;
  }
  // Repeatable HAWB rows — number and pieces — with "+ Add another HAWB".
  function hawbEditorHtml(prefix, existing){
    const vals = (existing && existing.length) ? existing : [{ no:'', pcs:null }];
    return `
      <div class="field">
        <label>HAWB <span style="font-weight:400;color:var(--muted);text-transform:none;">— optional, one row per house bill with its pieces</span></label>
        <div id="${prefix}-hawb-list">
          ${vals.map(v => hawbRowHtml(v)).join('')}
        </div>
        <button type="button" class="lot-act ghost" id="${prefix}-hawb-add"
          style="border-radius:9px;width:100%;margin-top:6px;padding:10px;">+ Add another HAWB</button>
      </div>`;
  }
  function hawbRowHtml(v){
    v = v || {};
    return `<div class="hawb-row" style="display:flex;gap:8px;margin-bottom:6px;">
      <input class="mono hawb-input" value="${escapeHtml(v.no||'')}" placeholder="HAWB no." style="flex:1.6;min-width:0;">
      <input type="number" min="0" class="hawb-pcs" value="${v.pcs==null?'':escapeHtml(v.pcs)}" placeholder="pcs" style="flex:0.8;min-width:0;">
      <button type="button" class="hawb-del" style="width:42px;flex:0 0 auto;border:1.5px solid var(--line);background:#fff;
        border-radius:9px;color:var(--red);font-size:18px;line-height:1;">&times;</button>
    </div>`;
  }
  function wireHawbEditor(prefix){
    const list = document.getElementById(prefix + '-hawb-list');
    function wireRows(){
      list.querySelectorAll('.hawb-del').forEach(btn => {
        btn.onclick = () => {
          const rows = list.querySelectorAll('.hawb-row');
          const row = btn.closest('.hawb-row');
          if(rows.length > 1) row.remove();
          else row.querySelectorAll('input').forEach(i => i.value = '');
        };
      });
    }
    document.getElementById(prefix + '-hawb-add').onclick = () => {
      list.insertAdjacentHTML('beforeend', hawbRowHtml(null));
      wireRows();
      const inputs = list.querySelectorAll('.hawb-input');
      inputs[inputs.length-1].focus();
    };
    wireRows();
  }
  // Reads and validates the HAWB rows against the MAWB's total pieces.
  // Returns { hawbs } or { error }.
  function readHawbs(prefix, mawbPcs){
    const rows = [...document.querySelectorAll('#' + prefix + '-hawb-list .hawb-row')];
    const out = [], seen = new Set();
    for(const r of rows){
      const no = r.querySelector('.hawb-input').value.trim().toUpperCase();
      const pcsRaw = r.querySelector('.hawb-pcs').value.trim();
      if(!no && !pcsRaw) continue;
      if(!no) return { error: 'A HAWB row has pieces but no HAWB number.' };
      if(seen.has(no)) return { error: `HAWB ${no} is listed twice.` };
      const pcs = parseInt(pcsRaw, 10);
      if(!pcsRaw || isNaN(pcs) || pcs <= 0) return { error: `Enter the pieces for HAWB ${no}.` };
      seen.add(no);
      out.push({ no, pcs });
    }
    if(out.length > 0 && mawbPcs != null){
      const sum = out.reduce((a,h)=>a+h.pcs,0);
      if(sum !== mawbPcs) return { error: `HAWB pieces add up to ${sum}, but the MAWB has ${mawbPcs} pcs — they need to match.` };
    }
    return { hawbs: out };
  }

  function trackLinksHtml(s){
    const cl = cargoLink(s.awb);
    const fl = s.flight ? flightLink(s.flight) : null;
    if(!cl && !fl) return '';
    let html = '<div class="linkrow">';
    if(cl) html += `<div class="linkbtn" id="lk-cargo">${escapeHtml(cl.label)}</div>`;
    if(fl) html += `<div class="linkbtn" id="lk-flight">Track flight ${escapeHtml(s.flight)}</div>`;
    html += '</div>';
    return html;
  }
  function wireTrackLinks(s){
    const cl = cargoLink(s.awb);
    const fl = s.flight ? flightLink(s.flight) : null;
    const lc = document.getElementById('lk-cargo');
    if(lc && cl){
      lc.onclick = () => {
        if(cl.direct){ window.open(cl.url, '_blank'); }
        else {
          navigator.clipboard?.writeText(cl.copy).catch(()=>{});
          window.open(cl.url, '_blank');
        }
      };
    }
    const lf = document.getElementById('lk-flight');
    if(lf && fl) lf.onclick = () => window.open(fl, '_blank');
  }

  // Export's own version of the combined delivery form — who brought the
  // cargo in, what lorry, and a photo, all together. No quantity/balance
  // concept here, since export never splits the way import lots can; this
  // is a single one-off event, not something recorded across several runs.
  // The shipper bringing export cargo in. For a consolidation, each HAWB's
  // shipper delivers separately — so each run is recorded against its house
  // bill, and the shipment only moves on to Docs in once every HAWB is fully
  // in. A direct shipment with no HAWBs is still a single one-off delivery.
  function renderExportDeliveryRecord(s, onlyHawb){
    const c = document.getElementById('content');
    const hasHawbs = hawbList(s).length > 0;
    // Opened from a HAWB's own card → locked to that house bill.
    const hawbs = hawbProgress(s).filter(h => (h.remaining === null || h.remaining > 0) && (!onlyHawb || h.no === onlyHawb));
    let pickedHawb = hawbs.length ? hawbs[0].no : null;
    const capFor = no => { const h = hawbs.find(x => x.no === no); return h && h.remaining !== null ? h.remaining : null; };
    let file = null;
    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">Record the delivery</div>
        <div class="meta">${escapeHtml(s.customer||'')} &middot; cargo delivered by the shipper</div>
      </div>
      ${hasHawbs ? `
      <div class="field"><label>Which HAWB</label>
        <div class="chips" id="xd-hawb">
          ${hawbs.map((h,i)=>`<span class="mono ${i===0?'on':''}" data-h="${escapeHtml(h.no)}">${escapeHtml(h.no)}${h.remaining!==null?` &middot; ${h.remaining} left`:''}</span>`).join('')}
        </div>
      </div>
      <div class="field"><label>How many pieces came in</label>
        <input type="number" min="0" id="xd-qty" value="${pickedHawb && capFor(pickedHawb)!==null ? capFor(pickedHawb) : ''}"></div>
      <div id="xd-qof" style="margin:-8px 16px 14px;font-size:11.5px;color:var(--muted);">${pickedHawb && capFor(pickedHawb)!==null ? `of ${capFor(pickedHawb)} remaining` : ''}</div>` : ''}
      <div class="field"><label>Lorry</label>
        <input class="mono" id="xd-lorry" placeholder="e.g. QKK 4471"></div>
      <div class="field"><label>Driver</label>
        <input id="xd-driver" placeholder="Driver's name"></div>
      <div class="field">
        <label>Photo</label>
        <div id="xd-preview" style="margin-bottom:8px;">
          <div style="font-size:12px;color:var(--muted);">No photo taken yet</div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="xd-file" style="display:none;">
        <input type="file" accept="image/*" id="xd-upload" style="display:none;">
        <div style="display:flex;gap:8px;">
          <button type="button" class="lot-act ghost" id="xd-pick" style="border-radius:9px;flex:1;">Take photo</button>
          <button type="button" class="lot-act ghost" id="xd-browse" style="border-radius:9px;flex:1;">Upload photo</button>
        </div>
      </div>
      <div class="msg" id="xd-msg"></div>
      <button class="advance" id="xd-go">Record delivery</button>
      ${hasHawbs ? `<div style="margin:10px 16px 0;font-size:11.5px;color:var(--muted);text-align:center;">
        Moves on to Docs in once every HAWB is fully delivered in.</div>` : ''}`;
    document.getElementById('bk').onclick = () => renderExportDetail(s);

    if(hasHawbs){
      document.querySelectorAll('#xd-hawb span').forEach(sp => {
        sp.onclick = () => {
          document.querySelectorAll('#xd-hawb span').forEach(x => x.classList.remove('on'));
          sp.classList.add('on');
          pickedHawb = sp.dataset.h;
          const cap = capFor(pickedHawb);
          document.getElementById('xd-qty').value = cap !== null ? cap : '';
          document.getElementById('xd-qof').textContent = cap !== null ? `of ${cap} remaining` : '';
        };
      });
    }

    const xdFile = document.getElementById('xd-file');
    const xdUpload = document.getElementById('xd-upload');
    document.getElementById('xd-pick').onclick = () => xdFile.click();
    document.getElementById('xd-browse').onclick = () => xdUpload.click();
    function xdPicked(input){
      file = input.files[0] || null;
      const prev = document.getElementById('xd-preview');
      if(file){
        const url = URL.createObjectURL(file);
        prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:200px;border-radius:10px;">`;
      }
    }
    xdFile.onchange = () => xdPicked(xdFile);
    xdUpload.onchange = () => xdPicked(xdUpload);

    document.getElementById('xd-go').onclick = async function(){
      const lorry = document.getElementById('xd-lorry').value.trim();
      const driver = document.getElementById('xd-driver').value.trim();
      const msg = document.getElementById('xd-msg');
      let qty = s.pcs || null;
      if(hasHawbs){
        if(!pickedHawb){ msg.style.color='var(--red)'; msg.textContent='Every HAWB is already fully delivered in.'; return; }
        const qtyVal = document.getElementById('xd-qty').value.trim();
        qty = qtyVal ? parseInt(qtyVal,10) : 0;
        const cap = capFor(pickedHawb);
        if(!qtyVal || isNaN(qty) || qty<=0){ msg.style.color='var(--red)'; msg.textContent='Enter how many pieces came in.'; return; }
        if(cap !== null && qty > cap){ msg.style.color='var(--red)'; msg.textContent=`Only ${cap} pcs left on HAWB ${pickedHawb} — can't record more than that.`; return; }
      }
      if(!lorry){ msg.style.color='var(--red)'; msg.textContent='Enter the lorry.'; return; }
      if(!driver){ msg.style.color='var(--red)'; msg.textContent="Enter the driver's name."; return; }
      if(!file){ msg.style.color='var(--red)'; msg.textContent='Take a photo.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      try{
        const dataUrl = await resizeImageFile(file, 800, 0.85);
        const photoId = await savePhoto(dataUrl);
        s.deliveries = s.deliveries || [];
        s.deliveries.push({ pcs: qty, lorry, driver, hawb: pickedHawb || null, photoId,
          by: ME.name, at: new Date().toISOString() });
        logActivity(s, `${pickedHawb ? `HAWB ${pickedHawb}: ` : ''}Delivered in${qty ? ` ${qty} pcs` : ''} by ${driver}, ${lorry}`, 'status', photoId);
        if(hasHawbs){
          // Each HAWB moves on independently — only this house bill goes to
          // Docs in, and only once all of its own pieces are in.
          const tracks = exportTracks(s);
          const t = tracks.find(x => x.no === pickedHawb);
          const p = hawbProgress(s).find(x => x.no === pickedHawb);
          if(t && p && p.status === 'done' && t.stage === 0){
            t.stage = 1;
            t.stageAt = new Date().toISOString();
            t.chasedDate = null;
            logActivity(s, `HAWB ${pickedHawb}: all pieces in — moved to Docs in`);
          }
          closeExportIfDone(s);
        } else {
          s.stage = 1;
          s.stageAt = new Date().toISOString();
          s.chasedDate = null;
        }
        await saveShipment(s);
        renderExportDetail(s);
      }catch(e){
        this.disabled = false; this.textContent = 'Record delivery';
        msg.style.color='var(--red)'; msg.textContent = e.message || 'Could not save — try again.';
      }
    };
  }

  // One HAWB's own card on a consolidated export — its roadmap, its delivery
  // progress and runs, and its own next-step button below it.
  function exportTrackCardHtml(s, t, i){
    const prog = hawbProgress(s).find(p => p.no === t.no) || { pcs:null, delivered:0, runs:[] };
    const dots = EXPORT_STEPS.map((label,k)=>{
      const cls = k<t.stage?'done':k===t.stage?'now':'todo';
      return `<div class="st"><div class="d ${cls}"></div><div class="lbl ${k===t.stage?'on':''}">${label}</div></div>` +
        (k<EXPORT_STEPS.length-1?`<div class="jn ${k<t.stage?'done':''}"></div>`:'');
    }).join('');
    const last = EXPORT_STEPS.length-1;
    const tag = t.closed ? '<span class="lot-tag done">CLOSED</span>'
      : t.stage === 0 ? '<span class="lot-tag w">AWAITING CARGO</span>'
      : '<span class="lot-tag here">IN PROGRESS</span>';
    let nowLine, btn = '';
    if(t.closed){
      nowLine = `<div class="lot-now"><div><div class="s">Closed</div></div><span class="age ok">done</span></div>`;
    } else {
      const h = ageHours(t.stageAt), thr = THRESH.exp[t.stage] || 24;
      const lvl = ageLevel(h, thr);
      nowLine = `<div class="lot-now"><div><div class="s">${EXPORT_STEPS[t.stage]}</div>
          ${t.stage===0 ? `<div class="k">${prog.delivered}${prog.pcs!=null?` of ${prog.pcs}`:''} pcs delivered in</div>` : ''}</div>
        <span class="age ${lvl==='bad'?'bad':lvl==='warn'?'warn':'ok'}">${ageStr(t.stageAt)}</span></div>`;
      if(CAN_EDIT){
        if(t.stage === 0){
          btn = `<button class="advance needs-input" data-xdeliver="${i}"><small>${prog.delivered>0?`${prog.delivered} of ${prog.pcs} in`:'When it arrives'}</small>Record the delivery</button>`;
        } else if(t.stage+1 >= last){
          btn = `<button class="advance needs-input" data-xadv="${i}"><small>Photo required</small>Mark ${EXPORT_STEPS[t.stage+1]}</button>`;
        } else {
          btn = `<button class="advance" data-xadv="${i}"><small>Next step</small>Mark ${EXPORT_STEPS[t.stage+1]}</button>`;
        }
      }
    }
    const runs = (prog.runs||[]).map(d=>`
      <div class="run"><div class="qty">${d.pcs} pcs</div>
        <div><div class="who">${escapeHtml(d.driver||'')}</div>
          <div class="when">${new Date(d.at).toLocaleString()}</div>
          <span class="lorry">${escapeHtml(d.lorry||'')}</span>
          ${d.photoId?` <span style="font-size:11px;color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(d.photoId)}">View photo</span>`:''}</div></div>`).join('');
    return `
      <div class="sect" style="margin-bottom:0;">HAWB ${escapeHtml(t.no)}</div>
      <div class="lot ${t.stage===0 && !t.closed ? 'wait' : ''}">
        <div class="lot-hd"><span class="lot-qty">${prog.pcs!=null?prog.pcs+' pcs':'—'}</span>${tag}</div>
        <div class="steps">${dots}</div>
        ${nowLine}
        ${runs ? `<div style="padding:0 14px 6px;">${runs}</div>` : ''}
      </div>
      ${btn}`;
  }

  function renderExportDetail(s){
    const c = document.getElementById('content');
    const tracks = exportTracks(s);
    const stepsHtml = EXPORT_STEPS.map((label,i)=>{
      const cls = i<s.stage?'done':i===s.stage?'now':'todo';
      return `<div class="st"><div class="d ${cls}"></div><div class="lbl ${i===s.stage?'on':''}">${label}</div></div>` +
        (i<EXPORT_STEPS.length-1?`<div class="jn ${i<s.stage?'done':''}"></div>`:'');
    }).join('');
    const done = s.stage >= EXPORT_STEPS.length-1;
    const nextLabel = done ? null : EXPORT_STEPS[s.stage+1];

    c.innerHTML = `
      <div class="back" id="bk">&larr; Board</div>
      <div class="head">
        <div class="awb-lg">${escapeHtml(s.awb)}</div>
        <div class="meta">Export to ${escapeHtml(s.to||'—')}${s.flight?` on ${escapeHtml(s.flight)}`:''}${s.departDate?` &middot; departs ${escapeHtml(s.departDate)}${s.departTime?', '+escapeHtml(s.departTime):''}`:''}<br>
          ${escapeHtml(s.customer||'')}${s.pcs?` &middot; ${escapeHtml(s.pcs)} pcs`:''}${s.kg?`, ${escapeHtml(s.kg)} kg`:''}</div>
        ${hawbHeaderHtml(s)}
        ${trackLinksHtml(s)}
        ${IS_ADMIN ? `<div class="linkrow"><div class="linkbtn" id="edit-btn">Edit details</div></div>` : ''}
      </div>
      ${tracks.length ? `
      ${tracks.map((t,i)=>exportTrackCardHtml(s,t,i)).join('')}
      ${s.closed ? `<div class="card" style="text-align:center;color:var(--green);font-weight:600;">
          Every HAWB is closed — this shipment is complete.</div>` : ''}
      ${!CAN_EDIT ? `<div class="viewer-strip">You're signed in as <b>view only</b>.
          Ask an editor to move this along.</div>` : ''}
      ` : `
      <div class="card" style="padding:2px 15px;">
        <div class="steps" style="padding-top:14px;">${stepsHtml}</div>
      </div>
      ${!CAN_EDIT ? `<div class="viewer-strip">You're signed in as <b>view only</b>.
          Ask an editor to move this along.</div>` :
        done ? `<div class="card" style="text-align:center;color:var(--green);font-weight:600;">
          ${EXPORT_STEPS[EXPORT_STEPS.length-1]} — this shipment is closed.</div>` :
        s.stage === 0
          ? `<button class="advance needs-input" id="adv"><small>${(() => {
              const p = hawbProgress(s);
              if(!p.length) return 'When it arrives';
              const done = p.filter(h => h.status === 'done').length;
              return done > 0 ? `${done} of ${p.length} HAWB in` : 'When it arrives';
            })()}</small>Record the delivery</button>`
          : (s.stage+1 >= EXPORT_STEPS.length-1
            ? `<button class="advance needs-input" id="adv"><small>Photo required</small>Mark ${escapeHtml(nextLabel)}</button>`
            : `<button class="advance" id="adv"><small>Next step</small>Mark ${escapeHtml(nextLabel)}</button>`)}
      `}
      <div class="sect">ACTIVITY</div>
      <div class="card">
        ${activityHtml(s)}
        ${CAN_EDIT ? `<div class="addnote"><input id="note-in" placeholder="Add a remark…">
          <button id="note-go">Add</button></div>` : ''}
      </div>
      <div style="height:20px;"></div>`;

    document.getElementById('bk').onclick = () => { STATE.tab='board'; paintShell(); };
    wireTrackLinks(s);
    wireActivityPhotoLinks(c);
    const editBtn = document.getElementById('edit-btn');
    if(editBtn) editBtn.onclick = () => renderEditShipment(s);
    c.querySelectorAll('[data-xdeliver]').forEach(btn => {
      btn.onclick = () => renderExportDeliveryRecord(s, tracks[+btn.dataset.xdeliver].no);
    });
    c.querySelectorAll('[data-xadv]').forEach(btn => {
      btn.onclick = () => {
        const t = tracks[+btn.dataset.xadv];
        const fromLabel = EXPORT_STEPS[t.stage];
        const toStage = t.stage + 1;
        const toLabel = EXPORT_STEPS[toStage];
        const isClosing = toStage >= EXPORT_STEPS.length-1;
        async function doAdvance(photoId){
          btn.disabled = true;
          t.stage = toStage;
          t.stageAt = new Date().toISOString();
          t.chasedDate = null;
          if(isClosing) t.closed = true;
          logActivity(s, `HAWB ${t.no}: Moved from ${fromLabel} to ${toLabel}`, 'status', photoId);
          closeExportIfDone(s);
          await saveShipment(s);
          renderExportDetail(s);
        }
        if(isClosing){
          requirePhoto(`Photo for ${toLabel} — closing the airline delivery order`, `HAWB ${t.no} · ${s.awb}`, doAdvance, () => renderExportDetail(s));
        } else {
          doAdvance(null);
        }
      };
    });
    const adv = document.getElementById('adv');
    if(adv) adv.onclick = async () => {
      const fromLabel = EXPORT_STEPS[s.stage];
      const toStage = s.stage + 1;
      const toLabel = EXPORT_STEPS[toStage];
      const isClosing = toStage >= EXPORT_STEPS.length-1;
      // Leaving "Delivery" is the moment cargo actually arrived from the
      // shipper — same kind of moment as an import's delivery, so it's
      // captured the same way: who brought it, what lorry, and a photo,
      // together, rather than a bare tap.
      if(s.stage === 0){
        renderExportDeliveryRecord(s);
        return;
      }
      const needsPhoto = isClosing;
      async function doAdvance(photoId){
        adv.disabled = true; adv.textContent = 'Saving…';
        s.stage = toStage;
        s.stageAt = new Date().toISOString();
        s.chasedDate = null;
        logActivity(s, `Moved from ${fromLabel} to ${toLabel}`, 'status', photoId);
        if(isClosing){ s.closed = true; s.closedDate = todayStr(); }
        await saveShipment(s);
        renderExportDetail(s);
      }
      if(needsPhoto){
        requirePhoto(`Photo for ${toLabel} — closing the airline delivery order`, s.awb, doAdvance, () => renderExportDetail(s));
      } else {
        await doAdvance(null);
      }
    };
    const noteGo = document.getElementById('note-go');
    if(noteGo) noteGo.onclick = async () => {
      const inp = document.getElementById('note-in');
      const text = inp.value.trim();
      if(!text) return;
      logActivity(s, text, 'note');
      await saveShipment(s);
      renderExportDetail(s);
    };
  }

  // ============================================================
  // Detail — import (lots)
  // ============================================================
  function lotStepsHtml(lot){
    const steps = importSteps(lot);
    return steps.map((label,i)=>{
      const cls = i<lot.stage?'done':i===lot.stage?'now':'todo';
      return `<div class="st"><div class="d ${cls}"></div><div class="lbl ${i===lot.stage?'on':''}">${label}</div></div>` +
        (i<steps.length-1?`<div class="jn ${i<lot.stage?'done':''}"></div>`:'');
    }).join('');
  }

  function renderImportDetail(s){
    const c = document.getElementById('content');
    const lots = s.lots || [];
    // s.pcs is the total booked on the AWB at creation — the one figure to
    // measure everything else against, rather than re-deriving it from
    // whatever each lot happens to expect.
    const totalExp = s.pcs || 0;
    const totalHere = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
    const anyArrived = lots.some(l=>l.hasArrived);
    const balance = totalExp - totalHere;
    // Only offer another lot once the first has actually arrived and come up
    // short — recording the full amount on the first go removes the option
    // entirely, since there's nothing left to split.
    const showAddLot = CAN_EDIT && !s.closed && anyArrived && balance > 0;
    // Every arrived lot is finished but the rest of the MAWB never turned up —
    // offer a deliberate write-off so the shipment isn't stranded open forever.
    const allLotsClosed = lots.length > 0 && lots.every(l=>l.closed);
    const showWriteOff = CAN_EDIT && !s.closed && allLotsClosed && balance > 0;

    c.innerHTML = `
      <div class="back" id="bk">&larr; Board</div>
      <div class="head">
        <div class="awb-lg">${escapeHtml(s.awb)}</div>
        <div class="meta">Import from ${escapeHtml(s.from||'—')}<br>${escapeHtml(s.customer||'')}</div>
        ${hawbHeaderHtml(s)}
        <div class="tally">
          <div>ON THE AWB<b>${totalExp||'—'}</b></div>
          <div>HERE<b>${totalHere}</b></div>
          ${anyArrived && balance>0?`<div>BALANCE<b class="amb">${balance}</b></div>`:''}
        </div>
        ${trackLinksHtml(s)}
        ${IS_ADMIN ? `<div class="linkrow"><div class="linkbtn" id="edit-btn">Edit details</div></div>` : ''}
      </div>
      <div id="lots-host"></div>
      ${showAddLot ? `<button class="addlot" id="add-lot">+ Add lot for the remaining ${balance} pcs</button>` : ''}
      ${showWriteOff ? `
        <div style="margin:0 16px 8px;font-size:12px;color:var(--muted);line-height:1.6;">
          Everything that arrived is delivered and closed, but ${balance} pcs on this MAWB
          haven't arrived. The shipment stays open until they do — or close it here if
          they're not coming.</div>
        <button class="advance" id="writeoff-btn" style="background:#F2F5F9;color:var(--ink);">
          <small>Photo required</small>Close shipment — balance won't arrive</button>` : ''}
      ${hawbPanelHtml(s)}
      <div class="sect">ACTIVITY</div>
      <div class="card">
        ${activityHtml(s)}
        ${CAN_EDIT ? `<div class="addnote"><input id="note-in" placeholder="Add a remark…">
          <button id="note-go">Add</button></div>` : ''}
      </div>
      <div style="height:20px;"></div>`;

    document.getElementById('bk').onclick = () => { STATE.tab='board'; paintShell(); };
    wireTrackLinks(s);
    wireActivityPhotoLinks(c);
    const editBtn = document.getElementById('edit-btn');
    if(editBtn) editBtn.onclick = () => renderEditShipment(s);
    paintLots(s);

    const addLotBtn = document.getElementById('add-lot');
    if(addLotBtn) addLotBtn.onclick = () => renderRecordArrival(s, null, balance);
    const writeOffBtn = document.getElementById('writeoff-btn');
    if(writeOffBtn) writeOffBtn.onclick = () => {
      if(!confirm(`Close ${s.awb} with ${balance} pcs never arrived? This completes the whole shipment.`)) return;
      requirePhoto('Photo for Closing — closing the airline delivery order', s.awb, async (photoId) => {
        s.balanceWrittenOff = true;
        logActivity(s, `Shipment closed — ${balance} pcs balance never arrived`, 'status', photoId);
        checkFullyClosed(s);
        await saveShipment(s);
        renderImportDetail(s);
      }, () => renderImportDetail(s));
    };

    const noteGo = document.getElementById('note-go');
    if(noteGo) noteGo.onclick = async () => {
      const inp = document.getElementById('note-in');
      const text = inp.value.trim();
      if(!text) return;
      logActivity(s, text, 'note');
      await saveShipment(s);
      renderImportDetail(s);
    };
  }

  function paintLots(s){
    const host = document.getElementById('lots-host');
    const lots = s.lots || [];
    host.innerHTML = lots.map((lot, li) => {
      const label = lots.length>1 ? `LOT ${li+1}` : 'PROGRESS';
      const steps = importSteps(lot);
      const k1Tag = lot.hasArrived && !lot.closed
        ? `<span class="lot-tag ${lot.hasK1?'w':'here'}" style="margin-left:6px;">${lot.hasK1?'K1':'NO K1'}</span>` : '';
      const tagHtml = lot.closed ? `<span class="lot-tag done">DELIVERED</span>`
        : !lot.hasArrived ? `<span class="lot-tag w">NOT ARRIVED</span>`
        : `<span class="lot-tag here">HERE</span>${k1Tag}`;
      const qty = !lot.hasArrived ? (lot.pcsExpected||'?')+' pcs' : (lot.pcsArrived||'?')+' pcs';
      const when = !lot.hasArrived
        ? (lot.expectedDate ? `Expected ${lot.expectedDate}${lot.expectedTime?', '+lot.expectedTime:''}` : 'Date not yet known') + (lot.flight?` &middot; ${escapeHtml(lot.flight)}`:'')
        : `${lot.flight?escapeHtml(lot.flight)+' &middot; ':''}landed ${lot.arrivedAt?new Date(lot.arrivedAt).toLocaleDateString():''}${lot.k1?` &middot; K1 ${escapeHtml(lot.k1)}`:''}`;

      let nowLine, insideAction = '', outsideAction = '';
      if(lot.closed){
        nowLine = `<div class="lot-now"><div><div class="s">Delivered in full</div></div>
          <span class="age ok">done</span></div>`;
      } else if(!lot.hasArrived){
        nowLine = `<div class="lot-now"><div><div class="s">Waiting on the airline</div>
          <div class="k">Will need its own clearance once here</div></div>
          <span class="age warn">${lot.expectedDate||'no date yet'}</span></div>`;
        outsideAction = CAN_EDIT ? `<button class="advance needs-input" data-arrive="${li}"><small>Once it lands</small>Record this lot arriving</button>` : '';
      } else if(lot.stage === deliveryIdx(steps)){
        const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
        const remaining = (lot.pcsArrived||0) - delivered;
        const h = ageHours(lot.stageAt), thr = importThresh(lot)[lot.stage];
        nowLine = `<div class="lot-now"><div><div class="s">Delivery</div>
          <div class="k">${delivered} delivered, ${remaining} balance</div></div>
          <span class="age ${remaining>0?(ageLevel(h,thr)==='bad'?'bad':'warn'):'ok'}">${ageStr(lot.stageAt)}</span></div>`;
        const runsHtml = (lot.deliveries||[]).map(d=>`
          <div class="run"><div class="qty">${d.pcs} pcs</div>
            <div><div class="who">${escapeHtml(d.driver)}</div>
              <div class="when">${new Date(d.at).toLocaleString()}</div>
              <span class="lorry">${escapeHtml(d.lorry)}</span>${d.hawb ? ` <span class="lorry" style="background:rgba(242,169,59,.18);color:var(--amber-dk);">HAWB ${escapeHtml(d.hawb)}</span>` : ''}</div></div>`).join('');
        insideAction = runsHtml ? `<div style="padding:0 14px;">${runsHtml}</div>` : '';
        if(!CAN_EDIT){
          outsideAction = '';
        } else if(remaining > 0){
          outsideAction = `<button class="advance needs-input" data-deliver="${li}"><small>When it goes out</small>Record a delivery</button>
             <button class="advance" style="background:#F2F5F9;color:var(--ink);" data-closelot="${li}">Close &mdash; nothing more to deliver</button>`;
        } else {
          // Everything's been delivered, but that alone doesn't close it —
          // Closing is its own deliberate step with its own photo, same as
          // export, so nothing is finalised until this is actually tapped.
          outsideAction = `<button class="advance needs-input" data-closelot="${li}"><small>Photo required</small>Mark Closing</button>`;
        }
      } else {
        const h = ageHours(lot.stageAt), thr = importThresh(lot)[lot.stage]||24;
        const lvl = ageLevel(h,thr);
        nowLine = `<div class="lot-now"><div><div class="s">${steps[lot.stage]}</div></div>
          <span class="age ${lvl==='bad'?'bad':lvl==='warn'?'warn':'ok'}">${ageStr(lot.stageAt)}</span></div>`;
        // Every next step is a separate, standalone button below the card —
        // the same shape export uses throughout — coloured by whether it's
        // a plain tap or something that needs a form or a photo first.
        if(!CAN_EDIT){ /* nothing to show */ }
        else if(steps[lot.stage+1] === 'Delivery'){
          outsideAction = `<button class="advance needs-input" data-deliver="${li}"><small>When it goes out</small>Record a delivery</button>`;
        } else {
          const needsPhotoNext = steps[lot.stage+1] === 'Docs in';
          outsideAction = needsPhotoNext
            ? `<button class="advance needs-input" data-advance="${li}"><small>Photo required</small>Mark ${escapeHtml(steps[lot.stage+1])}</button>`
            : `<button class="advance" data-advance="${li}"><small>Next step</small>Mark ${escapeHtml(steps[lot.stage+1])}</button>`;
        }
      }

      return `
        <div class="sect" style="margin-bottom:0;">${label}</div>
        <div class="lot ${!lot.hasArrived?'wait':''}">
          <div class="lot-hd"><span class="lot-qty">${qty}</span>${tagHtml}</div>
          <div class="lot-when">${when}</div>
          ${lot.hasArrived ? `<div class="steps">${lotStepsHtml(lot)}</div>` : ''}
          ${nowLine}
          ${insideAction}
        </div>
        ${outsideAction}`;
    }).join('');

    if(!CAN_EDIT){
      host.insertAdjacentHTML('beforeend', `<div class="viewer-strip">You're signed in as
        <b>view only</b>. Ask an editor to move this along.</div>`);
    }

    host.querySelectorAll('[data-advance]').forEach(btn=>{
      btn.onclick = async () => {
        const li = +btn.dataset.advance;
        const lot = s.lots[li];
        const steps = importSteps(lot);
        const fromLabel = steps[lot.stage];
        const toStage = lot.stage + 1;
        const toLabel = steps[toStage];
        const label = lots.length>1 ? `Lot ${li+1}: ` : '';
        const needsPhoto = toLabel === 'Docs in';
        async function doAdvance(photoId){
          btn.disabled = true;
          lot.stage = toStage;
          lot.stageAt = new Date().toISOString();
          lot.chasedDate = null;
          logActivity(s, `${label}Moved from ${fromLabel} to ${toLabel}`, 'status', photoId);
          await saveShipment(s);
          renderImportDetail(s);
        }
        if(needsPhoto){
          requirePhoto(`Photo for ${toLabel}`, `${label}${s.awb}`, doAdvance, () => renderImportDetail(s));
        } else {
          await doAdvance(null);
        }
      };
    });
    host.querySelectorAll('[data-arrive]').forEach(btn=>{
      btn.onclick = () => renderRecordArrival(s, +btn.dataset.arrive);
    });
    host.querySelectorAll('[data-deliver]').forEach(btn=>{
      btn.onclick = () => renderRecordDelivery(s, +btn.dataset.deliver);
    });
    host.querySelectorAll('[data-closelot]').forEach(btn=>{
      btn.onclick = () => {
        const li = +btn.dataset.closelot;
        const lot = s.lots[li];
        const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
        const remaining = (lot.pcsArrived||0) - delivered;
        const label = lots.length>1 ? `Lot ${li+1}: ` : '';
        if(remaining > 0 && !confirm('Close this lot with a balance still outstanding?')) return;
        requirePhoto('Photo for Closing — closing the airline delivery order', `${label}${s.awb}`, async (photoId) => {
          lot.closed = true;
          lot.stage = terminalIdx(importSteps(lot));
          logActivity(s, remaining > 0
            ? `${label}Closed with a balance still outstanding`
            : `${label}Closed — fully delivered`, 'status', photoId);
          checkFullyClosed(s);
          await saveShipment(s);
          renderImportDetail(s);
        }, () => renderImportDetail(s));
      };
    });
  }

  // ---- export HAWB tracks ----
  // A consolidated export splits by house bill: each HAWB runs its own
  // Delivery → Docs in → Screening → Releasing → Closing, independently of
  // the others. A direct export with no HAWBs keeps the single shipment-level
  // stage it always had. Tracks are built lazily, so an older export that
  // already had HAWBs picks them up the first time it's opened.
  function exportTracks(s){
    if(s.type !== 'export') return [];
    const hawbs = hawbList(s);
    if(hawbs.length === 0) return [];
    if(!Array.isArray(s.xtracks)) s.xtracks = [];
    const prog = hawbProgress(s);
    // Keep tracks in step with the HAWB list: add any new house bill, drop
    // any removed one (the edit screen already blocks removing a HAWB that
    // has deliveries, so nothing real is lost here).
    const byNo = {};
    s.xtracks.forEach(t => { byNo[t.no] = t; });
    s.xtracks = hawbs.map(h => {
      if(byNo[h.no]) return byNo[h.no];
      const p = prog.find(x => x.no === h.no);
      // Migrating an older export: if this HAWB was already fully in, carry
      // on from wherever the shipment itself had got to.
      const startStage = (p && p.status === 'done') ? Math.max(1, s.stage||0) : 0;
      return { no: h.no, stage: Math.min(startStage, EXPORT_STEPS.length-1),
        stageAt: s.stageAt || new Date().toISOString(), chasedDate: null,
        closed: !!s.closed };
    });
    return s.xtracks;
  }
  function closeExportIfDone(s){
    const tracks = exportTracks(s);
    if(tracks.length && tracks.every(t => t.closed)){
      s.closed = true; s.closedDate = todayStr();
      s.stage = EXPORT_STEPS.length-1;
    } else if(tracks.length){
      // Keep the shipment-level stage as the least-advanced open track, so
      // anything still reading s.stage sees a sensible value.
      const open = tracks.filter(t => !t.closed);
      s.stage = Math.min(...open.map(t => t.stage));
    }
  }

  // Pieces booked on the MAWB that haven't arrived in any lot yet.
  function arrivalBalance(s){
    if(s.type !== 'import' || !s.pcs) return 0;
    const here = (s.lots||[]).filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
    return Math.max(0, s.pcs - here);
  }
  // Closing a lot closes that consignment's airline delivery order — it does
  // NOT mean the whole MAWB is done. The shipment only completes once every
  // lot is closed AND nothing booked on the MAWB is still waiting to arrive
  // (or someone has deliberately written that balance off). Previously only
  // the first half was checked, so closing the first short-shipped lot
  // completed the whole MAWB while the rest was still in the air.
  function checkFullyClosed(s){
    if(s.type !== 'import') return;
    const lots = s.lots || [];
    if(!lots.length || !lots.every(l=>l.closed)) return;
    if(arrivalBalance(s) > 0 && !s.balanceWrittenOff) return;
    s.closed = true; s.closedDate = todayStr();
  }

  // ---- record a lot arriving ----
  function renderRecordArrival(s, li, defaultQtyForNewLot){
    const c = document.getElementById('content');
    const lot = li!=null ? s.lots[li] : null;
    const defaultQty = lot ? (lot.pcsExpected || '') : (defaultQtyForNewLot || '');
    // K1 is decided once, when the shipment is created — not re-asked here.
    // A new lot from a balance takes the same K1 status as the first, since
    // it's the same commodity on the same AWB.
    const hasK1 = lot ? !!lot.hasK1 : !!(s.lots && s.lots[0] && s.lots[0].hasK1);
    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">
          ${lot?'Lot has arrived':'New lot arrived'}</div>
        <div class="meta">${escapeHtml(s.customer||'')}</div>
      </div>
      <div class="field"><label>Flight it came on</label>
        <input class="mono" id="ar-flight" value="${escapeHtml(lot&&lot.flight||s.flight||'')}" placeholder="e.g. CX9711"></div>
      <div class="field"><label>Pieces that actually landed</label>
        <input type="number" min="0" id="ar-qty" value="${escapeHtml(defaultQty)}" placeholder="e.g. 18"></div>
      ${lot&&lot.pcsExpected?`<div style="margin:-8px 16px 14px;font-size:11.5px;color:var(--muted);">of ${lot.pcsExpected} expected</div>`:''}
      <div style="margin:0 16px 14px;font-size:12px;color:var(--muted);line-height:1.6;">
        This lot starts its own clearance from here.${lot?'':' It will follow the same K1 status as the shipment.'}
        It goes through ${hasK1?'Examine and Pay duty':'Screening'}${hasK1?' (K1)':' (no K1)'}.
      </div>
      <div class="msg" id="ar-msg"></div>
      <button class="advance" id="ar-go">Record arrival</button>`;
    document.getElementById('bk').onclick = () => renderImportDetail(s);
    document.getElementById('ar-go').onclick = async function(){
      const flight = document.getElementById('ar-flight').value.trim();
      const qtyVal = document.getElementById('ar-qty').value.trim();
      const qty = qtyVal ? parseInt(qtyVal,10) : 0;
      const msg = document.getElementById('ar-msg');
      if(!qtyVal || isNaN(qty) || qty <= 0){ msg.style.color='var(--red)'; msg.textContent='Enter how many pieces arrived.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      const now = new Date().toISOString();
      if(lot){
        lot.hasArrived = true; lot.stage = 0; lot.pcsArrived = qty;
        lot.flight = flight || lot.flight || null;
        lot.arrivedAt = now; lot.stageAt = now; lot.chasedDate = null;
        const idx = s.lots.indexOf(lot);
        const label = s.lots.length>1 ? `Lot ${idx+1}: ` : '';
        logActivity(s, `${label}Arrived — ${qty} pcs${lot.hasK1?' (K1)':''}`);
      } else {
        s.lots = s.lots || [];
        s.lots.push({ id: uid(), hasArrived:true, hasK1, stage: 0, pcsArrived: qty, flight: flight||null,
          arrivedAt: now, stageAt: now, deliveries: [], closed:false, chasedDate:null });
        logActivity(s, `Lot ${s.lots.length}: Arrived — ${qty} pcs${hasK1?' (K1)':''}`);
      }
      await saveShipment(s);
      renderImportDetail(s);
    };
  }

  // ---- record a delivery ----
  function renderRecordDelivery(s, li){
    const c = document.getElementById('content');
    const lot = s.lots[li];
    const steps = importSteps(lot);
    const enteringDelivery = lot.stage < deliveryIdx(steps);
    const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
    const remaining = (lot.pcsArrived||0) - delivered;
    // A consolidation is delivered one house bill at a time, each to its own
    // consignee — so the run is recorded against a specific HAWB, capped by
    // both what that HAWB still has outstanding and what this lot still holds.
    const hawbs = hawbProgress(s).filter(h => h.remaining === null || h.remaining > 0);
    const hasHawbs = hawbList(s).length > 0;
    let pickedHawb = hawbs.length ? hawbs[0].no : null;
    const capFor = no => {
      const h = hawbs.find(x => x.no === no);
      return (h && h.remaining !== null) ? Math.min(h.remaining, remaining) : remaining;
    };
    let file = null;

    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">Record a delivery</div>
        <div class="meta">${escapeHtml(s.customer||'')} &middot; ${remaining} pcs remaining</div>
      </div>
      ${hasHawbs ? `
      <div class="field"><label>Which HAWB</label>
        <div class="chips" id="dv-hawb">
          ${hawbs.map((h,i)=>`<span class="mono ${i===0?'on':''}" data-h="${escapeHtml(h.no)}">${escapeHtml(h.no)}${h.remaining!==null?` &middot; ${h.remaining} left`:''}</span>`).join('')}
        </div>
      </div>` : ''}
      <div class="field"><label>How many pieces are going out</label>
        <input type="number" min="0" id="dv-qty" value="${pickedHawb ? capFor(pickedHawb) : remaining}"></div>
      <div id="dv-qof" style="margin:-8px 16px 14px;font-size:11.5px;color:var(--muted);">of ${pickedHawb ? capFor(pickedHawb) : remaining} remaining</div>
      <div class="field"><label>Lorry</label>
        <input class="mono" id="dv-lorry" placeholder="e.g. QKK 4471"></div>
      <div class="field"><label>Driver</label>
        <input id="dv-driver" placeholder="Driver's name"></div>
      <div class="field">
        <label>Photo</label>
        <div id="dv-preview" style="margin-bottom:8px;">
          <div style="font-size:12px;color:var(--muted);">No photo taken yet</div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="dv-file" style="display:none;">
        <input type="file" accept="image/*" id="dv-upload" style="display:none;">
        <div style="display:flex;gap:8px;">
          <button type="button" class="lot-act ghost" id="dv-pick" style="border-radius:9px;flex:1;">Take photo</button>
          <button type="button" class="lot-act ghost" id="dv-browse" style="border-radius:9px;flex:1;">Upload photo</button>
        </div>
      </div>
      <div class="msg" id="dv-msg"></div>
      <button class="advance" id="dv-go">Record delivery</button>
      <div style="margin:10px 16px 0;font-size:11.5px;color:var(--muted);text-align:center;">
        Closing is a separate step once everything's been delivered.
      </div>`;
    document.getElementById('bk').onclick = () => renderImportDetail(s);

    if(hasHawbs){
      document.querySelectorAll('#dv-hawb span').forEach(sp => {
        sp.onclick = () => {
          document.querySelectorAll('#dv-hawb span').forEach(x => x.classList.remove('on'));
          sp.classList.add('on');
          pickedHawb = sp.dataset.h;
          const cap = capFor(pickedHawb);
          document.getElementById('dv-qty').value = cap;
          document.getElementById('dv-qof').textContent = `of ${cap} remaining`;
        };
      });
    }

    const dvFile = document.getElementById('dv-file');
    const dvUpload = document.getElementById('dv-upload');
    document.getElementById('dv-pick').onclick = () => dvFile.click();
    document.getElementById('dv-browse').onclick = () => dvUpload.click();
    function dvPicked(input){
      file = input.files[0] || null;
      const prev = document.getElementById('dv-preview');
      if(file){
        const url = URL.createObjectURL(file);
        prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:200px;border-radius:10px;">`;
      }
    }
    dvFile.onchange = () => dvPicked(dvFile);
    dvUpload.onchange = () => dvPicked(dvUpload);

    document.getElementById('dv-go').onclick = async function(){
      const qtyVal = document.getElementById('dv-qty').value.trim();
      const qty = qtyVal ? parseInt(qtyVal,10) : 0;
      const lorry = document.getElementById('dv-lorry').value.trim();
      const driver = document.getElementById('dv-driver').value.trim();
      const msg = document.getElementById('dv-msg');
      const cap = pickedHawb ? capFor(pickedHawb) : remaining;
      if(hasHawbs && !pickedHawb){ msg.style.color='var(--red)'; msg.textContent='Every HAWB is already fully delivered.'; return; }
      if(!qtyVal || isNaN(qty) || qty<=0){ msg.style.color='var(--red)'; msg.textContent='Enter how many pieces.'; return; }
      if(qty > cap){ msg.style.color='var(--red)'; msg.textContent= pickedHawb
        ? `Only ${cap} pcs left on HAWB ${pickedHawb} — can't send more than that.`
        : `Only ${remaining} pcs remain — can't send more than that.`; return; }
      if(!lorry){ msg.style.color='var(--red)'; msg.textContent='Enter the lorry.'; return; }
      if(!driver){ msg.style.color='var(--red)'; msg.textContent="Enter the driver's name."; return; }
      if(!file){ msg.style.color='var(--red)'; msg.textContent='Take a photo.'; return; }
      const label = (s.lots.length>1) ? `Lot ${li+1}: ` : '';
      const hawbTag = pickedHawb ? `HAWB ${pickedHawb}: ` : '';

      this.disabled = true; this.textContent = 'Saving…';
      try{
        const dataUrl = await resizeImageFile(file, 800, 0.85);
        const photoId = await savePhoto(dataUrl);
        if(enteringDelivery){
          lot.stage = deliveryIdx(steps);
          lot.stageAt = new Date().toISOString();
          lot.chasedDate = null;
        }
        lot.deliveries = lot.deliveries || [];
        lot.deliveries.push({ pcs: qty, lorry, driver, hawb: pickedHawb || null, photoId,
          by: ME.name, at: new Date().toISOString() });
        // Only the delivery itself is recorded here. Closing is its own
        // separate step with its own photo.
        logActivity(s, `${label}${hawbTag}Delivered ${qty} pcs — ${driver}, ${lorry}`, 'status', photoId);
        await saveShipment(s);
        renderImportDetail(s);
      }catch(e){
        this.disabled = false; this.textContent = 'Record delivery';
        msg.style.color='var(--red)'; msg.textContent = e.message || 'Could not save — try again.';
      }
    };
  }

  // ============================================================
  // New shipment
  // ============================================================
  // Edit shipment details (admin only) — the same fields captured at
  // creation, editable afterwards. For import, the pre-arrival lot's
  // plan (flight/date/pieces) is kept in step too — but only while it
  // hasn't actually arrived yet; once a lot has real arrival data,
  // editing the shipment record doesn't silently overwrite what
  // actually happened.
  // ============================================================
  function renderEditShipment(s){
    const c = document.getElementById('content');
    const isExport = s.type === 'export';
    const curFlight = isExport ? (s.flight||'') : (s.flight || (s.lots&&s.lots[0]&&s.lots[0].flight) || '');
    const curDate = isExport ? (s.departDate||'') : (s.lots&&s.lots[0]&&s.lots[0].expectedDate) || '';
    const curTime = isExport ? (s.departTime||'') : (s.lots&&s.lots[0]&&s.lots[0].expectedTime) || '';
    const curPcs = s.pcs!=null ? s.pcs : (s.lots&&s.lots[0]&&s.lots[0].pcsExpected!=null ? s.lots[0].pcsExpected : '');

    c.innerHTML = `
      <div class="back" id="bk">&larr; ${escapeHtml(s.awb)}</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:19px;">Edit shipment</div>
        <div class="meta">${s.type==='export'?'Export':'Import'} &middot; all fields are required.</div>
      </div>
      <div class="field"><label>MAWB *</label><input class="mono" id="ed-awb" value="${escapeHtml(s.awb)}"></div>
      ${hawbEditorHtml('ed', hawbList(s))}
      <div class="field"><label>Customer *</label><input id="ed-cust" value="${escapeHtml(s.customer||'')}"></div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1;"><label>From *</label><input id="ed-from" value="${escapeHtml(s.from||'')}"></div>
        <div style="flex:1;"><label>To *</label><input id="ed-to" value="${escapeHtml(s.to||'')}"></div>
      </div>
      <div class="field"><label>Flight number *</label>
        <input class="mono" id="ed-flight" value="${escapeHtml(curFlight)}"></div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1.3;"><label>${isExport?'Departs':'Expected arrival'} *</label>
          <input type="date" id="ed-date" value="${escapeHtml(curDate)}"></div>
        <div style="flex:1;"><label>Time *</label><input type="time" id="ed-time" value="${escapeHtml(curTime)}"></div>
      </div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1;"><label>Pieces *</label><input type="number" min="0" id="ed-pcs" value="${escapeHtml(curPcs)}"></div>
        <div style="flex:1;"><label>Weight (kg) *</label><input type="number" min="0" step="0.1" id="ed-kg" value="${escapeHtml(s.kg!=null?s.kg:'')}"></div>
      </div>
      ${!isExport && s.lots && s.lots[0] && s.lots[0].hasArrived ?
        `<div class="viewer-strip">Lot 1 has already arrived, so its own recorded
          flight, date and pieces stay as they are — this only updates the shipment's
          own record.</div>` : ''}
      <div class="msg" id="ed-msg"></div>
      <button class="advance" id="ed-go">Save changes</button>
      ${IS_ADMIN ? `
      <div class="card" style="margin-top:22px;border:1.5px solid #F3C9C9;">
        <div style="font-weight:700;color:var(--red);font-size:13.5px;margin-bottom:5px;">Delete this shipment</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6;">
          Permanent — every lot, delivery, photo reference and activity entry on this
          shipment goes with it. This can't be undone.
        </div>
        <div class="field" style="margin-bottom:8px;">
          <label>Type the AWB to confirm</label>
          <input class="mono" id="del-confirm" placeholder="${escapeHtml(s.awb)}">
        </div>
        <button class="advance" id="del-go" style="background:var(--red);margin:0;">Delete shipment</button>
        <div class="msg" id="del-msg"></div>
      </div>` : ''}`;

    document.getElementById('bk').onclick = () => renderDetail(s.id);
    wireHawbEditor('ed');
    document.getElementById('ed-go').onclick = async function(){
      const awb = document.getElementById('ed-awb').value.trim();
      const customer = document.getElementById('ed-cust').value.trim();
      const from = document.getElementById('ed-from').value.trim().toUpperCase();
      const to = document.getElementById('ed-to').value.trim().toUpperCase();
      const flight = document.getElementById('ed-flight').value.trim();
      const dateVal = document.getElementById('ed-date').value;
      const timeVal = document.getElementById('ed-time').value;
      const pcsVal = document.getElementById('ed-pcs').value.trim();
      const kgVal = document.getElementById('ed-kg').value.trim();
      const pcs = pcsVal ? parseInt(pcsVal,10) : null;
      const kg = kgVal ? parseFloat(kgVal) : null;
      const msg = document.getElementById('ed-msg');
      if(!awb){ msg.style.color='var(--red)'; msg.textContent='Enter the MAWB number.'; return; }
      if(!customer){ msg.style.color='var(--red)'; msg.textContent='Enter the customer.'; return; }
      if(!from){ msg.style.color='var(--red)'; msg.textContent="Enter the 'from' airport."; return; }
      if(!to){ msg.style.color='var(--red)'; msg.textContent="Enter the 'to' airport."; return; }
      if(!flight){ msg.style.color='var(--red)'; msg.textContent='Enter the flight number.'; return; }
      if(!dateVal){ msg.style.color='var(--red)'; msg.textContent=(isExport?'Enter the departure date.':'Enter the expected arrival date.'); return; }
      if(!timeVal){ msg.style.color='var(--red)'; msg.textContent='Enter the time.'; return; }
      if(!pcsVal){ msg.style.color='var(--red)'; msg.textContent='Enter the number of pieces.'; return; }
      if(isNaN(pcs) || pcs < 0){ msg.style.color='var(--red)'; msg.textContent='Pieces must be a positive number.'; return; }
      if(!kgVal){ msg.style.color='var(--red)'; msg.textContent='Enter the weight.'; return; }
      if(isNaN(kg) || kg < 0){ msg.style.color='var(--red)'; msg.textContent='Weight must be a positive number.'; return; }
      const hawbRead = readHawbs('ed', pcs);
      if(hawbRead.error){ msg.style.color='var(--red)'; msg.textContent=hawbRead.error; return; }
      // A HAWB that already has deliveries against it can't disappear or
      // shrink below what's already gone out — that would orphan real runs.
      for(const h of hawbProgress(s)){
        if(h.delivered <= 0) continue;
        const kept = hawbRead.hawbs.find(x => x.no === h.no);
        if(!kept){ msg.style.color='var(--red)'; msg.textContent=`HAWB ${h.no} already has ${h.delivered} pcs delivered, so it can't be removed.`; return; }
        if(kept.pcs < h.delivered){ msg.style.color='var(--red)'; msg.textContent=`HAWB ${h.no} already has ${h.delivered} pcs delivered — its pieces can't go below that.`; return; }
      }
      if(STATE.shipments.some(x=>x.awb===awb && x.id!==s.id)){
        msg.style.color='var(--red)'; msg.textContent='Another open shipment already uses this AWB.'; return;
      }
      this.disabled = true; this.textContent = 'Saving…';
      s.awb = awb; s.customer = customer; s.from = from; s.to = to; s.flight = flight;
      s.hawbs = hawbRead.hawbs;
      // Re-sync an export's per-HAWB tracks with the edited list — a new
      // house bill starts at Delivery, a removed one drops out, and if every
      // remaining track is already closed the shipment completes.
      if(s.type === 'export'){ exportTracks(s); closeExportIfDone(s); }
      s.pcs = pcs; s.kg = kg;
      if(isExport){
        s.departDate = dateVal; s.departTime = timeVal;
      } else if(s.lots && s.lots[0] && !s.lots[0].hasArrived){
        // Still pre-arrival — safe to keep the plan in step with the edit.
        s.lots[0].flight = flight; s.lots[0].expectedDate = dateVal;
        s.lots[0].expectedTime = timeVal; s.lots[0].pcsExpected = pcs;
      }
      logActivity(s, 'Shipment details edited');
      await saveShipment(s);
      renderDetail(s.id);
    };

    const delGo = document.getElementById('del-go');
    if(delGo) delGo.onclick = async function(){
      const typed = document.getElementById('del-confirm').value.trim();
      const msg = document.getElementById('del-msg');
      if(typed !== s.awb){ msg.style.color='var(--red)'; msg.textContent="That doesn't match the AWB — type it exactly to confirm."; return; }
      if(!confirm(`Delete ${s.awb} permanently? This cannot be undone.`)) return;
      this.disabled = true; this.textContent = 'Deleting…';
      try{
        await withTimeout(db.collection(SHIP).doc(s.id).delete(), 15000, 'Deleting shipment');
        STATE.shipments = STATE.shipments.filter(x=>x.id!==s.id);
        STATE.tab = 'board';
        paintShell();
      }catch(e){
        this.disabled = false; this.textContent = 'Delete shipment';
        msg.style.color='var(--red)'; msg.textContent = 'Could not delete: ' + e.message;
      }
    };
  }

      if(hawbRead.error){ msg.style.color='var(--red)'; msg.textContent=hawbRead.error; return; }
      const hawbs = hawbRead.hawbs;
      if(STATE.shipments.some(s=>s.awb===awb)){
        msg.style.color='var(--red)'; msg.textContent='A shipment with this AWB is already open.'; return;
      }
      this.disabled = true; this.textContent = 'Creating…';
      const now = new Date().toISOString();
      const s = {
        id: uid(), awb, type, customer, from, to, createdAt: now, createdBy: ME.name,
        notes: [], closed:false, closedDate:null, pcs, kg, flight: flight || null, hawbs
      };
      if(type === 'export'){
        s.stage = 0; s.stageAt = now; s.chasedDate = null;
        s.departDate = dateVal || null; s.departTime = timeVal || null;
      } else {
        s.lots = [{ id: uid(), hasArrived:false, hasK1: k1Choice==='yes',
          stage: 0, pcsExpected: pcs,
          expectedDate: dateVal || null, expectedTime: timeVal || null, flight: flight || null,
          stageAt: now, deliveries:[], closed:false, chasedDate:null }];
      }
      logActivity(s, `Shipment created — ${type === 'export' ? 'Export' : 'Import'}, ${pcs} pcs, ${kg} kg${hawbs.length ? `, ${hawbs.length} HAWB` : ''}`, 'created');
      await saveShipment(s);
      STATE.shipments.push(s);
      paintShell();
    };
  }

  // ============================================================
  // Alerts
  // ============================================================
  function paintAlerts(c, groups){
    const total = groups.stuck.length+groups.balance.length+groups.deliver.length+groups.missing.length;
    if(total === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">${STATE.shipments.length}</div>
          <div class="l">open, moving normally</div></div></div>
        <div class="quiet"><div class="big">All clear</div>
          <div class="sm">Nothing has been sitting longer than it should.</div></div>`;
      return;
    }
    function block(title, items){
      if(!items.length) return '';
      return `<div class="grp"><span>${title}</span><span class="c">${items.length}</span></div>` +
        items.map(a=>`
          <div class="al ${a.level==='red'?'red':a.level==='amb'?'amb':'gry'}">
            <div class="al-body" data-goto="${a.s.id}">
              <div class="al-top"><span class="al-what">${escapeHtml(a.what)}</span>
                <span class="al-age ${a.level==='red'?'red':'amb'}">${escapeHtml(a.age)}</span></div>
              <div class="al-who">${escapeHtml(a.s.customer||'')} &middot; ${escapeHtml(a.s.awb)}</div>
            </div>
            <div class="al-acts">
              <button data-goto2="${a.s.id}">Open</button>
              ${CAN_EDIT && a.chaseKey ? `<button data-chase="${escapeHtml(a.chaseKey)}">Chased today</button>` : ''}
            </div>
          </div>`).join('');
    }
    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n warn">${total}</div>
        <div class="l">need attention</div></div></div>
      ${block('STUCK TOO LONG', groups.stuck)}
      ${block('BALANCE NOT ARRIVED', groups.balance)}
      ${block('RELEASED, NOT DELIVERED', groups.deliver)}
      ${block('MISSING DETAILS', groups.missing)}
      <div style="height:20px;"></div>`;
    c.querySelectorAll('[data-goto],[data-goto2]').forEach(el=>{
      el.onclick = () => renderDetail(el.dataset.goto || el.dataset.goto2);
    });
    c.querySelectorAll('[data-chase]').forEach(el=>{
      el.onclick = async () => {
        const key = el.dataset.chase;
        const [sid, li] = key.split('|');
        const s = STATE.shipments.find(x=>x.id===sid);
        if(!s) return;
        if(li===undefined || li===''){ s.chasedDate = todayStr(); }
        else if(li.startsWith('x')){ const t = exportTracks(s)[+li.slice(1)]; if(t) t.chasedDate = todayStr(); }
        else { s.lots[+li].chasedDate = todayStr(); }
        await saveShipment(s);
        paintShell();
      };
    });
  }

  // ============================================================
  // Balances — shipments whose first round of arrivals came up
  // short, sitting there until someone adds the balancing lot.
  // ============================================================
  function paintBalances(c, list){
    if(list.length === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">0</div>
          <div class="l">awaiting a balance lot</div></div></div>
        <div class="quiet"><div class="big">Nothing outstanding</div>
          <div class="sm">No import has arrived short of what was booked right now.</div></div>`;
